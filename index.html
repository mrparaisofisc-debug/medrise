<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedRise — Preparatório Residência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06343F; --ink2:#33514F; --mute:#5E7775; --teal:#0FA3A3; --teal-d:#0B7F7F; --mint:#5EF2C8;
  --bg:#EDF5F4; --card:#FFFFFF; --line:#D6E5E3; --ok:#12805C; --ok-bg:#E3F6EE; --bad:#B4232C; --bad-bg:#FBE9EA;
  --warn:#8A5A00; --warn-bg:#FFF4D6; --r:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal-d)}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0;letter-spacing:-0.02em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:248px;flex:none;background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;padding:4px 8px 18px}.logo-full{display:block;width:auto}
.brand b{font-family:Sora;font-size:22px;font-weight:800;letter-spacing:-0.04em}
.brand b span{color:var(--mint)}
.brand small{display:block;font-size:9.5px;letter-spacing:.22em;opacity:.75;font-weight:600}
.nav-sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;padding:14px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#DDEDEB;text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(94,242,200,.14);color:#fff}
.nav a.on svg{color:var(--mint)}
.nav svg{width:18px;height:18px;flex:none}
.nav .pill{margin-left:auto;background:var(--mint);color:var(--ink);font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1240px}
.topbar{display:none}
/* generic */
.row{display:flex;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.pad-s{padding:14px}
.sub{color:var(--mute);font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#E1F1EF;color:var(--teal-d)}
.tag.gray{background:#EEF2F2;color:var(--ink2)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff;text-decoration:none;min-height:44px}
.btn:hover{background:var(--teal-d)}
.btn.dark{background:var(--ink)} .btn.dark:hover{background:#0A4A57}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#F2F8F7}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
select,input[type=text],input[type=number],input[type=date],textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:80px;resize:vertical}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:Sora;font-size:28px;font-weight:800;letter-spacing:-0.03em}
.kpi .l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#E1F1EF;color:var(--teal-d);margin-bottom:8px}
.kpi .ic svg{width:18px;height:18px}
.bar-h{height:10px;border-radius:99px;background:#E5EFEE;overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--teal);border-radius:99px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid #EAF2F1;vertical-align:top}
.tbl-wrap{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r);background:#FAFDFC}
.note{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 12px}
.hero{background:linear-gradient(120deg,#06343F 0%,#0A5560 100%);color:#fff;border:0}
.hero .sub{color:#BFE3DE}
.count{font-family:Sora;font-size:44px;font-weight:800;color:var(--mint);line-height:1}
/* question */
.q-enun{font-size:16px;line-height:1.6;margin:10px 0 16px}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:44px}
.alt:hover{border-color:var(--teal)}
.alt .lt{flex:none;width:26px;height:26px;border-radius:99px;border:1.5px solid #9DB9B6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.alt.sel{border-color:var(--teal);background:#EFFAF8}
.alt.sel .lt{background:var(--teal);border-color:var(--teal);color:#fff}
.alt.right{border-color:var(--ok);background:var(--ok-bg)}
.alt.right .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.alt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.alt.cut{opacity:.45;text-decoration:line-through}
.coment{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.resumo{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.resumo table{width:100%;border-collapse:collapse;font-size:14px}
.resumo th{background:#E8F4F2;text-align:left;padding:8px 12px;font-size:13px}
.resumo td{padding:8px 12px;border-top:1px solid #E5EFEE;vertical-align:top}
.tutor{background:#F1FBF8;border:1px solid #BDEBDD;border-radius:12px;padding:14px;margin-top:12px}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.qnav button{height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:13px}
.qnav button.done{background:#E1F1EF;border-color:#A9D8D3}
.qnav button.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
.timer{font-family:Sora;font-weight:800;font-size:22px}
/* dossie */
.doss{max-width:780px}
.doss h2{margin:28px 0 10px}
.doss p,.doss li{line-height:1.7}
.doss .box{border-left:0;background:#F4FAF9;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
mark.h1{background:#FFF0A8} mark.h2{background:#C8F4E4} mark.h3{background:#FFD3DA}
mark{border-radius:3px;padding:0 1px}
.hl-bar{position:fixed;z-index:20;display:none;gap:6px;background:var(--ink);padding:6px;border-radius:10px;box-shadow:0 6px 20px rgba(6,52,63,.25)}
.hl-bar button{width:32px;height:32px;border-radius:8px;border:2px solid rgba(255,255,255,.4);cursor:pointer}
.hl-bar .nt{width:auto;padding:0 10px;color:#fff;background:transparent;font-size:13px;font-weight:600}
.toc a{display:block;padding:6px 0;text-decoration:none;font-size:14px;color:var(--ink2)}
.toc a:hover{color:var(--teal-d)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:Inter,sans-serif;fill:var(--mute);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* flash */
.flash{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:30px;cursor:pointer}
/* onboarding */
.ob{max-width:640px;margin:40px auto;padding:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;min-height:40px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--teal)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:30;display:none}
.tile{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--teal)}
.tile .ic{flex:none;width:42px;height:42px;border-radius:12px;background:#E1F1EF;color:var(--teal-d);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:22px;height:22px}

/* landing */
.lp{background:#fff;color:var(--ink);overflow-x:clip}.lp *{min-width:0}
.lp-nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.lp-in{max-width:1180px;margin:0 auto;padding:0 20px}
.lp-nav .lp-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;flex-wrap:wrap}
.lp-logo{display:flex;align-items:center;gap:9px;font-family:Sora;font-weight:800;font-size:22px;letter-spacing:-.04em;text-decoration:none;color:var(--ink)}
.lp-logo b span{color:var(--teal)}.lp-logo b{font-weight:800}.lp-wm{display:flex;flex-direction:column;line-height:1}.lp-wm small{font-family:Inter,sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--ink2);margin-top:4px}
.lp-links{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.lp-links a{text-decoration:none;color:var(--ink2);font-weight:500;font-size:14px;cursor:pointer}
.lp-links a:hover{color:var(--teal-d)}.lp-links a.btn,.lp-links a.btn:hover{color:#fff}.lp-links a.btn.ghost{color:var(--ink)}
.lp-hero{background:linear-gradient(160deg,#06343F 0%,#0A4E5A 60%,#0B6B6B 100%);color:#fff;overflow:hidden}
.lp-hero .lp-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-top:56px;padding-bottom:64px}
.lp-hero h1{font-size:clamp(28px,3.3vw,42px);line-height:1.1;letter-spacing:-.035em;text-wrap:balance}
.lp-hero h1 em{font-style:normal;color:var(--mint)}
.lp-hero p.lead{font-size:16px;color:#CBE9E4;margin:18px 0 28px;max-width:540px}
.lp-hero .btn{font-size:15px;padding:12px 22px}
.lp-hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)} .lp-hero .btn.ghost:hover{background:rgba(255,255,255,.08)}
.lp-checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:14px;color:#CBE9E4}
.lp-checks span{display:flex;gap:6px;align-items:center}
.mock{background:#EDF5F4;border-radius:18px;padding:16px;box-shadow:0 30px 60px rgba(0,0,0,.28);color:var(--ink);transform:rotate(-1deg)}
.mock .card{padding:14px;border-radius:12px}
.lp-band{padding:60px 0}
.lp-band.soft{background:var(--bg)}
.lp-band h2{font-size:clamp(22px,2.3vw,30px);line-height:1.18;letter-spacing:-.03em;text-wrap:balance;max-width:760px}
.lp-band .lead{font-size:15.5px;color:var(--ink2);max-width:680px;margin:12px 0 0}
.lp-strip{background:var(--ink);color:#BFE3DE;padding:18px 0;font-size:14px}
.lp-strip .lp-in{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;justify-content:center}
.lp-strip b{color:#fff}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:34px}
.vs>div{padding:26px}
.vs .old{background:#F7F7F7;color:#5b6466}
.vs .new{background:#06343F;color:#fff}
.vs h3{font-size:18px;margin-bottom:14px}
.vs ul{list-style:none;padding:0;margin:0}
.vs li{padding:10px 0;border-top:1px solid rgba(127,127,127,.18);display:flex;gap:10px}
.vs .new li b{color:var(--mint)}
.step{display:flex;flex-direction:column;gap:10px}
.step .n{font-family:Sora;font-weight:800;font-size:30px;color:var(--teal);line-height:1}
.feat .ic{width:44px;height:44px;border-radius:12px;background:#E1F1EF;color:var(--teal-d);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.feat .ic svg{width:22px;height:22px}
.feat h3{margin-bottom:6px}
.price{display:flex;flex-direction:column;gap:12px;position:relative}
.price.best{border:2px solid var(--teal);box-shadow:0 18px 40px rgba(15,163,163,.18)}
.price .flag{position:absolute;top:-13px;left:20px;background:var(--teal);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:4px 12px}
.price .val{font-family:Sora;font-weight:800;font-size:26px;letter-spacing:-.03em}
.price ul{padding-left:0;list-style:none;margin:4px 0 8px}
.price li{padding:6px 0;display:flex;gap:8px;font-size:14px}
.price li::before{content:"✓";color:var(--teal-d);font-weight:800}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:16px}
.faq p{color:var(--ink2);margin:10px 0 0}
.lp-cta{background:linear-gradient(120deg,#0FA3A3,#0B7F7F);color:#fff;text-align:center}
.lp-cta h2{margin:0 auto;color:#fff}
.lp-foot .lp-wm b{color:#fff}.lp-foot .lp-wm b span{color:var(--mint)}.lp-foot{background:#04262E;color:#9FC4BF;padding:34px 0;font-size:13px}
.lp-img{width:100%;border-radius:18px;display:block;object-fit:cover}.float-kpi{position:absolute;left:-22px;bottom:-26px;padding:12px 16px;box-shadow:0 14px 34px rgba(6,52,63,.25);color:var(--ink)}.float-tag{position:absolute;right:-14px;top:22px;padding:10px 14px;box-shadow:0 14px 34px rgba(6,52,63,.25);color:var(--ink)}@media (max-width:860px){.float-kpi{left:10px;bottom:-22px}.float-tag{right:10px}}
@media (max-width:860px){.hero-mini{grid-template-columns:repeat(3,minmax(0,1fr))}.mock .grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.lp-hero .lp-in{grid-template-columns:minmax(0,1fr);padding-top:44px}.vs{grid-template-columns:minmax(0,1fr)}.lp-links a.hide-s{display:none}.mock{transform:none}}

.kick{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-d);margin-bottom:10px}
.lp-center{text-align:center}.lp-center h2,.lp-center .lead{margin-left:auto;margin-right:auto}
.pill-k{display:inline-flex;align-items:center;gap:8px;background:rgba(94,242,200,.14);color:var(--mint);font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px}
.pill-k svg{width:16px;height:16px}
.hero-ck{list-style:none;padding:0;margin:0 0 26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.ck{display:flex;gap:10px;align-items:center;font-size:14px}
.ck-i{flex:none;width:22px;height:22px;border-radius:99px;background:var(--mint);color:var(--ink);display:flex;align-items:center;justify-content:center}
.ck-i svg{width:14px;height:14px;stroke-width:3}
.lp-hero .ck{color:#E3F5F2}
.ck-list{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.ck-list .ck-i{background:#E1F1EF;color:var(--teal-d)}
.ck-list.light .ck{color:#E3F5F2}.ck-list.light .ck-i{background:var(--mint);color:var(--ink)}
.lp-checks svg{width:16px;height:16px}
.hero-mini{margin-top:40px;gap:12px}
.mini{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;color:#fff}
.mini svg{width:22px;height:22px;color:var(--mint);margin-bottom:4px}.mini span{font-size:12px;color:#BFE3DE}
.lp-marq{background:#052A33;padding:30px 0 34px;overflow:hidden}
.marq{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq-t{display:flex;gap:14px;width:max-content;animation:marq 55s linear infinite}
.marq:hover .marq-t{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.lg-card{flex:none;height:64px;min-width:120px;padding:8px 16px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}.lg-card img{max-height:44px;max-width:150px;width:auto;height:auto;display:block}.marq-t.rev{animation-direction:reverse;animation-duration:60s}
@media (prefers-reduced-motion:reduce){.marq-t{animation:none;flex-wrap:wrap;width:auto;justify-content:center}}
.m-item{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:12px;padding:10px 16px 10px 10px;font-weight:700;font-family:Sora;font-size:15px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.m-badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#06343F,#0FA3A3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.02em}
.strip-i{display:flex;gap:12px;align-items:center}
.ic-c{flex:none;width:42px;height:42px;border-radius:12px;background:#E1F1EF;color:var(--teal-d);display:inline-flex;align-items:center;justify-content:center}
.ic-c svg{width:22px;height:22px}.ic-c.lg{width:52px;height:52px;border-radius:14px}.ic-c.lg svg{width:26px;height:26px}
.ic-c.xl{width:76px;height:76px;border-radius:20px}.ic-c.xl svg{width:40px;height:40px}
.lp-dark{background:linear-gradient(160deg,#06343F,#0A4E5A);color:#fff}
.lp-dark .kick{color:var(--mint)}.lp-dark h2{color:#fff}.lp-dark .lead{color:#CBE9E4}
.dif{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:24px}
.dif .ic-c{background:var(--mint);color:var(--ink)}
.dif .num{font-family:Sora;font-weight:800;font-size:22px;color:rgba(255,255,255,.18)}
.dif h3{color:#fff;margin:14px 0 6px;font-size:16px}.dif p{color:#CBE9E4;margin:0;font-size:14.5px}
.cmp th,.cmp td{padding:14px 18px;font-size:15px}.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center;width:150px}
.cmp .hl{background:#EFFAF8}.cmp th.hl{color:var(--teal-d)}
.yes,.nope{display:inline-flex;width:26px;height:26px;border-radius:99px;align-items:center;justify-content:center}
.yes{background:var(--ok-bg);color:var(--ok)}.nope{background:var(--bad-bg);color:var(--bad)}
.yes svg,.nope svg{width:15px;height:15px;stroke-width:3}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.sim-mock{box-shadow:0 24px 50px rgba(6,52,63,.14)}
.doss-row{display:flex;gap:12px;overflow-x:auto;padding:26px 2px 6px;scroll-snap-type:x mandatory}
.doss-card{flex:none;width:190px;scroll-snap-align:start;background:linear-gradient(160deg,#06343F,#0B6B6B);color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.doss-card .ic-c{background:rgba(94,242,200,.18);color:var(--mint)}.doss-card .sub{color:#BFE3DE}
.demo{background:#fff;color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.demo-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dq{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.dq.cur{background:var(--ink);color:#fff;border-color:var(--ink)}.dq.okk{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}.dq.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:11px;font-weight:700;color:var(--mute);text-align:center;padding:4px 0}
.cal-d{min-height:54px;border:1px solid #E5EFEE;border-radius:8px;padding:4px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.cal-d b{font-weight:600;color:var(--ink2)}
.cal-d.ev{background:#EFFAF8;border-color:#A9D8D3}
.cal-d i{font-style:normal;font-size:10px;font-weight:700;background:var(--teal);color:#fff;border-radius:4px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bad-list{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:12px}
.bad-list li{display:flex;gap:12px;align-items:center;font-size:15px}
.sol{background:linear-gradient(160deg,#06343F,#0B6B6B);border-radius:22px;padding:34px}
.sol .ic-c{background:var(--mint);color:var(--ink)}
.guar{display:flex;gap:26px;align-items:center;background:#EFFAF8;border:1px solid #BDEBDD;border-radius:22px;padding:30px}
.guar .ic-c{background:var(--teal);color:#fff}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr);gap:28px}.hero-ck,.ck-list{grid-template-columns:minmax(0,1fr)}.guar{flex-direction:column;text-align:center}.cmp td:not(:first-child),.cmp th:not(:first-child){width:auto}}
@media (max-width:1000px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:800px){
  .app{flex-direction:column}
  .side{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:30}
  .topbar b{font-family:Sora;font-weight:800;font-size:19px;letter-spacing:-.04em}.topbar b span{color:var(--mint)}
  .topbar button{background:transparent;border:0;color:#fff;width:44px;height:44px}
  .main{padding:18px 14px 50px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
}

", "tema": "Trauma cranioencefálico", "e": "Homem de 45 anos foi encontrado inconsciente por familiares junto a uma escada de sua casa. Familiares o conduziram em carro próprio, sem medidas-padrão de atendimento pré- hospitalar. Não sabem por quanto tempo ficou desacordado e nem sobre o histórico de saúde. Quando deu entrada no pronto-socorro, encontrava-se inconsciente, com equimose e escoriações na região orbital e palpebral direita, além de escoriações na região cervical posterior e em membros à direita. Não apresentava resposta ao comando verbal, mas respirava espontaneamente com frequência normal. Pressão arterial de 140 x 90 mmHg e pupilas isocóricas. Durante a avaliação, abriu os olhos e começou a se mexer, ainda sem responder a questões ou comandos. Após 30 minutos começou a responder, mas informava não se lembrar de ter caído da escada. ão Médica Considerando o quadro, a conduta adequada é", "a": ["tomografia de crânio, face e coluna cervical; radiografia de membros; manter o paciente em observação por 12 horas.", "radiografia de crânio, coluna cervical e membros em duas posições; internar o paciente para observação.", "tomografia de crânio, face e radiografia de membros; liberar o paciente para observação domiciliar.", "radiografia de crânio e face; radiografia de membros; internar o paciente por 24 horas."], "c": 0, "com": "TCE com perda de consciência, amnésia, rebaixamento inicial e trauma de face e região cervical: precisa de tomografia de crânio, face e coluna cervical e observação. Radiografia de crânio não tem papel no TCE, e liberar o paciente seria inseguro.", "tab": [["Situação", "Conduta"], ["TCE com perda de consciência ou amnésia", "TC de crânio"], ["Trauma acima da clavícula/rebaixamento", "Avaliar coluna cervical (TC)"], ["Radiografia de crânio", "Não indicada no TCE"]], "tut": "No TCE, a imagem de escolha é sempre a tomografia, nunca a radiografia de crânio. Rebaixou ou esqueceu o trauma? TC e observação."}, {"id": "en25-04", "banca": "ENAMED/ENARE", "ano": 2025, "num": 4, "area": "Ginecologia e Obstetrícia", "tema": "Endometriose", "e": "Paciente de 30 anos procurou consultório de ginecologia relatando fadiga, dismenorreia progressiva e dispareunia de profundidade. Toque vaginal: útero de volume normal, retroversofletido, dor à mobilização do colo. Com base nessas informações, a principal hipótese diagnóstica é", "a": ["doença inflamatória pélvica.", "miomatose uterina.", "cisto hemorrágico.", "endometriose."], "c": 3, "com": "A tríade dismenorreia progressiva, dispareunia de profundidade e útero retrovertido doloroso à mobilização é clássica de endometriose, que afeta mulheres em idade reprodutiva.", "tab": [["Achado", "Sugere"], ["Dismenorreia progressiva + dispareunia profunda", "Endometriose"], ["Útero aumentado, sangramento aumentado", "Miomatose/adenomiose"], ["Febre, corrimento, dor à mobilização aguda", "DIP"]], "tut": "Pense em endometriose quando a cólica piora a cada ano e a dor aparece na relação profunda. O útero fica 'preso' para trás por aderências."}, {"id": "en25-06", "banca": "ENAMED/ENARE", "ano": 2025, "num": 6, "area": "Medicina Preventiva", "tema": "Níveis de atenção e prevenção", "e": "Observe o encaminhamento realizado por um médico de família. “A cardiologia, Encaminho o Sr. J. L. S., de 56 anos, com diagnóstico de cardiopatia isquêmica, que sofreu um infarto agudo do miocárdio há 3 meses. Tem orientação para o uso de antiagregantes plaquetários, mas tem história de úlcera péptica e teve reação alérgica ao clopidogrel e à ticlopidina. Desta forma, solicito orientação quanto à conduta preventiva” Ao ser assistido pelo cardiologista, o paciente será atendido em qual nível de atenção e receberá que tipo de prevenção, respectivamente?", "a": ["Primário; secundário.", "Secundário; secundário.", "Terciário; terciário.", "Quaternário; terciário."], "c": 1, "com": "O cardiologista atua na atenção secundária (ambulatório especializado). Como o paciente já teve um infarto, as medidas para evitar novo evento são prevenção secundária.", "tab": [["Prevenção", "Objetivo"], ["Primária", "Evitar que a doença aconteça"], ["Secundária", "Detectar cedo / evitar recorrência"], ["Terciária", "Reabilitar e reduzir sequelas"], ["Quaternária", "Evitar dano por excesso de intervenção"]], "tut": "Nível de atenção = onde o paciente é atendido (UBS, especialista, hospital). Tipo de prevenção = o que se quer evitar. São duas perguntas diferentes."}, {"id": "en25-08", "banca": "ENAMED/ENARE", "ano": 2025, "num": 8, "area": "Clínica Médica", "tema": "Artrite reumatoide", "e": "Mulher de 20 anos procura atendimento médico no ambulatório de clínica médica de referência devido a quadro iniciado há 3 meses, com dor e edema articular acometendo articulações das mãos (interfalangeanas proximais, metacarpofalangeanas e punhos), assim como cotovelos, joelhos e tornozelos. Relata rigidez matinal que persiste por mais de 2 horas. O exame físico confirma dor e edema nas articulações descritas, além de mucosas hipocoradas (++/4+), sem outras alterações. A hipótese diagnóstica a ser considerada, o achado laboratorial esperado e a primeira linha de tratamento indicada são, respectivamente,", "a": ["esclerose sistêmica; níveis elevados de creatina quinase; prednisona.", "artrite reumatoide; pesquisa de fator reumatoide (FR) positivo; metotrexato.", "lúpus eritematoso sistêmico; FAN com padrão nuclear pontilhado fino denso; cloroquina.", "doença mista do tecido conjuntivo; FAN com padrão nuclear pontilhado fino; azatioprina."], "c": 1, "com": "Poliartrite simétrica de pequenas e grandes articulações, rigidez matinal acima de 1 hora e duração maior que 6 semanas: artrite reumatoide. O fator reumatoide costuma ser positivo, e o metotrexato é a droga de primeira linha.", "tab": [["Artrite reumatoide", "Pontos-chave"], ["Clínica", "Poliartrite simétrica de mãos, rigidez > 1 h"], ["Laboratório", "FR e anti-CCP (mais específico)"], ["Tratamento inicial", "Metotrexato"]], "tut": "AR = mãos inchadas dos dois lados, de manhã travadas por mais de uma hora. A âncora do tratamento é o metotrexato."}, {"id": "en25-12", "banca": "ENAMED/ENARE", "ano": 2025, "num": 12, "area": "Medicina Preventiva", "tema": "Rastreamento no adulto", "e": "Homem de 52 anos, branco, solteiro, comparece à consulta agendada na Unidade Básica de Saúde (UBS) desejando realizar revisão clínica e exames laboratoriais. Desde os 35 anos não faz acompanhamento de saúde. Relata história familiar de diabetes e hipertensão, e a mãe faleceu com câncer de pulmão. Sem história familiar de câncer de próstata. Fuma cerca de 2 maços por dia há 21 anos. Exame físico: pressão arterial de 120 x 80 mmHg, índice de massa corporal de 23 kg/m”, sem outras alterações. Considerando as recomendações de rastreamento para esse paciente, o médico de família e comunidade deve", "a": ["solicitar exames de colesterol total e frações, hemograma, glicemia de jejum, creatinina, PSA, radiografia de tórax, colonoscopia, realizar toque retal; orientar sobre a prática de atividade física regular.", "solicitar exames de colesterol total, glicemia de jejum, pesquisa de sangue oculto nas fezes, PSA, ofertar anti-HIV e HBsAg, realizar toque retal; orientar sobre participação no grupo na UBS para abandono do tabagismo.", "abordar mudanças no estilo de vida e cessação do tabagismo; acompanhar, em consultas longitudinais, as futuras possibilidades de exames complementares, quando o paciente atingir faixa etária para investigações adicionais.", "solicitar exames de colesterol total, HDL e triglicerídeos, glicemia de jejum, pesquisa de sangue oculto nas fezes, ofertar testes rápidos para HIV, sífilis e hepatites Be C; realizar abordagem sobre possibilidade de cessação do tabagismo."], "c": 3, "com": "Homem de 52 anos, tabagista: rastrear dislipidemia e diabetes, câncer colorretal (sangue oculto nas fezes dos 50 aos 75 anos), oferecer testes rápidos para IST e abordar a cessação do tabagismo. PSA e radiografia de tórax não são recomendados como rastreamento na APS.", "tab": [["Rastreamento", "Recomendação na APS"], ["Câncer colorretal", "Sangue oculto nas fezes, 50 a 75 anos"], ["PSA", "Não recomendado de rotina"], ["Radiografia de tórax", "Não é rastreamento de câncer de pulmão"]], "tut": "Rastreie o que tem benefício provado: lipídios, glicemia, câncer de cólon a partir dos 50 e ISTs. PSA e raio-X de tórax de rotina são pegadinhas."}, {"id": "en25-13", "banca": "ENAMED/ENARE", "ano": 2025, "num": 13, "area": "Medicina Preventiva", "tema": "Saúde do trabalhador", "e": "Mulher de 32 anos, parda, ensino fundamental incompleto, trabalhadora rural, diarista no plantio de morango, procura Unidade Básica de Saúde (UBS) com queixas de tonturas, dores de cabeça, cansaço, náuseas e falta de ar. Ela referiu que desde os 20 anos sofre com dores de cabeça frequentes, mas há 2 semanas, após uma pulverização de agrotóxicos, começou a apresentar os sintomas descritos. Disse ainda que sua colega de trabalho apresentava queixas similares. Ao ouvir esses relatos, a médica da UBS suspeita de intoxicação aguda por agrotóxicos. Nessa situação, qual é a conduta adequada a ser adotada na assistência?", "a": ["Encaminhar como caso suspeito ao centro de referência em saúde do trabalhador estadual e formalizar denúncia ao Ministério Público do Trabalho.", "Estabelecer nexo causal entre os sintomas e os resultados de exames complementares, para confirmar diagnóstico de intoxicação por agrotóxicos, e notificar a Vigilância em Saúde municipal.", "Tratar os sintomas, solicitar exames complementares, notificar o caso no Sistema de Notificação de Agravos e Doenças (Sinan), conceder atestado médico e solicitar matriciamento à Vigilância em Saúde do Trabalhador.", "Informar não ser responsável pelo preenchimento da comunicação de acidente de trabalho (CAT), por ser atribuição exclusiva da medicina do trabalho, no centro municipal de referência em saúde do trabalhador."], "c": 2, "com": "Na suspeita de intoxicação por agrotóxico, a UBS trata, investiga, notifica no Sinan (agravo de notificação compulsória), afasta o trabalhador com atestado e pede apoio da Vigilância em Saúde do Trabalhador. Não precisa confirmar o nexo para notificar.", "tab": [["Ponto", "Regra"], ["Notificação", "Suspeita já basta"], ["Sistema", "Sinan"], ["CAT", "Qualquer médico pode emitir"]], "tut": "Notificação compulsória é feita na suspeita, não depois da confirmação. E a CAT não é exclusiva do médico do trabalho."}, {"id": "en25-14", "banca": "ENAMED/ENARE", "ano": 2025, "num": 14, "area": "Pediatria", "tema": "Saúde mental infantil", "e": "Pais de um menino de 10 anos levam a criança para avaliação médica em Unidade Básica de Saúde (UBS). Relatam que seu filho se dá bem com a família até que não lhe seja permitido fazer algo que deseja. Quando isso ocorre, ele fica irritado, impulsivamente agressivo e agitado por várias horas. Assim que se acalma ou consegue o que quer, fica feliz e agradável novamente. Os pais entendem que o filho parece agir deliberadamente para aborrecer os outros e nunca assume a culpa por seus próprios erros ou mau comportamento. Relatam ainda que ele discute com adultos ou figuras de autoridade e em várias situações não aceita as regras de boa convivência com os familiares. Considerando o caso descrito, qual é o diagnóstico mais provável?", "a": ["Transtorno afetivo bipolar.", "Transtorno de oposição desafiante.", "Transtorno disruptivo da desregulação do humor.", "Transtorno do déficit de atenção e hiperatividade."], "c": 1, "com": "Padrão persistente de desafio às regras, discussão com adultos, culpar os outros e agir para irritar, com humor normal entre os episódios: transtorno de oposição desafiante. No transtorno disruptivo da desregulação do humor, a irritabilidade é persistente entre as explosões.", "tab": [["Transtorno", "Marca"], ["Oposição desafiante", "Desafio, discussão, vingança; humor normal entre episódios"], ["Desregulação do humor", "Explosões + irritabilidade persistente o tempo todo"], ["TDAH", "Desatenção e hiperatividade"]], "tut": "Se entre as birras a criança volta a ficar feliz, pense em TOD. Se ela vive irritada o dia todo, pense em desregulação do humor."}, {"id": "en25-15", "banca": "ENAMED/ENARE", "ano": 2025, "num": 15, "area": "Clínica Médica", "tema": "Síndrome nefrótica", "e": "Homem de 50 anos, queixando-se de astenia e constipação com fezes em fita. Há 15 dias, apresenta edema de membros inferiores até a raiz da região crural, bilateralmente, com pouca melhora à elevação dos membros. Ele perdeu 10 kg em 6 meses. Nega hipertensão arterial e diabetes mellitus e não faz uso de medicamento. Os exames do paciente apresentaram os seguintes resultados: Pressão arterial 130 x 80 mmHg -—— Peso 70kg -— Hematócrito 35% 48 a 69% Glicemia 88 mg/dL 60 a 100 mg/dL Albumina sérica 1,8 g/dL 3,8a 4,8g/dL Creatinina 1,2 mg/dL 0,7a 1,3 mg/dL Triglicerídeos 200 mg/dL < 150 mg/dL Proteína urinária de 24 horas 3,6 8/24 horas < 100 mg/24 horas proteínas +++ Sedimentos hemácias + (5 por = campo) Dentre esses achados laboratoriais, quais são necessários para a definição da síndrome renal do paciente?", "a": ["Proteína urinária de 24 horas = 3,6 g e albumina sérica = 1,8 g/dL.", "Proteína urinária de 24 horas = 3,6 g e triglicerídeos = 200 mg/dL.", "Hematúria e triglicerídeos = 200 mg/dL.", "Hematúria e albumina sérica = 1,8 g/dL."], "c": 0, "com": "A síndrome nefrótica é definida por proteinúria acima de 3,5 g/24 h e hipoalbuminemia. Edema e dislipidemia são consequências frequentes, mas não fazem parte da definição. Hematúria aponta para síndrome nefrítica.", "tab": [["Síndrome", "Definição"], ["Nefrótica", "Proteinúria > 3,5 g/24 h + hipoalbuminemia"], ["Nefrítica", "Hematúria + HAS + edema + oligúria"], ["Achados associados", "Edema, dislipidemia, lipidúria"]], "tut": "Nefrótica = 'perde proteína': muita proteína na urina e pouca albumina no sangue. Sangue na urina é coisa da nefrítica."}, {"id": "en25-16", "banca": "ENAMED/ENARE", "ano": 2025, "num": 16, "area": "Pediatria", "tema": "Puericultura na síndrome de Down", "e": "Recém-nascido de 15 dias, a termo, Apgar 8/9, peso e comprimento ao nascer de 2.600 g e 46 cm, respectivamente, com síndrome de Down, e cuja gestação não apresentou outras intercorrências. Está na consulta de puericultura com peso e comprimento atuais de 2.900 g e 47 cm, respectivamente. Para o acompanhamento pôndero-estatural, os dados devem ser plotados nas", "a": ["curvas de crescimento da OMS desde o nascimento até a adolescência.", "curvas de crescimento específicas para síndrome de Down desde o nascimento.", "curvas de crescimento da OMS, corrigindo o peso e o comprimento para síndrome de Down.", "curvas de crescimento da OMS até os dois anos e, a partir daí, em curvas específicas para síndrome de Down."], "c": 1, "com": "Crianças com síndrome de Down têm padrão de crescimento próprio, por isso devem ser acompanhadas em curvas específicas para Down desde o nascimento.", "tab": [["Situação", "Curva"], ["Criança típica", "OMS"], ["Síndrome de Down", "Curvas específicas desde o nascimento"], ["Prematuro", "Curva de prematuros/idade corrigida"]], "tut": "Down tem a régua própria: usa a curva de Down desde o primeiro dia, sem 'corrigir' a da OMS."}, {"id": "en25-17", "banca": "ENAMED/ENARE", "ano": 2025, "num": 17, "area": "Cirurgia", "tema": "Pneumotórax hipertensivo", "e": "Paciente de 20 anos, sexo masculino, vítima de colisão “automóvel a muro”, sem cinto de segurança, é atendido ainda na cena pelo Serviço Móvel de Atendimento de Urgência (SAMU). Exame físico: paciente torporoso; saturação de O, de 60%, em ar ambiente; frequência respiratória de 28 irpm; frequência cardíaca de 112 bpm; pressão arterial de 90 x 50 mmHg. Desvio da traqueia para a direita, turgência de veias jugulares, hipofonese de bulhas cardíacas e diminuição acentuada do murmúrio vesicular à esquerda. Qual é a conduta adequada no atendimento pré-hospitalar?", "a": ["Reposição volêmica.", "Cricotireoidostomia.", "Pericardiocentese.", "Toracocentese."], "c": 3, "com": "Hipotensão, turgência jugular, desvio da traqueia para o lado contrário e murmúrio abolido à esquerda: pneumotórax hipertensivo. A conduta imediata, ainda na cena, é a descompressão torácica (toracocentese de alívio).", "tab": [["Achado", "Pneumotórax hipertensivo x tamponamento"], ["Murmúrio vesicular", "Abolido x normal"], ["Traqueia", "Desviada x central"], ["Conduta", "Descompressão torácica x pericardiocentese"]], "tut": "Jugular cheia e hipotensão podem ser pneumotórax ou tamponamento. O que decide é o pulmão: sem murmúrio e traqueia desviada = pneumotórax."}, {"id": "en25-18", "banca": "ENAMED/ENARE", "ano": 2025, "num": 18, "area": "Ginecologia e Obstetrícia", "tema": "Amenorreia primária", "e": "Paciente de 16 anos comparece ao ambulatório para mostrar os resultados dos exames complementares solicitados na consulta anterior. Está preocupada porque todas as colegas da mesma idade já menstruaram e ela não. O fenótipo é feminino, com pelos pubianos e axilares esparsos. Os exames complementares evidenciam ausência do útero à ultrassonografia pélvica, dosagem sérica do hormônio folículo estimulante (FSH) normal, dosagem de testosterona sérica compatível com níveis do sexo masculino e cariótipo 46 XY. Com base no quadro clínico e nos dados apresentados, a principal hipótese diagnóstica dessa paciente é", "a": ["disgenesia gonadal.", "malformação Mulleriana.", "obstrução do trato genital.", "insensibilidade androgênica."], "c": 3, "com": "Cariótipo 46,XY, fenótipo feminino, ausência de útero, testosterona em níveis masculinos e pelos escassos: insensibilidade androgênica completa. Os testículos produzem testosterona, mas os tecidos não respondem a ela.", "tab": [["Diagnóstico", "Cariótipo / útero / pelos"], ["Insensibilidade androgênica", "46,XY / ausente / escassos"], ["Agenesia mülleriana (Rokitansky)", "46,XX / ausente / normais"], ["Disgenesia gonadal (Turner)", "45,X / presente / escassos, FSH alto"]], "tut": "Sem útero e com pelos normais = Rokitansky. Sem útero e sem pelos, com testosterona alta = insensibilidade androgênica."}, {"id": "en25-19", "banca": "ENAMED/ENARE", "ano": 2025, "num": 19, "area": "Clínica Médica", "tema": "Hipertensão no idoso", "e": "Mulher de 82 anos, sem história prévia dehipertensão, comparece à consulta preocupada porque aferiu a pressão na farmácia há 1 semana e estava em 146 x 86 mmHg. Em outra aferição, há 2 semanas, na unidade de saúde, a pressão estava em 144 x 88 mmHg. No momento da consulta, a pressão está em 148 x 88 mmHg. Não apresenta sintomas nem está em acompanhamento de outros agravos neste momento. Qual é a abordagem adequada nesse caso?", "a": ["Referenciar ao cardiologista para um manejo específico.", "Solicitar holter 24 horas e ecocardiograma para ampliar a avaliação.", "Prescrever losartana 50 mg, 1 comprimido à noite, com monitoramento da pressão arterial na unidade.", "Realizar uma conduta expectante, sem necessidade de medicamentos, com monitoramento de pressão arterial na unidade."], "c": 3, "com": "Em idosos com 80 anos ou mais, o tratamento farmacológico costuma ser indicado a partir de PAS de 160 mmHg. Com PA de 144-148 x 86-88 mmHg, sem sintomas nem lesão de órgão-alvo, a conduta é expectante, com mudança de estilo de vida e monitoramento.", "tab": [["Idade", "Início do remédio (PAS)"], ["Adulto", "≥ 140 mmHg (conforme risco)"], ["Idoso ≥ 80 anos", "≥ 160 mmHg"], ["Meta no muito idoso", "Individualizar, evitar hipotensão"]], "tut": "No muito idoso, a régua sobe: só trate com remédio a partir de 160 de sistólica. Abaixo disso, acompanhe."}, {"id": "en25-20", "banca": "ENAMED/ENARE", "ano": 2025, "num": 20, "area": "Clínica Médica", "tema": "Profilaxia do HIV", "e": "Mulher travesti de 28 anos, profissional do sexo, comparece à Unidade Básica de Saúde (UBS) em demanda espontânea. Relata relações sexuais frequentes com diferentes parceiros, com uso inconsistente de preservativos, principalmente durante relações anais receptivas. Há 2 dias teve uma relação sexual desprotegida com um cliente que se recusou a usar camisinha. Nunca utilizou medicamento para profilaxia pré-exposição (PrEP) ou pós- exposição (PEP) à infecção pelo HIV. Considerando que a paciente está assintomática no momento, qual a melhor estratégia de prevenção?", "a": ["Prescrever PrEP após resultado não reagente para HIV; indicar PEP após tratamento inicial e orientar rastreamento de ISTs a cada 3 meses.", "Oferecer teste rápido para HIV e sífilis; prescrever PrEP de início imediato; orientar sobre as vacinas disponíveis no SUS para seu grupo populacional.", "Realizar testagem rápida para HIV e sífilis; prescrever PEP mediante resultado não reagente para HIV e programar início da PrEP após término da PEP.", "Prescrever PEP e PrEP de forma concomitante; solicitar sorologias para ISTs; agendar retorno para analisar os resultados e revisar adesão ao tratamento."], "c": 2, "com": "Exposição sexual de risco há menos de 72 horas: faz-se teste rápido e, se não reagente, PEP por 28 dias. Ao terminar a PEP, emenda-se a PrEP, já que a exposição é recorrente.", "tab": [["Profilaxia", "Quando"], ["PEP", "Exposição de risco há até 72 h, por 28 dias"], ["PrEP", "Exposição recorrente, uso contínuo"], ["Transição", "Inicia PrEP ao fim da PEP"]], "tut": "Aconteceu agora (até 72 h)? É PEP. Vai continuar acontecendo? Depois da PEP, PrEP."}, {"id": "en25-21", "banca": "ENAMED/ENARE", "ano": 2025, "num": 21, "area": "Clínica Médica", "tema": "Anorexia nervosa", "e": "Mulher de 21 anos comparece à consulta médica em Unidade Básica de Saúde (UBS) para avaliação de amenorreia há 4 meses, sendo descartada gravidez. Paciente relata que há 10 meses iniciou dieta para perder peso, tendo emagrecido nesse período aproximadamente 30 kg. Há 2 dias relata desmaio durante prática de exercício físico e, por isso, realizou eletrocardiograma (ECG) que indicou alterações no segmento ST e na onda T. Paciente nega histórico de diagnóstico de transtorno mental, mora sozinha e sua família é de outra cidade. Afirma manter o padrão alimentar, pois ainda quer perder peso. Ao exame físico, apresenta palidez de mucosa e turgor cutâneo diminuído. Altura = 1,63 m; peso = 39 kg (IMC = 14,7 kg/m?); pressão arterial = 80 x 60 mmHg; frequência cardíaca = 55 bpm e frequência respiratória = 15 irpm. Qual é a conduta adequada nesse momento?", "a": ["Solicitar internação em enfermaria de clínica médica.", "Encaminhar para internação em enfermaria de saúde mental.", "Continuar a investigação para causas da amenorreia na UBS.", "Acompanhar em ambulatório do Centro de Atenção Psicossocial (CAPs)."], "c": 0, "com": "Anorexia com instabilidade clínica (IMC 14,7, síncope, bradicardia, hipotensão e alteração de ECG) exige internação em enfermaria clínica para estabilização e prevenção da síndrome de realimentação. O cuidado psiquiátrico vem junto, mas a prioridade é o risco clínico.", "tab": [["Critério de internação", "Exemplo"], ["IMC muito baixo", "< 15 kg/m²"], ["Instabilidade hemodinâmica", "Bradicardia, hipotensão, síncope"], ["Alterações de ECG/eletrólitos", "Risco de arritmia"]], "tut": "Na anorexia grave, primeiro salva o corpo (clínica médica), depois trata a cabeça. Coração lento e ECG alterado = internação clínica."}, {"id": "en25-22", "banca": "ENAMED/ENARE", "ano": 2025, "num": 22, "area": "Clínica Médica", "tema": "Doença de Parkinson", "e": "Mulher de 65 anos iniciou quadro de lentidão dos movimentos há 6 meses, com dificuldade para amarrar sapatos, abotoar roupas e digitar. Ao caminhar, apresentava passos mais curtos e sensação de instabilidade, com 1 episódio de queda. Concomitantemente apresentou tremores nas mãos, de repouso, associados à rigidez e alteração do padrão do sono. Nega alterações de memória e cognição. Ao exame físico apresentava fácies em máscara, marcha em pequenos passos, frequência cardíaca de 88 bpm com ausculta sem alterações, pressão arterial de 130 x 80 mmHg, tremores assimétricos na manobra dos braços estendidos, hipertonia em roda dentada. A ressonância nuclear magnética realizada há 2 semanas constatou atrofia cerebral compatível com a idade. O tratamento medicamentoso inicial recomendado para o caso clínico será", "a": ["levodopa e carbidopa.", "donepezila e memantina.", "propranalol e amantadina.", "atorvastatina e baclofeno."], "c": 0, "com": "Bradicinesia, tremor de repouso assimétrico, rigidez em roda denteada e instabilidade: doença de Parkinson. Em paciente de 65 anos com sintomas que limitam a vida diária, levodopa associada a carbidopa é o tratamento inicial mais eficaz.", "tab": [["Opção", "Uso"], ["Levodopa + carbidopa", "Mais eficaz, padrão inicial no idoso"], ["Agonista dopaminérgico", "Alternativa no paciente mais jovem"], ["Donepezila/memantina", "Demência, não Parkinson"]], "tut": "Parkinson = lento, rígido e treme parado. O remédio que repõe dopamina é a levodopa, com carbidopa para ela chegar ao cérebro."}, {"id": "en25-23", "banca": "ENAMED/ENARE", "ano": 2025, "num": 23, "area": "Pediatria", "tema": "Violência contra adolescentes", "e": "A violência contra adolescentes pode ter várias causas e atores. Os sinais que demonstram essas ações podem ser indiretos, mas devem ser observados pelos profissionais da saúde. Assinale a alternativa com a situação em que se deve notificar o Conselho Tutelar.", "a": ["Manuel, 15 anos, abandonado pelos pais e sob os cuidados de uma família acolhedora, apresenta febre, vômitos, petéquias que evoluem para púrpuras em MMiIl ess, rigidez de nuca e história vacinal desconhecida.", "Michele, 13 anos, está morando temporariamente com os tios enquanto a mãe faz um curso no exterior. Há 1 mês vem apresentando equimoses em face, pernas, coxas, em vários estágios de evolução, e evita falar sobre o fato.", "Felipe, 11 anos, acolhido em um abrigo desde os 9 anos, há 3 dias está mais recolhido no seu quarto e dorme quase o tempo todo. Apresenta febre, muita dor no corpo e retro- orbitária, sangramento gengival quando escova os dentes e petéquias pelo corpo.", "Edilene, 16 anos, que cumpre medidas socioeducativas em uma instituição do Estado, apresenta várias equimoses nos membros superiores e inferiores, além do tronco."], "c": 1, "com": "Equimoses em vários estágios de evolução, em locais não usuais, numa adolescente que evita falar do assunto, são sinais de alerta de violência física. Suspeita de violência contra criança ou adolescente deve ser comunicada ao Conselho Tutelar.", "tab": [["Sinal", "Alerta de violência"], ["Lesões em estágios diferentes", "Agressões repetidas"], ["Locais pouco usuais (face, coxas)", "Não sugerem acidente"], ["Relato evasivo", "Medo ou proteção do agressor"]], "tut": "Manchas roxas de 'idades' diferentes e uma história que não fecha = suspeite de violência e acione o Conselho Tutelar."}, {"id": "en25-24", "banca": "ENAMED/ENARE", "ano": 2025, "num": 24, "area": "Cirurgia", "tema": "Abdome agudo inflamatório", "e": "Paciente do sexo feminino, 27 anos, é atendida em Unidade de Pronto Atendimento (UPA) com história de dor abdominal, com início em epigástrio há dois dias, contínua, sem fatores de melhora, associada a náuseas e perda de apetite, evoluindo para dor em fossa ilíaca direita há 1 dia e febre de 38,2 “C no dia do atendimento. Nega comorbidades, cirurgias prévias ou uso de medicações regulares. Relata que a última menstruação foi há 23 dias, e apresenta ciclos regulares de 28 dias. Exame físico: regular estado geral, corada, desidratada +/4+, eupneica, anictérica, acianótica; ausculta pulmonar e cardíaca sem alterações; ruídos hidroaéreos diminuídos, descompressão brusca dolorosa em quadrante inferior de abdome à direita. Hemoglobina 10,7 g/dL 11,5 a 15,5 g/dlL Hematócrito 37% 38a 52% Leucócitos 13.400/mm? 4.000 a 11.000/mm? totais Bastonetes 7% 025% Urina 25 leucócitos/campo — Hemácias 8 hemácias/campo — Beta-hCG . (o negativo — sérico Considerando o diagnóstico mais provável, a conduta adequada é", "a": ["iniciar antibioticoterapia empírica até resultado de exame de urocultura.", "realizar tomografia computadorizada de abdome e iniciar metotrexato.", "iniciar antibioticoterapia empírica e acompanhamento ambulatorial.", "realizar ultrassonografia de abdome e solicitar parecer cirúrgico."], "c": 3, "com": "Dor que migra do epigástrio para a fossa ilíaca direita, febre, anorexia, leucocitose com desvio e descompressão dolorosa com beta-hCG negativo: apendicite aguda. Na mulher jovem, o ultrassom ajuda no diagnóstico diferencial, e o tratamento é cirúrgico.", "tab": [["Achado", "Apendicite"], ["Dor", "Migra do epigástrio para a FID"], ["Exame", "Blumberg positivo"], ["Conduta", "Imagem quando necessário + cirurgia"]], "tut": "Dor que começa no estômago e desce para a direita, com febre, é apendicite até prova em contrário. Leucócitos na urina podem confundir, mas não mudam a conduta."}, {"id": "en25-25", "banca": "ENAMED/ENARE", "ano": 2025, "num": 25, "area": "Ginecologia e Obstetrícia", "tema": "Diabetes gestacional", "e": "Multípara, 37 semanas, obesa, apresentando diabetes mellitus gestacional controlada com insulina NPH e regular. Evoluiu para parto normal, e o recém-nascido pesou 3.300 g. A conduta no puerpério imediato deve ser", "a": ["suspender insulinoterapia.", "iniciar hipoglicemiante oral.", "manter insulina NPH em 1/3 da dose da gravidez.", "manter insulinoterapia com a dosagem do pré-natal."], "c": 0, "com": "No diabetes gestacional, a resistência à insulina cai logo após a saída da placenta. Por isso, no puerpério imediato a insulina é suspensa e se faz um TOTG de 75 g entre 6 semanas e 6 meses após o parto.", "tab": [["Situação", "Pós-parto"], ["Diabetes gestacional", "Suspender insulina"], ["Diabetes prévio (pré-gestacional)", "Reduzir dose (cerca de 1/3 a 1/2)"], ["Reclassificação", "TOTG 75 g após o parto"]], "tut": "O diabetes da gravidez 'vai embora' com a placenta: suspende a insulina e reavalia depois. Quem já era diabético antes só reduz a dose."}, {"id": "en25-26", "banca": "ENAMED/ENARE", "ano": 2025, "num": 26, "area": "Clínica Médica", "tema": "Dengue", "e": "Homem de 34 anos se dirige à Unidade Básica de Saúde (UBS) com febre (38,5 “C), dores de moderada intensidade e manchas no corpo há 3 dias. No dia da consulta, iniciou com dores abdominais e vômitos incontroláveis. Exame físico: prostrado, mucosas coradas, extremidades bem perfundidas. Pressão arterial de 120 x 80 mmHg; frequência respiratória de 16 irpm; frequência cardíaca de 80 bpm. Leve dor à palpação abdominal, sem outras alterações. Qual a hipótese diagnóstica e o manejo, respectivamente?", "a": ["Dengue grupo B. Prescrever hidratação oral, analgésico e antiemético; solicitar hemograma, plaquetas e antígeno NS1; realizar acompanhamento domiciliar após exames.", "Dengue grupo C. Prescrever hidratação oral, analgésico e antiemético; solicitar hemograma, plaquetas e anticorpo IgM; realizar acompanhamento ambulatorial após exames.", "Dengue grupo C. Prescrever hidratação parenteral, analgésico e antiemético; solicitar hemograma, plaquetas e antígeno NS1; manter em leito de observação até estabilização.", "Dengue grupo B."], "c": 2, "com": "Dengue com dor abdominal e vômitos persistentes apresenta sinais de alarme, o que a classifica no grupo C. O manejo é hidratação venosa, exames (hemograma, plaquetas, NS1 na fase inicial) e observação em leito até estabilizar.", "tab": [["Grupo", "Critério / conduta"], ["A", "Sem alarme, sem risco / hidratação oral em casa"], ["B", "Sangramento de pele ou condição de risco / oral + hemograma"], ["C", "Sinais de alarme / hidratação venosa, internação"], ["D", "Choque / reanimação, UTI"]], "tut": "Dor abdominal intensa ou vômitos que não param são sinais de alarme: o paciente vai pro grupo C e pra veia."}, {"id": "en25-27", "banca": "ENAMED/ENARE", "ano": 2025, "num": 27, "area": "Clínica Médica", "tema": "Lombalgia", "e": "Homem de 48 anos, auxiliar de pedreiro, procura Unidade Básica de Saúde (UBS) com queixa de dor lombar iniciada há 3 semanas, de instalação insidiosa, sem irradiação. Relata que a dor piora ao final do dia e melhora parcialmente com repouso e uso de paracetamol. Nega perda de peso, febre, traumas, incontinência ou fraqueza nos membros inferiores. Ao exame físico, apresenta dor à palpação paravertebral em região lombar, sem alterações neurológicas. Com base na história clínica e no exame físico, qual o próximo passo na condução desse caso?", "a": ["Solicitar ressonância magnética da coluna lombar e encaminhar para a ortopedia.", "Solicitar radiografia lombar, prescrever corticoide oral e agendar o retorno após 10 dias.", "Orientar repouso, fornecer atestado de 7 dias e otimizar a analgesia com antidepressivo tricíclico.", "Explicar a natureza benigna, orientar analgesia e atividade física leve, com reavaliação em 4 a 6 semanas."], "c": 3, "com": "Lombalgia mecânica de 3 semanas, sem sinais de alarme (sem perda de peso, febre, trauma ou déficit neurológico), não precisa de exame de imagem. A conduta é explicar a natureza benigna, analgesia, manter-se ativo e reavaliar em 4 a 6 semanas.", "tab": [["Sinal de alarme", "Investigar"], ["Febre, emagrecimento, câncer prévio", "Infecção ou neoplasia"], ["Déficit neurológico, incontinência", "Compressão (síndrome da cauda equina)"], ["Trauma importante, idoso", "Fratura"]], "tut": "Dor nas costas sem bandeira vermelha melhora sozinha: não peça imagem, mantenha o paciente ativo e reavalie em algumas semanas."}, {"id": "en25-28", "banca": "ENAMED/ENARE", "ano": 2025, "num": 28, "area": "Medicina Preventiva", "tema": "Legislação em saúde mental", "e": "“Internações sem consentimento aumentam na Cracolândia, em meio a denúncias de agressões”. ZYLBERKAN, M.; KRUSE, T. Folha de S. Paulo, 3 jul. 2024. Notícias como esta têm se tornado frequentes em jornais brasileiros nos últimos anos. Alguns municípios têm criado leis locais próprias para as internações involuntárias que muitas vezes contradizem as leis federais sobre o tema. Sobre a internação involuntária no Brasil, é correto afirmar que", "a": ["a internação involuntária é determinada, de acordo com a legislação, pela Justiça.", "é autorizada por médico devidamente registrado no Conselho Regional de Medicina.", "no prazo de 15 dias, a internação deve ser comunicada ao Ministério Público Federal.", "o término da internação involuntária ocorrerá por solicitação do Ministério Público Municipal."], "c": 1, "com": "Pela Lei 10.216/2001 (e alterações da Lei 13.840/2019), a internação involuntária é autorizada por médico registrado no CRM, a pedido de terceiro. Ela deve ser comunicada ao Ministério Público Estadual em até 72 horas. A internação determinada pela Justiça é a compulsória.", "tab": [["Tipo", "Quem decide"], ["Voluntária", "O próprio paciente"], ["Involuntária", "Médico (CRM), a pedido de terceiro; MP estadual em 72 h"], ["Compulsória", "Juiz"]], "tut": "Involuntária = sem o paciente querer, mas com o médico autorizando. Compulsória = o juiz manda."}, {"id": "en25-29", "banca": "ENAMED/ENARE", "ano": 2025, "num": 29, "area": "Clínica Médica", "tema": "AVC isquêmico", "e": "Homem de 68 anos, em tratamento crônico irregular de hipertensão arterial sistêmica, diabetes mellitus e fibrilação atrial, é admitido em Unidade de Pronto Atendimento (UPA) com quadro de rebaixamento do nível de consciência e déficit neurológico do lado esquerdo, de predomínio braquiofacial. Segundo o acompanhante, o paciente tinha ido se deitar havia 90 minutos, sem qualquer sintoma antes de ser encontrado com o transtorno observado. Foi levado ao hospital, onde deu entrada 30 minutos após constatado o déficit focal. Ao exame físico, paciente com 9 pontos na escala de coma de Glasgow modificada, exibindo hemiparesia acentuada à esquerda, pressão arterial de 170 x 100 mmHg em ambos os membros superiores, com ritmo cardíaco irregular, frequência cardíaca média de 96 bpm. Não há outras alterações expressivas ao exame físico. Glicemia capilar de 285 mg/dL; demais exames laboratoriais não revelam anormalidades. A tomografia computadorizada de crânio sem contraste revela área de atenuação de densidade em cerca de 40% do território da artéria cerebral média direita, cujo laudo é obtido cerca de 3 horas após o último momento em que o paciente foi visto sem déficits. O médico da unidade explica ao acompanhante que, apesar dos potenciais benefícios da terapia trombolítica em pacientes com acidente vascular encefálico isguêmico, o paciente apresenta contraindicação em função de", "a": ["apresentar extensão de isquemia superior a 1/3 do território da artéria cerebral média acometida.", "haver decorrido período de tempo superior ao limite máximo tolerável desde o início do déficit.", "evoluir com glicemia acima de 200 mg/dL com intervalo maior que 2 horas pós-prandial.", "ter níveis pressóricos superiores aos permitidos para o uso do fármaco."], "c": 0, "com": "A tomografia mostra hipodensidade em cerca de 40% do território da artéria cerebral média, mais de 1/3 do território. Isso indica infarto extenso já estabelecido e alto risco de transformação hemorrágica, o que contraindica a trombólise. O tempo (3 h) ainda estaria dentro da janela de 4,5 h.", "tab": [["Contraindicação à trombólise", "Exemplo"], ["Hipodensidade extensa", "> 1/3 do território da ACM"], ["PA não controlada", "> 185 x 110 mmHg"], ["Tempo", "> 4,5 h do último momento visto bem"]], "tut": "Se a TC já mostra 'o estrago' em mais de um terço da cerebral média, o cérebro já morreu ali: trombolisar só aumenta o risco de sangrar."}, {"id": "en25-30", "banca": "ENAMED/ENARE", "ano": 2025, "num": 30, "area": "Pediatria", "tema": "Fimose", "e": "Menino de 6 anos é levado à Unidade Básica de Saúde (UBS) com queixa de fimose. Mãe relata balanopostites frequentes, sendo o primeiro episódio com 1 ano de vida. Nega infecções do trato urinário. Ao exame físico, apresenta prepúcio cobrindo toda a glande que, quando tracionado, expõe meato uretral e anel fibrótico prepucial. Sobre o caso, assinale a alternativa correta.", "a": ["Trata-se de fimose fisiológica, necessitando de exercícios de redução e higiene do prepúcio.", "Há indicação cirúrgica na adolescência, pois já está apresentando exposição de meato uretral.", "Há indicação cirúrgica, pois a criança apresenta balanopostites recorrentes com fibrose prepucial.", "Indica-se uso de creme de betametasona e hialuronidase por 4 semanas, uma vez que apresenta exposição de meato uretral."], "c": 2, "com": "A fimose fisiológica pode ser acompanhada, mas balanopostites de repetição e anel fibrótico prepucial indicam fimose patológica, com indicação cirúrgica (postectomia).", "tab": [["Situação", "Conduta"], ["Fimose fisiológica sem complicações", "Higiene, observação, corticoide tópico"], ["Balanopostites recorrentes, fibrose", "Cirurgia"], ["ITU de repetição", "Considerar cirurgia"]], "tut": "Prepúcio apertado é normal na criança. Inflamação de repetição com cicatriz (anel fibroso) é sinal para operar."}, {"id": "en25-31", "banca": "ENAMED/ENARE", "ano": 2025, "num": 31, "area": "Cirurgia", "tema": "Icterícia obstrutiva", "e": "Mulher de 72 anos foi atendida em hospital de médio porte. Relatava emagrecimento e dor abdominal com irradiação para região dorsal há 3 meses; há 1 mês a urina ficou mais escura, começou a apresentar prurido cutâneo intenso e icterícia em escleras. Ao exame físico, encontrava-se ictérica +++/4+, emagrecida; exame do abdome com fígado palpável abaixo da borda costal direita, assim como uma massa bem definida, de consistência cística, não dolorosa em hipocôndrio direito. Nesse caso, o mais adequado é solicitar", "a": ["ultrassonografia para avaliar colecistite crônica calculosa.", "tomografia computadorizada para avaliar vias biliares e pâncreas.", "colangiopancreatografia por ressonância para avaliar coledocolitiase.", "biópsia percutânea com agulha da massa palpada para avaliar neoplasia."], "c": 1, "com": "Icterícia progressiva com emagrecimento, dor irradiada para o dorso e vesícula palpável indolor (sinal de Courvoisier-Terrier) sugere neoplasia periampular, como câncer de cabeça de pâncreas. A tomografia de abdome avalia vias biliares, pâncreas e estadiamento.", "tab": [["Achado", "Pensar em"], ["Vesícula palpável indolor + icterícia", "Neoplasia periampular"], ["Icterícia flutuante com dor em cólica", "Coledocolitíase"], ["Exame inicial na suspeita de tumor", "TC de abdome"]], "tut": "Vesícula grande que não dói em idoso amarelo e magro é tumor até prova em contrário. Pedra costuma doer e deixar a vesícula murcha."}, {"id": "en25-33", "banca": "ENAMED/ENARE", "ano": 2025, "num": 33, "area": "Medicina Preventiva", "tema": "Tuberculose: retratamento", "e": "Homem de 48 anos busca atendimento na Unidade Básica de Saúde (UBS) para reiniciar tratamento para tuberculose. Paciente refere que iniciou o tratamento poliquimioterápico há 6 meses, quando foi diagnosticado com tuberculose; porém, há 2 meses, interrompeu o acompanhamento na sua unidade de origem devido ao uso de substâncias psicoativas. Ele se mudou para o território da unidade há 15 dias e foi visitado pelo agente comunitário, que o orientou a procurar atendimento médico para avaliação e retomada do tratamento. Foram solicitados, inicialmente, oteste rápido molecular para tuberculose (TRM-TB), baciloscopia de escarro e radiografia de tórax. Qual a conduta adequada para esse caso?", "a": ["Seo TRM-TB for positivo, sem resistência à rifampicina, e a baciloscopia for negativa, reiniciar o esquema básico.", "Se o TRM-TB for negativo e a baciloscopia for positiva, reiniciar o esquema básico, desde que a resistência à rifampicina seja positiva.", "Se o TRM-TB for negativo e a baciloscopia for positiva, solicitar cultura de escarro com teste de sensibilidade e reiniciar o esquema básico enquanto se aguarda a cultura.", "Se o TRM-TB for positivo, com resistência à rifampicina, e a baciloscopia for positiva, solicitar cultura de escarro com teste de sensibilidade e reiniciar o esquema básico enquanto se aguarda a cultura."], "c": 2, "com": "No retratamento por abandono, é preciso pedir cultura com teste de sensibilidade. Com TRM-TB negativo e baciloscopia positiva, reinicia-se o esquema básico enquanto se aguarda a cultura. Resistência à rifampicina exige esquema especial, não o básico.", "tab": [["Situação", "Conduta"], ["Retratamento", "Sempre cultura + teste de sensibilidade"], ["Sem resistência à rifampicina", "Reiniciar esquema básico"], ["Resistência à rifampicina", "Referência e esquema especial"]], "tut": "Paciente que abandonou o tratamento volta com cultura obrigatória. Se não há sinal de resistência, recomeça o esquema básico enquanto o resultado sai."}, {"id": "en25-34", "banca": "ENAMED/ENARE", "ano": 2025, "num": 34, "area": "Medicina Preventiva", "tema": "Testes diagnósticos", "e": "Uma instituição de saúde está pesquisando um novo teste de triagem para hanseníase, com sensibilidade de 92% e especificidade de 65%, aplicado em uma população com baixa prevalência da doença. Nesse contexto, é correto afirmar que", "a": ["quasetodos os testes positivos indicarão verdadeiros casos de hanseníase, diante da elevada sensibilidade do teste.", "o número de falsos-positivos será elevado, devido à baixa especificidade do teste e à baixa prevalência da doença.", "o número de falsos-negativos será elevado, reduzindo a capacidade do teste em detectar casos reais.", "a elevada sensibilidade do teste o torna ideal para a confirmação do diagnóstico de hanseníase."], "c": 1, "com": "Com especificidade de 65%, 35% dos sadios terão resultado positivo. Como a prevalência é baixa, os sadios são a grande maioria, então os falsos-positivos serão muitos e o valor preditivo positivo será baixo.", "tab": [["Conceito", "Efeito"], ["Baixa especificidade", "Mais falsos-positivos"], ["Baixa prevalência", "VPP cai, VPN sobe"], ["Alta sensibilidade", "Bom para triagem, não para confirmar"]], "tut": "Teste pouco específico 'acusa' muita gente sadia. Se quase ninguém tem a doença, a maioria dos positivos será falso."}, {"id": "en25-35", "banca": "ENAMED/ENARE", "ano": 2025, "num": 35, "area": "Medicina Preventiva", "tema": "Luto", "e": "Mulher de 52 anos chega ao acolhimento de Unidade Básica de Saúde (UBS), muito chorosa, e relata: “Estou com dificuldade para dormir, não tenho comido direito, desde o ocorrido ... é o meu filho, sabe ... ele morreu há 3 dias ... e a dor no meu coração está muito forte, quase insuportável”. A paciente chora copiosamente e diz que sonha com uma pessoa gritando o nome de seu filho, relembrando o momento em que o tinha encontrado na rua, vítima de atropelamento. Após o primeiro acolhimento, ela fica um pouco mais calma, relatando que não pensa em se matar, que nunca tinha sido atendida por psiquiatra ou tomado medicamentos antes, mas que nesse momento precisa de muita ajuda. Diante do caso, qual a conduta adequada?", "a": ["Prescrever inibidor de recaptação de serotonina para alívio dos sintomas depressivos e ansiosos.", "Encaminhar ao Centro de Atenção Psicossocial (CAPs) para seguimento intensivo com médico psiquiatra.", "Encaminhar para psicologia na atenção secundária para ofertar terapia psicanalítica breve.", "Acompanhar longitudinalmente para observação e ofertar apoio pela equipe da UBS."], "c": 3, "com": "Luto agudo de 3 dias, com tristeza intensa, insônia e lembranças, sem ideação suicida, é reação esperada e não doença. A conduta é acolher e acompanhar longitudinalmente na UBS, sem antidepressivo nem encaminhamento especializado neste momento.", "tab": [["Situação", "Conduta"], ["Luto recente sem risco", "Acolher e acompanhar na APS"], ["Luto prolongado/complicado", "Avaliar transtorno, considerar tratamento"], ["Ideação suicida", "Avaliação de risco imediata"]], "tut": "Chorar muito três dias depois de perder um filho é normal. A APS acolhe e acompanha, sem medicalizar o luto."}, {"id": "en25-36", "banca": "ENAMED/ENARE", "ano": 2025, "num": 36, "area": "Clínica Médica", "tema": "Quedas no idoso", "e": "Mulher de 86 anos é levada pela filha à consulta no ambulatório de clínica médica, com queixa de quedas frequentes. A paciente tem diagnóstico prévio de hipertensão arterial sistêmica, diabetes mellitus tipo 2, dislipidemia, depressão, déficit cognitivo leve e constipação intestinal. Está em uso de losartana, hidroclorotiazida, atenolol, metformina, gliclazida, rosuvastatina, escitalopram, donepezila e lactulose. Segundo a filha da paciente, as quedas ocorrem em diversos horários do dia, mais frequentemente na madrugada, ao se levantar para ir ao banheiro. Ao exame físico, a idosa apresenta leve bradipsiquismo e sinais de sarcopenia; pressão arterial do membro superior direito de 138 x 92 mmHg, quando deitada, e 110 x 70 mmHg, quando sentada. O plano terapêutico apropriado ao contexto desse caso deve incluir", "a": ["sugerir avaliação oftalmológica para investigação de catarata.", "encaminhar ao neurologista para investigar a presença de disautonomia.", "rever a polifarmácia para reduzir fármacos indutores de hipotensão arterial.", "adicionar fármaco capaz de elevar os níveis tensionais, como a fludrocortisona."], "c": 2, "com": "Idosa com quedas à noite ao levantar, em uso de vários anti-hipertensivos (losartana, hidroclorotiazida, atenolol) e outros fármacos: o principal fator modificável é a polifarmácia com hipotensão ortostática. A conduta é revisar e reduzir medicamentos.", "tab": [["Causa de queda", "Ação"], ["Polifarmácia/hipotensão", "Desprescrever"], ["Sarcopenia", "Exercício e nutrição"], ["Ambiente", "Iluminação, barras, tapetes"]], "tut": "Idoso que cai ao levantar de madrugada e toma muito remédio de pressão: o primeiro passo é tirar remédio, não colocar."}, {"id": "en25-37", "banca": "ENAMED/ENARE", "ano": 2025, "num": 37, "area": "Pediatria", "tema": "Febre reumática", "e": "Menino, 10 anos, morador de área urbana, está em avaliação no pronto-atendimento por apresentar dor em cotovelo direito há 1 dia. Há 1 semana, iniciou quadro de febre de 38,5 *C, 1 a 2 picos ao dia, associada à dificuldade de deambular devido ao joelho direito apresentar-se “doloroso e inchado”. Após 4 dias, percebeu melhora da dor no joelho, porém o tornozelo direito começou a ficar “inchado e um pouco avermelhado”, doloroso, com melhora em 2 dias. Há 3 semanas, havia se queixado de dor de garganta. Sem outras queixas. Nega contato com animais domésticos. No momento do atendimento, está com dificuldade para movimentar o cotovelo direito por causa da dor e do edema, frequência cardíaca de 110 bpm e 2 bulhas rítmicas normofonéticas, com sopro sistólico de 3+/6+. Restante do exame físico sem anormalidades. Considerando o quadro clínico apresentado, o agente etiológico e o tratamento de escolha são, respectivamente,", "a": ["Borrelia burgdorferi; doxiciclina.", "Staphylococcus aureus; oxacilina.", "Treponema pallidum; penicilina G benzatina.", "Streptococcus pyogenes; penicilina G benzatina."], "c": 3, "com": "Artrite migratória de grandes articulações e febre, cerca de 3 semanas após faringite: febre reumática, causada pelo Streptococcus pyogenes. O tratamento erradica o estreptococo com penicilina G benzatina, que também é usada na profilaxia secundária.", "tab": [["Critério maior de Jones", "Exemplo"], ["Cardite", "Sopro novo, insuficiência mitral"], ["Poliartrite migratória", "Grandes articulações"], ["Coreia, eritema marginado, nódulos", "Outros critérios maiores"]], "tut": "Garganta inflamada e, semanas depois, uma artrite que 'pula' de articulação: febre reumática. O antibiótico é a penicilina benzatina."}, {"id": "en25-38", "banca": "ENAMED/ENARE", "ano": 2025, "num": 38, "area": "Cirurgia", "tema": "Pancreatite crônica", "e": "Homem de 58 anos deu entrada no pronto-socorro com dor epigástrica irradiada para as costas, iniciada há 2 horas, progressiva, pós-prandial, acompanhada de náuseas, vômitos e sudorese. Relata episódios semelhantes no último ano, que melhoraram com uso de analgésico. Tabagista ativo, alcoolista de 8 doses de destilado por dia há 33 anos, nega comorbidades. Exame físico: corado, acianótico, anictérico, sudoreico, fácies de dor, agitado. Índice de massa corporal de 23 kg/m?; pressão arterial de 150 x 90 mmHg; frequência cardíaca de 74 bpm; frequência respiratória de 18 irpm; temperatura axilar de 37 ºC. Abdome globoso, distendido, timpânico, peristalse presente, doloroso à palpação do epigástrio e hipocôndrio esquerdo. Os exames laboratoriais apresentam os seguintes resultados: Hematócrito 46% 36 a 46% Hemoglobina 15,0 g/dL 12,0a 15,0 g/dL Leucócitos 12.000/mm? 4.000 a 10.000/mm? Glicose 120 mg/dL 70a 99 mg/dL Bilirrubina total 1,2 mg/dL 0,3 a 1,3 mg/dL Ureia 38 mg/dL 15 a 40 mg/dL Cálcio 8,9 mg/dL 8,7 a 10,2 mg/dL Amilase 35 U/L 20a 96 U/L Lipase 12 U/L 3a 43 U/L Fosfatase alcalina 81U/L 33a96U/L LDH 127 U/L 100 a 190 U/L TGO 36 U/L 5a40U/L Qual é o provável diagnóstico?", "a": ["Colangite aguda.", "Colecistite aguda.", "Doença ulcerosa péptica.", "Pancreatite crônica."], "c": 3, "com": "Etilista e tabagista com crises recorrentes de dor epigástrica irradiada para o dorso: pancreatite crônica. Amilase e lipase normais não afastam o diagnóstico, porque o pâncreas fibrosado produz pouca enzima.", "tab": [["Pancreatite", "Aguda x crônica"], ["Enzimas", "Elevadas (≥ 3x) x normais"], ["Clínica", "Dor súbita x dor recorrente, esteatorreia, diabetes"], ["Causa principal", "Litíase/álcool x álcool"]], "tut": "Na pancreatite crônica, o pâncreas já está 'gasto' e não solta enzima: dor recorrente em etilista com amilase normal ainda é pancreatite."}, {"id": "en25-39", "banca": "ENAMED/ENARE", "ano": 2025, "num": 39, "area": "Ginecologia e Obstetrícia", "tema": "Gestação pós-termo", "e": "Primigesta de 29 anos, com 41 semanas de gestação e pré-natal de risco habitual, comparece à Unidade Básica de Saúde (UBS) para consulta de rotina. Ela está preocupada com a duração da gravidez e deseja saber quais serão os próximos passos. A paciente está assintomática, relata movimentação fetal presente, e o exame físico está normal para a idade gestacional. Perfil biofísico fetal realizado há 1 dia encontra-se dentro da normalidade. Considerando o quadro clínico apresentado e a idade gestacional, a conduta é", "a": ["orientar repouso domiciliar, com planejamento da indução do parto após 42 semanas.", "solicitar dopplervelocimetria obstétrica para avaliar o bem- estar fetal e planejar o manejo com base no resultado.", "realizar amnioscopia para verificar a presença de mecônio no líquido amniótico e planejar o manejo com base no resultado.", "solicitar perfil biofísico fetal e cardiotocografia a cada 2 a 3 dias e planejamento da indução do parto até 41 semanas e 6 dias."], "c": 3, "com": "Com 41 semanas, gestação de baixo risco, deve-se avaliar o bem-estar fetal (perfil biofísico e cardiotocografia a cada 2 a 3 dias) e programar a indução até 41 semanas e 6 dias, antes de completar 42.", "tab": [["Idade gestacional", "Conduta"], ["40 semanas", "Acompanhamento habitual"], ["41 semanas", "Vitalidade a cada 2 a 3 dias, programar indução"], ["42 semanas", "Pós-termo: resolução"]], "tut": "Chegou a 41 semanas? Vigia o bebê de perto e marca a indução antes de bater 42."}, {"id": "en25-41", "banca": "ENAMED/ENARE", "ano": 2025, "num": 41, "area": "Clínica Médica", "tema": "Cetoacidose diabética", "e": "Homem de 21 anos, portador de diabetes mellitus tipo 1, diagnosticado há 5 anos, foi levado à Unidade de Pronto Atendimento (UPA) devido à dor abdominal, náuseas e vômitos. Familiares informam que está sem utilizar insulina há 3 dias por dificuldades financeiras. No exame físico, encontra-se torporoso, desidratado, com hálito cetótico e dor abdominal à palpação profunda de forma generalizada. Ao exame, frequência cardíaca de 112 bpm; frequência respiratória de 38 irpm; pressão arterial de 110 x 70 mmHg. Os exames laboratoriais na admissão indicam: Glicemia 472 mg/dL 60 a 100 mg/dL Gasometria arterial pH de 7,2 7,35 a 7,45 Bicarbonato 10 mEg/L 22 a 26 mEg/L Creatinina 1,6 mg/dL 0,7 a 1,3 mg/dL Potássio sérico 3,0 mEg/L 3,5 a 5,5 mEg/L O diagnóstico e a conduta inicial indicada para esse paciente são, respectivamente,", "a": ["pancreatite aguda; iniciar dieta oral zero.", "estado hiperosmolar hiperglicêmico; iniciar insulinoterapia.", "cetoacidose diabética; prescrever solução fisiológica a 0,9 por cento.", "insuficiência renal aguda; prescrever bicarbonato de sódio."], "c": 2, "com": "DM1 sem insulina, glicemia de 472, pH 7,2, bicarbonato de 10 e hálito cetônico: cetoacidose diabética. O primeiro passo é hidratação com soro fisiológico a 0,9%. Com potássio de 3,0, é preciso repor potássio antes de começar a insulina.", "tab": [["Passo", "CAD"], ["1", "Soro fisiológico 0,9%"], ["2", "Checar potássio (< 3,3: repor antes da insulina)"], ["3", "Insulina regular em infusão"]], "tut": "Na CAD, a ordem é: água, potássio e só depois insulina. Insulina com potássio baixo pode causar arritmia."}, {"id": "en25-42", "banca": "ENAMED/ENARE", "ano": 2025, "num": 42, "area": "Pediatria", "tema": "Sepse neonatal", "e": "Recém-nascido de 14 dias, hipoativo e com desconforto respiratório, é levado para avaliação na Unidade de Pronto Atendimento (UPA). Antecedentes obstétricos: não foi realizado pré-natal e o parto ocorreu a termo no domicílio. Exame clínico: hipoativo e pouco responsivo, hipocorado, cianótico. Aparelho respiratório: 70 irpm com tiragem subcostal. Murmúrio vesicular diminuído bilateralmente. Saturação de O> em ar ambiente de 82%. Aparelho cardiovascular: pulsos débeis, tempo de perfusão capilar de 5 segundos. Frequência cardíaca de 160 bpm, com ritmo cardíaco regular. Abdome globoso, com fígado a 2,5 cm do rebordo costal direito, presença de halo de hiperemia e edema em torno do coto umbilical. O diagnóstico e as condutas adequadas são, respectivamente,", "a": ["choque cardiogênico; manter suporte ventilatório, evitar excesso de volume intravascular devido a risco de piora, administrar fármacos vasoativos e prostagland
