s dados apresentados, a conduta indicada nesse momento é", "a": ["iniciar expansão volêmica com cristaloide e antibiótico de espectro estendido para infecção nosocomial.", "iniciar fluidoterapia em velocidade de manutenção e cefalosporina de terceira geração.", "aguardar lactato, coagulograma, D-dímero e fibrinogênio para definir necessidade de antibiótico.", "aguardar coleta e resultados de sedimento urinário para definir necessidade de antibiótico."], "c": 0, "com": "Criança com febre, letargia, taquicardia e PA de 90 x 40 (pressão diferencial alargada, choque quente), com internação recente em UTI com sonda e cateter: choque séptico com risco de germe hospitalar. A conduta é expansão com cristaloide e antibiótico de amplo espectro na primeira hora.", "tab": [["Choque séptico pediátrico", "Conduta"], ["1ª hora", "Expansão 10-20 mL/kg + antibiótico"], ["Internação recente", "Cobertura para germes hospitalares"], ["Refratário a volume", "Drogas vasoativas"]], "tut": "Criança febril, letárgica e com pressão diferencial alargada, recém-saída da UTI: volume e antibiótico amplo já."}, {"id": "usp26-54", "banca": "USP-SP", "ano": 2026, "num": 54, "area": "Pediatria", "tema": "Distúrbios eletrolíticos e ECG", "e": "Criança, sexo masculino, 4 anos de idade, foi admitido no pronto-socorro devido a quadro de diarreia e vômitos há 3 dias, em grande quantidade. Na admissão, apresentava sinais de instabilidade hemodinâmica, sendo iniciada expansão volêmica. O resultado da gasometria venosa coletada na admissão foi o seguinte: pH: 7,29 HCO3 : 15 mmol/L Na+ : 128 mEq/L K+ : 3,9 mEq/L Ca2+ : 4,92 mg/dL Frente aos dados clínicos e laboratoriais apresentados, qual é o traçado eletrocardiográfico esperado?", "a": ["", "", "", ""], "c": 0, "com": "Questão anulada pela banca. Pelos dados (cálcio total de 4,92 mg/dL, baixo), o traçado mais compatível seria o de QT prolongado por alongamento do segmento ST (hipocalcemia), mostrado na imagem A.", "tab": [["Distúrbio", "ECG"], ["Hipocalcemia", "QT longo (ST alongado)"], ["Hipercalemia", "T apiculada, QRS largo"], ["Hipocalemia", "T achatada, onda U"]], "tut": "Questão anulada. Cálcio baixo alonga o QT; potássio alto apicula a T.", "anul": 1, "aimg": ["img/q/usp26-54-a.jpg", "img/q/usp26-54-b.jpg", "img/q/usp26-54-c.jpg", "img/q/usp26-54-d.jpg"]}, {"id": "usp26-55", "banca": "USP-SP", "ano": 2026, "num": 55, "area": "Pediatria", "tema": "Infecção de cateter", "e": "Criança, sexo masculino, 4 anos de idade, com antecedente de insuficiência renal crônica dialítica, portador de cateter de longa permanência, apresentou quadro de febre e tremores durante sessão de hemodiálise há 48 horas. Após estabilização inicial, foi internado em enfermaria de pediatria com prescrição de antibiótico parenteral. Ele está afebril há 24 horas, sem queixas, com sinais vitais dentro da normalidade. Ao exame físico, encontra-se em bom estado geral, descorado +/4+, hidratado, anictérico, afebril e eupneico. Ausculta pulmonar e cardíaca sem alterações, exame físico abdominal indolor, sem visceromegalias. A hemocultura central resultou positiva para Staphylococcus aureus, conforme tabela a seguir: Não foi coletada hemocultura periférica na admissão por dificuldade de acesso. Foi realizado ecocardiograma, sem achados de vegetação, e retirado cateter de longa permanência. Qual a melhor conduta para esse paciente?", "a": ["Manter vancomicina parenteral.", "Alta hospitalar com sulfametoxazol trimetropina.", "Suspender antibioticoterapia e considerar contaminação.", "Descalonar para clindamicina oral, mantendo internação."], "c": 0, "com": "Bacteremia por S. aureus resistente à oxacilina (MRSA) relacionada a cateter de longa permanência: mesmo após retirar o cateter, mantém-se vancomicina parenteral por pelo menos 14 dias.", "tab": [["S. aureus no sangue", "Conduta"], ["Nunca é contaminante", "Sempre tratar"], ["MRSA", "Vancomicina"], ["Duração mínima", "14 dias após retirada do cateter"]], "tut": "S. aureus na hemocultura nunca é contaminação. Oxacilina R = vancomicina.", "img": ["img/q/usp26-55.jpg"]}, {"id": "usp26-56", "banca": "USP-SP", "ano": 2026, "num": 56, "area": "Pediatria", "tema": "Coqueluche", "e": "Criança, sexo feminino, 5 meses e duas semanas de vida, compareceu no pronto-socorro, com relato de tosse há cerca de 1 semana. A mãe nega contactantes sintomáticos e não observou coriza ou obstrução nasal. Refere que a criança tem crises de tosse e chegou a ficar com coloração arroxeada, cerca de duas vezes no dia, nos últimos quatro dias. Ao exame físico, está em BEG, corada, hidratada, anictérica, acianótica. Ausculta cardíaca e pulmonar sem alterações. Apresenta FR de 36 irpm, FC de 120 bpm. Oroscopia com leve hiperemia de orofaringe. Restante do exame clínico sem alterações. Carteira de vacinação e de parto conforme imagens a seguir: Considerando o principal agente etiológico envolvido, o quadro atual poderia ter sido prevenido com a vacina", "a": ["DTPa para a mãe, às 20 semanas de gestação.", "VSR para a mãe, às 20 semanas de gestação.", "VPC10 aos 4 meses para a paciente (2ª dose).", "INF3 aos 5 meses para a paciente (1ª dose)."], "c": 0, "com": "Lactente com tosse em crises e cianose, sem coriza: coqueluche. A melhor proteção para o lactente pequeno é a vacina dTpa na gestante, a partir de 20 semanas, que passa anticorpos ao bebê.", "tab": [["dTpa na gestação", "Detalhe"], ["Quando", "A partir de 20 semanas, a cada gestação"], ["Objetivo", "Proteger o RN contra coqueluche"], ["Penta no bebê", "2, 4 e 6 meses"]], "tut": "Bebê pequeno com tosse que deixa roxo: coqueluche. Prevenção: dTpa na mãe durante a gravidez.", "img": ["img/q/usp26-56.jpg"]}, {"id": "usp26-57", "banca": "USP-SP", "ano": 2026, "num": 57, "area": "Pediatria", "tema": "Reação alérgica alimentar", "e": "Criança, sexo masculino, 4 anos de idade, alérgica a amendoim, comparece à unidade de emergência devido à ingestão acidental de um doce contendo o alérgeno há cerca de 40 minutos. Há 10 minutos, iniciou o surgimento de placas urticariformes por todo o corpo, sem outras queixas. Na avaliação inicial, paciente encontra-se em bom estado geral, corado, hidratado, ausculta cardíaca com 2BRNF sem sopros, FC de 102 bpm, PA de 88×54 mmHg, extremidades bem perfundidas, ausculta pulmonar com múrmurio vesicular presente, sem ruídos adventícios, FR de 24 irpm, SpO2 de 97% em ar ambiente. Abdome flácido, normotenso, indolor. A conduta indicada nesse momento é:", "a": ["Administrar adrenalina 1:1.000 por via intramuscular.", "Alta hospitalar, com anti-histamínico e corticosteroide.", "Monitorização hospitalar e administrar anti-histamínico.", "Realizar medidas de eliminação com lavagem gástrica."], "c": 2, "com": "Urticária isolada após ingestão de alérgeno, sem acometimento respiratório, cardiovascular ou gastrointestinal, não é anafilaxia. A conduta é anti-histamínico e observação hospitalar, porque o quadro pode evoluir.", "tab": [["Reação", "Conduta"], ["Só pele", "Anti-histamínico + observação"], ["Pele + outro sistema", "Anafilaxia: adrenalina IM"], ["Lavagem gástrica", "Não indicada"]], "tut": "Só manchas na pele: anti-histamínico e fica de olho. Se pegar outro sistema, adrenalina."}, {"id": "usp26-58", "banca": "USP-SP", "ano": 2026, "num": 58, "area": "Pediatria", "tema": "Febre sem sinais localizatórios", "e": "Criança, sexo feminino, branca, 1 ano e 2 meses de idade, apresenta febre de até 39,5 °C há um dia, sem outros sintomas. Há cerca de uma hora, apresentou crise convulsiva tônico clônica generalizada com duração de 4 minutos na vigência de febre, sendo levada ao hospital. Foi admitida já fora da crise, alerta e sem alterações no exame físico. Paciente previamente hígida, com vacinação em dia, tem antecedente familiar de irmão e pai com histórico de crises convulsivas na vigência de febre até os cinco anos de idade. Frente aos dados apresentados, a conduta indicada para a paciente é", "a": ["coletar eletrólitos, glicemia capilar e hemograma.", "coletar urina tipo 1 e urocultura por sondagem vesical.", "realizar ultrassom transfontanela e eletroencefalograma.", "manter observação hospitalar por 24h, sem exames."], "c": 1, "com": "Lactente com febre sem foco e convulsão febril simples, com exame normal após a crise. Em meninas menores de 2 anos com febre sem foco, deve-se investigar infecção urinária com urina tipo 1 e urocultura por sondagem.", "tab": [["Situação", "Conduta"], ["Convulsão febril simples", "Não precisa de EEG ou imagem"], ["Febre sem foco < 2 anos", "Investigar ITU"], ["Coleta de urina", "Sondagem ou punção suprapúbica"]], "tut": "A convulsão febril não muda nada. O que importa é achar a causa da febre, e em menina pequena é a urina."}, {"id": "usp26-59", "banca": "USP-SP", "ano": 2026, "num": 59, "area": "Pediatria", "tema": "Obesidade infantil", "e": "Você é responsável pela organização de uma pesquisa sobre obesidade infantil. O objetivo é buscar pacientes do sexo masculino, de 0 a 15 anos de idade, com diagnóstico de obesidade, conforme padronização da Organização Mundial de Saúde (OMS) apresentadas nas tabelas a seguir, a fim de conhecer os hábitos alimentares destas crianças. Considerando as referências da OMS e o objetivo da pesquisa, assinale a alternativa que apresenta o paciente mais adequado para o estudo.", "a": ["1 ano e 10 meses, IMC de 20 kg/m2", "3 anos e 2 meses, IMC de 17,5 kg/m2", "8 anos e 3 meses, IMC de 21 kg/m2", "12 anos e 6 meses, IMC de 22,5 kg/m2"], "c": 2, "com": "Pelos critérios da OMS, obesidade é IMC acima do escore-z +2 a partir dos 5 anos (e acima de +3 abaixo dos 5 anos). Um menino de 8 anos e 3 meses com IMC de 21 fica acima de +2: obeso.", "tab": [["Faixa etária", "Obesidade (IMC/idade)"], ["0-5 anos", "> escore-z +3"], ["5-19 anos", "> escore-z +2"], ["Sobrepeso 5-19", "> +1"]], "tut": "Abaixo de 5 anos, obesidade é acima de +3. Acima de 5 anos, acima de +2.", "img": ["img/q/usp26-59.jpg"]}, {"id": "usp26-60", "banca": "USP-SP", "ano": 2026, "num": 60, "area": "Pediatria", "tema": "Acuidade visual", "e": "Criança, sexo masculino, 7 anos de idade é portadora de miopia e usa lentes corretivas. Em mutirão executado por agentes comunitários de saúde treinados previamente, foi submetida ao teste de Snellen em sua escola, usando seus óculos. A mãe da criança procura a unidade básica de saúde solicitando encaminhamento ao oftalmologista após a aplicação do teste, com resultado mostrado na imagem a seguir: Assinale a alternativa que justifica, corretamente, o encaminhamento ao especialista.", "a": ["O resultado obtido no olho direito está alterado.", "O resultado obtido foi diferente nos dois olhos.", "O teste foi realizado com uso das lentes corretivas.", "O teste foi realizado por profissional não habilitado."], "c": 0, "com": "Na escala de Snellen, aos 7 anos espera-se acuidade de pelo menos 0,7 em cada olho, e diferença de duas ou mais linhas entre os olhos também indica encaminhamento. A banca considerou alterado o resultado do olho direito.", "tab": [["Encaminhar", "Critério escolar"], ["Acuidade", "< 0,7 em qualquer olho"], ["Diferença entre olhos", "≥ 2 linhas"], ["Com óculos", "Testar com a correção"]], "tut": "Na triagem escolar, menos de 0,7 em um olho já é motivo para mandar ao oftalmologista.", "img": ["img/q/usp26-60.jpg"]}, {"id": "usp26-61", "banca": "USP-SP", "ano": 2026, "num": 61, "area": "Pediatria", "tema": "Hiperplasia adrenal congênita", "e": "Recém-nascido a termo internado na unidade neonatal para tratamento de neurossífilis apresentou hipoglicemia assintomática nas primeiras 24 horas de vida, necessitando de reposição endovenosa de glicose por 72 horas. Com 11 dias de vida, apresenta perda ponderal de 12% em relação ao peso de nascimento, recebendo seio materno e, na ausência da mãe, fórmula láctea com oferta adequada, além da antibioticoterapia parenteral. Foram coletados exames laboratoriais que revelaram Na+ de 126 mEq/L e K+ de 6,8 mEq/L. Qual é a deficiência que se espera encontrar no Teste do Pezinho?", "a": ["Deficiência de TREC e KREC.", "Deficiência de 21-hidroxilase.", "Deficiência de carnitina.", "Deficiência na síntese da proteína CFTR."], "c": 1, "com": "RN com perda de peso, hiponatremia e hipercalemia na segunda semana de vida: crise perdedora de sal por deficiência de 21-hidroxilase, detectada no teste do pezinho pela 17-OH-progesterona.", "tab": [["HAC por 21-hidroxilase", "Achados"], ["Perda de sal", "Hiponatremia, hipercalemia, desidratação"], ["Meninas", "Genitália ambígua"], ["Triagem", "17-OH-progesterona no teste do pezinho"]], "tut": "RN com sódio baixo e potássio alto na segunda semana: perdedor de sal, deficiência de 21-hidroxilase."}, {"id": "usp26-62", "banca": "USP-SP", "ano": 2026, "num": 62, "area": "Pediatria", "tema": "Candidíase", "e": "Criança, 4 meses de vida, comparece à consulta em unidade básica de saúde acompanhada da mãe com queixa de assadura há 5 dias, após mudar a marca da fralda. Refere também dor durante a amamentação há uma semana. Mãe nega febre, diarreia, vômitos ou prostração. Ao exame físico, a criança apresenta bom estado geral, ganho ponderoestatural adequado, exame abdominal e ausculta cardiopulmonar sem alterações. A região perineal é apresentada na imagem a seguir: Ao avaliar a mamada, a mãe refere dor no momento da pega e durante a sucção. O aspecto da mama pode ser visualizado na imagem a seguir: Assinale a alternativa que apresenta a conduta mais adequada nesse momento. [A banca removeu a imagem desta questão, nos termos do Estatuto da Criança e do Adolescente.]", "a": ["Retirar leite e derivados da dieta materna.", "Antifúngico tópico no períneo e na mama da mãe.", "Retornar à marca da fralda anterior e orientar pega adequada.", "Pomada de barreira em períneo e lanolina na mama da mãe."], "c": 1, "com": "Dermatite de fraldas e mamilo hiperemiado e doloroso na mãe: candidíase do bebê e da mama. Tratam-se os dois com antifúngico tópico. A imagem da região perineal foi removida pela banca.", "tab": [["Candidíase mãe-bebê", "Conduta"], ["Bebê", "Antifúngico tópico (períneo/boca)"], ["Mãe", "Antifúngico na aréola"], ["Amamentação", "Manter"]], "tut": "Assadura que não melhora e mamilo dolorido: é cândida nos dois. Trate a dupla.", "img": ["img/q/usp26-62.jpg"]}, {"id": "usp26-63", "banca": "USP-SP", "ano": 2026, "num": 63, "area": "Pediatria", "tema": "Asma: controle", "e": "Criança, sexo feminino, 8 anos de idade, portadora de asma, comparece à consulta na unidade básica de saúde referindo que, nas últimas 4 semanas, apresenta tosse e cansaço pelo menos uma vez por semana. Despertou à noite por cansaço apenas uma vez. Tem utilizado medicação de resgate para realizar aula de educação física (3 vezes por semana), conseguindo fazer a aula junto aos seus colegas, sem problemas. Faz uso diário de beclometasona HFA partícula padrão 50 µg, 2 jatos por via inalatória de 12/12horas, com técnica de aplicação repetida por duas vezes, conforme imagem a seguir: Qual a conduta na consulta de hoje, conforme recomendações do GINA 2025? [A banca removeu a imagem desta questão, nos termos do Estatuto da Criança e do Adolescente.]", "a": ["Associar salbutamol 100 µg 4 jatos de 12/12 horas.", "Ajustar beclometasona para 200 µg 1 jato de 12/12horas.", "Corrigir técnica de administração, sem alterar medicações.", "Referenciar paciente ao serviço de pneumologia pediátrica."], "c": 1, "com": "Sintomas diurnos semanais e despertar noturno indicam asma parcialmente controlada. Com técnica já adequada, o GINA indica subir o degrau, aumentando a dose do corticoide inalatório. A imagem da técnica foi removida pela banca.", "tab": [["Controle da asma (GINA)", "Critérios em 4 semanas"], ["Sintomas diurnos > 2x/semana", "Sim/Não"], ["Despertar noturno", "Sim/Não"], ["Resgate > 2x/semana / limitação", "Sim/Não"]], "tut": "Asma que acorda a criança à noite não está controlada: suba o corticoide inalatório."}, {"id": "usp26-64", "banca": "USP-SP", "ano": 2026, "num": 64, "area": "Pediatria", "tema": "Coto umbilical", "e": "Mãe demonstra preocupação na maternidade com relação à aparência umbilical observada em sua primeira filha, com 3 dias de vida, conforme a imagem a seguir: Assinale a alternativa que indica a melhor conduta.", "a": ["Encaminhar para o cirurgião pediátrico para avaliação ambulatorial.", "Correção cirúrgica antes da alta, devido ao risco de encarceramento.", "Manter internação hospitalar e iniciar antibioticoterapia.", "Conduta expectante, orientar limpeza e não aplicar técnicas compressivas."], "c": 3, "com": "Coto umbilical em mumificação, sem sinais de infecção. A conduta é expectante, com limpeza com álcool 70% e sem faixas ou moedas compressivas.", "tab": [["Coto umbilical", "Cuidado"], ["Limpeza", "Álcool 70% a cada troca"], ["Queda", "7 a 15 dias"], ["Sinais de onfalite", "Hiperemia, secreção fétida"]], "tut": "Coto escuro e seco está normal: limpe com álcool e não aperte nada.", "img": ["img/q/usp26-64.jpg"]}, {"id": "usp26-65", "banca": "USP-SP", "ano": 2026, "num": 65, "area": "Pediatria", "tema": "Anemia falciforme", "e": "Criança, sexo masculino, 2 anos de idade, com antecedente de anemia falciforme (Hb basal de 8,5 g/dL), é admitida no pronto-socorro com queixa de febre de até 38,5 °C há 4 dias, palidez e adinamia há 3 dias. Ao exame físico, apresenta-se descorado 3+/4+, hidratado, com FC de 152 bpm, FR de 23 irpm, PA de 80×48 mmHg, SpO2 de 94% em ar ambiente, ausculta pulmonar sem alteração, ausculta cardíaca com sopro holossistóloco 2+/6+, fígado palpável no rebordo costal direito, baço percutível no rebordo costal esquerdo. Coletados exames laboratoriais e liberado hemograma na urgência com resultado de pânico: Hb: 4,5 g/dL Ht: 16% Leucócitos: 17.350/mm3 Plaquetas: 160.000/mm3 Reticulócitos: 0,1% Assinale a alternativa que melhor descreve o mecanismo fisiopatológico do quadro apresentado pelo paciente.", "a": ["Choque hipovolêmico hipotensivo relacionado à retenção esplênica.", "Sepse e anemia de consumo decorrente de infecção por agente encapsulado.", "Hemólise intravascular disseminada decorrente de atividade da doença.", "Anemia sintomática por supressão transitória da eritropoiese medular."], "c": 3, "com": "Falciforme com queda importante de hemoglobina e reticulócitos muito baixos (0,1%), após febre: crise aplásica, geralmente pelo parvovírus B19, que suprime a eritropoiese de forma transitória.", "tab": [["Crise na falciforme", "Reticulócitos"], ["Aplásica (parvovírus)", "Muito baixos"], ["Sequestro esplênico", "Altos, baço grande"], ["Hemolítica", "Altos"]], "tut": "Hemoglobina despencou e os reticulócitos sumiram: crise aplásica por parvovírus."}, {"id": "usp26-66", "banca": "USP-SP", "ano": 2026, "num": 66, "area": "Pediatria", "tema": "Infecção urinária na criança", "e": "Criança, sexo masculino, 3 anos e 7 meses de vida, comparece à consulta com a pediatra após infecção urinária, adequadamente diagnosticada no pronto-socorro com exame de urina. Na ocasião, referia febre, dor abdominal e náusea; foi prescrita antibioticoterapia, com melhora dos sintomas em menos de 48 horas. Nega infecções urinárias prévias. A paciente realizou ultrassonografia e compareceu à consulta devido à infecção e à ultrassonografia apresentada a seguir: Assinale a alternativa com a imagem que representa o exame ou monitorização a ser solicitado na consulta, neste momento.", "a": ["", "", "", ""], "c": 2, "com": "Criança com ITU febril e ultrassom mostrando hidronefrose: deve-se investigar refluxo vesicoureteral com uretrocistografia miccional (imagem C).", "tab": [["Após ITU febril", "Investigação"], ["Ultrassom normal", "Acompanhar"], ["Hidronefrose/alteração", "Uretrocistografia miccional"], ["Cicatriz renal", "Cintilografia com DMSA"]], "tut": "ITU febril com rim dilatado no ultrassom: peça uretrocistografia para procurar refluxo.", "img": ["img/q/usp26-66.jpg"], "aimg": ["img/q/usp26-66-a.jpg", "img/q/usp26-66-b.jpg", "img/q/usp26-66-c.jpg", "img/q/usp26-66-d.jpg"]}, {"id": "usp26-67", "banca": "USP-SP", "ano": 2026, "num": 67, "area": "Pediatria", "tema": "Saúde mental na criança com câncer", "e": "Criança, sexo masculino, 10 anos de idade, em quimioterapia devido à neuroblastoma diagnosticado há 6 meses, sendo a última sessão realizada há 10 dias, está no terceiro dia de internação na enfermaria de pediatria por neutropenia febril, em uso de cefepime. Está afebril nas últimas 36 horas, sem queixas álgicas. Ao exame físico, está consciente, orientado, hidratado, descorado +/4+, sem alterações no restante do exame. Mãe refere não ter novas queixas, mas comenta que ele está inapetente, tem recusado a dieta e não dormiu bem. Refere também que, nas últimas 3 semanas, está mais abatido, tem dormido durante quase todo o dia e, quando acordado, apresenta-se irritado, menos colaborativo que o usual e recusa-se a sair da cama e interagir com familiares. Na enfermaria, segue sem interagir com outros pacientes e com a equipe multiprofissional. • Exames laboratoriais na admissão: Hb: 8,8 g/dL Ht: 27% Leucócitos: 400/mm3 (sem diferencial) Plaquetas: 55 mil/mm3 • Exames laboratoriais de hoje: Hb: 8,6 g/dL Ht: 26% Leucócitos: 600/mm3 (sem diferencial) Plaquetas: 59 mil/mm3 Na+: 137 mEq/L K+: 4,3 mEq/L Assinale a alternativa que apresenta a conduta mais indicada para a evolução descrita no caso.", "a": ["Considerar possibilidade de privação sensorial associada a internações e dar alta hospitalar.", "Considerar quadro compatível com ajustamento à doença, sem investigações adicionais.", "Solicitar avaliação psiquiátrica e suporte psicológico por suspeita de depressão.", "Corrigir parâmetros hematimétricos com transfusão de concentrado de hemácias e observar se há melhora da adinamia."], "c": 2, "com": "Criança em quimioterapia, afebril e estável, com adinamia e retraimento persistentes: deve-se suspeitar de depressão e solicitar avaliação psiquiátrica e suporte psicológico.", "tab": [["Sinal", "Pensar em"], ["Retraimento, apatia, anedonia", "Depressão"], ["Sintomas físicos estáveis", "Não justificam a adinamia"], ["Conduta", "Avaliação de saúde mental"]], "tut": "Criança com câncer, estável e sem febre, mas apagada: pergunte sobre tristeza."}, {"id": "usp26-68", "banca": "USP-SP", "ano": 2026, "num": 68, "area": "Pediatria", "tema": "Pneumonia necrotizante", "e": "Criança, sexo feminino, 9 anos de idade, previamente hígida, está no 6º dia de internação na enfermaria de pediatria devido a um quadro de pneumonia, em uso de ceftriaxone 100 mg/kg/dia. À entrada, apresentava febre, taquipneia e queda do estado geral. A radiografia de tórax evidenciou derrame pleural significativo que foi drenado com envio do líquido para cultura. Realizada tomografia computadorizada de tórax, com achados compatíveis com pneumonia necrotizante. Hoje, na evolução, você percebe que a paciente continua mantendo picos diários de febre de até 39 °C, embora apresente bom estado geral e reduzindo a necessidade de oferta de oxigênio. A cultura do líquido pleural resultou positiva para pneumococo sensível à penicilina. Considerando os dados apresentados, a melhor conduta, nesse momento, é", "a": ["prescrever cefepime e vancomicina.", "solicitar nova avaliação da cirurgia.", "repetir tomografia de tórax.", "manter antibioticoterapia e suporte."], "c": 3, "com": "Na pneumonia necrotizante e no empiema, a febre pode persistir por vários dias mesmo com tratamento adequado. Com bom estado geral, melhora da oxigenação e pneumococo sensível, mantém-se o antibiótico e o suporte.", "tab": [["Febre persistente na pneumonia", "Avaliar"], ["Bom estado e melhora clínica", "Manter tratamento"], ["Piora ou derrame não drenado", "Imagem e cirurgia"], ["Germe sensível", "Não ampliar antibiótico"]], "tut": "Febre que demora a passar na pneumonia necrotizante é esperada se a criança está melhorando."}, {"id": "usp26-69", "banca": "USP-SP", "ano": 2026, "num": 69, "area": "Pediatria", "tema": "Laringotraqueíte (crupe)", "e": "Criança, sexo masculino, 2 anos de idade, previamente hígida, iniciou quadro de coriza e febre de até 38 °C há três dias, com evolução para tosse seca, intensa e estridente há um dia. Paciente foi levado de madrugada à unidade de emergência devido à dificuldade para respirar há cerca de 30 minutos. Ao exame, foi notada tiragem subdiafragmática e de fúrcula, com dificuldade e ruído inspiratório, audível em repouso. Considerando a principal hipótese diagnóstica, assinale a alternativa cuja a imagem ilustra, corretamente, a posição anatômica da complicação apresentada pelo paciente e a representação fisiológica do acometimento respiratório.", "a": ["", "", "", ""], "c": 1, "com": "Pródromo viral seguido de tosse ladrante, estridor e tiragem: laringotraqueíte viral. A obstrução é subglótica, por edema da laringe (imagem B).", "tab": [["Quadro", "Local"], ["Crupe viral", "Subglote"], ["Epiglotite", "Supraglote"], ["Asma/bronquiolite", "Vias aéreas inferiores"]], "tut": "Tosse de cachorro e estridor: crupe, com edema logo abaixo das cordas vocais.", "aimg": ["img/q/usp26-69-a.jpg", "img/q/usp26-69-b.jpg", "img/q/usp26-69-c.jpg", "img/q/usp26-69-d.jpg"]}, {"id": "usp26-70", "banca": "USP-SP", "ano": 2026, "num": 70, "area": "Pediatria", "tema": "Taquiarritmia instável", "e": "Criança, sexo masculino, 6 anos de idade, portadora de asma não controlada, foi admitida na unidade de emergência em insuficiência respiratória devido à exacerbação asmática. O paciente recebeu corticosteroide sistêmico, salbutamol inalatório a cada 20 minutos por três vezes e sulfato de magnésio. Teve melhora, apenas discreta, e agora está recebendo β2-agonista endovenoso contínuo. Na evolução, o monitor do paciente começou a sinalizar alteração dos sinais vitais. As imagens a seguir apresentam os dados de monitorização dos últimos cinco minutos (prévio) e o do momento atual. Assinale a alternativa que ilustra, corretamente, o procedimento de urgência a ser realizado no paciente descrito.", "a": ["", "", "", ""], "c": 3, "com": "Criança asmática em uso de beta-2 contínuo com taquicardia de 198 bpm e hipotensão: taquiarritmia com instabilidade hemodinâmica. A conduta é cardioversão elétrica sincronizada (imagem D).", "tab": [["Taquiarritmia", "Conduta"], ["Instável", "Cardioversão sincronizada"], ["TSV estável", "Manobra vagal, adenosina"], ["Sem pulso", "Desfibrilação"]], "tut": "Taquicardia com pressão caindo: choque sincronizado.", "img": ["img/q/usp26-70.jpg"], "aimg": ["img/q/usp26-70-a.jpg", "img/q/usp26-70-b.jpg", "img/q/usp26-70-c.jpg", "img/q/usp26-70-d.jpg"]}, {"id": "usp26-71", "banca": "USP-SP", "ano": 2026, "num": 71, "area": "Pediatria", "tema": "Icterícia neonatal", "e": "Recém-nascido (RN) a termo, parto cesáreo eletivo, com 40 semanas de idade gestacional, com peso de 3.300 g, é encaminhado ao alojamento conjunto. O pré-natal transcorreu sem intercorrências. Com 48 horas de vida, recebe aleitamento materno por livre demanda e apresenta icterícia e evolução de peso, conforme demonstrado no gráfico a seguir: Além de estimular, orientar e corrigir o aleitamento materno, qual conduta deverá ser realizada após RN completar 48 horas de vida?", "a": ["Manter RN internado em alojamento conjunto, iniciar a fototerapia e coletar bilirrubinas totais e frações.", "Manter RN internado em alojamento conjunto, reavaliar icterícia, peso e diurese em 6 horas.", "Dar a alta hospitalar, uma vez que a icterícia é fisiológica e a perda de peso está dentro do esperado, com orientações sobre icterícia.", "Dar a alta hospitalar, uma vez que a icterícia é fisiológica, orientar banho de sol, iniciar complemento após o seio e agendar reavaliação em 48 horas."], "c": 1, "com": "RN com 48 h, perda de cerca de 11% do peso e bilirrubina transcutânea em ascensão: a perda é limítrofe e merece reavaliação de icterícia, peso e diurese antes da alta.", "tab": [["RN no alojamento", "Alerta"], ["Perda de peso", "> 10%"], ["Icterícia", "Antes de 24 h ou em ascensão rápida"], ["Conduta", "Reavaliar antes da alta"]], "tut": "Perdeu mais de 10% e a icterícia está subindo: segure o bebê e reavalie.", "img": ["img/q/usp26-71.jpg"]}, {"id": "usp26-72", "banca": "USP-SP", "ano": 2026, "num": 72, "area": "Pediatria", "tema": "Reanimação neonatal", "e": "Durante o atendimento em sala de parto, um recém-nascido apresentou-se hipotônico e sem choro ao nascer. Foi realizado o clampeamento imediato do cordão umbilical, seguido da aplicação dos passos iniciais de reanimação neonatal. A seguir, a avaliação da FC revelou 30 bpm, associada à ausência de movimentos respiratórios. Iniciada ventilação com pressão positiva com máscara, o paciente foi monitorizado e não apresentou melhora após correção da técnica. Assinale a alternativa que apresenta os dispositivos que podem ser usados para a realização da ventilação, como próximo passo da reanimação neonatal.", "a": ["", "", "", ""], "c": 0, "com": "FC abaixo de 100 bpm após ventilação com máscara bem feita: indica-se via aérea avançada. Podem ser usados máscara laríngea ou intubação com laringoscópio de lâmina reta e cânula sem balonete (imagem A).", "tab": [["Reanimação neonatal", "Material"], ["Lâmina", "Reta (Miller) 0 ou 1"], ["Cânula", "Sem balonete, conforme peso"], ["Alternativa", "Máscara laríngea"]], "tut": "No recém-nascido, laringoscópio de lâmina reta e cânula sem cuff.", "aimg": ["img/q/usp26-72-a.jpg", "img/q/usp26-72-b.jpg", "img/q/usp26-72-c.jpg", "img/q/usp26-72-d.jpg"]}, {"id": "usp26-73", "banca": "USP-SP", "ano": 2026, "num": 73, "area": "Medicina Preventiva", "tema": "Indicadores de mortalidade", "e": "Com base nos dados fornecidos na tabela apresentada, qual população tem maior risco de morte?", "a": ["População 1, pois apresenta a maior mortalidade proporcional.", "População 1, pois apresenta maior número de óbitos.", "População 2, pois apresenta a maior taxa de mortalidade.", "Não é possível comparar, pois as populações são diferentes."], "c": 2, "com": "Para comparar risco de morte entre populações, usa-se a taxa de mortalidade ajustada, não o número absoluto de óbitos nem a mortalidade proporcional. A população 2 tem a maior taxa ajustada (5,1 por mil).", "tab": [["Indicador", "Mede"], ["Nº de óbitos", "Depende do tamanho da população"], ["Mortalidade proporcional", "Distribuição dos óbitos"], ["Taxa ajustada", "Risco comparável"]], "tut": "Risco se compara por taxa, nunca por número de mortes.", "img": ["img/q/usp26-73.jpg"]}, {"id": "usp26-74", "banca": "USP-SP", "ano": 2026, "num": 74, "area": "Ginecologia e Obstetrícia", "tema": "Pré-natal na atenção primária", "e": "Considere as seguintes informações referentes a uma mulher de 22 anos de idade: SUBJETIVO: Paciente comparece a segunda consulta prénatal, relatando que ainda mantém náuseas e vômitos. Não queria engravidar agora, tomou um susto com a gravidez e ainda está buscando aceitá-la. Tem faltado no trabalho, por conta do mal-estar da gravidez, e demonstra preocupação com isso. O supervisor a tem pressionado, dizendo que talvez seja melhor ela se demitir. Fazia academia de ginástica 3 vezes por semana e parou por receio de fazer mal à criança. Está usando ácido fólico, sulfato ferroso e carbonato de cálcio. É a sua primeira gestação e não tem nenhuma comorbidade. OBJETIVO: Idade gestacional de 12 semanas compatível com o primeiro USG feito com 8 semanas de gestação. Vacinação prévia: 3 doses de hepatite B, 3 doses com reforço de DPT, 3 doses da vacina de COVID-19 e influenza sazonal. PA de 102×60 mmHg. Ausculta (sonar): BCF presente. IMC de 24,2 kg/m2. Exames de primeiro trimestre sem alterações significativas. AVALIAÇÃO: Primigesta de risco habitual, no primeiro trimestre gestacional. Eutrofia, com risco nutricional pelos vômitos. Risco psicossocial. Em relação ao PLANO para esta consulta, qual é a alternativa mais adequada?", "a": ["Orientar a paciente a não fazer atividade física em academia, pelo risco de lesão osteomuscular, restrição de crescimento e parto prematuro.", "Prescrever ondansetrona para a náusea e trocar os medicamentos por um multivitamínico, para melhorar a adesão.", "Completar vacinação agora com dTpa e encaminhar para a Psicologia, por ser gestação não planejada e ainda não aceita.", "Suspender temporariamente medicamentos e orientar direitos trabalhistas, pois a gestante não pode ser demitida, exceto por justa causa."], "c": 3, "com": "No plano do pré-natal, a gestante deve ser orientada sobre os direitos trabalhistas (estabilidade desde a confirmação da gravidez até 5 meses após o parto, salvo justa causa), além do cuidado clínico.", "tab": [["Direito da gestante", "Conteúdo"], ["Estabilidade", "Da confirmação até 5 meses pós-parto"], ["Licença-maternidade", "120 dias (180 em empresas cidadãs)"], ["Consultas", "Dispensa do trabalho para o pré-natal"]], "tut": "Pré-natal também é orientar direitos: gestante não pode ser demitida sem justa causa."}, {"id": "usp26-75", "banca": "USP-SP", "ano": 2026, "num": 75, "area": "Medicina Preventiva", "tema": "Vieses", "e": "O artigo de Faisal-Cury e Menezes (2012) apresenta os resultados de uma coorte de gestantes que estimou a associação entre depressão antenatal e depressão pós-parto. Segundo a pesquisa, gestantes deprimidas apresentaram maior risco de depressão pós-parto (risco relativo: 2,5; IC95%: 2,3-2,7). No entanto, dentre as 828 gestantes avaliadas no início da pesquisa, 107 não responderam ao instrumento de avaliação da depressão no período pós-parto. A análise dos dados mostra que as mulheres que não responderam eram mais deprimidas, menos escolarizadas e mais frequentemente solteiras, mas com idade similar às mulheres que completaram a pesquisa. Caso estas mulheres tivessem retornado e fossem incluídas na análise dos dados, o que provavelmente ocorreria com a medida de associação?", "a": ["Ficaria estável.", "Aumentaria.", "Diminuiria.", "Não é possível prever."], "c": 1, "com": "As mulheres que não responderam eram mais deprimidas. Como elas teriam maior chance de depressão pós-parto, sua exclusão subestimou a associação. Se fossem incluídas, o risco relativo provavelmente aumentaria.", "tab": [["Viés", "Exemplo"], ["Seleção (perda de seguimento)", "Perda diferencial entre grupos"], ["Informação", "Erro na medida da exposição/desfecho"], ["Confusão", "Terceira variável"]], "tut": "Quem saiu do estudo era justamente quem mais tinha o problema. Sem elas, a associação parece menor do que é."}, {"id": "usp26-76", "banca": "USP-SP", "ano": 2026, "num": 76, "area": "Medicina Preventiva", "tema": "Padronização de taxas", "e": "O gráfico a seguir mostra a mortalidade ajustada por idade por COVID-19 no município de São Paulo, tomando como população padrão o total de habitantes na cidade no período de março a dezembro de 2020, identificando as diferenças segundo raça e sexo. Neste estudo, qual o principal motivo para padronizar as taxas de mortalidade por idade?", "a": ["Homens têm menor expectativa de vida, e a padronização considera a expectativa de vida das populações em seu cálculo.", "Mulheres têm menor taxa de mortalidade, e a padronização permite um cálculo mais acurado do risco de morte em cada faixa etária.", "População branca tem maior proporção de idosos, e a padronização permite a comparação de populações com diferentes distribuições etárias.", "População negra tem piores condições de vida e saúde, e a padronização pondera a influência das desigualdades socioeconômicas em seu cálculo."], "c": 2, "com": "A padronização por idade permite comparar populações com estruturas etárias diferentes. A população branca, mais envelhecida, teria mortalidade bruta maior apenas pela idade.", "tab": [["Taxa", "Uso"], ["Bruta", "Real, mas influenciada pela idade"], ["Padronizada", "Comparar populações diferentes"], ["Específica", "Por faixa etária"]], "tut": "Padronizar é tirar o efeito da idade para comparar populações de forma justa.", "img": ["img/q/usp26-76.jpg"]}, {"id": "usp26-77", "banca": "USP-SP", "ano": 2026, "num": 77, "area": "Medicina Preventiva", "tema": "Desenhos de estudo", "e": "Um aluno de pós-graduação pretende estudar três diferentes aspectos do Transtorno do Estresse Pós-Traumático (TEPT) associados ao parto: 1. Se a frequência de TEPT é maior em mulheres atendidas em serviços públicos do que privados; 2. Se há relação causal entre história de abuso na infância e TEPT; 3. Se TEPT aumenta o risco de ideação suicida anos após o parto. Assinale a alternativa que contempla os tipos de estudos apropriados para os objetivos 1, 2 e 3, respectivamente.", "a": ["Coorte, caso-controle, ensaio de comunidade.", "Descritivo, coorte, caso-controle.", "Transversal, descritivo, coorte.", "Transversal, caso-controle, coorte."], "c": 3, "com": "Comparar a frequência de TEPT entre serviços: estudo transversal. Relação entre abuso na infância (exposição passada) e TEPT: caso-controle. TEPT levando a ideação suicida anos depois: coorte.", "tab": [["Pergunta", "Desenho"], ["Frequência em um momento", "Transversal"], ["Exposição passada x doença atual", "Caso-controle"], ["Exposição → desfecho futuro", "Coorte"]], "tut": "Foto do momento = transversal; olhar para trás = caso-controle; seguir para frente = coorte."}, {"id": "usp26-78", "banca": "USP-SP", "ano": 2026, "num": 78, "area": "Medicina Preventiva", "tema": "Vieses em caso-controle", "e": "Em um estudo caso-controle que investiga a associação entre tabagismo e câncer de pulmão, se os controles têm maior probabilidade de subestimar o hábito de fumar devido a viés de resposta socialmente desejável, qual é o efeito mais provável sobre a razão de chances (odds ratio, OR)?", "a": ["O OR será superestimado.", "O OR será subestimado.", "O OR permanecerá inalterado.", "A direção não pode ser determinada."], "c": 0, "com": "Se os controles subestimam o tabagismo, a exposição entre eles parece menor do que é. Isso aumenta artificialmente a diferença entre casos e controles e superestima a odds ratio.", "tab": [["Erro", "Efeito na OR"], ["Controles subestimam exposição", "OR superestimada"], ["Casos subestimam exposição", "OR subestimada"], ["Erro igual nos dois", "OR tende ao nulo"]], "tut": "Se os controles 'fumam menos' no papel, a diferença cresce e a OR fica inflada."}, {"id": "usp26-79", "banca": "USP-SP", "ano": 2026, "num": 79, "area": "Medicina Preventiva", "tema": "Interpretação de ensaios clínicos", "e": "A metformina tem sido o medicamento de primeira linha para tratamento do diabetes melito tipo 2 há décadas. Ela também demonstrou apresentar ações antivirais in vitro em estudos com dengue, hepatite C e rotavírus. Um ensaio clínico avaliou a efetividade da metformina na redução de desfechos adversos graves em pacientes com COVID-19. Após randomização, 1.433 pacientes receberam metformina, 500 mg/dia, 14 dias (GE = Grupo Experimental) e 1.548 receberam placebo (GC = Grupo Controle). O desfecho primário do estudo foi o tempo para a recuperação sustentada da COVID-19 (definida como ausência de sintomas por, pelo menos, 3 dias). Os desfechos secundários foram a hospitalização e o óbito. O resultado principal mostrou que, ao longo de 180 dias de seguimento, 7 participantes do GE e 3 do GC apresentaram algum evento adverso classificado como grave (razão de riscos: 2.50, IC95%: 0.65-9,66). O tempo mediano para recuperação sustentada foi de 9 dias para o GE e 10 dias para o GC (razão de riscos = 0,96; IC95%: 0,89-1,03). No total, 103 participantes relataram visitas ao pronto-socorro ou hospitalização: 54 no GE e 49 no GC (razão de riscos = 1,25; IC95%: 0,82-1,78). Não foram relatados óbitos. Diante dos resultados apresentados, podese concluir:", "a": ["Embora a diferença seja modesta, os dados favorecem o uso da metformina.", "O uso da metformina contribuiu para agravar o quadro clínico dos pacientes.", "A metformina gerou significativamente mais eventos adversos do que o placebo.", "Os dados indicam que a hipótese nula não pode ser rejeitada neste caso."], "c": 3, "com": "Os intervalos de confiança das razões de risco incluem 1 (0,89-1,03 e 0,82-1,78). Não há diferença estatisticamente significativa, então a hipótese nula não pode ser rejeitada.", "tab": [["IC95% da razão", "Interpretação"], ["Inclui 1", "Sem diferença significativa"], ["Totalmente > 1", "Aumento significativo"], ["Totalmente < 1", "Redução significativa"]], "tut": "Intervalo de confiança da razão que cruza o 1 = sem diferença comprovada."}, {"id": "usp26-80", "banca": "USP-SP", "ano": 2026, "num": 80, "area": "Medicina Preventiva", "tema": "SUS e setor privado", "e": "O Governo Federal lançou em 2025 o programa “Agora Tem Especialistas”, visando ampliar o acesso da população usuária do Sistema Único de Saúde (SUS) à atenção ambulatorial e hospitalar especializada, incluindo consultas, exames e cirurgias. Uma das medidas prevê a contratação de hospitais e serviços privados, mediante venda de capacidade ociosa, abatimento de dívidas públicas ou créditos tributários. Este caráter da participação do setor privado no SUS é previsto na legislação como", "a": ["suplementar.", "complementar.", "prestador subsidiário.", "organização social."], "c": 1, "com": "Pela Constituição e pela Lei 8.080, a iniciativa privada participa do SUS de forma complementar, por contrato ou convênio, quando a rede pública é insuficiente.", "tab": [["Termo", "Significado"], ["Complementar", "Privado contratado pelo SUS"], ["Suplementar", "Planos e seguros de saúde"], ["Preferência", "Entidades filantrópicas e sem fins lucrativos"]], "tut": "Privado que vende serviço para o SUS = complementar. Plano de saúde = suplementar."}, {"id": "usp26-81", "banca": "USP-SP", "ano": 2026, "num": 81, "area": "Medicina Preventiva", "tema": "Odds ratio", "e": "Há evidências crescentes, embora controversas, de que a exposição solar crônica está associada ao risco de câncer de mama. Estudos anteriores foram realizados em regiões com variação sazonal na Radiação Ultravioleta (UV) e entre participantes predominantemente de ascendência europeia. Um estudo de caso-controle foi conduzido em Porto Rico, onde não há flutuação sazonal significativa e há exposição contínua à radiação UV muito alta. O estudo incluiu 307 casos de câncer de mama e 328 controles. A análise foi estratificada por cor da pele. A tabela a seguir mostra a distribuição dos participantes com tom de pele mais escuro. Com base na tabela e considerando a categoria exposição solar “baixa” como referência, qual a provável conclusão em relação à exposição solar e ao câncer de mama neste estudo?", "a": ["A exposição solar moderada não tem efeito sobre o câncer de mama.", "A alta exposição solar é um fator protetor contra o câncer de mama.", "A alta exposição solar é um fator de risco para o câncer de mama.", "A alta exposição solar não tem efeito sobre o câncer de mama."], "c": 1, "com": "Com a exposição baixa como referência, a odds ratio da exposição alta é (24/54)/(53/54) ≈ 0,45. A OR menor que 1 indica associação protetora.", "tab": [["OR", "Interpretação"], ["< 1", "Fator de proteção"], ["= 1", "Sem associação"], ["> 1", "Fator de risco"]], "tut": "Monte a tabela 2x2 contra a referência: OR abaixo de 1 é proteção.", "img": ["img/q/usp26-81.jpg"]}, {"id": "usp26-82", "banca": "USP-SP", "ano": 2026, "num": 82, "area": "Medicina Preventiva", "tema": "NNT", "e": "Um ensaio clínico randomizado estudou a associação entre o uso de sotatercept e morte em pacientes com hipertensão arterial pulmonar classes II e III. Os pacientes foram randomizados em dois grupos: 84 pacientes receberam sotatercept e 86 placebo, a cada três semanas, durante 11 meses. Os resultados do estudo encontram-se a seguir: Considerando os dados da tabela, é necessário tratar:", "a": ["15 pacientes com sotatercept para evitar a morte em um paciente.", "53 pacientes com sotatercept para evitar a morte em um paciente.", "84 pacientes com sotatercept para evitar mortes em 15% dos pacientes.", "84 pacientes com sotatercept para evitar a morte em 53% dos pacientes."], "c": 0, "com": "Risco no placebo: 13/86 = 15,1%. Risco no sotatercept: 7/84 = 8,3%. Redução absoluta ≈ 6,8%. NNT = 1/0,068 ≈ 15 pacientes tratados para evitar uma morte.", "tab": [["Medida", "Cálculo"], ["RAR", "Risco controle - risco tratado"], ["NNT", "1 / RAR"], ["Exemplo", "1 / 0,068 ≈ 15"]], "tut": "NNT é 1 dividido pela diferença de risco absoluto.", "img": ["img/q/usp26-82.jpg"]}, {"id": "usp26-83", "banca": "USP-SP", "ano": 2026, "num": 83, "area": "Ginecologia e Obstetrícia", "tema": "Climatério", "e": "Mulher, 52 anos de idade, procura a atenção primária com queixas de fogachos frequentes, sudorese noturna e alterações de sono, com ciclos menstruais regulares e volumosos. Qual deve ser a abordagem mais apropriada para o manejo inicial dessa paciente, conforme as diretrizes do Ministério da Saúde?", "a": ["Solicitar exames hormonais de rotina para confirmar diagnóstico.", "Iniciar terapia de reposição hormonal para alívio dos sintomas.", "Prescrever antidepressivo inibidor da receptação de serotonina.", "Investigar intensidade dos sintomas e orientar adequação do estilo de vida."], "c": 3, "com": "No climatério, a abordagem inicial é avaliar a intensidade dos sintomas e orientar mudanças de estilo de vida. Exames hormonais não são necessários para o diagnóstico, e a terapia hormonal é individualizada.", "tab": [["Climatério", "Conduta"], ["Diagnóstico", "Clínico (não precisa de FSH)"], ["Sintomas leves", "Estilo de vida"], ["Sintomas moderados/graves", "Considerar terapia hormonal"]], "tut": "Fogacho aos 52 anos é diagnóstico clínico: avalie a intensidade e comece pelo estilo de vida."}, {"id": "usp26-84", "banca": "USP-SP", "ano": 2026, "num": 84, "area": "Medicina Preventiva", "tema": "Atributos da APS", "e": "Mulher, parda, 22 anos de idade, na segunda gestação. Moradora de município de médio porte, ensino médio incompleto. Desempregada, em união estável. Primeiro atendimento (14 semanas) quando realiza consulta de prénatal com enfermagem. Os exames de rotina são solicitados, incluindo sorologia para sífilis (VDRL). Exame coletado, mas resultado não foi incluído no prontuário por falha na digitação do laboratório no sistema. Segundo atendimento (22 semanas): Anamnese e exame físico sem alterações. Terceiro atendimento (28 semanas): Queixa de corrimento vaginal. Solicitado novo VDRL, que retorna reagente: VDRL 1:64. Confirmado por teste rápido treponêmico (positivo). Iniciada penicilina benzatina (2,4 milhões UI IM, 3 doses com intervalo semanal). Parceiro não comparece para tratamento. Parto (38 semanas): vaginal em maternidade regional. Recém-nascido com sinais de prematuridade limítrofe, baixo peso (2.300 g) e exantema palmoplantar. Avaliação neonatal mostra VDRL reagente e anemia. Foi realizado tratamento do recém-nascido com penicilina procaína. Puérpera foi orientada a continuar o tratamento após a alta. Dentre os princípios do SUS e os atributos da APS, em qual não houve o cumprimento adequado e levou a ocorrência da sífilis congênita neste caso?", "a": ["Acesso.", "Equidade.", "Universalidade.", "Coordenação do cuidado."], "c": 3, "com": "A gestante teve acesso ao pré-natal, mas a falha no seguimento dos exames e no tratamento da sífilis (dela e do parceiro) até o parto mostra falha na coordenação do cuidado.", "tab": [["Atributo da APS", "Significado"], ["Acesso", "Chegar ao serviço"], ["Longitudinalidade", "Vínculo ao longo do tempo"], ["Coordenação", "Integrar exames, tratamentos e serviços"]], "tut": "Ela foi atendida, mas ninguém amarrou exame, tratamento e retorno: falhou a coordenação."}, {"id": "usp26-85", "banca": "USP-SP", "ano": 2026, "num": 85, "area": "Ginecologia e Obstetrícia", "tema": "Rastreio do câncer de mama e colo", "e": "Mulher, 67 anos de idade, procura atendimento na sua Unidade Básica de Saúde (UBS) para exames de rotina, especialmente preocupada com os exames ginecológicos. Tem vida sexual ativa, não tem comorbidades. Realizou exame citopatológico do colo uterino aos 61 e 64 anos de idade, e mamografia aos 65 anos. Não tem história familiar de câncer, nem teve exames de rastreamento alterados anteriormente. Seguindo as recomendações do Ministério da Saúde para câncer de mama e colo de útero, qual conduta deve ser orientada para a paciente?", "a": ["Solicitar apenas mamografia.", "Solicitar apenas citopatológico de colo de útero.", "Solicitar mamografia e citopatológico de colo de útero.", "Orientar que não há indicação de exames."], "c": 0, "com": "Aos 67 anos, com citologias normais aos 61 e 64, o rastreio do colo pode ser encerrado (encerra-se aos 64 anos com dois exames negativos nos últimos 5 anos). A mamografia segue a cada 2 anos até 69 anos.", "tab": [["Rastreio (MS)", "Faixa"], ["Mamografia", "50-69 anos, a cada 2 anos"], ["Citologia", "25-64 anos, a cada 3 anos após 2 normais"], ["Encerrar citologia", "64 anos com 2 negativos recentes"]], "tut": "Aos 67, só a mamografia continua: o preventivo do colo termina aos 64 se estiver tudo normal."}, {"id": "usp26-86", "banca": "USP-SP", "ano": 2026, "num": 86, "area": "Medicina Preventiva", "tema": "Diarreia crônica", "e": "Considere o registro a seguir, realizado no prontuário de um homem cisgênero, 35 anos de idade, bancário. A UBS de referência está localizada em área urbana. S1: Dor abdominal em cólica e diarreia malcheirosa há cerca de 20 dias, sem sangue ou muco. Em uso de analgésico e anti-espasmódico com controle dos sintomas. Sem febre, perda de 1 kg nesse período, nega viagens recentes. S2: Renovação de prescrição de PrEP para HIV (profilaxia pré-exposição). Uso diário há 2 anos, esquece de tomar menos de 1 vez por semana; últimos exames há cerca de 4 meses sem alterações. Relações sexuais anais receptivas e insertivas, uso irregular de preservativo. O: Abdome timpânico, sem dor à palpação e sem massas; hidratado, anictérico. Exames realizados há 4 meses: sorologias para HIV, sífilis e hepatites B e C: negativo; pesquisa clamídia e gonorreia retal e urinária negativas; creatinina 0,8 mg/dL. Para esse paciente, a conduta mais indicada seria pesquisa nas fezes de:", "a": ["Calprotectina.", "Sangue oculto.", "Giardia lamblia.", "Microsporidium spp."], "c": 2, "com": "Diarreia malcheirosa há 20 dias, com cólica e perda de peso, em homem que faz sexo anal: a causa mais provável é giardíase (também transmitida pela via sexual oral-anal).", "tab": [["Diarreia > 14 dias", "Pensar em"], ["Esteatorreia, distensão", "Giárdia"], ["Imunossuprimido", "Cryptosporidium, microsporídio"], ["Sangue e muco", "Inflamatória/invasiva"]], "tut": "Diarreia fedida e prolongada com cólica: procure giárdia nas fezes."}, {"id": "usp26-87", "banca": "USP-SP", "ano": 2026, "num": 87, "area": "Medicina Preventiva", "tema": "Medidas de risco", "e": "Em abril de 2024, o Rio Grande do Sul experimentou alta precipitação, que resultou em inundações generalizadas. Um estudo avaliou a incidência de leptospirose entre maio e julho de 2024 no estado do Rio Grande do Sul. Porcentagem de residências atingidas pelas inundações Incidência de leptospirose (por 100.000 habitantes) 0 - 0,1 0,5 0,2 - 0,6 1,6 0,7 - 1,2 3,3 1,3 - 11,0 7,3 11,1 - 27,9 21,7 Considerando como referência os locais com porcentagem de residências atingidas pelas inundações entre 0 e 0,1%, o risco de leptospirose na população é:", "a": ["Nos locais em que a porcentagem de residências afetadas pelas inundações foi de 0,2 a 0,6 é 3,2 vezes menor.", "Nos locais em que a porcentagem de residências afetadas pelas inundações foi de 0,7 a 1,2 é 6,6 vezes maior.", "Nos locais em que a porcentagem de residências afetadas pelas inundações foi de 1,3 a 11,0 é 14,6% menor.", "Nos locais em que a porcentagem de residências afetadas pelas inundações foi de 11,1 a 27,9 é 24% maior."], "c": 1, "com": "O risco relativo é a incidência no grupo exposto dividida pela incidência no grupo de referência. No grupo de 0,7-1,2%, 3,3/0,5 = 6,6 vezes maior.", "tab": [["Medida", "Cálculo"], ["Risco relativo", "Incidência exposto / incidência referência"], ["Exemplo", "3,3 / 0,5 = 6,6"], ["RR > 1", "Exposição aumenta o risco"]], "tut": "Divida a incidência do grupo pela incidência da referência: 3,3 dividido por 0,5 dá 6,6.", "img": ["img/q/usp26-87.jpg"]}, {"id": "usp26-88", "banca": "USP-SP", "ano": 2026, "num": 88, "area": "Pediatria", "tema": "Tuberculose: RN contato", "e": "Homem e sua companheira iniciaram tratamento para tuberculose pulmonar há 7 dias. A equipe da unidade básica de saúde realiza visita domiciliar a fim de avaliar os contactantes domiciliares do caso. Na casa, além do casal, mora a filha com 26 dias de vida, assintomática, com bom ganho de peso, em aleitamento materno exclusivo, vacinação de acordo com o calendário vacinal do Programa Nacional de Imunização. Assinale a alternativa que apresenta a conduta adequada para a criança.", "a": ["Realizar prova tuberculínica.", "Tratar para Infecção Latente de Tuberculose (ILTB).", "Realizar Ensaio de Liberação de Interferon-gama (IGRA).", "Solicitar radiografia de tórax."], "c": 1, "com": "RN coabitante de caso de tuberculose pulmonar bacilífera deve receber tratamento da infecção latente (quimioprofilaxia primária). Em geral, a prova tuberculínica é feita após o terceiro mês, para decidir continuar ou vacinar.", "tab": [["RN contato de bacilífero", "Conduta"], ["Inicial", "Tratamento da ILTB (quimioprofilaxia primária)"], ["Após 3 meses", "Prova tuberculínica"], ["PT negativa", "Suspender e vacinar com BCG"]], "tut": "Bebê em casa com tuberculose bacilífera não espera: começa a profilaxia."}, {"id": "usp26-89", "banca": "USP-SP", "ano": 2026, "num": 89, "area": "Medicina Preventiva", "tema": "Notificação compulsória", "e": "Em março de 2025, o Ministério da Saúde publicou portaria atualizando a Lista Nacional de Doenças e Agravos de Notificação Compulsória, com a inclusão da esporotricose. Trata-se de uma doença fúngica da pele, cujo agente etiológico é o Sporothix schencckii. Ela emergiu no Brasil no final do milênio passado, com uma estrutura epidemiológica diferente: a infecção de felinos domésticos, que a transmitem para os seus tutores. Nas últimas décadas, ela se disseminou por todo o país, chegando também a outros países da América do Sul. O que motivou a necessidade de notificação compulsória da esporotricose humana?", "a": ["Crescimento dos casos; alto risco de disseminação, acometimento de populações vulneráveis e possibilidade de intervenção.", "Acometimento de populações de áreas urbanas onde há concentração de gatos domésticos e profissionais da saúde animal.", "Apesar da gravidade autolimitada e do baixo potencial de disseminação, a magnitude e transcendência são elevadas.", "A determinação da Organização Mundial de Saúde prévia à pactuação da Comissão Intergestores Tripartite sobre a doença, a semelhança do antraz."], "c": 0, "com": "A esporotricose humana entrou na lista nacional pelo crescimento dos casos, alto risco de disseminação (transmissão por gatos), acometimento de populações vulneráveis e possibilidade de intervenção.", "tab": [["Critério para notificação", "Exemplo"], ["Magnitude", "Muitos casos"], ["Potencial de disseminação", "Transmissão zoonótica urbana"], ["Vulnerabilidade", "Atinge populações pobres"]], "tut": "Uma doença entra na lista quando cresce, se espalha, pesa sobre os vulneráveis e dá para intervir."}, {"id": "usp26-90", "banca": "USP-SP", "ano": 2026, "num": 90, "area": "Medicina Preventiva", "tema": "Depressão na APS", "e": "Homem, 45 anos de idade, em consulta em uma unidade básica de saúde, refere indisposição de início gradativo, redução do ânimo e da energia há 4 meses. Nesse período tem comido mais, principalmente carboidratos. Tem estado um pouco mais irritado e tem sentido menos prazer no batepapo com os amigos. A investigação clínica não identificou outros sintomas físicos ou mentais. Não apresenta alterações ao exame físico. O paciente acredita que seu caso seja falta de exercício e que, se voltar a correr com seus amigos 4 vezes por semana, como fazia até há um ano, vai melhorar. Comparece à consulta porque seu chefe disse que ele deveria procurar tratamento. Diz não acreditar em psicoterapia e não gosta da ideia de tomar antidepressivos. Além de agendar uma consulta para 4 a 6 semanas, a conduta imediata seria:", "a": ["Encaminhar para psicoterapia cognitivo-comportamental.", "Prescrever inibidor seletivo de recaptura de serotonina.", "Orientar e reforçar a necessidade de atividade física.", "Indicar fitoterápico Hipericum perforatum."], "c": 2, "com": "Episódio depressivo leve a moderado em paciente que resiste a psicoterapia e antidepressivo e acredita na atividade física: a conduta imediata é orientar e reforçar o exercício, com retorno programado.", "tab": [["Depressão leve", "Opções"], ["Atividade física", "Eficaz e aceita pelo paciente"], ["Psicoterapia", "Primeira linha"], ["Antidepressivo", "Para moderada/grave"]], "tut": "Na depressão leve, decisão compartilhada: se ele topa correr, comece pelo exercício e reavalie."}, {"id": "usp26-91", "banca": "USP-SP", "ano": 2026, "num": 91, "area": "Medicina Preventiva", "tema": "Efeitos de psicofármacos", "e": "Homem, 58 anos de idade, em atendimento em unidade básica de saúde, refere estar “mais ou menos”. Queixa-se de intestino “um pouco preso” e boca seca. Durante a consulta diz estar se sentindo mais tenso, com pouca paciência, preocupando-se demais com pequenos problemas. Refere, ainda, tontura quando se levanta e bebe mais água para a boca seca. Fazia tratamento para pressão alta há 1 ano com captopril irregularmente. Há 2 meses, seu médico anterior disse que ele teria transtorno de ansiedade e prescreveu nortriptilina e, para hipertensão, foi substituído o captopril por enalapril, pois a pressão não baixava. No final da consulta, diz não se dar bem com remédios para a pressão. Reconhece que com frequência não toma os medicamentos para pressão, pois tem preguiça e também, eventualmente, não se lembra. Ao exame físico, apresentou PA de 150×95 mmHg, FC de 74 bpm. Além de abordar aspectos relativos a hábitos e à adesão ao tratamento, a conduta indicada seria substituir", "a": ["nortriptilina por fluoxetina.", "nortriptilina por diazepam.", "enalapril por anlodipino.", "enalapril por losartana."], "c": 0, "com": "Constipação, boca seca e ansiedade são efeitos anticolinérgicos e adversos da nortriptilina. A troca por fluoxetina (ISRS) reduz esses efeitos.", "tab": [["Tricíclico", "Efeitos adversos"], ["Anticolinérgicos", "Boca seca, constipação, retenção urinária"], ["Cardiovasculares", "Hipotensão, arritmias"], ["Alternativa", "ISRS (fluoxetina, sertralina)"]], "tut": "Boca seca e intestino preso em quem toma tricíclico: troque por um ISRS."}, {"id": "usp26-92", "banca": "USP-SP", "ano": 2026, "num": 92, "area": "Medicina Preventiva", "tema": "Indicadores de saúde", "e": "Caraiporã é um município de médio porte com 58 mil habitantes. Aproximadamente 35% da população vive abaixo da linha da pobreza, com precariedade em saneamento básico e acesso limitado a serviços públicos. Nos últimos anos, o município notificou cerca de 12 casos novos anuais de Tuberculose (TB). Em 2024, esse número saltou para 27, com 5 óbitos, o que ocasionou uma análise da situação de tuberculose em Caraiporã com a apresentação dos seguintes indicadores: Incidência de TB: 46,6/100 mil; Incidência de TB pulmonar: 32,8/100 mil; Coeficiente de mortalidade por TB: 8,6/100 mil; Letalidade de 18,5%; Proporção de abandono: 20,0%; Prevalência da forma pulmonar: 17,2/100 mil; Proporção da forma miliar: 1,72%. Assinale a alternativa que descreve um indicador populacional de avaliação da qualidade da assistência aos casos de tuberculose.", "a": ["Taxa de incidência da forma pulmonar.", "Taxa de prevalência da forma pulmonar.", "Proporção de abandono do tratamento.", "Proporção de tuberculose miliar."], "c": 2, "com": "A proporção de abandono do tratamento reflete a qualidade da assistência (adesão, vínculo, supervisão). Incidência e prevalência medem a carga da doença.", "tab": [["Indicador de TB", "Mede"], ["Incidência", "Ocorrência de casos novos"], ["Abandono", "Qualidade do cuidado"], ["Letalidade", "Gravidade e acesso"]], "tut": "Quem abandona o tratamento mostra o quanto o serviço segura o paciente."}, {"id": "usp26-93", "banca": "USP-SP", "ano": 2026, "num": 93, "area": "Medicina Preventiva", "tema": "Comportamento alimentar", "e": "Mulher, 23 anos de idade, com 26,7 kg/m² de IMC, refere estar preocupada com suas “gordurinhas a mais”. Relata que, nos últimos meses, apresenta um a dois episódios por mês em que, em meia hora, come muito doce, principalmente chocolate. Está com medo de engordar mais. Uma amiga está tomando lisdexanfetamina e perdeu 2 kg em um mês. Não apresenta alterações no exame físico. Ao exame psíquico, não apresentou alterações. Refere ser uma pessoa pragmática, mas não se adapta bem a rotinas; já tentou fazer atividade física algumas vezes, sem muito sucesso na continuidade. Nega problemas de saúde e gostaria de poder tomar lisdexanfetamina para controlar seu peso e apetite. Qual a conduta adequada?", "a": ["Discutir riscos da lisdexantetamina e prescrever fluoxetina.", "Indicar semaglutida se exames hepáticos e pancreáticos normais.", "Encaminhar para avaliação psiquiátrica de distúrbios alimentares.", "Orientar sobre hábitos alimentares sem indicação de exames ou medicamentos."], "c": 3, "com": "Episódios ocasionais (1 a 2 por mês) de comer doce, sem critérios de transtorno alimentar e IMC de sobrepeso leve: a conduta é orientação sobre hábitos, sem exames nem medicamentos.", "tab": [["Compulsão alimentar (transtorno)", "Critério"], ["Frequência", "≥ 1 vez/semana por 3 meses"], ["Perda de controle", "Sim, com sofrimento"], ["Uso de lisdexanfetamina", "Só com diagnóstico"]], "tut": "Atacar o chocolate uma ou duas vezes por mês não é doença: oriente e não medicalize."}, {"id": "usp26-94", "banca": "USP-SP", "ano": 2026, "num": 94, "area": "Medicina Preventiva", "tema": "Financiamento em saúde", "e": "Os gastos diretos em saúde, também chamados de out of pocket ou gastos catastróficos, referem-se aos valores que famílias e indivíduos desembolsam diretamente por serviços de saúde. Segundo a Pesquisa de Orçamento Familiar (POF), do IBGE, cada vez mais as famílias brasileiras dispensam um percentual maior de sua renda mensal com gastos diretos em saúde ao longo do tempo. A edição da POF de 2019 apontava que a saúde respondia por 8% das despesas totais das famílias. Antes, em 2003, respondia por 5,1%. Sobre os gastos out of pocket com saúde no Brasil, assinale a alternativa correta.", "a": ["Os gastos de indivíduos e famílias com planos e seguros de saúde privados constituem o maior percentual dos gastos out of pocket.", "O comprometimento proporcional da renda familiar com assistência à saúde no Brasil cresce na medida em que aumenta a renda familiar.", "Do gasto total com saúde no Brasil, mais da metade é constituída por gastos privados out of pocket.", "A maior parcela de gastos out of pocket é com medicamentos, em proporção mais elevada nas classes com renda mais baixa."], "c": 3, "com": "Os gastos diretos (out of pocket) no Brasil são, em grande parte, com medicamentos, e pesam proporcionalmente mais nas famílias de renda mais baixa.", "tab": [["Gasto direto", "Característica"], ["Maior item nas famílias pobres", "Medicamentos"], ["Famílias ricas", "Planos de saúde"], ["Impacto", "Regressivo: pesa mais no pobre"]], "tut": "Família pobre gasta com remédio; família rica, com plano. Proporcionalmente, pesa mais para o pobre."}, {"id": "usp26-95", "banca": "USP-SP", "ano": 2026, "num": 95, "area": "Medicina Preventiva", "tema": "Equipes Multiprofissionais (eMulti)", "e": "As equipes Multiprofissionais na Atenção Primária (eMulti) são compostas por profissionais de saúde de diferentes áreas de conhecimento que atuam de maneira complementar e integrada às demais equipes da Atenção Primária à Saúde (APS). Com relação às eMulti, assinale a alternativa correta.", "a": ["A teleconsulta ou atendimento remoto de pacientes não estão incorporados no processo de trabalho das eMulti.", "As eMulti estão vinculadas à APS, mas também a unidades de pronto atendimento e ambulatórios de especialidades.", "Os médicos especialistas em cardiologia, dermatologia, endocrinologia, infectologia e psiquiatria podem compor as eMulti.", "O financiamento e custeio das eMulti é responsabilidade exclusiva dos municípios (Prefeituras e Secretarias Municipais de Saúde)."], "c": 2, "com": "As eMulti podem incluir médicos especialistas, como cardiologista, dermatologista, endocrinologista, infectologista e psiquiatra, além de outros profissionais. Atuam vinculadas à APS e podem usar teleatendimento.", "tab": [["eMulti", "Característica"], ["Vínculo", "Atenção Primária"], ["Composição", "Inclui especialistas médicos"], ["Financiamento", "Tripartite"]], "tut": "As eMulti trazem especialistas para dentro da APS, inclusive a distância."}, {"id": "usp26-96", "banca": "USP-SP", "ano": 2026, "num": 96, "area": "Ginecologia e Obstetrícia", "tema": "Depressão pós-parto", "e": "Mulher, 32 anos de idade, sem doenças prévias, em consulta 4 semanas após nascimento de seu primeiro filho. Marido é “trabalhador, mas não tem muito jeito com o filho”. O parto foi vaginal espontâneo sem complicações. Ela relata que estava bem nos dois dias em que ficou na maternidade. Entretanto, ao voltar para casa, começou a se sentir sobrecarregada, cansada, com dificuldade para dormir e, quando o bebê dorme, ela chora. Sente que não é uma boa mãe, está sem paciência, irritada, e não sente prazer em cuidar do filho. Acredita estar com os hormônios alterados. Amamentar era seu sonho, mas diz ter pouco leite e, diferentemente do seu comportamento habitual, está com aversão à proximidade com o marido, que reclama do distanciamento. Refere estar com secreção vaginal amarelada abundante e preocupada se não estaria com um problema no útero. Qual é a conduta indicada?", "a": ["Passiflora incarnata e pedir ultrassom pélvico.", "Miconazol tópico e orientar sobre baby blues.", "Quetiapina à noite e convocar marido para consulta.", "Sertralina e orientar sobre depressão."], "c": 3, "com": "Sintomas depressivos persistentes 4 semanas após o parto (tristeza, ansiedade, aversão, prejuízo do cuidado) vão além do baby blues, que dura até 2 semanas. É depressão pós-parto, tratada com sertralina (compatível com amamentação) e orientação.", "tab": [["Quadro", "Duração"], ["Baby blues", "Até 2 semanas, leve"], ["Depressão pós-parto", "> 2 semanas, prejuízo funcional"], ["Psicose puerperal", "Delírios, emergência"]], "tut": "Passou de duas semanas e atrapalha a vida: não é mais baby blues, é depressão pós-parto."}, {"id": "usp26-97", "banca": "USP-SP", "ano": 2026, "num": 97, "area": "Ginecologia e Obstetrícia", "tema": "Anemia na gestação", "e": "Gestante, 30 anos de idade, 30 semanas de gravidez, com antecedente de prolapso de valva mitral diagnosticado na infância, comparece no pronto atendimento com queixa de taquicardia. Está muito preocupada com o bem-estar de seu bebê. Refere que tem tido cansaço a esforços pequenos, como caminhar no plano, e sente “o coração disparado” com muita frequência. Ao exame físico, apresenta bom estado geral, descorada 1+, PA de 108×70 mmHg, FC de 108 bpm, IMC de 38,2 kg/m2 , bulhas rítmicas normofonéticas com sopro sistólico ejetivo aórtico 2+/6+, murmúrios vesiculares sem ruídos adventícios. Abdome gravídico, altura uterina de 32 cm, BCF presente de 146 bpm. Diante da anamnese e exame clínico, a hipótese diagnóstica principal é de", "a": ["estenose aórtica.", "anemia sintomática.", "arritmia supraventricular.", "transtorno de ansiedade."], "c": 1, "com": "Gestante descorada, taquicárdica, com cansaço e sopro sistólico ejetivo suave: quadro de anemia sintomática. Sopro ejetivo leve é comum por estado hiperdinâmico e não indica estenose aórtica.", "tab": [["Sopro na gestação", "Significado"], ["Sistólico ejetivo suave", "Fluxo aumentado (fisiológico/anemia)"], ["Diastólico", "Sempre investigar"], ["Rude, com sintomas", "Investigar valvopatia"]], "tut": "Gestante pálida e taquicárdica com sopro suave: pense em anemia antes de valvopatia."}, {"id": "usp26-98", "banca": "USP-SP", "ano": 2026, "num": 98, "area": "Ginecologia e Obstetrícia", "tema": "Prolapso genital", "e": "Mulher, 58 anos de idade, menopausada, refere desconforto pélvico e sensação de “peso” na região vaginal, que se acentua ao final do dia e após longos períodos em pé. Também refere dificuldade para evacuar, com necessidade frequente de realizar manobras digitais para completar a evacuação. Apresenta atividade sexual regular com uso de lubrificantes à base de óleos naturais. Durante o exame ginecológico com manobra de Valsalva, observa-se que a parede vaginal posterior ultrapassa o hímen em 2 cm e o colo uterino exterioriza-se 1 cm além do hímen. Assinale a alternativa que apresenta a melhor conduta terapêutica a ser considerada neste caso.", "a": ["Pessário vaginal e fisioterapia pélvica.", "Tratamento com laser de CO2.", "Histerectomia vaginal e perineocolporrafia.", "Colpocleise com estrogenioterapia tópica."], "c": 2, "com": "Prolapso de parede posterior e uterino além do hímen, sintomático, em mulher sexualmente ativa: segundo a banca, histerectomia vaginal com perineocolporrafia. A colpocleise é reservada a mulheres sem atividade sexual.", "tab": [["Prolapso sintomático", "Opções"], ["Conservador", "Pessário + fisioterapia"], ["Cirúrgico com atividade sexual", "Correção reconstrutiva"], ["Sem atividade sexual, idosa", "Colpocleise"]], "tut": "Prolapso que sai pela vagina em mulher sexualmente ativa: correção reconstrutiva, não colpocleise."}, {"id": "usp26-99", "banca": "USP-SP", "ano": 2026, "num": 99, "area": "Ginecologia e Obstetrícia", "tema": "Insulina no dia do parto", "e": "Texto para as questões 99 e 100 Primigesta, 39 anos de idade, é admitida com 40 semanas de gravidez para indução de parto. Apresenta antecedente de hipertensão arterial crônica, controlada atualmente com metildopa 1,5 g por dia e diabetes gestacional em uso de insulina NPH 12 unidades antes do café da manhã, 6 unidades na hora do almoço e 6 unidades às 22 horas (12-6-0-6) e insulina regular 4 unidades no café da manhã, 4 unidades no almoço e 2 no jantar (4-4-2-0). Ao exame inicial, apresenta bom estado geral, corada, normotensa e normocárdica, altura uterina de 38 cm, cefálico, BCF presente de 148 bpm, colo médio, medianizado, com 4 cm. Considerando que será ofertada dieta pré-parto, no dia da indução, qual deve ser a prescrição de insulina?", "a": ["NPH 4-0-0-0 e regular conforme glicemia.", "NPH 6-3-0-3 e regular 4-2-2-0.", "NPH 12-6-0-6 e SG 5% manutenção.", "Regular conforme glicemia capilar."], "c": 0, "com": "No dia da indução com dieta pré-parto, reduz-se a NPH (cerca de 1/3 da dose da manhã) e usa-se insulina regular conforme glicemia capilar, para evitar hipoglicemia materna e neonatal.", "tab": [["Dia do parto", "Insulina"], ["Com dieta", "NPH reduzida + regular por glicemia"], ["Em jejum/trabalho de parto ativo", "Suspender NPH, soro glicosado, regular por glicemia"], ["Após o parto (DMG)", "Suspender insulina"]], "tut": "No dia do parto, tire boa parte da NPH e corrija com regular pela glicemia."}, {"id": "usp26-100", "banca": "USP-SP", "ano": 2026, "num": 100, "area": "Ginecologia e Obstetrícia", "tema": "Iminência de rotura uterina", "e": "Texto para as questões 99 e 100 Primigesta, 39 anos de idade, é admitida com 40 semanas de gravidez para indução de parto. Apresenta antecedente de hipertensão arterial crônica, controlada atualmente com metildopa 1,5 g por dia e diabetes gestacional em uso de insulina NPH 12 unidades antes do café da manhã, 6 unidades na hora do almoço e 6 unidades às 22 horas (12-6-0-6) e insulina regular 4 unidades no café da manhã, 4 unidades no almoço e 2 no jantar (4-4-2-0). Ao exame inicial, apresenta bom estado geral, corada, normotensa e normocárdica, altura uterina de 38 cm, cefálico, BCF presente de 148 bpm, colo médio, medianizado, com 4 cm. Após 6 horas de trabalho de parto, a paciente apresentava dilatação total e apresentação cefálica no plano 0 de De Lee, occipito transversa direita e avaliação abdominal conforme a imagem a seguir: Qual é o diagnóstico e a conduta?", "a": ["Distocia funcional – ocitocina.", "Retenção urinária – sondagem de alívio.", "Iminência de rotura – parto cesárea.", "Hipertonia uterina – terbutalina."], "c": 2, "com": "Trabalho de parto prolongado com o sinal de Bandl (anel que separa corpo e segmento inferior, abdome em ampulheta) indica iminência de rotura uterina. A conduta é cesárea imediata.", "tab": [["Iminência de rotura", "Sinais"], ["Bandl", "Anel na altura do umbigo"], ["Frommel", "Ligamentos redondos tensos"], ["Conduta", "Cesárea de urgência"]], "tut": "Barriga em forma de ampulheta no trabalho de parto: o útero vai romper. Cesárea já.", "img": ["img/q/usp26-100.jpg"]}, {"id": "usp26-101", "banca": "USP-SP", "ano": 2026, "num": 101, "area": "Ginecologia e Obstetrícia", "tema": "Nódulo mamário na gestação", "e": "Mulher, 39 anos de idade, 26 semanas de gestação, refere que notou aumento assimétrico das mamas ao longo do último mês. Ao exame, nota-se nodulação de aproximadamente 2,5 cm em junção de quadrantes inferiores de mama esquerda, profundo, pouco móvel, sem calor local. Neste caso, recomenda-se:", "a": ["Punção aspirativa guiada por ultrassonografia.", "Prosseguir investigação com mamografia.", "Iniciar tratamento com clindamicina.", "Reavaliar clinicamente em 2 semanas."], "c": 1, "com": "Nódulo mamário palpável, endurecido e pouco móvel em gestante de 39 anos precisa ser investigado como qualquer nódulo. A banca indicou a mamografia (com proteção abdominal), que é segura na gestação.", "tab": [["Nódulo na gestação", "Conduta"], ["Investigar", "Sempre, sem adiar"], ["Imagem", "Ultrassom e/ou mamografia com proteção"], ["Suspeito", "Biópsia por agulha grossa"]], "tut": "Gravidez não adia a investigação de nódulo de mama."}, {"id": "usp26-102", "banca": "USP-SP", "ano": 2026, "num": 102, "area": "Ginecologia e Obstetrícia", "tema": "Hiperêmese gravídica", "e": "Mulher, 28 anos de idade, 2G1A, com 10 semanas de gestação, procura pronto atendimento por vômitos persistentes há 10 dias, com dificuldade para manter líquidos e alimentos. Refere dor abdominal discreta e perda de 5 kg no período. Nega febre e perdas vaginais. Traz cartão de prénatal com rotina de exames sem alterações. Relata ter iniciado dimenidrinato oral há cerca de 5 dias, prescrito em outro serviço, mas sem melhora significativa dos sintomas. Ao exame físico, apresenta-se em BEG, PA de 100×60 mmHg, FC de 104 bpm, mucosa oral levemente seca. Abdome flácido, levemente doloroso em epigástrio, sem visceromegalias. • Exames laboratoriais: TGO/AST: 58 U/L TGP/ALT: 65 U/L Bilirrubina total: 0,9 mg/dL β-hCG: 215.000 mUI/mL Urina tipo 1: cetonúria ++/4+ TSH: 0,05 mUI/L T4 livre: 1,1 ng/dL Assinale a alternativa que apresenta a interpretação e conduta mais adequadas para o caso descrito.", "a": ["Cetoacidose diabética; solicitar glicemia, gasometria e eletrólitos e iniciar hidratação endovenosa.", "Hiperêmese gravídica com hipertiroidismo transitório; hidratação venosa e otimização dos antieméticos.", "Hepatite medicamentosa por uso de dimenidrinato; suspender a medicação e iniciar corticoide sistêmico.", "Hipertireoidismo autoimune associado à hepatopatia; iniciar propiltiouracil e monitorar função hepática."], "c": 1, "com": "Vômitos persistentes com perda de peso e cetonúria no primeiro trimestre: hiperêmese gravídica. O TSH baixo com T4 livre normal reflete hipertireoidismo transitório pelo hCG alto, que não precisa de antitireoidiano.", "tab": [["Hiperêmese", "Pontos-chave"], ["Critérios", "Vômitos persistentes, perda > 5% do peso, cetonúria"], ["Tratamento", "Hidratação, antieméticos, tiamina"], ["TSH baixo", "Efeito do hCG, transitório"]], "tut": "Muito hCG estimula a tireoide e baixa o TSH. Trate o vômito, não a tireoide."}, {"id": "usp26-103", "banca": "USP-SP", "ano": 2026, "num": 103, "area": "Ginecologia e Obstetrícia", "tema": "Aborto legal", "e": "Mulher, 25 anos de idade, busca atendimento por atraso menstrual e teste de gravidez positivo. Sem doenças, refere ciclos menstruais prévios regulares, com variação entre 27 e 31 dias de intervalo. A data da última menstruação foi em 10/08/2025. Refere que foi vítima de violência sexual em 23/08/2025, mas não verbalizou por receio de ser punida pelo agressor conhecido. A relação não consensual ocorreu com penetração vaginal, sem uso de preservativo. Após o ocorrido, apresentou corrimento amarelado, que tratou por conta própria com clotrimazol em dose única. Manifesta desejo de interromper a gravidez. Assinale a alternativa correta.", "a": ["Como a idade gestacional e o evento são compatíveis, a interrupção de gravidez pode ser realizada diante de relato circunstanciado.", "Diante da idade gestacional avançada, indicar suporte multiprofissional integral e iniciar pré-natal de alto risco.", "Orientar para que realize boletim de ocorrência para prosseguir com a interrupção de gravidez.", "Não há correlação direta entre a gravidez e o evento e, por isso, deve-se garantir assistência pré-natal."], "c": 0, "com": "A gravidez decorrente de violência sexual permite a interrupção legal. Não é necessário boletim de ocorrência, e o relato circunstanciado da mulher basta. Aqui, a idade gestacional é compatível com a data do evento.", "tab": [["Aborto previsto em lei", "Situação"], ["Violência sexual", "Relato da mulher, sem BO"], ["Risco de vida materno", "Indicação médica"], ["Anencefalia", "Diagnóstico por imagem"]], "tut": "No estupro, a palavra da mulher basta: não precisa de boletim de ocorrência."}, {"id": "usp26-104", "banca": "USP-SP", "ano": 2026, "num": 104, "area": "Ginecologia e Obstetrícia", "tema": "Pré-eclâmpsia e vitalidade fetal", "e": "Secundigesta com uma cesárea prévia, sem doenças, comparece ao pré-natal com 34 semanas e 3 dias de gravidez, queixa-se de edema importante na última semana. Boa movimentação, sem perdas vaginais. Ao exame físico, apresenta bom estado geral, corada, PA de 148×90 mmHg, abdome gravídico, altura uterina de 29 cm, útero normotônico, BCF presente rítmico de 128 bpm. Edema mãos e face 2+/4+, edema membros inferiores 3+/4+, simétrico e sem sinais de TVP. Avaliação fetal realizada com os seguintes achados: A conduta obstétrica é:", "a": ["Parto cesárea.", "Indução de parto.", "Iniciar metildopa e reavaliar.", "Sulfato de magnésio endovenoso."], "c": 0, "com": "Gestante de 34 semanas com hipertensão e edema (pré-eclâmpsia) e avaliação fetal alterada (desaceleração na cardiotocografia e diástole zero/reversa no Doppler da artéria umbilical). Com uma cesárea prévia e sofrimento fetal, a conduta é parto cesárea.", "tab": [["Doppler umbilical", "Conduta (≥ 34 sem)"], ["Normal", "Seguir conduta obstétrica"], ["Diástole zero/reversa", "Parto"], ["Cesárea prévia + sofrimento", "Cesárea"]], "tut": "Pré-eclâmpsia com Doppler ruim depois de 34 semanas: tire o bebê.", "img": ["img/q/usp26-104.jpg"]}, {"id": "usp26-105", "banca": "USP-SP", "ano": 2026, "num": 105, "area": "Ginecologia e Obstetrícia", "tema": "Hemorragia pós-parto", "e": "Quintigesta com quatro partos vaginais anteriores, internada com 38 semanas de gravidez e trabalho de parto espontâneo, com recém-nascido nativivo, 4.020 g, Apgar 7-9-10 após 3 horas de trabalho de parto. Após a dequitação, apresenta atonia uterina com sangramento vaginal e, em 4 minutos, o monitor revela PA de 76×54 mmHg e FC de 120 bpm. São tomadas medidas adequadas, como acesso venoso, reposição de cristaloide, coleta de exames, aquecimento e oxigenioterapia. Em paralelo, medidas para corrigir a atonia. Do ponto de vista hemodinâmico, deve-se", "a": ["manter reanimação volêmica com Ringer lactato.", "avaliar necessidade de transfusão com Hb/Ht.", "iniciar protocolo de transfusão maciça.", "iniciar noradrenalina em bomba de infusão."], "c": 2, "com": "Hemorragia pós-parto com hipotensão (76 x 54) e taquicardia, índice de choque
