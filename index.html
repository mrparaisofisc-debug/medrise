coledocolitíase).", "tab": [["Situação", "Exame"], ["Colestase sem colangite", "Colangiorressonância"], ["Colangite (Charcot)", "CPRE terapêutica"], ["Suspeita de tumor", "TC com contraste"]], "tut": "Colestase sem febre: primeiro enxergue a via biliar com a colangiorressonância. A CPRE fica para quando houver colangite ou necessidade de tratar."}, {"id": "en25-99", "banca": "ENAMED/ENARE", "ano": 2025, "num": 99, "area": "Ginecologia e Obstetrícia", "tema": "Rotura prematura de membranas", "e": "Primigesta de 28 anos, com 33 semanas de gestação, pré-natal de risco habitual, chega ao pronto-atendimento obstétrico relatando saída de líquido claro pela vagina há cerca de 2 horas. Ao exame físico, sinais vitais normais, tônus uterino normal, não há presença de contrações, altura uterina é compatível com a idade gestacional, movimentos fetais presentes e frequência cardíaca fetal de 140 bpm. Ao exame especular, nota-se saída de líquido amniótico claro pelo orifício externo do colo uterino. Após a prescrição de antibiótico e corticoterapia antenatal, a conduta adequada a ser adotada é prescrever", "a": ["internação hospitalar e monitoramento materno-fetal diário.", "internação hospitalar, cardiotocografia e indução imediata do parto.", "alta, repouso domiciliar e monitoramento materno-fetal ambulatorial diário.", "alta, repouso domiciliar e monitoramento materno-fetal ambulatorial semanal."], "c": 0, "com": "Rotura prematura de membranas com 33 semanas, sem infecção e com vitalidade preservada: conduta expectante com internação, antibiótico, corticoide e monitoramento materno-fetal diário até 34 semanas.", "tab": [["RPMO", "Conduta"], ["< 34 semanas sem infecção", "Expectante: internar, ATB, corticoide"], ["≥ 34 semanas", "Resolução da gestação"], ["Corioamnionite", "Resolução imediata"]], "tut": "Bolsa rota antes de 34 semanas e sem infecção: segura a gravidez internada, com antibiótico e corticoide."}, {"id": "usp26-01", "banca": "USP-SP", "ano": 2026, "num": 1, "area": "Clínica Médica", "tema": "Ultrassom à beira do leito (POCUS)", "e": "Homem, 52 anos de idade, mecânico, tem hipertensão arterial sistêmica, diabetes melito tipo 2 e asma. Procura atendimento ambulatorial por falta de ar. Notou dispneia progressiva ao longo das duas últimas semanas durante o trabalho. Chegou a passar em pronto-socorro, foi medicado com salbutamol inalatório e acha que teve melhora discreta. Percebe edema frequente perimaleolar, ronco alto noturno e sonolência diurna. Nega angina, ortopneia, dispneia paroxística noturna, viagem ou imobilização recentes. Sinais vitais com temperatura de 36,2 °C, FC de 90 bpm, PA de 120×82 mmHg, FR de 16 irpm, SpO2 de 95%. Apresenta IMC de 32,3 kg/m2 . Murmúrios vesiculares universalmente reduzidos, sibilos expiratórios ocasionais. Bulhas hipofonéticas, sem sopros, veias do pescoço não visíveis, edema bilateral leve dos tornozelos. Foi realizada uma avaliação complementar com ultrassonografia à beira do leito e foram obtidas as imagens apresentadas a seguir: Assinale a alternativa que apresenta a conduta medicamentosa mais adequada neste momento.", "a": ["Furosemida.", "Azitromicina.", "Rivaroxabana.", "Formoterol/budesonida."], "c": 0, "com": "As imagens mostram linhas B difusas em todos os campos pulmonares (congestão), veia cava inferior dilatada e sem colapso inspiratório (pressão de enchimento alta) e veias femorais e poplíteas compressíveis (sem TVP). O quadro é de congestão, possivelmente com disfunção cardíaca ligada à apneia do sono e obesidade. A conduta é diurético: furosemida.", "tab": [["Achado no POCUS", "Significado"], ["Linhas B difusas", "Congestão pulmonar"], ["VCI dilatada, sem colapso", "Pressão venosa alta"], ["Veia compressível", "Afasta TVP"]], "tut": "Pulmão cheio de linhas B e cava gorda que não colaba: é água. Dê diurético.", "img": ["img/q/usp26-01.jpg"]}, {"id": "usp26-02", "banca": "USP-SP", "ano": 2026, "num": 2, "area": "Clínica Médica", "tema": "Hiponatremia", "e": "Mulher, 28 anos de idade, previamente hígida, procura atendimento de urgência. Queixa-se de diarreia aquosa há 4 dias com febre baixa. Teve 6 episódios por dia, com cólicas intensas, náuseas e hiporexia. O seu filho de 4 anos de idade está com os mesmos sintomas. Sinais vitais com PA de 110×68 mmHg, FC de 94 bpm, FR de 18 irpm, SpO2 de 99%, temperatura de 37,1 °C. Ao exame clínico, apresenta regular estado geral, mucosas secas, peristalse aumentada, desconforto abdominal difuso. • Exames laboratoriais: Hb: 13,7 g/dL Leucócitos: 15.890/mm3 Plaquetas: 384 mil/mm3 Ur: 47 mg/dL Cr: 1,18 mg/dL Na+: 128 mEq/L K+: 3,7 mEq/L HCO3-: 29 mEq/L Assinale a alternativa que apresenta um mecanismo fisiopatológico que faz parte do desenvolvimento da hiponatremia desta paciente.", "a": ["Secreção inapropriada de ADH.", "Liberação de peptídeo natriurético.", "Elevação de aldosterona.", "Perda fecal de potássio."], "c": 2, "com": "Diarreia com desidratação causa hipovolemia, que ativa o sistema renina-angiotensina-aldosterona e libera ADH de forma apropriada (não é SIADH). A hiponatremia vem da reposição com água livre somada ao ADH. Entre as opções, a elevação de aldosterona faz parte dessa resposta à hipovolemia.", "tab": [["Hiponatremia hipovolêmica", "Mecanismo"], ["Gatilho", "Perda de volume (diarreia, vômitos)"], ["Resposta", "ADH apropriado + SRAA ativado"], ["Tratamento", "Soro fisiológico"]], "tut": "Desidratou? O corpo segura água (ADH) e sal (aldosterona). Como não é inapropriado, não chame de SIADH."}, {"id": "usp26-03", "banca": "USP-SP", "ano": 2026, "num": 3, "area": "Clínica Médica", "tema": "Hipertensão portal", "e": "Homem, 53 anos de idade, tem esquistossomose hepatoesplênica e comparece em consulta ambulatorial de seguimento. Nota edema nos tornozelos desde a última consulta. Já teve episódios prévios de encefalopatia hepática. Faz uso crônico de lactulose. Sinais vitais com PA de 154×86 mmHg, FC de 89 bpm, FR de 16 irpm, SpO2 de 98%. Ao exame clínico, apresenta bom estado geral, vigil, orientado no tempo e no espaço, tônus normais, abdome plano, lobo esquerdo do fígado palpável, baço palpável, edema perimaleolar de 2+/4+. • Exames laboratoriais: Hb:12,9 g/dL Leucócitos: 4.230/mm3 Plaquetas: 98 mil/mm3 TGO/AST: 37 U/L TGP/ALT: 43 U/L Albumina: 3,1 g/dL INR: 1,8 Cr: 1,37 mg/dL Na+: 130 mEq/L Urina tipo 1: normal Endoscopia digestiva alta com duas varizes esofágicas de grosso calibre, sem sinais de sangramento recente. Ultrassonografia de abdome superior com líquido livre em pequena quantidade na cavidade, aumento do lobo esquerdo do fígado e aumento do baço. Com base no caso clínico apresentado, assinale a alternativa que indica a melhor conduta terapêutica a ser realizada neste momento.", "a": ["Infundir albumina.", "Introduzir carvedilol.", "Indicar paracentese.", "Restringir água diária."], "c": 1, "com": "Varizes esofágicas de grosso calibre sem sangramento prévio pedem profilaxia primária. O betabloqueador não seletivo (carvedilol ou propranolol) reduz o risco do primeiro sangramento.", "tab": [["Varizes", "Conduta"], ["Grosso calibre, sem sangramento", "Betabloqueador não seletivo ou ligadura"], ["Após sangramento", "Betabloqueador + ligadura"], ["Opção preferida", "Carvedilol"]], "tut": "Variz grossa que ainda não sangrou: dê carvedilol pra baixar a pressão portal antes que ela estoure."}, {"id": "usp26-04", "banca": "USP-SP", "ano": 2026, "num": 4, "area": "Clínica Médica", "tema": "Cardiomiopatias", "e": "Homem, 47 anos de idade, possui antecedente de síndrome do túnel de carpo unilateral à direita. Procura o ambulatório por queixa de dispneia aos médios esforços. Relata despertar noturno por desconforto respiratório, que melhora com a ortostase. Consome de forma crônica 8 latas de cerveja por dia. Ao exame físico, apresenta bom estado geral, corado, hidratado. Auscultas cardíaca e pulmonar sem alterações. Abdome normotenso, indolor, presença de refluxo hepatojugular. Edema de membros inferiores bilateral. • Exames laboratoriais: Hb: 10,8 g/dL Leucócitos: 4.400/mm3 Plaquetas: 164 mil/mm3 TGO/AST: 48 U/L TGP/ALT: 36 U/L Albumina: 3,6 g/dL INR: 1,0 TTPa R: 0,9 Bilirrubina total: 0,6 mg/dL Fosfatase alcalina: 187 U/L GGT: 318 U/L Saturação transferrina: 32% Ferritina: 997 ng/mL Ecodopplercardiograma com estresse: fração de ejeção ventricular de 43%, volume diastólico de ventrículo esquerdo aumentado, ventrículo direito e átrios de tamanho normal, ausência de espessamento de septo, ausência de hipocinesia segmentar induzida por estresse farmacológico. Com relação ao caso clínico apresentado, assinale a alternativa que indica o diagnóstico pertinente.", "a": ["Amiloidose subtipo ATTR.", "Cardiomiopatia alcóolica.", "Cardiomiopatia cirrótica.", "Hemocromatose."], "c": 1, "com": "Etilismo pesado e crônico com disfunção sistólica, ventrículo esquerdo dilatado e sem isquemia induzida: cardiomiopatia alcoólica, uma forma de cardiomiopatia dilatada. A abstinência pode melhorar a função cardíaca.", "tab": [["Cardiomiopatia", "Pista"], ["Alcoólica", "Etilismo pesado, VE dilatado"], ["Amiloidose ATTR", "Túnel do carpo bilateral, septo espesso"], ["Hemocromatose", "Ferritina alta, diabetes, pele bronzeada"]], "tut": "Bebe muito, coração grande e fraco, sem infarto: pense em cardiomiopatia alcoólica."}, {"id": "usp26-05", "banca": "USP-SP", "ano": 2026, "num": 5, "area": "Clínica Médica", "tema": "Prurido", "e": "Mulher, 58 anos de idade, comparece à consulta ambulatorial por prurido cutâneo intenso. Refere que há 7 meses iniciou prurido no tronco e nos membros inferiores, sem lesões cutâneas. Há 1 mês, evolui com piora progressiva do sintoma, que passou a ser diário, acometendo quase todo o corpo e interferindo em atividades diárias e sono. Tem diagnósticos de hipertensão arterial sistêmica, diabetes melito tipo 2, dislipidemia e osteoartrite. Faz uso de hidroclorotiazida, metformina, dapagliflozina, sinvastatina e tramadol. Ao exame físico, apresenta sinais vitais normais, pele com leve xerose e algumas lesões escoriadas em membros inferiores, sem outras anormalidades. Tem exames de hemograma completo, ureia, creatinina, TGO/AST, TGP/ALT, FA e GGT normais. Hemoglobina glicada de 7,3%. Qual é a conduta mais apropriada a respeito do prurido neste momento?", "a": ["Hidratar a pele e usar corticoide tópico nas lesões.", "Substituir o tramadol por analgésicos simples orais.", "Prescrever gabapentina ou pregabalina orais.", "Prescrever anti-histamínico oral por quinze dias."], "c": 1, "com": "Prurido generalizado sem lesões primárias e com exames normais deve levar à revisão de medicamentos. Opioides como o tramadol causam prurido, então a troca por analgésicos simples é o primeiro passo.", "tab": [["Prurido sem lesão", "Investigar"], ["Medicamentos", "Opioides, IECA, estatinas"], ["Doença sistêmica", "Colestase, uremia, tireoide, linfoma"], ["Pele seca", "Hidratação"]], "tut": "Coceira no corpo todo sem lesão? Antes de tudo, olhe a receita: opioide coça."}, {"id": "usp26-06", "banca": "USP-SP", "ano": 2026, "num": 6, "area": "Clínica Médica", "tema": "Infarto de ventrículo direito", "e": "Homem, 53 anos de idade, possui antecedente de hipertensão e diabetes melito tipo 2. Faz uso de hidroclorotiazida, metformina e gliclazida. Comparece ao departamento de emergência com queixa de dor torácica há cerca de uma hora. Ao exame físico, apresenta PA de 90×60 mmHg, FC de 60 bpm, FR de 25 irpm. Regular estado geral, sudoreico. Auscultas cardíaca e pulmonar sem alterações. Abdome e extremidades sem alterações. Foi realizado o eletrocardiograma apresentado a seguir: Com base no caso clínico apresentado, assinale a alternativa indica a terapia intravenosa imediata pertinente.", "a": ["Dobutamina.", "Nitroglicerina.", "Noradrenalina.", "Cloreto de sódio 0,9%."], "c": 3, "com": "Dor torácica com hipotensão, bradicardia e pulmões limpos, e ECG com supradesnivelamento em parede inferior (DII, DIII, aVF): infarto inferior com acometimento do ventrículo direito. O VD depende de pré-carga, então a terapia imediata é volume com soro fisiológico. Nitrato é contraindicado.", "tab": [["IAM de VD", "Conduta"], ["Hipotensão", "Volume (SF 0,9%)"], ["Nitrato e diurético", "Evitar"], ["Diagnóstico", "Supra em V3R/V4R"]], "tut": "Infarto inferior com pressão baixa e pulmão limpo: pense no VD e dê soro, nunca nitrato.", "img": ["img/q/usp26-06.jpg"]}, {"id": "usp26-07", "banca": "USP-SP", "ano": 2026, "num": 7, "area": "Clínica Médica", "tema": "Gamopatia monoclonal", "e": "Homem, 68 anos de idade, passa em consulta ambulatorial. Ele tem fadiga crônica e o exame clínico é normal. Durante investigação, detectou-se uma anormalidade na eletroforese de proteínas, conforme imagem apresentada a seguir: Foram realizados exames de hemograma completo, creatinina, cálcio e radiografias ósseas que estavam normais. Com base nessas informações, assinale a alternativa que apresenta a conduta indicada neste momento.", "a": ["Imunofixação e pesquisa de cadeias leves livres no sangue.", "Biópsia de medula óssea e pesquisa por citogenética/FISH.", "Eletroforese de proteínas séricas a cada 6 meses.", "Cintilografia óssea ou tomografia de corpo inteiro."], "c": 0, "com": "Eletroforese com pico monoclonal (componente M de 1,2 g/dL) e hemograma, creatinina, cálcio e ossos normais. O próximo passo é caracterizar o componente M com imunofixação e dosagem de cadeias leves livres, para diferenciar MGUS de mieloma.", "tab": [["Gamopatia", "Critérios"], ["MGUS", "Pico < 3 g/dL, plasmócitos < 10%, sem CRAB"], ["Mieloma", "CRAB ou marcadores de malignidade"], ["Investigação inicial", "Imunofixação + cadeias leves livres"]], "tut": "Achou pico M? Primeiro descubra qual proteína é (imunofixação e cadeias leves) antes de pensar em medula.", "img": ["img/q/usp26-07.jpg"]}, {"id": "usp26-08", "banca": "USP-SP", "ano": 2026, "num": 8, "area": "Clínica Médica", "tema": "Transtornos de ansiedade", "e": "Homem, 45 anos de idade, busca atendimento ambulatorial. Refere ter procurado o pronto-socorro 3 vezes nos últimos 4 meses, com crises de dor precordial, taquicardia, falta de ar, formigamento nas mãos e tontura. Durante as crises, que ocorriam quando ele estava em casa, ficava muito assustado achando que iria morrer. Nos atendimentos de urgência, realizou eletrocardiogramas, radiografias de tórax e exames de sangue de urgência que apresentaram resultados normais. Devido às crises, passou a evitar andar de elevador por ter medo de ter uma crise e não poder sair ou receber ajuda. Não há queixas descritas entre as crises. Além do transtorno de pânico, qual é o diagnóstico mais apropriado a partir dos sintomas descritos?", "a": ["Agorafobia.", "Claustrofobia.", "Ansiedade generalizada.", "Fobia específica."], "c": 0, "com": "Crises de pânico recorrentes com medo de ficar em lugares de onde seria difícil sair ou receber ajuda (elevador) e esquiva desses locais: agorafobia associada ao transtorno de pânico.", "tab": [["Transtorno", "Medo de"], ["Agorafobia", "Situações sem saída ou sem ajuda"], ["Fobia específica", "Objeto ou situação específica"], ["Ansiedade generalizada", "Preocupação excessiva e difusa"]], "tut": "Evita o elevador porque tem medo de ter uma crise e não conseguir sair: isso é agorafobia."}, {"id": "usp26-09", "banca": "USP-SP", "ano": 2026, "num": 9, "area": "Clínica Médica", "tema": "Doença celíaca", "e": "Homem, 57 anos de idade, com peso de 74 kg, passa em atendimento ambulatorial. Ele tem hipotireoidismo e faz uso de 225 µg/dia de levotiroxina. Descreve que há 8 meses tem episódios progressivos de dor abdominal. A dor é em cólica, difusa, de intensidade leve a moderada. Associa episódios de evacuações amolecidas. Nunca teve saída de sangue, muco ou pus. Nega tenesmo. Acredita que os episódios têm relação com a alimentação, mas não percebe refeições ou alimentos claramente relacionados. Ele é tabagista (24 anos-maço), etilista social ocasional. Nega sibilos, prurido nasal ou congestão nasal. Os sinais vitais e o exame clínico são normais. Traz consigo uma enterotomografia normal. • Exames laboratoriais: Hb: 10,1 g/dL VCM: 67 fL HCM: 30 pg Leucócitos: 6.750/mm3 Plaquetas: 490 mil/mm3 Uma biópsia tecidual do trato gastrointestinal deste paciente, mais provavelmente, identificaria a presença de", "a": ["granuloma.", "H. pylori.", "infiltrado linfocítico.", "infiltrado eosinofílico."], "c": 2, "com": "Anemia ferropriva, diarreia com cólicas e necessidade de dose alta de levotiroxina (má absorção) sugerem doença celíaca. A biópsia duodenal mostra linfocitose intraepitelial, além de atrofia vilositária.", "tab": [["Doença celíaca", "Achados"], ["Clínica", "Diarreia, anemia ferropriva, má absorção"], ["Sorologia", "Antitransglutaminase IgA"], ["Biópsia", "Infiltrado linfocítico, atrofia de vilosidades"]], "tut": "Anemia que não melhora e remédio que não absorve: pense em celíaca, com muito linfócito na biópsia."}, {"id": "usp26-10", "banca": "USP-SP", "ano": 2026, "num": 10, "area": "Clínica Médica", "tema": "Antidepressivos", "e": "Mulher, 35 anos de idade, em acompanhamento ambulatorial por artrite reumatoide e depressão. Faz uso de metotrexato 10 mg semanal, ácido fólico 5 mg semanal e fluoxetina 20 mg à noite. Procura ambulatório por insônia há 2 meses. Exame físico geral sem alterações e articulações sem sinais de flogismo. Assinale a alternativa que apresenta a conduta adequada para a queixa da paciente.", "a": ["Trocar fluoxetina por clonazepam.", "Associar fluoxetina com clonazepam.", "Aumentar dose da fluoxetina.", "Orientar uso da fluoxetina pela manhã."], "c": 3, "com": "A fluoxetina é ativadora e pode causar insônia. A conduta simples é orientar o uso pela manhã, sem associar benzodiazepínico.", "tab": [["Efeito adverso da fluoxetina", "Conduta"], ["Insônia", "Tomar pela manhã"], ["Náusea", "Tomar com alimento"], ["Disfunção sexual", "Avaliar troca"]], "tut": "ISRS estimulante à noite tira o sono. Muda o horário pra manhã antes de pensar em outro remédio."}, {"id": "usp26-11", "banca": "USP-SP", "ano": 2026, "num": 11, "area": "Clínica Médica", "tema": "AVC e síndrome de negligência", "e": "Mulher, 74 anos de idade, tabagista, tem hipertensão e diabetes. Foi encontrada confusa em casa pela filha, que há 2 dias atrás havia a visto bem. Na admissão no pronto-socorro, encontrava-se afebril, eupneica, com PA de 170×110 mmHg, FC de 102 bpm, glicemia capilar de 145 mg/dL. Ao exame neurológico, apresentou-se vigil, alerta, irritada, afirmando “estou bem, quero ir para casa”. Tinha o olhar desviado para a direita quando distraída, mas conseguia olhar para a esquerda quando instruída pelo examinador. A paciente percebia o dedo do examinador em todos os quadrantes no exame de campos visuais por confrontação. Quando solicitada a ler um texto, começava a partir do meio da página e lia apenas o lado direito das frases repetidamente. Não apresentava fraqueza muscular. Assinale a alternativa que apresenta uma imagem de ressonância magnética compatível com o quadro da paciente descrita.", "a": ["", "", "", ""], "c": 0, "com": "Desvio do olhar para a direita, negligência do hemiespaço esquerdo (lê só o lado direito) e anosognosia apontam lesão do hemisfério direito, em região temporoparietal. A imagem A mostra hipersinal no território da artéria cerebral média direita (o lado direito do paciente aparece à esquerda da imagem).", "tab": [["Sinal", "Localização"], ["Negligência esquerda", "Parietal direito"], ["Olhar desviado para a lesão", "Lesão cortical"], ["Afasia", "Hemisfério esquerdo"]], "tut": "Ignora o lado esquerdo e olha para a direita: a lesão está no hemisfério direito. Lembre que na imagem o lado direito do paciente fica à esquerda.", "aimg": ["img/q/usp26-11-a.jpg", "img/q/usp26-11-b.jpg", "img/q/usp26-11-c.jpg", "img/q/usp26-11-d.jpg"]}, {"id": "usp26-12", "banca": "USP-SP", "ano": 2026, "num": 12, "area": "Clínica Médica", "tema": "Cetoacidose diabética", "e": "Mulher, 22 anos de idade, procura o pronto-socorro por indisposição. Descreve ter polifagia, poliúria e polidipsia progressivas no último mês, com piora na última semana. Nos últimos dois dias, teve náuseas, alguns vômitos e passou a maior parte do dia sentada por indisposição. Ao exame clínico, apresentou PA de 110×62 mmHg, FC de 106 bpm, FR de 28 irpm, temperatura 36,2 °C, SpO2 de 98%, mucosas secas, vigil, sem sinais de desconforto respiratório, força grau IV nos membros inferiores, sem outras anormalidades. • Exames laboratoriais: Glicemia: 482 mg/dL pH: 7,27 HCO3 : 12 mEq/L pCO2: 26 mmHg Cetonas detectadas no sangue. Um eletrocardiograma foi realizado e pode ser observado na imagem a seguir: Assinale a alternativa que contém o item mais apropriado à prescrição imediata da paciente.", "a": ["Bicarbonato de sódio.", "Insulina em bomba de infusão.", "Adenosina em bólus.", "Cloreto de potássio."], "c": 3, "com": "Cetoacidose diabética com ECG mostrando sinais de hipocalemia (ondas T achatadas e ondas U). Antes de iniciar insulina, o potássio precisa ser reposto, porque a insulina joga o potássio para dentro das células e pode causar arritmia grave.", "tab": [["Potássio na CAD", "Conduta"], ["< 3,3 mEq/L", "Repor K e adiar insulina"], ["3,3-5,2 mEq/L", "Insulina + K no soro"], ["> 5,2 mEq/L", "Insulina, sem K"]], "tut": "Na cetoacidose, potássio baixo vem antes da insulina. Insulina sem potássio pode matar.", "img": ["img/q/usp26-12.jpg"]}, {"id": "usp26-13", "banca": "USP-SP", "ano": 2026, "num": 13, "area": "Clínica Médica", "tema": "Razão de verossimilhança", "e": "Homem, 58 anos de idade, procura atendimento por dispneia. A médica residente, que realizou o atendimento, observou a presença de um achado clínico que favoreceu, significativamente, a possibilidade de se tratar de um caso de insuficiência cardíaca. A partir da análise da tabela, assinale a alternativa que contém o achado clínico observado.", "a": ["Hepatomegalia.", "Terceira bulha.", "Estertores.", "Refluxo abdominojugular."], "c": 3, "com": "O achado que mais aumenta a probabilidade de doença é o de maior razão de verossimilhança positiva. O refluxo abdominojugular tem RV+ de 5,5, bem acima dos outros.", "tab": [["RV+", "Impacto"], ["> 10", "Grande aumento da probabilidade"], ["5-10", "Aumento moderado"], ["1-2", "Quase não muda"]], "tut": "Quer saber qual achado mais 'confirma' a doença? Olhe a maior RV positiva.", "img": ["img/q/usp26-13.jpg"]}, {"id": "usp26-14", "banca": "USP-SP", "ano": 2026, "num": 14, "area": "Clínica Médica", "tema": "Pneumonia e radiografia", "e": "Mulher, 53 anos de idade, antecedentes desconhecidos. Trazida à sala de emergência com relato de tosse produtiva, febre e prostração nos últimos 3 dias. Durante atendimento, evoluiu com franco desconforto respiratório, foi submetida à intubação orotraqueal e foram realizados procedimentos para estabilização. Ao exame físico, após os procedimentos, apresentou PA de 102×74 mmHg, FC de 112 bpm, SpO2 de 92%, temperatura de 37,9 °C. Regular estado geral, corada, hidratada. Murmúrios vesiculares presentes à direita e globalmente reduzidos à esquerda. Ausculta cardíaca e exame abdominal sem alterações. Extremidades com perfusão periférica adequada. Assinale a alternativa que apresenta uma imagem de radiografia compatível com o quadro da paciente.", "a": ["", "", "", ""], "c": 1, "com": "Paciente intubada com murmúrio reduzido à esquerda. A imagem B mostra opacificação de todo o hemitórax esquerdo (atelectasia ou consolidação extensa), compatível com o exame físico.", "tab": [["Opacidade de hemitórax", "Pista"], ["Desvio para o lado opaco", "Atelectasia"], ["Desvio contrário", "Derrame volumoso"], ["Sem desvio", "Consolidação"]], "tut": "Murmúrio abolido de um lado: procure o hemitórax 'branco' do mesmo lado.", "aimg": ["img/q/usp26-14-a.jpg", "img/q/usp26-14-b.jpg", "img/q/usp26-14-c.jpg", "img/q/usp26-14-d.jpg"]}, {"id": "usp26-15", "banca": "USP-SP", "ano": 2026, "num": 15, "area": "Clínica Médica", "tema": "Urticária e angioedema", "e": "Mulher, 23 anos de idade, faz acompanhamento médico por rinite alérgica, dismenorreia e cefaleia tensional, com uso recorrente de anti-inflamatórios e analgésicos. A paciente comparece em consulta ambulatorial de rotina e refere que, nos últimos 8 meses, procurou o pronto-atendimento quatro vezes por edema em pálpebras e lábios. Um dos episódios foi acompanhado de edema de língua. Outro episódio foi acompanhado de lesões de pele eritematosas, edematosas e pruriginosas. Em um dos casos havia ingerido amendoim. Em duas ocasiões, recebeu adrenalina intramuscular com melhora do quadro. Nega que tenha ocorrido hipotensão, dispneia, diarreia ou dor abdominal nos quatro atendimentos. Qual é a causa mais provável do quadro clínico desta paciente?", "a": ["Urticária aguda.", "Alergia alimentar.", "Anafilaxia recorrente.", "Angioedema hereditário."], "c": 0, "com": "Episódios isolados de urticária e angioedema, sem hipotensão, dispneia ou sintomas gastrointestinais, não preenchem critério de anafilaxia. São episódios de urticária aguda, possivelmente ligados ao uso frequente de anti-inflamatórios.", "tab": [["Quadro", "Definição"], ["Urticária aguda", "Episódios < 6 semanas"], ["Anafilaxia", "Pele + respiratório, cardiovascular ou GI"], ["Angioedema hereditário", "Sem urticária, história familiar"]], "tut": "Placas na pele e inchaço sem falta de ar, pressão baixa ou dor abdominal ainda é urticária, não anafilaxia."}, {"id": "usp26-16", "banca": "USP-SP", "ano": 2026, "num": 16, "area": "Clínica Médica", "tema": "Linfonodomegalia", "e": "Mulher, 35 anos de idade, previamente hígida, procura o ambulatório. Há 3 meses, queixa-se de calafrios ocorrendo 3 vezes por semana, além de prurido generalizado, sem melhora com uso de hidratantes. Relata edema facial leve ao despertar, com melhora ao longo do dia. Notou gânglio aumentado à direita e passou em odontologista que atribuiu a um procedimento feito no mês anterior. Ao exame clínico, apresentou PA de 113×66 mmHg, FC de 112 bpm, temperatura de 37,1 ºC, FR de 18 irpm, SpO2 de 97% em ar ambiente. Linfonodo cervical direito aumentado, firme, indolor, não aderido, medindo cerca de 2,5 cm. Turgência jugular discreta. Sem sinais de congestão pulmonar ou derrame pleural. Ausência de estertores ou sibilos. Abdome flácido, indolor, sem visceromegalias. Assinale a alternativa que apresenta a conduta apropriada neste momento.", "a": ["Sorologia para mononucleose.", "Amoxicilina/clavulanato por 7 dias.", "Biópsia do linfonodo.", "Prednisona oral por 5 dias."], "c": 2, "com": "Linfonodo cervical de 2,5 cm, endurecido e persistente, com prurido, calafrios e edema facial matinal (possível compressão de veia cava superior por massa mediastinal) sugere linfoma. A conduta é a biópsia excisional do linfonodo.", "tab": [["Linfonodo suspeito", "Característica"], ["Tamanho", "> 2 cm"], ["Consistência", "Endurecido, fixo ou persistente > 4 semanas"], ["Conduta", "Biópsia excisional"]], "tut": "Íngua grande e dura que não some, com sintomas gerais: biópsia. Antibiótico e corticoide só atrasam o diagnóstico."}, {"id": "usp26-17", "banca": "USP-SP", "ano": 2026, "num": 17, "area": "Clínica Médica", "tema": "Medida da pressão arterial", "e": "Homem, 43 anos de idade, possui antecedentes de diabetes melito tipo 2 e sobrepeso. Comparece em consulta para seguimento de controle glicêmico. Marido do paciente refere ronco esporádico em noites após ingestão de álcool e nega pausas respiratórias. Paciente nega sonolência diurna ou cefaleia. Foi realizada aferição de pressão arterial na triagem, que identificou valor de 148×92 mmHg. Qual deve ser o próximo passo na avaliação da pressão arterial em consultório?", "a": ["Solicitar uma polissonografia tipo 1 (laboratório de sono).", "Indicar Monitorização Ambulatorial da Pressão Arterial (MAPA).", "Reavaliar medida de pressão arterial em consulta de retorno.", "Checar comprimento e largura do manguito utilizado na medição."], "c": 3, "com": "Antes de interpretar uma PA elevada, é preciso garantir a técnica: manguito com largura e comprimento adequados à circunferência do braço. Manguito pequeno superestima a PA.", "tab": [["Erro de técnica", "Efeito"], ["Manguito pequeno", "Superestima a PA"], ["Manguito grande", "Subestima a PA"], ["Braço sem apoio", "Eleva a leitura"]], "tut": "PA alta em pessoa com sobrepeso? Primeiro confira se o manguito é do tamanho certo."}, {"id": "usp26-18", "banca": "USP-SP", "ano": 2026, "num": 18, "area": "Ginecologia e Obstetrícia", "tema": "Trombofilias e contracepção", "e": "Mulher, 28 anos de idade, saudável, com gestação prévia sem intercorrências, procura atendimento ginecológico para iniciar o uso de contracepção hormonal combinada. Ela não possui história pessoal ou familiar de trombose venosa profunda, tromboembolia pulmonar ou complicações gestacionais. Soube por amigos do risco de trombose relacionado ao uso desse tipo de contraceptivo e solicita a realização de exames para pesquisa de trombofilias hereditárias antes de iniciar o método. A tabela de prevalência de trombofilias hereditárias é apresentada a seguir: Com base nas evidências disponíveis na tabela e o risco de tromboembolia em usuárias de contraceptivos orais, qual é o melhor aconselhamento neste caso?", "a": ["Solicitar a pesquisa das trombofilias mais prevalentes na população.", "Solicitar as pesquisas das trombofilias com maior risco relativo de TEV.", "Realizar triagem laboratorial para as trombofilias hereditárias disponíveis.", "Não há necessidade de investigar trombofilias hereditárias."], "c": 3, "com": "Sem história pessoal ou familiar de trombose, não há indicação de rastrear trombofilias antes do contraceptivo combinado. As trombofilias são raras e o rastreio universal não é custo-efetivo.", "tab": [["Investigar trombofilia", "Quando"], ["História pessoal de TEV", "Sim"], ["Parente de 1º grau com TEV/trombofilia", "Considerar"], ["Sem história", "Não"]], "tut": "Sem trombose na pessoa ou na família, não precisa pedir trombofilia antes da pílula.", "img": ["img/q/usp26-18.jpg"]}, {"id": "usp26-19", "banca": "USP-SP", "ano": 2026, "num": 19, "area": "Clínica Médica", "tema": "Pneumonia hospitalar", "e": "Homem, 73 anos de idade, com antecedente de insuficiência cardíaca de fração de ejeção reduzida e hipertensão arterial sistêmica. Internado por descompensação da insuficiência cardíaca por má adesão. Após 8 dias de internação hospitalar, intercorreu com febre, tosse produtiva, taquicardia e pressão arterial média limítrofe. • Exames laboratoriais: Hb: 14,2 mg/dL Leucócitos: 9.200/mm3 Plaquetas: 184 mil/mm3 Cr: 0,9 mg/dL Hemocultura com identificação de Staphylococcus epidermidis em frasco aeróbio após 22h, frasco anaeróbio e outro par de hemocultura seguem negativos. Assinale a alternativa que apresenta a antibioticoterapia mais pertinente para o caso apresentado.", "a": ["Ceftriaxone e azitromicina.", "Piperacilina com tazobactam.", "Vancomicina.", "Oxacilina."], "c": 1, "com": "Febre e tosse após 8 dias de internação indicam pneumonia hospitalar. O S. epidermidis em um único frasco é contaminação. O tratamento empírico precisa cobrir Pseudomonas, por exemplo com piperacilina-tazobactam.", "tab": [["Situação", "Interpretação"], ["S. epidermidis em 1 frasco", "Contaminante"], ["Pneumonia > 48 h de internação", "Hospitalar: cobrir Pseudomonas"], ["Opções", "Piperacilina-tazobactam, cefepime"]], "tut": "Estafilococo coagulase-negativo num frasco só é sujeira da coleta. Trate a pneumonia hospitalar com cobertura pra Pseudomonas."}, {"id": "usp26-20", "banca": "USP-SP", "ano": 2026, "num": 20, "area": "Clínica Médica", "tema": "Parkinsonismo induzido", "e": "Homem, 62 anos de idade, com histórico de hipertensão arterial sistêmica e dislipidemia, foi recentemente internado devido a infarto agudo do miocárdio de parede inferior, tratado com sucesso por intervenção coronariana percutânea primária. Ficou internado por 14 dias para controle sintomático. Neste período, a família notou o surgimento de tremores simétricos em repouso, predominantemente em membros superiores, associados à lentificação dos movimentos e dificuldade de marcha, com piora progressiva ao longo dos dias. Ao exame neurológico, o paciente apresentava rigidez em “roda denteada” em ambos os membros superiores, bradicinesia e tremor de repouso bilateral, mais proeminente nos membros superiores, com frequência de 4-6 Hz. A velocidade da marcha encontrava-se reduzida, com passos curtos e redução do balanço passivo dos membros superiores. Assinale a alternativa que apresenta a medicação mais provavelmente associada ao surgimento desses sintomas no caso descrito.", "a": ["Clonazepam.", "Carvedilol.", "Bromoprida.", "Losartana."], "c": 2, "com": "Parkinsonismo bilateral e simétrico de início recente, após internação, sugere causa medicamentosa. A bromoprida bloqueia receptores dopaminérgicos e causa parkinsonismo.", "tab": [["Droga", "Mecanismo"], ["Bromoprida, metoclopramida", "Antagonista dopaminérgico"], ["Haloperidol, risperidona", "Antipsicóticos"], ["Flunarizina, cinarizina", "Bloqueadores de canal de cálcio"]], "tut": "Parkinson que aparece de repente, dos dois lados, depois de um remédio para enjoo: culpe a bromoprida."}, {"id": "usp26-21", "banca": "USP-SP", "ano": 2026, "num": 21, "area": "Clínica Médica", "tema": "Hipercalemia", "e": "Mulher, 23 anos de idade, possui antecedente de lúpus eritematoso sistêmico com atividade prévia mucocutânea e articular em uso de hidroxicloroquina e prednisona, além de constipação crônica. Perdeu seguimento ambulatorial por 2 anos. Procura o departamento de emergência por cansaço inespecífico. Ao exame físico, apresentou PA de 152×88 mmHg, FC de 90 bpm, FR de 23 irpm, SpO2 de 94% em ar ambiente, ausculta cardiopulmonar sem alterações, hiperemia malar e em tronco. • Exames laboratoriais: Hb: 8,9 mg/dL Leucócitos: 3.600l/mm3 Plaquetas: 123 mil/mm3 Cr: 3,7 mg/dL Ur: 127 mg/dL K+ : 5,8 mEq/mL Na+ : 135 mEq/mL Foi realizado o eletrocardiograma apresentado a seguir: Com base no caso clínico descrito, assinale a alternativa que apresenta a conduta imediata pertinente.", "a": ["Gluconato de cálcio.", "Furosemida.", "Desmopressina.", "Poliestireno sulfonato de sódio."], "c": 1, "com": "Lúpus com provável nefrite e insuficiência renal, hipertensa, com K de 5,8 e ECG sem alterações graves de hipercalemia. Sem alterações eletrocardiográficas que exijam gluconato de cálcio, o gabarito indicou furosemida para aumentar a excreção renal de potássio e tratar a hipervolemia.", "tab": [["Hipercalemia", "Conduta"], ["Alteração grave no ECG", "Gluconato de cálcio"], ["Redistribuir", "Insulina + glicose, beta-2"], ["Eliminar", "Furosemida, resina, diálise"]], "tut": "Potássio um pouco alto com ECG sem sinais graves: foque em eliminar o potássio.", "img": ["img/q/usp26-21.jpg"]}, {"id": "usp26-22", "banca": "USP-SP", "ano": 2026, "num": 22, "area": "Clínica Médica", "tema": "Hipertensão no paciente dialítico", "e": "Homem, 67 anos de idade, possui antecedentes de hipertensão arterial sistêmica, doença renal crônica dialítica e cefaleia tensional. Está internado na enfermaria de clínica médica em término de tratamento de pneumonia. Durante a evolução, foram identificados, nos controles das últimas 48 horas, múltiplas aferições de pressão arterial próximas a 180×120 mmHg. Apresentou um episódio de sua cefaleia habitual. Assinale a alternativa que apresenta uma etapa do exame físico fundamental para a conduta imediata.", "a": ["Exame do fundo de olho.", "Medida do peso corpóreo.", "Aferição da circunferência cervical.", "Pesquisa de sopro abdominal."], "c": 1, "com": "Em doentes renais crônicos dialíticos, a hipertensão costuma ser volume-dependente. A medida do peso, comparada ao peso seco, orienta a conduta (ajuste da diálise e da ultrafiltração). Não há sinais de lesão aguda de órgão-alvo.", "tab": [["Paciente dialítico com PA alta", "Avaliar"], ["Peso x peso seco", "Excesso de volume"], ["Sinais de lesão aguda", "Emergência hipertensiva"], ["Ajuste", "Ultrafiltração/diálise"]], "tut": "No paciente em diálise, pressão alta quase sempre é água demais: suba na balança."}, {"id": "usp26-23", "banca": "USP-SP", "ano": 2026, "num": 23, "area": "Clínica Médica", "tema": "Hipercalcemia maligna", "e": "Mulher, 41 anos de idade, portadora de neoplasia de mama com metástases óssea e pulmonar, encontra-se em uso de morfina, dipirona e lactulose. Há uma semana, evoluiu com sonolência progressiva, náuseas, vômitos, piora da constipação intestinal e queda de funcionalidade. Ao exame físico, apresentou PA de 130×78 mmHg, FC de 112 bpm, FR de 14 irpm, SpO2 de 94%; regular estado geral, sonolenta, desidratada, hipocorada; aparelho cardiopulmonar sem alterações; abdome distendido. Diante desses achados, a principal hipótese diagnóstica é de", "a": ["metástase hepática.", "metástase cerebral.", "hipercalcemia.", "hiponatremia."], "c": 2, "com": "Câncer de mama com metástase óssea e quadro de sonolência, náuseas, vômitos, constipação e desidratação: hipercalcemia da malignidade. O tratamento é hidratação vigorosa e bisfosfonato.", "tab": [["Hipercalcemia", "Sintomas"], ["Neurológicos", "Sonolência, confusão"], ["Gastrointestinais", "Náusea, vômito, constipação"], ["Renais", "Poliúria, desidratação"]], "tut": "Paciente com metástase óssea sonolenta, enjoada e com intestino preso: dose o cálcio."}, {"id": "usp26-24", "banca": "USP-SP", "ano": 2026, "num": 24, "area": "Clínica Médica", "tema": "Insuficiência adrenal", "e": "Homem, 49 anos de idade, tem diagnóstico recente de insuficiência adrenal e faz uso crônico de hidrocortisona e fludrocortisona por via oral. Ele procura o pronto-socorro com queixa de 3 dias de congestão nasal, cefaleia frontal intermitente, rinorreia e odinofagia leve. Ao exame físico, apresenta temperatura de 38,3 ºC, bom estado geral, congestão nasal bilateral, orofaringe com hiperemia, sem linfonodos cervicais ou lesões orais; sem outras anormalidades. Ele conta que a equipe de endocrinologia lhe entregou uma carta para levar consigo em caso de atendimentos de urgência, mas esqueceu de trazer este documento. Com base nessas informações, assinale a alternativa que apresenta a conduta mais apropriada para o paciente neste momento.", "a": ["Manter as doses dos medicamentos e observar evolução em domicílio.", "Manter as doses dos medicamentos e indicar hospitalização.", "Aumentar a dose de hidrocortisona e observar evolução em domicílio.", "Aumentar a dose de hidrocortisona e indicar hospitalização."], "c": 2, "com": "Na insuficiência adrenal, doenças intercorrentes exigem aumento da dose de hidrocortisona (regra dos dias de doença, geralmente dobrar ou triplicar). Com IVAS leve e estável, o paciente pode ser acompanhado em casa.", "tab": [["Situação", "Conduta"], ["Doença leve (IVAS)", "Dobrar/triplicar a hidrocortisona"], ["Vômitos ou instabilidade", "Hidrocortisona parenteral, hospital"], ["Mineralocorticoide", "Manter a mesma dose"]], "tut": "Quem não produz cortisol precisa de mais remédio quando fica doente. Resfriado leve: dobra a dose e fica em casa."}, {"id": "usp26-25", "banca": "USP-SP", "ano": 2026, "num": 25, "area": "Cirurgia", "tema": "Lesões anais", "e": "Homem, 30 anos de idade, queixa-se de abaulamento anal associado a dor intensa, contínua e sangramento vivo. A sintomatologia piora em todas as suas evacuações e ficou ainda mais intensa há duas semanas. O hábito evacuatório era de uma evacuação ao dia, fezes endurecidas, e passou a ser de uma vez por semana devido a piora da dor Relata ter uma “hemorroida/verruga” (sic), na borda anal, que parece ter aumentado com o tempo. Informa relações sexuais com parceiros do mesmo sexo, sem maiores detalhes. Ao exame físico, observou-se a seguinte lesão: Com base no relato do paciente e no exame físico apresentado, assinale a alternativa que indica o diagnóstico mais provável.", "a": ["Adenocarcinoma.", "Carcinoma espinocelular.", "Condiloma acuminado.", "Hemorroida interna grau IV."], "c": 1, "com": "Lesão vegetante, ulcerada e sangrante na borda anal, em homem que faz sexo com homens, com piora progressiva: carcinoma espinocelular do canal/margem anal, associado ao HPV.", "tab": [["Lesão anal", "Pista"], ["CEC", "Úlcera vegetante, HPV, HSH, HIV"], ["Condiloma", "Verrugas múltiplas, sem úlcera"], ["Hemorroida", "Mamilos vasculares"]], "tut": "Lesão anal que cresce, ulcera e sangra em paciente com risco de HPV: biopsie pensando em carcinoma espinocelular.", "img": ["img/q/usp26-25.jpg"]}, {"id": "usp26-26", "banca": "USP-SP", "ano": 2026, "num": 26, "area": "Cirurgia", "tema": "Pseudo-obstrução cólica", "e": "Mulher, 72 anos de idade, encontra-se no sexto pós-operatório de troca de valva mitral. Desde a operação não evacuou, e há dois dias não elimina gases. Nas últimas 24 horas, evoluiu com distensão e dor abdominal. Tem diabetes melito controlado e antecedente de apendicectomia por incisão de McBurney. Ao exame físico, encontra-se em regular estado geral, descorada, eupneica em ar ambiente; exame torácico com incisão de esternotomia sem sinais de complicação e dreno de mediastino com baixo débito; abdome: distendido, com ruídos diminuídos, timpânico, pouco doloroso à palpação difusa sem sinais de irritação peritoneal. • Exames laboratoriais: Hb: 8,9 g/dL Leucócitos: 10.461/mm3 Cr: 2,5 mg/dL Ur: 72 mg/dL PCR: 79 mg/L (anterior de dois dias atrás de 101 mg/L) K+ : 3,1 mEq/L Na+ : 134 mEq/L Foi realizada tomografia, conforme imagens a seguir: Assinale a alternativa que apresenta o diagnóstico mais provável.", "a": ["Gastroparesia.", "Pseudo-obstrução cólica.", "Obstrução por bridas.", "Isquemia mesentérica."], "c": 1, "com": "Pós-operatório de cirurgia cardíaca com distensão importante do cólon e sem ponto de obstrução mecânica, com hipocalemia: síndrome de Ogilvie (pseudo-obstrução cólica aguda).", "tab": [["Ogilvie", "Pontos-chave"], ["Fatores", "Pós-op, idoso, distúrbios eletrolíticos, opioides"], ["Imagem", "Cólon muito dilatado sem obstrução"], ["Tratamento", "Corrigir eletrólitos, descompressão, neostigmina"]], "tut": "Cólon enorme sem obstrução no pós-operatório: Ogilvie. Corrija o potássio.", "img": ["img/q/usp26-26.jpg"]}, {"id": "usp26-27", "banca": "USP-SP", "ano": 2026, "num": 27, "area": "Cirurgia", "tema": "Trauma abdominal fechado", "e": "Homem, 23 anos de idade, foi vítima de queda da motocicleta há 1 hora. No atendimento pré-hospitalar estava inconsciente, com PA de 110×80 mmHg e FC de 90 bpm. Foi realizada intubação orotraqueal e encaminhamento para centro de trauma. Na admissão, encontrava-se: A: SpO2 de 97%; B: Expansibilidade preservada e ausculta sem alterações; C: PA de120×80 mmHg; FC de 94bpm; FAST positivo no espaço hepatorrenal e esplenorrenal; D: Escala de Coma de Glasgow: 3T (sedado); E: Deformidade na perna direita, sem sangramento. Realizada sondagem vesical com diurese clara. Após o atendimento inicial, foi realizada tomografia de corpo inteiro. Na imagem a seguir, é possível observar a região do abdome com os achados relevantes. Diante da condição clínica do paciente e dos achados no exame de imagem, assinale a alternativa com a provável lesão e a melhor conduta.", "a": ["Mesentério e laparotomia.", "Mesentério e tratamento não operatório.", "Fígado e laparotomia.", "Fígado e tratamento não operatório."], "c": 0, "com": "FAST positivo e tomografia com hemoperitônio e alças com espessamento/irregularidade sugerindo lesão de mesentério. Lesão de mesentério com sangramento e risco de isquemia intestinal pede laparotomia, mesmo com estabilidade.", "tab": [["Lesão", "Conduta típica"], ["Fígado/baço, estável", "Tratamento não operatório"], ["Mesentério/víscera oca", "Laparotomia"], ["Instável com FAST+", "Laparotomia"]], "tut": "Fígado e baço em paciente estável dá para observar. Mesentério e alça, não: opera.", "img": ["img/q/usp26-27.jpg"]}, {"id": "usp26-28", "banca": "USP-SP", "ano": 2026, "num": 28, "area": "Cirurgia", "tema": "Complicações do bypass gástrico", "e": "Mulher, 49 anos de idade, está no primeiro pós-operatório de cirurgia de bypass gástrico para obesidade por videolaparoscopia. Ao exame físico, encontra-se descorada, com FC de 130 bpm, PA de 100×80 mmHg e FR de 23 irpm, SpO2 de 94%; abdome flácido e indolor à palpação, exceto nos locais das punções. Assinale a alternativa que apresenta a principal hipótese diagnóstica.", "a": ["Hérnia interna.", "Atelectasia pulmonar.", "Deiscência da anastomose.", "Sangramento da anastomose."], "c": 3, "com": "No primeiro dia após bypass gástrico, taquicardia, palidez e queda da PA com abdome sem peritonite sugerem sangramento, em geral da linha de grampeamento ou da anastomose. Deiscência costuma aparecer depois, com sinais infecciosos.", "tab": [["Complicação", "Momento típico"], ["Sangramento", "Primeiras 24-48 h"], ["Fístula/deiscência", "3º a 7º dia"], ["Hérnia interna", "Meses a anos"]], "tut": "Taquicardia no primeiro dia depois da bariátrica, com o paciente descorado: pense em sangramento."}, {"id": "usp26-29", "banca": "USP-SP", "ano": 2026, "num": 29, "area": "Pediatria", "tema": "Complicações da esofagocoloplastia", "e": "Lactente, 1 ano de idade, foi submetido à esofagocoloplastia devido a atresia de esôfago. Após 24 horas de cirurgia, apresenta-se gemente, com má perfusão periférica, oligúria e débito vinhoso fétido pela gastrostomia. Ao exame físico, apresenta FC de 190 bpm e PA de 70×40 mmHg. Saturação de oxigênio não aferível. Murmúrios vesiculares reduzidos em bases. Assinale a alternativa que apresenta a complicação mais provável.", "a": ["Deiscência da anastomose.", "Pneumotórax hipertensivo.", "Perfuração de cólon.", "Necrose de cólon."], "c": 3, "com": "Choque, oligúria e débito vinhoso e fétido pela gastrostomia logo após interposição de cólon: necrose do cólon interposto por isquemia do pedículo vascular.", "tab": [["Complicação", "Pista"], ["Necrose do enxerto", "Choque precoce, secreção fétida"], ["Deiscência", "Fístula cervical, dias depois"], ["Estenose", "Disfagia tardia"]], "tut": "Secreção fétida com choque logo após levar o cólon ao tórax: o enxerto necrosou."}, {"id": "usp26-30", "banca": "USP-SP", "ano": 2026, "num": 30, "area": "Cirurgia", "tema": "Câncer colorretal obstrutivo", "e": "Homem, 73 anos de idade, refere alteração do hábito intestinal há 4 meses, com constipação e necessidade progressiva de laxativos. Realizou colonoscopia que evidenciou lesão ulcerada no sigmoide intransponível ao aparelho. Procura o serviço de emergência devido a dor abdominal em cólica, distensão e parada de evacuação há 5 dias. Ao exame físico, encontra-se em regular estado geral, desidratado, abdome pouco distendido, fígado palpável até 4 cm abaixo do rebordo costal direito, doloroso à palpação profunda, sem irritação peritoneal. • Exames laboratoriais: Hb: 10,8 g/dL Ht: 30% Ur: 43 mg/dL Cr: 1,4 mgdL Albumina: 3,3 mg/dL Foi realizada a tomografia, com o resultado apresentado na imagem a seguir: Diante da condição clínica do paciente e dos achados no exame de imagem, assinale a alternativa que apresenta a melhor conduta neste momento.", "a": ["Retossigmoidectomia com linfadenectomia com anastomose.", "Retossigmoidectomia com linfadenectomia sem anastomose.", "Laparotomia exploradora com colostomia em alça.", "Laparotomia exploradora com ileostomia em alça."], "c": 2, "com": "Tumor de sigmoide obstrutivo, com metástases hepáticas extensas e paciente desidratado e desnutrido: a conduta de urgência é aliviar a obstrução com laparotomia e colostomia em alça, sem ressecção oncológica neste momento.", "tab": [["Câncer obstrutivo", "Opção"], ["Paciente estável, sem metástase", "Ressecção (Hartmann ou anastomose)"], ["Doença metastática/condição ruim", "Colostomia derivativa"], ["Alternativa", "Prótese endoscópica"]], "tut": "Tumor que obstrui num paciente com metástase e debilitado: só desvie o trânsito com uma colostomia.", "img": ["img/q/usp26-30.jpg"]}, {"id": "usp26-31", "banca": "USP-SP", "ano": 2026, "num": 31, "area": "Cirurgia", "tema": "Melanoma", "e": "Mulher, 67 anos de idade, notou lesão pigmentada na face anterior da perna esquerda. Foi realizada biópsia excisional que revelou tratar-se de melanoma com Breslow de 4,5 mm e ulceração. Qual é o próximo passo na condução do caso?", "a": ["Ampliação de margens de 1 cm e pesquisa de linfonodo sentinela.", "Ampliação de margens de 2 cm e pesquisa de linfonodo sentinela.", "Ultrassom de região inguinal e ressonância de abdome total.", "Tomografia de tórax, abdome superior e pelve com contraste."], "c": 3, "com": "Melanoma com Breslow de 4,5 mm e ulceração (pT4b) é estádio avançado. Antes da ampliação de margens e do linfonodo sentinela, a banca considerou indicado o estadiamento sistêmico com tomografia de tórax, abdome e pelve.", "tab": [["Breslow", "Margem cirúrgica"], ["In situ", "0,5-1 cm"], ["≤ 1 mm", "1 cm"], ["1-2 mm", "1-2 cm"], ["> 2 mm", "2 cm"]], "tut": "Melanoma espesso e ulcerado tem risco alto de metástase: estadie o corpo antes de operar."}, {"id": "usp26-32", "banca": "USP-SP", "ano": 2026, "num": 32, "area": "Cirurgia", "tema": "Escroto agudo", "e": "Homem, 27 anos de idade, refere dor testicular à direita há cerca de 15 dias, acompanhada de aumento de volume do testículo e disúria leve. Nega trauma. Sem febre ou corrimento uretral. Não tem parceira sexual fixa e usa preservativo ocasionalmente. Foi realizado ultrassom Doppler de escroto que evidenciou testículo direito aumentado, hipoecoico e heterogêneo com aumento difuso da vascularização. Assinale a alternativa que apresenta a melhor conduta.", "a": ["Ciprofloxacino e azitromicina por 5 dias.", "Ceftriaxona dose única e doxiciclina por 10 dias.", "PET-CT com FDG18, βHCG e alfa feto proteína.", "Tomografia de tórax e abdome, βHCG e alfa feto proteína."], "c": 1, "com": "Dor testicular há 15 dias com aumento de volume, disúria e hipervascularização ao Doppler em homem jovem sexualmente ativo: orquiepididimite, provavelmente por IST. O tratamento é ceftriaxona em dose única e doxiciclina por 10 dias.", "tab": [["Orquiepididimite", "Agente / tratamento"], ["< 35 anos, sexualmente ativo", "Gonococo/clamídia: ceftriaxona + doxiciclina"], ["> 35 anos ou sexo anal insertivo", "Enterobactérias: quinolona"], ["Doppler", "Fluxo aumentado"]], "tut": "Testículo inchado com fluxo aumentado no Doppler é infecção. Na torção, o fluxo some."}, {"id": "usp26-33", "banca": "USP-SP", "ano": 2026, "num": 33, "area": "Cirurgia", "tema": "Obstrução intestinal por bridas", "e": "Mulher, 64 anos de idade, procura o serviço de emergência com distensão e dor abdominal em cólica há 24 horas, acompanhada de vômitos em grande quantidade. Nega alteração do hábito intestinal antes do quadro agudo. Tem antecedente de retossigmoidectomia por diverticulite aguda complicada com peritonite. Ao exame físico, encontra-se em bom estado geral, ausculta torácica sem alterações, abdome com ruídos hidroaéreos aumentados, distendido, doloroso à palpação profunda e sem sinais de irritação peritoneal. Assinale a alternativa que apresenta a tomografia esperada para esta paciente.", "a": ["", "", "", ""], "c": 0, "com": "Cirurgia abdominal prévia, cólica, distensão e vômitos volumosos, com ruídos aumentados: obstrução de intestino delgado por bridas. A tomografia esperada mostra alças de delgado dilatadas com nível hidroaéreo e cólon colabado (imagem A).", "tab": [["Obstrução", "Achado"], ["Delgado (bridas)", "Alças centrais dilatadas, cólon vazio"], ["Cólon (volvo, tumor)", "Cólon dilatado"], ["Isquemia", "Parede sem realce, líquido livre"]], "tut": "Cirurgia prévia + vômito + distensão: bridas. Na TC, delgado cheio e cólon vazio.", "aimg": ["img/q/usp26-33-a.jpg", "img/q/usp26-33-b.jpg", "img/q/usp26-33-c.jpg", "img/q/usp26-33-d.jpg"]}, {"id": "usp26-34", "banca": "USP-SP", "ano": 2026, "num": 34, "area": "Cirurgia", "tema": "Antibioticoprofilaxia cirúrgica", "e": "Durante um checklist pré-operatório de retossigmoidectomia para o tratamento de adenocarcinoma de cólon esquerdo, em um paciente de 64 anos de idade com diabetes controlado, o anestesista pergunta ao cirurgião qual é o antibiótico preconizado neste momento. Qual é a melhor opção?", "a": ["Cefoxitina.", "Cefuroxima.", "Cefazolina.", "Ceftriaxona."], "c": 0, "com": "Cirurgias colorretais precisam cobrir germes Gram-negativos e anaeróbios. A cefoxitina faz isso sozinha (alternativa: cefazolina + metronidazol).", "tab": [["Cirurgia", "Profilaxia"], ["Limpa (pele, hérnia)", "Cefazolina"], ["Colorretal", "Cefoxitina ou cefazolina + metronidazol"], ["Momento", "Até 60 min antes da incisão"]], "tut": "Cirurgia de cólon tem anaeróbio: a cefalosporina que cobre é a cefoxitina."}, {"id": "usp26-35", "banca": "USP-SP", "ano": 2026, "num": 35, "area": "Cirurgia", "tema": "Terapia nutricional", "e": "Homem, 59 anos de idade, foi diagnosticado com adenocarcinoma pancreático com indicação de quimioterapia neoadjuvante. Relata perda de 10% do peso corpóreo. O peso ideal é de 70 kg. Não possui comorbidades. Considerando o suporte nutricional para tolerar o tratamento sistêmico e, posteriormente, a operação de grande porte, assinale a alternativa que apresenta as metas calórica e proteica preconizadas.", "a": ["2.000 calorias; 100 gramas de proteína.", "2.000 calorias; 200 gramas de proteína.", "3.000 calorias; 200 gramas de proteína.", "3.000 calorias; 100 gramas de proteína."], "c": 0, "com": "Paciente oncológico com perda de peso: meta de 25 a 30 kcal/kg/dia e 1,5 g/kg/dia de proteína. Com 70 kg, isso dá cerca de 2.000 kcal e 100 g de proteína.", "tab": [["Meta", "Cálculo (70 kg)"], ["Calorias 25-30 kcal/kg", "1.750-2.100 kcal"], ["Proteína 1,5 g/kg", "≈ 105 g"], ["Paciente crítico/cirúrgico", "1,2-2,0 g/kg de proteína"]], "tut": "Conta de padaria: cerca de 30 calorias e 1,5 g de proteína por quilo."}, {"id": "usp26-36", "banca": "USP-SP", "ano": 2026, "num": 36, "area": "Cirurgia", "tema": "Coledocolitíase pós-bypass", "e": "Homem, 45 anos de idade, submetido a gastroplastia em Y de Roux para tratamento de obesidade há 2 anos, com perda de 40 kg. Em exame de rotina, foi feito o diagnóstico de colelitíase e coledocolitíase. Assinale a alternativa que apresenta a melhor sequência de tratamento.", "a": ["Colecistectomia e colangiografia transparietohepática.", "Colecistectomia e exploração cirúrgica do colédoco.", "Colangiografia endoscópica e colecistectomia laparoscópica.", "Litotripsia extracorpórea e colecistectomia."], "c": 1, "com": "Após gastroplastia em Y de Roux, a CPRE convencional não alcança a papila. O tratamento é colecistectomia com exploração cirúrgica do colédoco.", "tab": [["Coledocolitíase", "Conduta"], ["Anatomia normal", "CPRE + colecistectomia"], ["Pós-bypass em Y de Roux", "Exploração cirúrgica do colédoco"], ["Alternativa", "CPRE assistida por laparoscopia"]], "tut": "Depois do bypass, o endoscópio não chega na papila. A pedra sai pela cirurgia."}, {"id": "usp26-37", "banca": "USP-SP", "ano": 2026, "num": 37, "area": "Cirurgia", "tema": "Diverticulite complicada", "e": "Homem, 65 anos de idade, procura o serviço de emergência com dor em fossa ilíaca esquerda há 6 dias, associada a constipação, náuseas e hiporexia. Nega febre. Ao exame físico, apresenta-se em bom estado geral, FC de 80 bpm, PA de 130×80 mmHg, com dor à palpação profunda em fossa ilíaca esquerda, sem sinais de irritação peritoneal. Exames laboratoriais apresentaram 15.000/mm3 leucócitos e PCR de 180 mg/L. Foi realizada uma tomografia contrastada de abdome, que evidenciou divertículos em cólon descendente e sigmoide com densificação da gordura mesentérica e presença de abscesso pericólico de 2 cm de diâmetro com focos gasosos de permeio. Assinale a alternativa que apresenta a melhor conduta neste momento.", "a": ["Antibioticoterapia.", "Colostomia em alça.", "Retossigmoidectomia.", "Drenagem percutânea."], "c": 0, "com": "Diverticulite com abscesso pericólico pequeno (2 cm), estável: tratamento clínico com antibiótico. A drenagem percutânea é para abscessos maiores (acima de 3-4 cm).", "tab": [["Classificação de Hinchey", "Conduta"], ["I: abscesso < 3-4 cm", "Antibiótico"], ["I-II: abscesso > 4 cm", "Drenagem percutânea"], ["III-IV: peritonite", "Cirurgia"]], "tut": "Abscesso pequeno na diverticulite trata com antibiótico. Grande, drena; peritonite, opera."}, {"id": "usp26-38", "banca": "USP-SP", "ano": 2026, "num": 38, "area": "Cirurgia", "tema": "Lesão de Morel-Lavallée", "e": "Homem, 28 anos de idade, vítima de atropelamento com trauma do membro inferior esquerdo. Após 7 dias de internação, observa-se lesão no membro acometido, sem solução de continuidade com meio externo. Ao exame físico, a escara cutânea está descolada da profundidade e apresenta grande hematoma subcutâneo, sem perfusão cutânea adequada, conforme imagem a seguir: Assinale a alternativa que apresenta o provável diagnóstico e a conduta cirúrgica mais adequada.", "a": ["Fasceite necrotizante; Punção diagnóstica para colheita de material para cultura, curativo oclusivo simples.", "Fasceite necrotizante; Incisão, drenagem de hematoma, colheita de material para cultura e instalação de curativo por pressão negativa.", "Ferimento descolante oculto; Ressecção da pele desvitalizada, limpeza cirúrgica e realização de curativo por pressão negativa.", "Ferimento descolante oculto; Ressecção e enxertamento da pele descolada, enxertia da pele emagrecida sobre o leito cruento."], "c": 2, "com": "Trauma por atropelamento com descolamento da pele e subcutâneo da fáscia (ferimento descolante oculto), hematoma e necrose cutânea. A conduta é ressecar a pele desvitalizada, limpar o leito e usar curativo por pressão negativa.", "tab": [["Ferimento descolante", "Conduta"], ["Pele viável", "Drenagem/compressão"], ["Pele necrótica", "Desbridamento + pressão negativa"], ["Depois", "Enxerto quando o leito estiver bom"]], "tut": "Pele que 'soltou' do músculo e necrosou: desbride e use pressão negativa.", "img": ["img/q/usp26-38.jpg"]}, {"id": "usp26-39", "banca": "USP-SP", "ano": 2026, "num": 39, "area": "Clínica Médica", "tema": "Lombalgia", "e": "Mulher, 40 anos de idade, procura o serviço de emergência com dor lombar há 3 dias e aumento da intensidade nas últimas 12h. No momento relata dor 10 em 10 e incapacidade de trabalhar. Relata múltiplos episódios prévios semelhantes em momentos de aumento da carga de trabalho. Tem obesidade (IMC de 41 kg/m2), insônia e tabagismo de 20 anos-maço. Faz uso de benzodiazepínico para dormir. Nega outras comorbidades. Ao exame físico, após analgesia, apresenta dor localizada na região lombar, com irradiação para o membro inferior direito, força motora e sensibilidade dos membros inferiores sem alterações. Qual das características apresentadas pela paciente representa fator de risco para cronificação do episódio de dor lombar?", "a": ["Dor intensa gerando incapacidade funcional.", "Índice de massa corpórea maior que 35 kg/m2.", "Tabagismo com elevada carga tabágica.", "Insônia com uso de benzodiazepínico."], "c": 0, "com": "Entre os fatores de risco para cronificação da dor lombar estão dor intensa com incapacidade funcional no início, fatores psicossociais e catastrofização.", "tab": [["Fator de cronificação", "Exemplo"], ["Intensidade/incapacidade", "Dor 10/10, afastamento"], ["Psicossociais", "Medo, depressão, insatisfação no trabalho"], ["Episódios prévios", "Recorrência"]], "tut": "Dor que já começa incapacitante é a que mais tende a virar crônica."}, {"id": "usp26-40", "banca": "USP-SP", "ano": 2026, "num": 40, "area": "Cirurgia", "tema": "Abdome agudo perfurativo", "e": "Mulher, 66 anos de idade, apresentou dor abdominal de início súbito e forte intensidade há 4 horas. Tem diabetes melito e tabagismo de 1 maço de cigarro por dia. Ao exame físico, encontra-se em regular estado geral, com FC de 100 bpm e PA de 100×70 mmHg, abdome tenso, doloroso difusamente à palpação, inclusive à percussão. • Exames laboratoriais: Hb: 14,9 g/dL Ht: 41% Leucócitos: 16.126/mm3 PCR: 12 mg/L Amilase: 281 U/L Lipase: 100 U/L Foi realizada a tomografia apresentada nas imagens a seguir: Assinale a alternativa que representa o achado operatório esperado nesta paciente.", "a": ["", "", "", ""], "c": 1, "com": "Dor súbita e intensa, abdome tenso e difusamente doloroso em tabagista, com tomografia mostrando pneumoperitônio: úlcera péptica perfurada. A imagem B mostra a perfuração na parede anterior do estômago/duodeno.", "tab": [["Abdome agudo", "Pista"], ["Perfurativo", "Dor súbita, pneumoperitônio"], ["Isquêmico", "Dor desproporcional ao exame"], ["Obstrutivo", "Distensão, vômitos"]], "tut": "Dor que começa como uma facada e ar livre na barriga: úlcera perfurada.", "aimg": ["img/q/usp26-40-a.jpg", "img/q/usp26-40-b.jpg", "img/q/usp26-40-c.jpg", "img/q/usp26-40-d.jpg"]}, {"id": "usp26-41", "banca": "USP-SP", "ano": 2026, "num": 41, "area": "Cirurgia", "tema": "Colangiografia intraoperatória", "e": "Durante colecistectomia pós pancreatite aguda leve, foi optado pela realização de colangiografia intraoperatória. A imagem do campo operatório pode ser observada a seguir: Em qual das estruturas, destacadas pelas setas e numeradas de 1 a 4, deve ser introduzido o cateter da colangiografia?", "a": ["1.", "2.", "3.", "4."], "c": 2, "com": "Na colangiografia intraoperatória, o cateter é introduzido no ducto cístico, após uma pequena incisão. A banca indicou a estrutura 3 como o ducto cístico.", "tab": [["Estrutura", "No triângulo de Calot"], ["Ducto cístico", "Via de acesso da colangiografia"], ["Artéria cística", "Clipada e seccionada"], ["Colédoco", "Não deve ser incisado"]], "tut": "O cateter da colangiografia entra pelo cístico, nunca pelo colédoco.", "img": ["img/q/usp26-41.jpg"]}, {"id": "usp26-42", "banca": "USP-SP", "ano": 2026, "num": 42, "area": "Cirurgia", "tema": "Pós-operatório de colecistectomia", "e": "Mulher, 59 anos de idade, foi submetida a colecistectomia laparoscópica devido a colecistite aguda há 1 dia. Na operação não foi realizada colangiografia intraoperatória e não houve colocação de dreno abdominal. Desde o pós-operatório imediato, apresentou vômitos de repetição sem aceitação da dieta e dor abdominal em tratamento com dipirona e tramadol. Ao exame físico, encontra-se em bom estado geral, eupneica, com FC de 95 bpm, PA de 120×70 mmHg, abdome doloroso à palpação profunda, sem sinais de irritação peritoneal. • Exames laboratoriais: Hb: 12 g/dL Leucócitos: 13.412/mm3 PCR: 90 mg/L Bilirrubina total: 1,1 /dL FA: 91 U/L GGT: 110 U/L Amilase: 100 U/L Lipase: 98 U/L Assinale a alternativa que apresenta a melhor conduta nesse momento.", "a": ["Suspender tramadol e passar sonda nasogástrica.", "Suspender tramadol e administrar ondansetrona.", "Realizar tomografia de abdome.", "Realizar colangiorressonância."], "c": 1, "com": "Vômitos no primeiro dia de pós-operatório, com exames sem sinais de complicação biliar ou pancreática, em uso de tramadol: provável efeito adverso do opioide. A conduta é suspender o tramadol e usar antiemético (ondansetrona).", "tab": [["Vômito no pós-operatório", "Pensar em"], ["Opioide (tramadol)", "Efeito adverso comum"], ["Alteração biliar", "Bilirrubina/enzimas canaliculares altas"], ["Íleo/obstrução", "Distensão, parada de eliminações"]], "tut": "Vomitando no dia seguinte da cirurgia com exames normais e tramadol na prescrição: tira o tramadol."}, {"id": "usp26-43", "banca": "USP-SP", "ano": 2026, "num": 43, "area": "Cirurgia", "tema": "Coledocolitíase", "e": "Mulher, 39 anos de idade, refere cólica em epigástrio e hipocôndrio direito com irradiação para dorso há 2 dias, que melhora com o uso de analgésicos e antiespasmódicos. Nega febre. Sem comorbidades. Ao exame físico, apresenta bom estado geral, corada, hidratada, ictérica +/++++, afebril; abdome distendido, flácido, doloroso em epigástrio e hipocôndrio direito sem sinais de peritonite. • Exames laboratoriais: Hb: 11,5 g/dL Leucócitos: 9.500/mm3 TGO/AST: 230 U/L TGP/ALT: 310 U/L FA: 430 U/l GGT: 352 U/L Amilase: 110 U/L Lipase: 72 U/L Bilirrubina total: 4,5 mg/dL PCR: 8 mg/L Com base no caso clínico descrito, assinale a alternativa que apresenta a principal hipótese diagnóstica.", "a": ["Cólica biliar.", "Colangite.", "Coledocolitíase.", "Colecistite aguda."], "c": 2, "com": "Cólica biliar com icterícia e padrão colestático (FA, GGT e bilirrubina altas), sem febre nem leucocitose: coledocolitíase sem colangite.", "tab": [["Quadro", "Diferença"], ["Cólica biliar", "Dor sem icterícia, exames normais"], ["Coledocolitíase", "Icterícia + colestase"], ["Colangite", "Febre + icterícia + dor (Charcot)"]], "tut": "Dor de vesícula com olho amarelo e sem febre: pedra no colédoco. Com febre, vira colangite."}, {"id": "usp26-44", "banca": "USP-SP", "ano": 2026, "num": 44, "area": "Cirurgia", "tema": "Retirada de dreno torácico", "e": "Mulher, 25 anos de idade, foi vítima de ferimento por arma branca em 2º espaço intercostal à direita há 5 dias. Na ocasião, foi submetida a drenagem de hemopneumotórax com dreno tubular multiperfurado 28 Fr. Evoluiu bem com débito seroso de 40 mL/dia e sem borbulhar à inspiração profunda. A imagem obtida na radiografia de tórax pode ser observada a seguir: Assinale a alternativa que apresenta a conduta correta neste momento.", "a": ["Manter o dreno em aspiração contínua.", "Manter o dreno e fisioterapia respiratória.", "Retirar o dreno com manobra de Valsalva.", "Retirar o dreno durante a inspiração."], "c": 2, "com": "Dreno com baixo débito seroso (menos de 100-200 mL/dia), sem escape aéreo e pulmão expandido na radiografia: pode ser retirado, com manobra de Valsalva (ou expiração forçada) para evitar a entrada de ar.", "tab": [["Retirar dreno", "Critério"], ["Débito", "< 100-200 mL/24 h"], ["Escape aéreo", "Ausente"], ["Técnica", "Valsalva ou fim da expiração"]], "tut": "Dreno sem borbulha e pouco débito: tire pedindo Valsalva.", "img": ["img/q/usp26-44.jpg"]}, {"id": "usp26-45", "banca": "USP-SP", "ano": 2026, "num": 45, "area": "Cirurgia", "tema": "Trauma pelo cinto de segurança", "e": "Mulher, 65 anos de idade, foi vítima de colisão de carro em alta velocidade contra anteparo fixo. Estava no banco traseiro do veículo com cinto de segurança. Na admissão no serviço de emergência encontrava-se: A: Intubada em ventilação mecânica; B: Murmúrios vesiculares simétricos; C: PA de 140×90 mmHg e FC de 120 bpm; D: Escala de coma de Glasgow 3T; E: Marca do cinto de segurança em parede abdominal. Diurese clara. Realizado o FAST, apresentado na imagem a seguir: Com base no caso descrito e no achado observado no FAST, assinale a alternativa que apresenta a lesão mais frequentemente associada a esse mecanismo de trauma.", "a": ["Lesão intestinal.", "Lesão pancreática.", "Fratura de bacia.", "Rotura da parede abdominal."], "c": 0, "com": "Marca do cinto na parede abdominal com líquido livre no FAST sugere lesão de víscera oca. A lesão mais associada ao cinto é a intestinal (delgado e mesentério), às vezes com fratura de Chance.", "tab": [["Sinal do cinto", "Lesões associadas"], ["Abdome", "Delgado e mesentério"], ["Coluna", "Fratura de Chance (lombar)"], ["Pâncreas/duodeno", "Trauma epigástrico direto"]], "tut": "Marca de cinto na barriga: procure lesão de alça intestinal.", "img": ["img/q/usp26-45.jpg"]}, {"id": "usp26-46", "banca": "USP-SP", "ano": 2026, "num": 46, "area": "Cirurgia", "tema": "Hérnia de hiato", "e": "Mulher, 65 anos de idade, refere empachamento pós-prandial eventual. Nega epigastralgia, pirose, regurgitação, disfagia, dor torácica ou náuseas. Ao exame físico, encontra-se em bom estado geral, com IMC de 32 kg/m2; abdome flácido e indolor. Foi submetida a endoscopia digestiva alta que identificou hérnia hiatal volumosa, com mucosa esofágica sem alterações e pangastrite enantematosa leve. Na sequência, realizou exame de radiografia contrastado do esôfago que confirmou hérnia hiatal tipo III. Foi iniciado tratamento com omeprazol e domperidona, com resolução do sintoma. Assinale a alternativa que apresenta a melhor conduta para esta paciente.", "a": ["Manometria e pH-metria esofágica para definição do diagnóstico e tratamento.", "Cirurgia para correção da hérnia de hiato com hiatoplastia e fundoplicatura.", "Cirurgia com correção da hérnia de hiato com hiatoplastia e bypass gástrico.", "Seguimento ambulatorial sem indicação de cirurgia no momento."], "c": 3, "com": "Hérnia hiatal tipo III com sintoma leve que respondeu ao tratamento clínico, sem complicações: seguimento ambulatorial, sem cirurgia no momento.", "tab": [["Hérnia de hiato", "Conduta"], ["Tipo I com DRGE controlada", "Clínico"], ["Para-esofágica sintomática/complicada", "Cirurgia"], ["Assintomática ou controlada", "Acompanhar"]], "tut": "Hérnia grande que não incomoda e melhorou com remédio: acompanhe."}, {"id": "usp26-47", "banca": "USP-SP", "ano": 2026, "num": 47, "area": "Cirurgia", "tema": "Ingestão de cáustico", "e": "Homem, 58 anos de idade, é trazido ao pronto-socorro com história de ingestão de soda cáustica. Foi realizada passagem de sonda nasoenteral. No segundo dia de internação, estava sem queixas e solicitou continuidade de recuperação domiciliar, pois sua esposa é enfermeira. O paciente apresenta postura reservada, solícito, fala pouco e diz não se conformar por ter ingerido por engano a soda cáustica que estava em uma garrafa igual à que usam para água. Quando o médico sugere uma consulta psiquiátrica, o paciente pede o favor de não chamar um psiquiatra, temendo o estigma, e acrescenta que tomará mais cuidado. Com base neste caso, assinale a alternativa que apresenta a conduta mais adequada.", "a": ["Dar a alta se ele assinar o termo de responsabilidade por alta a pedido, respeitando a autonomia do doente.", "Dar a alta considerando que a esposa é capaz de dar continuidade ao cuidado.", "Não dar a alta e avaliar com familiares a circunstância do evento para dar continuidade ao cuidado.", "Não dar a alta e pedir avaliação psiquiátrica, omitindo a especialidade do médico avaliador."], "c": 2, "com": "A ingestão de soda cáustica pode ter sido tentativa de suicídio, mesmo que o paciente negue. Não se deve dar alta antes de avaliar as circunstâncias com familiares e garantir a continuidade do cuidado.", "tab": [["Ingestão de cáustico", "Ponto-chave"], ["Avaliar intenção", "Sempre considerar tentativa de suicídio"], ["Alta", "Só após avaliação de risco"], ["Ética", "Não omitir a especialidade do avaliador"]], "tut": "Engoliu soda cáustica 'sem querer'? Antes da alta, investigue se foi tentativa de suicídio."}, {"id": "usp26-48", "banca": "USP-SP", "ano": 2026, "num": 48, "area": "Cirurgia", "tema": "Fratura com lesão vascular", "e": "Homem, 28 anos de idade, foi vítima de queda de motocicleta. Na admissão intra-hospitalar, está consciente e estável hemodinamicamente. Ao exame físico, tem deformidade da coxa esquerda, com ausência de pulso distal, diminuição da temperatura e palidez. Relata intensa dor no membro inferior esquerdo. O exame radiológico pode ser observado na imagem a seguir: Assinale a alternativa que apresenta a melhor sequência de tratamento.", "a": ["Revascularização do membro seguida de fixação cirúrgica da fratura.", "Redução da fratura com tala seguida de revascularização do membro.", "Embolectomia com cateter de Fogarty seguida de fixação cirúrgica da fratura.", "Fixação cirúrgica da fratura seguida de revascularização do membro."], "c": 3, "com": "Fratura de fêmur com isquemia do membro em paciente estável. A banca indicou primeiro estabilizar a fratura e depois revascularizar, para não romper a anastomose vascular durante a manipulação. Em muitos serviços usa-se shunt temporário quando a isquemia é longa.", "tab": [["Fratura + isquemia", "Sequência"], ["Isquemia curta", "Fixação e depois reparo vascular"], ["Isquemia prolongada", "Shunt, fixação, reparo"], ["Fasciotomia", "Considerar após revascularização"]], "tut": "Osso quebrado e pulso ausente: estabilize o osso e depois arrume a artéria (ou use shunt).", "img": ["img/q/usp26-48.jpg"]}, {"id": "usp26-49", "banca": "USP-SP", "ano": 2026, "num": 49, "area": "Pediatria", "tema": "Reanimação do lactente", "e": "Texto para as questões de 49 a 51 Criança, sexo masculino, 1 mês de vida, previamente hígida, é trazida à unidade de emergência após cair do trocador, há cerca de 30 minutos. Segundo a mãe, ela havia tirado a mão dele por alguns segundos para jogar a fralda no lixo e ele teria rolado e caído do trocador. Na admissão, o paciente estava inconsciente, sendo levado à sala de emergência. A seguir, os dados da avaliação sistematizada: A: pérvia B: murmúrio vesicular e expansibilidade diminuídos, FR de 8 irpm, SpO2 de 89% em ar ambiente; C: tempo de enchimento capilar < 1 segundo, pulsos presentes e simétricos, ausculta com 2BRNF sem sopros, PA de 108×70 mmHg; D: escala de coma de Glasgow 7, pupilas isofotorreagentes; E: hematoma subgaleal em região temporal direita. Assinale a alternativa que ilustra, corretamente, o suporte respiratório que deve ser prontamente instituído.", "a": ["", "", "", ""], "c": 3, "com": "Lactente inconsciente com bradipneia (FR 8) e hipoxemia: precisa de ventilação com pressão positiva com bolsa-válvula-máscara (imagem D). Cateter nasal ou máscara sem pressão não ventilam quem não respira.", "tab": [["Situação", "Suporte"], ["Respira bem, hipoxêmico", "Oxigênio (cateter/máscara)"], ["Bradipneia/apneia", "Ventilação com bolsa-válvula-máscara"], ["Falha", "Via aérea avançada"]], "tut": "Quem respira pouco precisa que você respire por ele: ambu com máscara.", "aimg": ["img/q/usp26-49-a.jpg", "img/q/usp26-49-b.jpg", "img/q/usp26-49-c.jpg", "img/q/usp26-49-d.jpg"]}, {"id": "usp26-50", "banca": "USP-SP", "ano": 2026, "num": 50, "area": "Pediatria", "tema": "Maus-tratos", "e": "Texto para as questões de 49 a 51 Criança, sexo masculino, 1 mês de vida, previamente hígida, é trazida à unidade de emergência após cair do trocador, há cerca de 30 minutos. Segundo a mãe, ela havia tirado a mão dele por alguns segundos para jogar a fralda no lixo e ele teria rolado e caído do trocador. Na admissão, o paciente estava inconsciente, sendo levado à sala de emergência. A seguir, os dados da avaliação sistematizada: A: pérvia B: murmúrio vesicular e expansibilidade diminuídos, FR de 8 irpm, SpO2 de 89% em ar ambiente; C: tempo de enchimento capilar < 1 segundo, pulsos presentes e simétricos, ausculta com 2BRNF sem sopros, PA de 108×70 mmHg; D: escala de coma de Glasgow 7, pupilas isofotorreagentes; E: hematoma subgaleal em região temporal direita. Foi realizada tomografia de crânio, conforme imagem demonstrada a seguir: Após medidas de estabilização, o caso foi notificado ao serviço social. Com relação a essa decisão da equipe médica, pode-se afirmar:", "a": ["Foi indicada porque a tomografia não é compatível com o trauma reportado.", "Foi motivada pela presença de hematoma em localização incomum nos traumas pediátricos.", "É justificada porque o mecanismo de trauma é incompatível com a faixa etária.", "Não havia indicação, pois não há incongruências nas circunstâncias do trauma."], "c": 2, "com": "Lactente de 1 mês não rola sozinho; a queda do trocador relatada não combina com a idade. Um mecanismo incompatível com o desenvolvimento neuropsicomotor é sinal de alerta para maus-tratos e justifica a notificação.", "tab": [["Sinal de alerta para maus-tratos", "Exemplo"], ["Mecanismo incompatível com a idade", "Bebê de 1 mês 'rolou'"], ["História inconsistente", "Muda a cada relato"], ["Lesões graves", "Hematoma subdural, fraturas"]], "tut": "Bebê de 1 mês não rola. Se a história não fecha com a idade, notifique.", "img": ["img/q/usp26-50.jpg"]}, {"id": "usp26-51", "banca": "USP-SP", "ano": 2026, "num": 51, "area": "Pediatria", "tema": "Trauma craniano grave", "e": "Texto para as questões de 49 a 51 Criança, sexo masculino, 1 mês de vida, previamente hígida, é trazida à unidade de emergência após cair do trocador, há cerca de 30 minutos. Segundo a mãe, ela havia tirado a mão dele por alguns segundos para jogar a fralda no lixo e ele teria rolado e caído do trocador. Na admissão, o paciente estava inconsciente, sendo levado à sala de emergência. A seguir, os dados da avaliação sistematizada: A: pérvia B: murmúrio vesicular e expansibilidade diminuídos, FR de 8 irpm, SpO2 de 89% em ar ambiente; C: tempo de enchimento capilar < 1 segundo, pulsos presentes e simétricos, ausculta com 2BRNF sem sopros, PA de 108×70 mmHg; D: escala de coma de Glasgow 7, pupilas isofotorreagentes; E: hematoma subgaleal em região temporal direita. Com relação aos exames séricos coletados durante o atendimento inicial do paciente, assinale a alternativa que apresenta as alterações laboratoriais esperadas.", "a": ["pH 7,28; paO2 58 mmHg; pCO2 55 mmHg; HCO3- 24 mmol/L; SpO2 89%", "Hb 5,0 g/dL; Ht 18%; leucócitos 12.000/mm³; plaquetas 310.000/µL", "Relação TTPA 2,5; RNI do TP 1,1; atividade do TP 76%", "Lactato arterial 55 mg/dL; ureia 60 mg/dL; creatinina 0,7 mg/dL"], "c": 0, "com": "Lactente com rebaixamento e bradipneia (FR 8): hipoventilação central causa acidose respiratória com hipoxemia (pH baixo, pCO2 alta e bicarbonato normal, quadro agudo).", "tab": [["Distúrbio", "Gasometria"], ["Acidose respiratória aguda", "pH ↓, pCO2 ↑, HCO3 normal"], ["Acidose metabólica", "pH ↓, HCO3 ↓"], ["Compensação crônica", "HCO3 sobe em dias"]], "tut": "Respira pouco, segura CO2: acidose respiratória com bicarbonato ainda normal."}, {"id": "usp26-52", "banca": "USP-SP", "ano": 2026, "num": 52, "area": "Pediatria", "tema": "Crescimento do prematuro", "e": "Prematura com idade gestacional ao nascer de 32 semanas, sexo feminino, peso ao nascer de 1.300 g, adequado para idade gestacional, Z-score -1 (Intergrowth-21). Passou em consulta de retorno com a idade cronológica de 56 dias de vida, com peso de 2.800 g, em aleitamento materno exclusivo. Os gráficos a seguir são disponibilizados na caderneta da criança pelo Ministério da Saúde. Os pais estão curiosos em saber se o ganho de peso de sua filha está dentro do esperado. Com base nas informações apresentadas, pode-se afirmar que o ganho de peso", "a": ["é insuficiente, devendo-se iniciar complemento com fórmula láctea e coletar perfil de ferro.", "é insuficiente, devendo-se iniciar complemento com fórmula láctea após o seio e reavaliar em 1 semana.", "está adequado, devendo-se manter o aleitamento exclusivo e realizar seguimento pediátrico mensal.", "está adequado, mas abaixo do esperado para idade, devendo-se complementar para acelerar a recuperação nutricional."], "c": 2, "com": "Prematura de 32 semanas com 56 dias de vida está com cerca de 40 semanas de idade corrigida. No gráfico Intergrowth, 2.800 g nessa idade fica entre a mediana e -1 DP, mantendo seu canal de crescimento. O ganho está adequado: mantém aleitamento exclusivo e seguimento mensal.", "tab": [["Prematuro", "Regra"], ["Idade corrigida", "Usar até 2-3 anos"], ["Até 64 semanas", "Curva Intergrowth"], ["Depois", "Curva da OMS com idade corrigida"]], "tut": "No prematuro, calcule a idade corrigida antes de olhar a curva.", "img": ["img/q/usp26-52.jpg"]}, {"id": "usp26-53", "banca": "USP-SP", "ano": 2026, "num": 53, "area": "Pediatria", "tema": "Choque séptico na criança", "e": "Criança, sexo masculino, 7 anos de idade, portadora de refluxo vesicoureteral bilateral, retornou hoje ao hospital por febre de até 38,8 °C. No exame físico inicial, o paciente está letárgico e sonolento, apresenta FC de 140 bpm, FR de 26 irpm, PA de 90×40 mmHg, SpO2 de 96% em ar ambiente, ausculta pulmonar e cardíaca normais, fígado no rebordo costal direito, perfusão com retorno rápido (< 1 segundo), pulsos amplos, escore de coma de Glasgow 14, pupilas isofotorreagentes. Temperatura atual de 37,2 °C, após uma hora do antitérmico administrado em casa. O paciente recebeu alta há dois dias do hospital, onde esteve internado em leito de terapia intensiva pediátrico devido a quadro de infecção do trato urinário grave por Escherichia coli sensível aos antibióticos testados. Durante internação, ficou com sonda vesical de demora e cateter venoso central, retirado no dia da alta, sem sinais flogísticos no exame físico de hoje. Considerando o
