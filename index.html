<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedRise — Preparatório Residência</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#06343F">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MedRise">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06343F; --ink2:#33514F; --mute:#5E7775; --teal:#0FA3A3; --teal-d:#0B7F7F; --mint:#5EF2C8;
  --bg:#EDF5F4; --card:#FFFFFF; --line:#D6E5E3; --ok:#12805C; --ok-bg:#E3F6EE; --bad:#B4232C; --bad-bg:#FBE9EA;
  --warn:#8A5A00; --warn-bg:#FFF4D6; --r:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal-d)}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0;letter-spacing:-0.02em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:248px;flex:none;background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;padding:4px 8px 18px}.logo-full{display:block;width:auto}
.brand b{font-family:Sora;font-size:22px;font-weight:800;letter-spacing:-0.04em}
.brand b span{color:var(--mint)}
.brand small{display:block;font-size:9.5px;letter-spacing:.22em;opacity:.75;font-weight:600}
.nav-sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;padding:14px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#DDEDEB;text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(94,242,200,.14);color:#fff}
.nav a.on svg{color:var(--mint)}
.nav svg{width:18px;height:18px;flex:none}
.nav .pill{margin-left:auto;background:var(--mint);color:var(--ink);font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1240px}
.topbar{display:none}
.stw{margin:0 0 6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 12px 10px}
.stw .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;font-weight:600}
.stw .clk{font-family:Sora;font-weight:800;font-size:28px;color:#fff;margin:2px 0 4px;letter-spacing:.02em}
.stw .st{font-size:12px;opacity:.8;display:flex;align-items:center;gap:7px;line-height:1.3}
.st-dot{width:8px;height:8px;border-radius:50%;background:#7C9592;flex:none}.st-dot.on{background:var(--mint);box-shadow:0 0 0 3px rgba(94,242,200,.22)}
.stw button{margin-top:10px;width:100%;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.stw button:hover{background:rgba(255,255,255,.08)}
.topbar .tb-clk{width:auto;height:auto;display:flex;align-items:center;gap:7px;font-family:Sora;font-weight:700;font-size:15px;color:#fff;background:rgba(255,255,255,.08);border:0;border-radius:99px;padding:6px 12px;cursor:pointer}
.vesp-it{border-left:4px solid var(--teal);padding:10px 14px;margin:10px 0;background:#F6FBFA;border-radius:0 12px 12px 0}
.vesp-it b{display:block;margin-bottom:2px}.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{border:0;background:#fff;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.grade{display:flex;gap:14px;align-items:center;border-radius:14px;padding:14px;margin:8px 0 10px;background:#F3F9F8}.grade .n{font-family:Sora;font-weight:800;font-size:30px;min-width:64px;text-align:center}
.chance{font-family:Sora;font-weight:800;font-size:26px}
.tt{width:100%;border-collapse:collapse;font-size:14px}.tt td,.tt th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.tt th{font-size:12px;color:var(--ink2);font-weight:600}
.tbar{height:10px;border-radius:99px;background:#E5EFEE;min-width:90px;overflow:hidden}.tbar i{display:block;height:100%;border-radius:99px}
.st-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 6px}.st-kpis div{background:#F3F9F8;border-radius:12px;padding:12px}.st-kpis b{font-family:Sora;font-size:20px;display:block}.st-kpis span{font-size:12px;color:var(--ink2)}
@media(max-width:700px){.st-kpis{grid-template-columns:repeat(2,1fr)}}
/* generic */
.row{display:flex;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.pad-s{padding:14px}
.sub{color:var(--mute);font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#E1F1EF;color:var(--teal-d)}
.tag.gray{background:#EEF2F2;color:var(--ink2)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff;text-decoration:none;min-height:44px}
.btn:hover{background:var(--teal-d)}
.btn.dark{background:var(--ink)} .btn.dark:hover{background:#0A4A57}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#F2F8F7}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
select,input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:80px;resize:vertical}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:Sora;font-size:28px;font-weight:800;letter-spacing:-0.03em}
.kpi .l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#E1F1EF;color:var(--teal-d);margin-bottom:8px}
.kpi .ic svg{width:18px;height:18px}
.bar-h{height:10px;border-radius:99px;background:#E5EFEE;overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--teal);border-radius:99px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid #EAF2F1;vertical-align:top}
.tbl-wrap{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r);background:#FAFDFC}
.note{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 12px}
.hero{background:linear-gradient(120deg,#06343F 0%,#0A5560 100%);color:#fff;border:0}
.hero .sub{color:#BFE3DE}
.count{font-family:Sora;font-size:44px;font-weight:800;color:var(--mint);line-height:1}
/* question */
.q-enun{font-size:16px;line-height:1.6;margin:10px 0 16px}
.q-figs{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
.q-figs img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:zoom-in;align-self:flex-start}
.alt-img{display:block;max-width:100%;max-height:240px;border-radius:8px;border:1px solid var(--line);background:#fff}
.zoom-btn{display:inline-block;font-size:12px;color:var(--teal,#0FA3A3);margin-top:6px;text-decoration:underline;cursor:zoom-in}
#zoom{position:fixed;inset:0;background:rgba(6,20,26,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:44px}
.alt:hover{border-color:var(--teal)}
.alt .lt{flex:none;width:26px;height:26px;border-radius:99px;border:1.5px solid #9DB9B6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.alt.sel{border-color:var(--teal);background:#EFFAF8}
.alt.sel .lt{background:var(--teal);border-color:var(--teal);color:#fff}
.alt.right{border-color:var(--ok);background:var(--ok-bg)}
.alt.right .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.alt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.alt.cut{opacity:.45;text-decoration:line-through}
.coment{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.resumo{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.resumo table{width:100%;border-collapse:collapse;font-size:14px}
.resumo th{background:#E8F4F2;text-align:left;padding:8px 12px;font-size:13px}
.resumo td{padding:8px 12px;border-top:1px solid #E5EFEE;vertical-align:top}
.tutor{background:#F1FBF8;border:1px solid #BDEBDD;border-radius:12px;padding:14px;margin-top:12px}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.qnav button{height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:13px}
.qnav button.done{background:#E1F1EF;border-color:#A9D8D3}.qnav button.flag{box-shadow:inset 0 -4px 0 #E0A100}.btn.on{background:#FFF4D6;border-color:#E0A100;color:#7A5400}.mot{margin:12px 0 2px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:#FAFCFC}.mot .chip{min-height:34px;padding:6px 12px;font-size:13px}.pista{background:#FFFBEF;border:1px solid #F1D58A;border-radius:12px;padding:12px 14px;margin-top:12px}.pista ol{margin:8px 0 0;padding-left:20px}.pista li{margin:4px 0}
.qnav button.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
.timer{font-family:Sora;font-weight:800;font-size:22px}
/* dossie */
.doss{max-width:780px}
.doss h2{margin:28px 0 10px}
.doss p,.doss li{line-height:1.7}
.doss .box{border-left:0;background:#F4FAF9;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
mark.h1{background:#FFF0A8} mark.h2{background:#C8F4E4} mark.h3{background:#FFD3DA}
mark{border-radius:3px;padding:0 1px}
.hl-bar{position:fixed;z-index:20;display:none;gap:6px;background:var(--ink);padding:6px;border-radius:10px;box-shadow:0 6px 20px rgba(6,52,63,.25)}
.hl-bar button{width:32px;height:32px;border-radius:8px;border:2px solid rgba(255,255,255,.4);cursor:pointer}
.hl-bar .nt{width:auto;padding:0 10px;color:#fff;background:transparent;font-size:13px;font-weight:600}
.toc a{display:block;padding:6px 0;text-decoration:none;font-size:14px;color:var(--ink2)}
.toc a:hover{color:var(--teal-d)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:Inter,sans-serif;fill:var(--mute);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* flash */
.flash{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:30px;cursor:pointer}
/* onboarding */
.ob{max-width:640px;margin:40px auto;padding:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;min-height:40px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--teal)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:30;display:none}
.tile{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--teal)}
.tile .ic{flex:none;width:42px;height:42px;border-radius:12px;background:#E1F1EF;color:var(--teal-d);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:22px;height:22px}

/* landing */
.lp{background:#fff;color:var(--ink);overflow-x:clip}.lp *{min-width:0}
.lp-nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.lp-in{max-width:1180px;margin:0 auto;padding:0 20px}
.lp-nav .lp-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;flex-wrap:wrap}
.lp-logo{display:flex;align-items:center;gap:9px;font-family:Sora;font-weight:800;font-size:22px;letter-spacing:-.04em;text-decoration:none;color:var(--ink)}
.lp-logo b span{color:var(--teal)}.lp-logo b{font-weight:800}.lp-wm{display:flex;flex-direction:column;line-height:1}.lp-wm small{font-family:Inter,sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--ink2);margin-top:4px}
.lp-links{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.lp-links a{text-decoration:none;color:var(--ink2);font-weight:500;font-size:14px;cursor:pointer}
.lp-links a:hover{color:var(--teal-d)}.lp-links a.btn,.lp-links a.btn:hover{color:#fff}.lp-links a.btn.ghost{color:var(--ink)}
.lp-hero{background:linear-gradient(160deg,#06343F 0%,#0A4E5A 60%,#0B6B6B 100%);color:#fff;overflow:hidden}
.lp-hero .lp-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-top:56px;padding-bottom:64px}
.lp-hero h1{font-size:clamp(28px,3.3vw,42px);line-height:1.1;letter-spacing:-.035em;text-wrap:balance}
.lp-hero h1 em{font-style:normal;color:var(--mint)}
.lp-hero p.lead{font-size:16px;color:#CBE9E4;margin:18px 0 28px;max-width:540px}
.lp-hero .btn{font-size:15px;padding:12px 22px}
.lp-hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)} .lp-hero .btn.ghost:hover{background:rgba(255,255,255,.08)}
.lp-checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:14px;color:#CBE9E4}
.lp-checks span{display:flex;gap:6px;align-items:center}
.mock{background:#EDF5F4;border-radius:18px;padding:16px;box-shadow:0 30px 60px rgba(0,0,0,.28);color:var(--ink);transform:rotate(-1deg)}
.mock .card{padding:14px;border-radius:12px}
.lp-band{padding:60px 0}
.lp-band.soft{background:var(--bg)}
.lp-band h2{font-size:clamp(22px,2.3vw,30px);line-height:1.18;letter-spacing:-.03em;text-wrap:balance;max-width:760px}
.lp-band .lead{font-size:15.5px;color:var(--ink2);max-width:680px;margin:12px 0 0}
.lp-strip{background:var(--ink);color:#BFE3DE;padding:18px 0;font-size:14px}
.lp-strip .lp-in{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;justify-content:center}
.lp-strip b{color:#fff}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:34px}
.vs>div{padding:26px}
.vs .old{background:#F7F7F7;color:#5b6466}
.vs .new{background:#06343F;color:#fff}
.vs h3{font-size:18px;margin-bottom:14px}
.vs ul{list-style:none;padding:0;margin:0}
.vs li{padding:10px 0;border-top:1px solid rgba(127,127,127,.18);display:flex;gap:10px}
.vs .new li b{color:var(--mint)}
.step{display:flex;flex-direction:column;gap:10px}
.step .n{font-family:Sora;font-weight:800;font-size:30px;color:var(--teal);line-height:1}
.feat .ic{width:44px;height:44px;border-radius:12px;background:#E1F1EF;color:var(--teal-d);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.feat .ic svg{width:22px;height:22px}
.feat h3{margin-bottom:6px}
.price{display:flex;flex-direction:column;gap:12px;position:relative}
.price.best{border:2px solid var(--teal);box-shadow:0 18px 40px rgba(15,163,163,.18)}
.price .flag{position:absolute;top:-13px;left:20px;background:var(--teal);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:4px 12px}
.price .val{font-family:Sora;font-weight:800;font-size:26px;letter-spacing:-.03em}
.price ul{padding-left:0;list-style:none;margin:4px 0 8px}
.price li{padding:6px 0;display:flex;gap:8px;font-size:14px}
.price li::before{content:"✓";color:var(--teal-d);font-weight:800}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:16px}
.faq p{color:var(--ink2);margin:10px 0 0}
.lp-cta{background:linear-gradient(120deg,#0FA3A3,#0B7F7F);color:#fff;text-align:center}
.lp-cta h2{margin:0 auto;color:#fff}
.lp-foot .lp-wm b{color:#fff}.lp-foot .lp-wm b span{color:var(--mint)}.lp-foot{background:#04262E;color:#9FC4BF;padding:34px 0;font-size:13px}
.lp-img{width:100%;border-radius:18px;display:block;object-fit:cover}.float-kpi{position:absolute;left:-22px;bottom:-26px;padding:12px 16px;box-shadow:0 14px 34px rgba(6,52,63,.25);color:var(--ink)}.float-tag{position:absolute;right:-14px;top:22px;padding:10px 14px;box-shadow:0 14px 34px rgba(6,52,63,.25);color:var(--ink)}@media (max-width:860px){.float-kpi{left:10px;bottom:-22px}.float-tag{right:10px}}
@media (max-width:860px){.hero-mini{grid-template-columns:repeat(3,minmax(0,1fr))}.mock .grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.lp-hero .lp-in{grid-template-columns:minmax(0,1fr);padding-top:44px}.vs{grid-template-columns:minmax(0,1fr)}.lp-links a.hide-s{display:none}.mock{transform:none}}

.kick{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-d);margin-bottom:10px}
.lp-center{text-align:center}.lp-center h2,.lp-center .lead{margin-left:auto;margin-right:auto}
.pill-k{display:inline-flex;align-items:center;gap:8px;background:rgba(94,242,200,.14);color:var(--mint);font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px}
.pill-k svg{width:16px;height:16px}
.hero-ck{list-style:none;padding:0;margin:0 0 26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.ck{display:flex;gap:10px;align-items:center;font-size:14px}
.ck-i{flex:none;width:22px;height:22px;border-radius:99px;background:var(--mint);color:var(--ink);display:flex;align-items:center;justify-content:center}
.ck-i svg{width:14px;height:14px;stroke-width:3}
.lp-hero .ck{color:#E3F5F2}

const espKw=(e,q)=>{if(q.esp)return q.esp===e;const m=ESP_MAP[e];return !!(m&&m.kw&&m.kw.test(q.tema));};
function inEspFocus(e,q,mode){const m=ESP_MAP[e];if(!m||!mode)return true;if(q.esp)return q.esp===e;if(mode==="temas")return m.kw?m.kw.test(q.tema):(!q.ined&&m.base.includes(q.area));return (!q.ined&&m.base.includes(q.area))||(!!m.kw&&m.kw.test(q.tema));}
const focoMode=()=>{const e=espOf();if(!e)return "";return qf.foco==="auto"?"foco":qf.foco;};
function espPool(e,mode){return Q.filter(q=>inEspFocus(e,q,mode||"foco"));}
function stats(filterArea){
  let tot=0,ok=0;const by={};AREAS.forEach(a=>by[a]={t:0,o:0});const byTema={};
  Object.entries(S.ans).forEach(([id,r])=>{const q=qById(id);if(!q)return;if(filterArea&&q.area!==filterArea)return;
    tot++;if(r.ok)ok++;by[q.area].t++;if(r.ok)by[q.area].o++;
    byTema[q.tema]=byTema[q.tema]||{t:0,o:0,area:q.area};byTema[q.tema].t++;if(r.ok)byTema[q.tema].o++;});
  return {tot,ok,err:tot-ok,pct:tot?Math.round(ok/tot*100):0,by,byTema};
}
function daysTo(d){if(!d)return null;const t=new Date(d+"T00:00:00");const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
function fmtDate(d){if(!d)return"";const [y,m,dd]=d.split("-");return dd+"/"+m+"/"+y;}
function rankPos(){const s=stats();const base=1240;const p=Math.max(1,Math.round(base*(1-(s.pct/100)*0.92)-s.tot*3));return s.tot?p:null;}

/* ================= CHARTS ================= */
function barChart(items,opt){ // items [{label,value,max?,color}]
  opt=opt||{};const W=640,H=opt.h||220,pl=48,pb=40,pt=18,pr=10;const n=items.length||1;
  const max=opt.max||Math.max(1,...items.map(i=>i.value));const bw=Math.min(46,(W-pl-pr)/n*0.6);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||"Gráfico de barras")+'">';
  for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*(1-k/4);const v=Math.round(max*k/4);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#E3EEEC"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+(opt.unit||"")+'</text>';}
  items.forEach((it,i)=>{const cx=pl+(W-pl-pr)*(i+0.5)/n;const h=(H-pt-pb)*(it.value/max);const y=H-pb-h;
    s+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="5" fill="'+(it.color||"#0FA3A3")+'"><title>'+esc(it.label)+': '+it.value+(opt.unit||"")+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(y-5)+'" text-anchor="middle" style="fill:#06343F;font-weight:600">'+it.value+(opt.unit||"")+'</text>';
    s+='<text x="'+cx+'" y="'+(H-pb+16)+'" text-anchor="middle">'+esc(it.short||it.label)+'</text>';});
  return s+'</svg>';
}
function lineChart(pts,opt){ // pts [{label,value}]
  opt=opt||{};const W=640,H=opt.h||220,pl=48,pb=36,pt=18,pr=16;const max=opt.max||100;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||"Gráfico de linha")+'">';
  for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*(1-k/4);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#E3EEEC"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*k/4)+(opt.unit||"")+'</text>';}
  if(opt.goal!=null){const y=pt+(H-pt-pb)*(1-opt.goal/max);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#C08A1E" stroke-dasharray="5 4"/><text x="'+(pl+6)+'" y="'+(y-6)+'" text-anchor="start" style="fill:#8A5A00;font-weight:600">'+esc(opt.goalLabel||"meta")+'</text>';}
  const n=pts.length;if(!n)return s+'</svg>';
  const xy=pts.map((p,i)=>[pl+(W-pl-pr)*(n===1?0.5:i/(n-1)),pt+(H-pt-pb)*(1-p.value/max)]);
  s+='<path d="M'+xy.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+'" fill="none" stroke="#0FA3A3" stroke-width="3" stroke-linejoin="round"/>';
  xy.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#fff" stroke="#06343F" stroke-width="2.5"><title>'+esc(pts[i].label)+': '+pts[i].value+(opt.unit||"")+'</title></circle><text x="'+p[0]+'" y="'+(H-pb+16)+'" text-anchor="middle">'+esc(pts[i].label)+'</text>';});
  return s+'</svg>';
}
function donut(pct,color,size){size=size||120;const r=size/2-10,c=2*Math.PI*r;return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+pct+'%"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#E5EFEE" stroke-width="12"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(color||"#0FA3A3")+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*pct/100)+' '+c+'" transform="rotate(-90 '+size/2+' '+size/2+')"/><text x="50%" y="54%" text-anchor="middle" style="font-family:Sora;font-weight:800;font-size:'+(size/5)+'px;fill:#06343F">'+pct+'%</text></svg>';}

function adaptPick(n){const s=stats();const u=S.user||{};const F=temaFreq((u.bancas||[]).map(bancaQ));
  const pool=Q.filter(q=>!q.dup&&q.tipo!=="aberta"&&!q.anul&&!q.desat&&(!q.ined||q.esp===espOf()));
  const score=q=>{const b=s.byTema[q.tema];const acc=b&&b.t?b.o/b.t:null;const a=S.ans[q.id];let sc=0;
    if(acc!=null)sc+=(1-acc)*10;else sc+=3;if(a&&!a.ok)sc+=4;if(a&&a.ok)sc-=6;if(!a)sc+=2;sc+=Math.min(3,(F[q.tema]?F[q.tema].n:0)/2);const _e=espOf();if(_e){const m=ESP_MAP[_e];if(espKw(_e,q))sc+=4;else if((!q.ined&&m.base.includes(q.area)))sc+=2;else sc-=3;}return sc+Math.random()*2;};
  const ranked=pool.map(q=>[q,score(q)]).sort((a,b)=>b[1]-a[1]);const out=[],per={};
  for(const [q] of ranked){if(out.length>=Math.ceil(n*1.3))break;if((per[q.tema]||0)>=4)continue;per[q.tema]=(per[q.tema]||0)+1;out.push(q.id);}return dedupe(out).slice(0,n);}

function buildPlan(){
  const u=S.user;const s=stats();const d=daysTo(u.data);const weeks=Math.max(1,Math.min(12,d!=null&&d>0?Math.ceil(d/7):8));
  const weight={};const _e=espOf(),_m=_e?ESP_MAP[_e]:null;AREAS.forEach(a=>{const b=s.by[a];const acc=b.t?b.o/b.t:0.5;weight[a]=(1+(1-acc))*(_m&&_m.base.includes(a)?1.8:1);});
  const tw=AREAS.reduce((x,a)=>x+weight[a],0);
  const F=temaFreq((u.bancas||[]).map(bancaQ));const temasPorArea={};AREAS.forEach(a=>{temasPorArea[a]=Object.entries(F).filter(([,v])=>v.area===a).sort((x,y)=>{const sx=s.byTema[x[0]],sy=s.byTema[y[0]];const px=sx&&sx.t?sx.o/sx.t:0.6,py=sy&&sy.t?sy.o/sy.t:0.6;const bx=_m&&_m.kw&&_m.kw.test(x[0])?3:1,by=_m&&_m.kw&&_m.kw.test(y[0])?3:1;return (y[1].n*(1.6-py)*by)-(x[1].n*(1.6-px)*bx);}).map(([t,v])=>({t,n:v.n}));if(!temasPorArea[a].length)temasPorArea[a]=[{t:"Revisão geral",n:0}];});
  const plan=[];for(let w=0;w<weeks;w++){const items=AREAS.map(a=>{const h=Math.max(1,Math.round(u.horas*weight[a]/tw));const ts=temasPorArea[a];const t1=ts[(w*2)%ts.length],t2=ts[(w*2+1)%ts.length];return {area:a,h,tema:t1.t+(t2&&t2.t!==t1.t?" · "+t2.t:""),n:t1.n+(t2&&t2.t!==t1.t?t2.n:0)};});
    plan.push({w:w+1,items,rev:w%2===1,sim:w%2===1});}
  return {weeks,plan,weight,tw};
}

/* ===== Etiquetas, plano do dia, caderno de erros por conceito, painel (nov/2026) ===== */
const TG=window.MR_TAGS||{T:[],S:[],K:[],q:{},sim:{},R:[]};
const AREA_CD={"Clínica Médica":"CM","Cirurgia":"CIR","Pediatria":"PED","Ginecologia e Obstetrícia":"GO","Medicina Preventiva":"PREV"};
const nrm=t=>" "+String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim()+" ";
let _RX=null;const _TC={};
function rxs(){if(_RX)return _RX;const mk=s=>s?new RegExp("\\b(?:"+s+")"):null;_RX=TG.R.map(([t,subs])=>[mk(t),subs.map(([s,cs])=>[mk(s),cs.map(mk)])]);return _RX;}
function tagRuntime(q){const R=rxs();if(!R.length)return null;const a=q.a||[];const corr=typeof q.c==="number"?(a[q.c]||""):"";
  const F=[nrm(q.tema),nrm([q.com,q.tut,corr,q.resp].join(" ")),nrm(q.e)];const W=[10,3,1];const sc=rx=>rx?W.reduce((s,w,i)=>s+(rx.test(F[i])?w:0),0):0;
  const cd=AREA_CD[q.area];let best=-1,bs=0;TG.T.forEach((t,i)=>{if(t[1]!==cd)return;const s=sc(R[i][0]);if(s>bs){bs=s;best=i;}});if(best<0||bs<3)return null;
  const cs=[];const base={};TG.S.forEach((s,si)=>{if(base[s[1]]==null)base[s[1]]=si;});
  const kBase={};TG.K.forEach((k,ki)=>{if(kBase[k[1]]==null)kBase[k[1]]=ki;});
  R[best][1].forEach(([srx,crs],j)=>{const si=base[best]+j;crs.forEach((crx,ci)=>{const s=sc(crx);if(s)cs.push([s,si,kBase[si]+ci]);});});
  cs.sort((x,y)=>y[0]-x[0]);const good=(cs.filter(x=>x[0]>=3).slice(0,3));const pick=good.length?good:cs.slice(0,1);
  return [best,pick.length?pick[0][1]:-1,pick.map(x=>x[2])];}
function qTag(q){if(!q)return null;let r=TG.q[q.id];if(!r){if(_TC[q.id]!==undefined)r=_TC[q.id];else r=_TC[q.id]=tagRuntime(q);}if(!r)return null;return {t:r[0],s:r[1],k:r[2]||[],g:r[3]||0};}
const temaN=q=>{const t=qTag(q);return t&&t.t>=0&&TG.T[t.t]?TG.T[t.t][0]:(q&&q.tema)||"";};
const subN=q=>{const t=qTag(q);return t&&t.s>=0&&TG.S[t.s]?TG.S[t.s][0]:"";};
const kN=k=>(TG.K[k]||["?"])[0];
const kTema=k=>{const s=TG.S[(TG.K[k]||[0,0])[1]];return s?(TG.T[s[1]]||[""])[0]:"";};
const qGroup=q=>{const t=qTag(q);return t?t.g:0;};
/* --- índices preguiçosos --- */
let _KQ=null,_GQ=null;
function kIndex(){if(_KQ)return _KQ;_KQ={};Q.forEach(q=>{if(q.dup||q.tipo==="aberta"||q.anul||q.desat)return;const t=qTag(q);if(!t)return;t.k.forEach(k=>{(_KQ[k]=_KQ[k]||[]).push(q.id);});});return _KQ;}
function gIndex(){if(_GQ)return _GQ;_GQ={};Object.entries(TG.q).forEach(([id,r])=>{if(r[3])(_GQ[r[3]]=_GQ[r[3]]||[]).push(id);});return _GQ;}
/* B5: lista sem questões quase iguais (só listas e treino do dia) */
function dedupe(ids,skipAnswered){const seen=new Set(),out=[];const G=gIndex();
  for(const id of ids){const q=qById(id);const g=qGroup(q);if(g){if(seen.has(g))continue;if(skipAnswered&&(G[g]||[]).some(x=>x!==id&&S.ans[x]))continue;seen.add(g);}out.push(id);}return out;}
/* A3: bancas parecidas */
function bancasParecidas(b){return (TG.sim[bancaQ(b)]||[]).filter(([o])=>Q.some(q=>q.banca===o));}
function restantesBanca(b){const bq=bancaQ(b);return Q.filter(q=>q.banca===bq&&!q.dup&&!q.anul&&q.tipo!=="aberta"&&!S.ans[q.id]).length;}
function parecidasCard(b,compact){const L=bancasParecidas(b).slice(0,4);if(!L.length)return "";const r=restantesBanca(b);
  return '<div class="card pad-s" style="margin-bottom:14px;background:#F6FBFA;box-shadow:none"><b>'+(r?'Bancas que cobram parecido com '+esc(b):'Acabaram as questões de '+esc(b)+'. Continue com bancas que cobram parecido:')+'</b>'+(compact?'':'<p class="sub" style="margin:4px 0 8px;font-size:13px">Comparamos o peso de cada tema nas provas. Quanto maior a porcentagem, mais parecida é a cobrança.</p>')+'<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:6px">'+L.map(([o,p])=>'<button class="btn ghost sm" data-act="qf-banca-go" data-v="'+esc(o)+'">'+esc(o)+' · '+p+'% parecida</button>').join("")+'</div></div>';}
/* ===== Caderno de erros por conceito (A2 + B1 + B2) ===== */
const dayMs=864e5;const todayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();};
function cxInit(){if(!S.cx)S.cx={};if(!S.rvLog)S.rvLog={};if(!S.cxMig){S.cxMig=1;let i=0;Object.entries(S.ans).forEach(([id,r])=>{if(!r.ok||r.chute){const q=qById(id);if(q){cxAdd(q,{silent:1,spread:i++%7});}}});}}
function intervals(){const d=S.user&&S.user.data?daysTo(S.user.data):null;let iv=[7,30,90];if(d!=null&&d>0){if(d<=7)iv=[1,2,3];else if(d<=21)iv=[2,5,10];else if(d<=60)iv=[3,10,21];else if(d<=120)iv=[7,21,45];}return {iv,d};}
function nextDue(lvl){const {iv,d}=intervals();let n=iv[Math.min(lvl,iv.length-1)];if(d!=null&&d>1)n=Math.min(n,d-1);return todayStart()+Math.max(1,n)*dayMs;}
function cxAdd(q,o){o=o||{};const t=qTag(q);if(!t||!t.k.length){(S.cxq=S.cxq||{})[q.id]=1;return;}t.k.forEach(k=>{const c=S.cx[k];if(c&&c.st!=="dom"){c.lvl=0;c.due=Math.min(c.due,nextDue(0));if(!c.src.includes(q.id))c.src.push(q.id);c.err=(c.err||0)+1;}else S.cx[k]={lvl:0,due:o.spread!=null?todayStart()+(o.spread+1)*dayMs:nextDue(0),src:[q.id],err:1,st:"novo",fc:0,ts:Date.now()};});}
function cxMark(k,v){const c=S.cx[k];if(!c)return;if(v==="sei"){c.st="sei";c.fc=0;c.lvl=Math.max(c.lvl,1);c.due=nextDue(1);}else{c.st="faltou";c.fc=1;c.lvl=0;c.due=nextDue(0);}save();}
function cxDue(){const now=Date.now();return Object.entries(S.cx||{}).filter(([,c])=>c.st!=="dom"&&c.due<=now).sort((a,b)=>a[1].due-b[1].due).map(([k])=>+k);}
function cxActive(){return Object.entries(S.cx||{}).filter(([,c])=>c.st!=="dom");}
/* questão-irmã: outra questão que cobra o mesmo conceito, com outro caso */
function irma(k){const c=S.cx[k];const src=c?c.src:[];const srcG=new Set(src.map(id=>qGroup(qById(id))).filter(Boolean));const L=(kIndex()[k]||[]).filter(id=>!src.includes(id));const ok=L.filter(id=>!srcG.has(qGroup(qById(id))));
  const fresh=ok.filter(id=>!S.ans[id]);const pool=fresh.length?fresh:ok.filter(id=>S.ans[id]&&S.ans[id].ok);if(pool.length)return {id:pool[(c?c.err||0:0)%pool.length],irma:true};return {id:src[src.length-1],irma:false};}
const rvQuota=()=>{const P=planToday();return P?P.rev:15;};
let rv={k:null,id:null,sel:null,show:false,guess:false,flip:false};
function rvLogInc(ok){const d=dayKey();S.rvLog[d]=S.rvLog[d]||{n:0,ok:0};S.rvLog[d].n++;if(ok)S.rvLog[d].ok++;}
function rvAnswer(){const q=qById(rv.id);const k=rv.k;const c=S.cx[k];if(!q||!c||rv.sel==null)return;const ok=isOk(q,rv.sel)&&!rv.guess;
  S.ans[q.id]={ok:isOk(q,rv.sel),ch:rv.sel,ts:Date.now(),rv:1};if(isOk(q,rv.sel)&&rv.guess)S.ans[q.id].chute=1;
  if(ok){c.lvl++;if(c.lvl>=3){c.st="dom";c.domTs=Date.now();}else c.due=nextDue(c.lvl);}else{c.lvl=0;c.fc=1;c.st="faltou";c.due=nextDue(0);c.err=(c.err||0)+1;if(!c.src.includes(q.id))c.src.push(q.id);}
  rvLogInc(ok);rv.show=true;rv.ok=ok;save();}
function fcBack(k){const c=S.cx[k];const q=qById((c&&c.src[0])||"")||null;if(!q)return "";const com=String(q.com||"").replace(/^Resposta:\s*/i,"");return '<p style="margin:6px 0 0">'+esc(com.length>420?com.slice(0,420)+"…":com)+'</p>'+(q.tut&&!/^Gabarito/i.test(q.tut)?'<p class="sub" style="margin:8px 0 0"><b>Para lembrar:</b> '+esc(q.tut)+'</p>':'')+c.src.map(id=>{const x=qById(id);return x?noteView(x):"";}).join("");}
function conceptBox(q){const r=S.ans[q.id];if(!r||(r.ok&&!r.chute))return "";const t=qTag(q);if(!t||!t.k.length)return "";
  return '<div class="cx-box"><b>Conceitos que essa questão cobra</b> <span class="sub" style="font-size:12px">marque o que faltou: só isso vira flashcard</span>'+t.k.map(k=>{const c=(S.cx||{})[k]||{};return '<div class="cx-row"><span>'+esc(kN(k))+'</span><span class="row" style="gap:6px"><button class="btn ghost sm'+(c.st==="sei"?" on":"")+'" data-act="cx-mark" data-k="'+k+'" data-v="sei" data-id="'+q.id+'">Já sei</button><button class="btn ghost sm'+(c.st==="faltou"?" on":"")+'" data-act="cx-mark" data-k="'+k+'" data-v="faltou" data-id="'+q.id+'">Faltou</button></span></div>';}).join("")+'</div>';}
function onAnswered(id){try{sendAnswer(id);}catch(e){}try{cxInit();const q=qById(id);const r=S.ans[id];if(q&&r&&(!r.ok||r.chute))cxAdd(q);planTouch();}catch(e){}}
function rvCard(){const due=cxDue();const quota=rvQuota();const doneToday=(S.rvLog[dayKey()]||{}).n||0;
  if(!rv.k||(!rv.show&&!due.includes(rv.k))){if(!due.length||(doneToday>=quota&&S.rvMore!==dayKey())){rv={k:null};return due.length?'<div class="empty">Você fez as '+doneToday+' revisões de hoje. '+(due.length)+' conceito'+(due.length>1?'s ficam':' fica')+' pra amanhã, dentro do limite do seu plano.<br><button class="btn ghost sm" style="margin-top:10px" data-act="rv-more">Revisar mais agora</button></div>':'<div class="empty">Nenhuma revisão pra hoje. Quando você errar ou chutar uma questão, os conceitos dela entram aqui em 7, 30 e 90 dias.</div>';}
    const k=due[0];const ir=irma(k);rv={k,id:ir.id,irma:ir.irma,sel:null,show:false,guess:false,flip:false};S.rvCur=rv;}
  const q=qById(rv.id);const c=S.cx[rv.k];if(!q){delete S.cx[rv.k];rv={k:null};return rvCard();}
  const lvlTxt=["1ª revisão","2ª revisão","3ª revisão"][Math.min(c.lvl,2)];
  const alts=q.a.map((t,i)=>{let cl="alt";if(rv.show){if(isOk(q,i))cl+=" right";else if(i===rv.sel)cl+=" wrong";}else if(rv.sel===i)cl+=" sel";return '<button class="'+cl+'" data-act="rv-pick" data-i="'+i+'"><span class="lt">'+L[i]+'</span><span>'+altBody(q,i)+'</span></button>';}).join("");
  const left=Math.max(0,Math.min(due.length,quota-doneToday));
  return '<div class="card"><div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><span class="tag">Conceito: '+esc(kN(rv.k))+'</span><span class="tag gray">'+esc(kTema(rv.k))+'</span><span class="tag gray">'+lvlTxt+'</span>'+(rv.irma?'<span class="tag ok" title="Outra questão que cobra o mesmo conceito, com outro caso">Questão-irmã</span>':'<span class="tag warn" title="Ainda não temos outra questão com esse conceito">Mesma questão</span>')+'<span class="sub" style="margin-left:auto;font-size:13px">'+left+' pra hoje</span></div>'+
   (c.fc&&!rv.show?'<details class="fc-peek" style="margin-top:10px"><summary class="sub" style="cursor:pointer">Ver o flashcard deste conceito antes</summary>'+fcBack(rv.k)+'</details>':'')+
   qEnun(q)+qFigs(q)+alts+

function plInit(){if(!S.pl)S.pl={start:dayKey(),days:{}};return S.pl;}
function doneOn(dk){let n=0;Object.values(S.ans).forEach(r=>{if(r.ts&&dayKey(new Date(r.ts))===dk&&!r.rv)n++;});return n+((S.rvLog||{})[dk]||{n:0}).n;}
function fase(d){if(d==null)return {k:"cob",n:"Cobertura",d:"Passar por todos os temas que a sua banca cobra"};if(d<=30)return {k:"final",n:"Reta final",d:"Revisar e simular, com foco no que mais cai"};if(d<=90)return {k:"cons",n:"Consolidação",d:"Reforçar os temas fracos e revisar o que errou"};return {k:"cob",n:"Cobertura",d:"Passar por todos os temas que a sua banca cobra"};}
const rmOk=q=>{const u=S.user||{};if(!q.rmais)return true;if(u.tipo!=="R+")return false;const e=(u.esp||"").toLowerCase();return !e||[q.rmais].concat(q.also||[]).some(x=>String(x).toLowerCase().includes(e));};
function temaPeso(){const u=S.user||{};const bs=(u.bancas||[]).map(bancaQ);const w={};let n=0;Q.forEach(q=>{if(q.dup||q.ined||!rmOk(q))return;if(bs.length&&!bs.includes(q.banca))return;const t=qTag(q);if(!t||t.t<0)return;w[t.t]=(w[t.t]||0)+1;n++;});if(!n){Q.forEach(q=>{const t=qTag(q);if(t&&t.t>=0){w[t.t]=(w[t.t]||0)+1;n++;}});}Object.keys(w).forEach(k=>w[k]/=n);return w;}
let _TP=null,_TPk="";const tPeso=()=>{const k=JSON.stringify((S.user||{}).bancas||[]);if(_TPk!==k){_TP=temaPeso();_TPk=k;}return _TP;};
function temaStats(){const s={};Object.entries(S.ans).forEach(([id,r])=>{const q=qById(id);const t=qTag(q);if(!t||t.t<0)return;const o=s[t.t]=s[t.t]||{n:0,ok:0,last:0};o.n++;if(r.ok&&!r.chute)o.ok++;o.last=Math.max(o.last,r.ts||0);});return s;}
const QMIN=5;/* minutos por questão, contando a leitura do comentário */
function planToday(){if(!S.user)return null;plInit();const u=S.user;const d=u.data?daysTo(u.data):null;const F=fase(d);
  const min=Math.round((u.horas||20)*60/6);const base=Math.max(5,Math.round(min/QMIN));
  const today=dayKey();const past=Object.entries(S.pl.days).filter(([k])=>k<today).sort().slice(-14);let back=0;past.forEach(([k,v])=>{back+=Math.max(0,(v.t||0)-doneOn(k));});
  const remDays=d!=null&&d>0?Math.max(1,Math.round(d*6/7)):30;const extra=Math.min(Math.round(base*0.5),Math.ceil(back/Math.min(remDays,14)));
  const total=base+extra;const revShare=F.k==="cob"?0.25:F.k==="cons"?0.4:0.5;const due=cxDue().length;const rev=Math.min(due,Math.round(total*revShare));const nova=total-rev;
  if(!S.pl.days[today]||S.pl.days[today].t!==total){S.pl.days[today]={t:total};}
  const W=tPeso();const TS=temaStats();const now=Date.now();
  const sc=Object.entries(W).map(([t,w])=>{const st=TS[t];const acc=st&&st.n?st.ok/st.n:null;let s=w*100;if(F.k==="cob")s*=st&&st.n?0.6:1.6;else s*=1+(acc==null?0.6:(1-acc)*1.5);if(F.k==="final")s*=1+w*20;if(st&&now-st.last<2*dayMs)s*=0.35;return [+t,s];}).sort((a,b)=>b[1]-a[1]);
  const nT=nova>=24?3:nova>=10?2:1;const temas=sc.slice(0,nT).map(([t])=>t);const per=temas.length?Math.ceil(nova/temas.length):0;
  const simDay=(F.k==="cons"&&new Date().getDay()===6)||(F.k==="final"&&[3,6].includes(new Date().getDay()));

function treinoIds(P){const u=S.user||{};const bs=(u.bancas||[]).map(bancaQ);const out=[];

const CF_V="13";const CF={},CF_LOAD={};
function cfKey(q){return String(q.id).split("-")[0];}
function cfGet(q){const k=cfKey(q);if(CF[k])return CF[k][q.id]||null;if(!CF_LOAD[k]){CF_LOAD[k]=1;fetch("cf/"+encodeURIComponent(k)+".json?v="+CF_V).then(r=>r.ok?r.json():{}).catch(()=>({})).then(d=>{CF[k]=d||{};if(CF[k][q.id])render();});}return null;}
function cfTab(rows,tit){if(!rows||!rows.length)return "";return (tit?'<div class="cf-h">'+esc(tit)+'</div>':'')+'<div class="resumo"><table><thead><tr>'+rows[0].map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';}
function comFull(q,oldTab){const f=cfGet(q);
  if(!f)return '<p style="margin:10px 0 0">'+esc(q.com||"")+'</p>'+(oldTab||"");
  const ok=Array.isArray(q.ok)?q.ok:[q.c];let h='<div class="cf">';
  if(f.raz)h+='<div class="cf-h">Por que a '+(q.a&&q.a.length?L[q.c]:"resposta")+' está certa</div><p>'+esc(f.raz)+'</p>';
  if(f.alt&&f.alt.length){h+='<div class="cf-h">Análise das alternativas</div><ul class="cf-alt">'+f.alt.map((x,i)=>{const c=i===q.c||ok.includes(i);return '<li class="'+(c?"ok":"no")+'"><b>'+L[i]+') '+(c?"Correta":"Errada")+'.</b> '+esc(x)+'</li>';}).join("")+'</ul>';}
  if(f.tema&&f.tema.length)h+='<div class="cf-h">Entenda o tema</div>'+f.tema.map(x=>'<p>'+esc(x)+'</p>').join("");
  (f.tabs||[]).forEach(x=>{h+=cfTab(x.r,x.t);});
  if(f.peg)h+='<div class="cf-box peg"><b>Pegadinha de prova</b><p>'+esc(f.peg)+'</p></div>';
  if(f.ouro)h+='<div class="cf-box ouro"><b>Dica de ouro</b><p>'+esc(f.ouro)+'</p></div>';
  if(f.conc&&f.conc.length)h+='<div class="cf-tags">'+(f.sub?'<span class="tag gray">'+esc(f.sub)+'</span>':'')+f.conc.map(c=>'<span class="tag">'+esc(c)+'</span>').join("")+'</div>';
  return h+'</div>';}

$("#hlbar").addEventListener("click",e=>{
  const btn=e.target.closest("[data-hl]");if(!btn||!selRange)return;const art=document.getElementById("doss");if(!art)return;
  let c=btn.dataset.hl,nota="";if(c==="note"){c="h1";}
  const txt=selRange.toString().trim();if(!txt){hideBar();return;}
  const mark=document.createElement("mark");mark.className=c;
  try{mark.appendChild(selRange.extractContents());selRange.insertNode(mark);}catch(err){toast("Não consegui grifar esse trecho");return;}
  window.getSelection().removeAllRanges();hideBar();
  const id=art.dataset.id;S.hl[id]=art.innerHTML.replace(/<div class="chart card" id="d-chart">[\s\S]*?<\/svg><\/div>/, '<div class="chart card" id="d-chart"></div>');
  const n={id,doss:(DOSSIES.find(d=>d.id===id)||{}).nome,txt,c,nota};
  if(btn.dataset.hl==="note"){openNote(n);}else{S.notes.push(n);save();toast("Trecho grifado");}
  afterDossie();
});
function openNote(n){
  const box=document.createElement("div");box.className="card";box.style.cssText="position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:50;width:min(420px,92vw);box-shadow:0 10px 40px rgba(6,52,63,.3)";
  box.innerHTML='<h3>Nota sobre o trecho</h3><p class="sub" style="margin:6px 0">"'+esc(n.txt.slice(0,120))+'"</p><textarea id="note-t" style="width:100%" placeholder="Escreva sua anotação"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost sm" id="note-c">Cancelar</button><button class="btn sm" id="note-s">Salvar nota</button></div>';
  document.body.appendChild(box);box.querySelector("#note-t").focus();
  box.querySelector("#note-c").onclick=()=>{S.notes.push(n);save();box.remove();};
  box.querySelector("#note-s").onclick=()=>{n.nota=box.querySelector("#note-t").value.trim();S.notes.push(n);save();box.remove();toast("Nota salva");};
}

render();
window.__mr={Q,SIMULADOS,ESP:Object.keys(ESP_MAP),filteredQ,espPool,qById,espKw,inEspFocus,espOf,get run(){return run},get S(){return S}};
})();
