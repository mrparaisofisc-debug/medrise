<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedRise — Preparatório Residência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06343F; --ink2:#33514F; --mute:#5E7775; --teal:#0FA3A3; --teal-d:#0B7F7F; --mint:#5EF2C8;
  --bg:#EDF5F4; --card:#FFFFFF; --line:#D6E5E3; --ok:#12805C; --ok-bg:#E3F6EE; --bad:#B4232C; --bad-bg:#FBE9EA;
  --warn:#8A5A00; --warn-bg:#FFF4D6; --r:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal-d)}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0;letter-spacing:-0.02em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:248px;flex:none;background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;padding:4px 8px 18px}.logo-full{display:block;width:auto}
.brand b{font-family:Sora;font-size:22px;font-weight:800;letter-spacing:-0.04em}
.brand b span{color:var(--mint)}
.brand small{display:block;font-size:9.5px;letter-spacing:.22em;opacity:.75;font-weight:600}
.nav-sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;padding:14px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#DDEDEB;text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(94,242,200,.14);color:#fff}
.nav a.on svg{color:var(--mint)}
.nav svg{width:18px;height:18px;flex:none}
.nav .pill{margin-left:auto;background:var(--mint);color:var(--ink);font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1240px}
.topbar{display:none}
/* generic */
.row{display:flex;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.pad-s{padding:14px}
.sub{color:var(--mute);font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#E1F1EF;color:var(--teal-d)}
.tag.gray{background:#EEF2F2;color:var(--ink2)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff;text-decoration:none;min-height:44px}
.btn:hover{background:var(--teal-d)}
.btn.dark{background:var(--ink)} .btn.dark:hover{background:#0A4A57}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#F2F8F7}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
select,input[type=text],input[type=number],input[type=date],textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:80px;resize:vertical}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:Sora;font-size:28px;font-weight:800;letter-spacing:-0.03em}
.kpi .l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#E1F1EF;color:var(--teal-d);margin-bottom:8px}
.kpi .ic svg{width:18px;height:18px}
.bar-h{height:10px;border-radius:99px;background:#E5EFEE;overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--teal);border-radius:99px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid #EAF2F1;vertical-align:top}
.tbl-wrap{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r);background:#FAFDFC}
.note{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 12px}
.hero{background:linear-gradient(120deg,#06343F 0%,#0A5560 100%);color:#fff;border:0}
.hero .sub{color:#BFE3DE}
.count{font-family:Sora;font-size:44px;font-weight:800;color:var(--mint);line-height:1}
/* question */
.q-enun{font-size:16px;line-height:1.6;margin:10px 0 16px}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:44px}
.alt:hover{border-color:var(--teal)}
.alt .lt{flex:none;width:26px;height:26px;border-radius:99px;border:1.5px solid #9DB9B6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.alt.sel{border-color:var(--teal);background:#EFFAF8}
.alt.sel .lt{background:var(--teal);border-color:var(--teal);color:#fff}
.alt.right{border-color:var(--ok);background:var(--ok-bg)}
.alt.right .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.alt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.alt.cut{opacity:.45;text-decoration:line-through}
.coment{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.resumo{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.resumo table{width:100%;border-collapse:collapse;font-size:14px}
.resumo th{background:#E8F4F2;text-align:left;padding:8px 12px;font-size:13px}
.resumo td{padding:8px 12px;border-top:1px solid #E5EFEE;vertical-align:top}
.tutor{background:#F1FBF8;border:1px solid #BDEBDD;border-radius:12px;padding:14px;margin-top:12px}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.qnav button{height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:13px}
.qnav button.done{background:#E1F1EF;border-color:#A9D8D3}
.qnav button.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
.timer{font-family:Sora;font-weight:800;font-size:22px}
/* dossie */
.doss{max-width:780px}
.doss h2{margin:28px 0 10px}
.doss p,.doss li{line-height:1.7}
.doss .box{border-left:0;background:#F4FAF9;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
mark.h1{background:#FFF0A8} mark.h2{background:#C8F4E4} mark.h3{background:#FFD3DA}
mark{border-radius:3px;padding:0 1px}
.hl-bar{position:fixed;z-index:20;display:none;gap:6px;background:var(--ink);padding:6px;border-radius:10px;box-shadow:0 6px 20px rgba(6,52,63,.25)}
.hl-bar button{width:32px;height:32px;border-radius:8px;border:2px solid rgba(255,255,255,.4);cursor:pointer}
.hl-bar .nt{width:auto;padding:0 10px;color:#fff;background:transparent;font-size:13px;font-weight:600}
.toc a{display:block;padding:6px 0;text-decoration:none;font-size:14px;color:var(--ink2)}
.toc a:hover{color:var(--teal-d)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:Inter,sans-serif;fill:var(--mute);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* flash */
.flash{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:30px;cursor:pointer}
/* onboarding */
.ob{max-width:640px;margin:40px auto;padding:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;min-height:40px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--teal)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:30;display:none}
.tile{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--teal)}
.tile .ic{flex:none;width:42px;height:42px;border-radius:12px;background:#E1F1EF;color:var(--teal-d);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:22px;height:22px}

/* landing */
.lp{background:#fff;color:var(--ink);overflow-x:clip}.lp *{min-width:0}
.lp-nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.lp-in{max-width:1180px;margin:0 auto;padding:0 20px}
.lp-nav .lp-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;flex-wrap:wrap}
.lp-logo{display:flex;align-items:center;gap:9px;font-family:Sora;font-weight:800;font-size:22px;letter-spacing:-.04em;text-decoration:none;color:var(--ink)}
.lp-logo b span{color:var(--teal)}.lp-logo b{font-weight:800}.lp-wm{display:flex;flex-direction:column;line-height:1}.lp-wm small{font-family:Inter,sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--ink2);margin-top:4px}
.lp-links{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.lp-links a{text-decoration:none;color:var(--ink2);font-weight:500;font-size:14px;cursor:pointer}
.lp-links a:hover{color:var(--teal-d)}.lp-links a.btn,.lp-links a.btn:hover{color:#fff}.lp-links a.btn.ghost{color:var(--ink)}
.lp-hero{background:linear-gradient(160deg,#06343F 0%,#0A4E5A 60%,#0B6B6B 100%);color:#fff;overflow:hidden}
.lp-hero .lp-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-top:56px;padding-bottom:64px}
.lp-hero h1{font-size:clamp(28px,3.3vw,42px);line-height:1.1;letter-spacing:-.035em;text-wrap:balance}
.lp-hero h1 em{font-style:normal;color:var(--mint)}
.lp-hero p.lead{font-size:16px;color:#CBE9E4;margin:18px 0 28px;max-width:540px}
.lp-hero .btn{font-size:15px;padding:12px 22px}
.lp-hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)} .lp-hero .btn.ghost:hover{background:rgba(255,255,255,.08)}
.lp-checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:14px;color:#CBE9E4}
.lp-checks span{display:flex;gap:6px;align-items:center}
.mock{background:#EDF5F4;border-radius:18px;padding:16px;box-shadow:0 30px 60px rgba(0,0,0,.28);color:var(--ink);transform:rotate(-1deg)}
.mock .card{padding:14px;border-radius:12px}
.lp-band{padding:60px 0}
.lp-band.soft{background:var(--bg)}
.lp-band h2{font-size:clamp(22px,2.3vw,30px);line-height:1.18;letter-spacing:-.03em;text-wrap:balance;max-width:760px}
.lp-band .lead{font-size:15.5px;color:var(--ink2);max-width:680px;margin:12px 0 0}
.lp-strip{background:var(--ink);color:#BFE3DE;padding:18px 0;font-size:14px}
.lp-strip .lp-in{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;justify-content:center}
.lp-strip b{color:#fff}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:34px}
.vs>div{padding:26px}
.vs .old{background:#F7F7F7;color:#5b6466}
.vs .new{background:#06343F;color:#fff}
.vs h3{font-size:18px;margin-bottom:14px}
.vs ul{list-style:none;padding:0;margin:0}
.vs li{padding:10px 0;border-top:1px solid rgba(127,127,127,.18);display:flex;gap:10px}
.vs .new li b{color:var(--mint)}
.step{display:flex;flex-direction:column;gap:10px}
.step .n{font-family:Sora;font-weight:800;font-size:30px;color:var(--teal);line-height:1}
.feat .ic{width:44px;height:44px;border-radius:12px;background:#E1F1EF;color:var(--teal-d);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.feat .ic svg{width:22px;height:22px}
.feat h3{margin-bottom:6px}
.price{display:flex;flex-direction:column;gap:12px;position:relative}
.price.best{border:2px solid var(--teal);box-shadow:0 18px 40px rgba(15,163,163,.18)}
.price .flag{position:absolute;top:-13px;left:20px;background:var(--teal);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:4px 12px}
.price .val{font-family:Sora;font-weight:800;font-size:26px;letter-spacing:-.03em}
.price ul{padding-left:0;list-style:none;margin:4px 0 8px}
.price li{padding:6px 0;display:flex;gap:8px;font-size:14px}
.price li::before{content:"✓";color:var(--teal-d);font-weight:800}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:16px}
.faq p{color:var(--ink2);margin:10px 0 0}
.lp-cta{background:linear-gradient(120deg,#0FA3A3,#0B7F7F);color:#fff;text-align:center}
.lp-cta h2{margin:0 auto;color:#fff}
.lp-foot .lp-wm b{color:#fff}.lp-foot .lp-wm b span{color:var(--mint)}.lp-foot{background:#04262E;color:#9FC4BF;padding:34px 0;font-size:13px}
.lp-img{width:100%;border-radius:18px;display:block;object-fit:cover}.float-kpi{position:absolute;left:-22px;bottom:-26px;padding:12px 16px;box-shadow:0 14px 34px rgba(6,52,63,.25);color:var(--ink)}.float-tag{position:absolute;right:-14px;top:22px;padding:10px 14px;box-shadow:0 14px 34px rgba(6,52,63,.25);color:var(--ink)}@media (max-width:860px){.float-kpi{left:10px;bottom:-22px}.float-tag{right:10px}}
@media (max-width:860px){.hero-mini{grid-template-columns:repeat(3,minmax(0,1fr))}.mock .grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.lp-hero .lp-in{grid-template-columns:minmax(0,1fr);padding-top:44px}.vs{grid-template-columns:minmax(0,1fr)}.lp-links a.hide-s{display:none}.mock{transform:none}}

.kick{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-d);margin-bottom:10px}
.lp-center{text-align:center}.lp-center h2,.lp-center .lead{margin-left:auto;margin-right:auto}
.pill-k{display:inline-flex;align-items:center;gap:8px;background:rgba(94,242,200,.14);color:var(--mint);font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px}
.pill-k svg{width:16px;height:16px}
.hero-ck{list-style:none;padding:0;margin:0 0 26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.ck{display:flex;gap:10px;align-items:center;font-size:14px}
.ck-i{flex:none;width:22px;height:22px;border-radius:99px;background:var(--mint);color:var(--ink);display:flex;align-items:center;justify-content:center}
.ck-i svg{width:14px;height:14px;stroke-width:3}
.lp-hero .ck{color:#E3F5F2}
.ck-list{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.ck-list .ck-i{background:#E1F1EF;color:var(--teal-d)}
.ck-list.light .ck{color:#E3F5F2}.ck-list.light .ck-i{background:var(--mint);color:var(--ink)}
.lp-checks svg{width:16px;height:16px}
.hero-mini{margin-top:40px;gap:12px}
.mini{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;color:#fff}
.mini svg{width:22px;height:22px;color:var(--mint);margin-bottom:4px}.mini span{font-size:12px;color:#BFE3DE}
.lp-marq{background:#052A33;padding:30px 0 34px;overflow:hidden}
.marq{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq-t{display:flex;gap:14px;width:max-content;animation:marq 55s linear infinite}
.marq:hover .marq-t{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.lg-card{flex:none;height:64px;min-width:120px;padding:8px 16px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}.lg-card img{max-height:44px;max-width:150px;width:auto;height:auto;display:block}.marq-t.rev{animation-direction:reverse;animation-duration:60s}
@media (prefers-reduced-motion:reduce){.marq-t{animation:none;flex-wrap:wrap;width:auto;justify-content:center}}
.m-item{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:12px;padding:10px 16px 10px 10px;font-weight:700;font-family:Sora;font-size:15px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.m-badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#06343F,#0FA3A3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.02em}
.strip-i{display:flex;gap:12px;align-items:center}
.ic-c{flex:none;width:42px;height:42px;border-radius:12px;background:#E1F1EF;color:var(--teal-d);display:inline-flex;align-items:center;justify-content:center}
.ic-c svg{width:22px;height:22px}.ic-c.lg{width:52px;height:52px;border-radius:14px}.ic-c.lg svg{width:26px;height:26px}
.ic-c.xl{width:76px;height:76px;border-radius:20px}.ic-c.xl svg{width:40px;height:40px}
.lp-dark{background:linear-gradient(160deg,#06343F,#0A4E5A);color:#fff}
.lp-dark .kick{color:var(--mint)}.lp-dark h2{color:#fff}.lp-dark .lead{color:#CBE9E4}
.dif{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:24px}
.dif .ic-c{background:var(--mint);color:var(--ink)}
.dif .num{font-family:Sora;font-weight:800;font-size:22px;color:rgba(255,255,255,.18)}
.dif h3{color:#fff;margin:14px 0 6px;font-size:16px}.dif p{color:#CBE9E4;margin:0;font-size:14.5px}
.cmp th,.cmp td{padding:14px 18px;font-size:15px}.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center;width:150px}
.cmp .hl{background:#EFFAF8}.cmp th.hl{color:var(--teal-d)}
.yes,.nope{display:inline-flex;width:26px;height:26px;border-radius:99px;align-items:center;justify-content:center}
.yes{background:var(--ok-bg);color:var(--ok)}.nope{background:var(--bad-bg);color:var(--bad)}
.yes svg,.nope svg{width:15px;height:15px;stroke-width:3}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.sim-mock{box-shadow:0 24px 50px rgba(6,52,63,.14)}
.doss-row{display:flex;gap:12px;overflow-x:auto;padding:26px 2px 6px;scroll-snap-type:x mandatory}
.doss-card{flex:none;width:190px;scroll-snap-align:start;background:linear-gradient(160deg,#06343F,#0B6B6B);color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.doss-card .ic-c{background:rgba(94,242,200,.18);color:var(--mint)}.doss-card .sub{color:#BFE3DE}
.demo{background:#fff;color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.demo-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dq{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.dq.cur{background:var(--ink);color:#fff;border-color:var(--ink)}.dq.okk{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}.dq.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:11px;font-weight:700;color:var(--mute);text-align:center;padding:4px 0}
.cal-d{min-height:54px;border:1px solid #E5EFEE;border-radius:8px;padding:4px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.cal-d b{font-weight:600;color:var(--ink2)}
.cal-d.ev{background:#EFFAF8;border-color:#A9D8D3}
.cal-d i{font-style:normal;font-size:10px;font-weight:700;background:var(--teal);color:#fff;border-radius:4px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bad-list{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:12px}
.bad-list li{display:flex;gap:12px;align-items:center;font-size:15px}
.sol{background:linear-gradient(160deg,#06343F,#0B6B6B);border-radius:22px;padding:34px}
.sol .ic-c{background:var(--mint);color:var(--ink)}
.guar{display:flex;gap:26px;align-items:center;background:#EFFAF8;border:1px solid #BDEBDD;border-radius:22px;padding:30px}
.guar .ic-c{background:var(--teal);color:#fff}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr);gap:28px}.hero-ck,.ck-list{grid-template-columns:minmax(0,1fr)}.guar{flex-direction:column;text-align:center}.cmp td:not(:first-child),.cmp th:not(:first-child){width:auto}}
@media (max-width:1000px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:800px){
  .app{flex-direction:column}
  .side{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:30}
  .topbar b{font-family:Sora;font-weight:800;font-size:19px;letter-spacing:-.04em}.topbar b span{color:var(--mint)}
  .topbar button{background:transparent;border:0;color:#fff;width:44px;height:44px}
  .main{padding:18px 14px 50px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
}

function qById(id){return Q.find(q=>q.id===id);}
function stats(filterArea){
  let tot=0,ok=0;const by={};AREAS.forEach(a=>by[a]={t:0,o:0});const byTema={};
  Object.entries(S.ans).forEach(([id,r])=>{const q=qById(id);if(!q)return;if(filterArea&&q.area!==filterArea)return;
    tot++;if(r.ok)ok++;by[q.area].t++;if(r.ok)by[q.area].o++;
    byTema[q.tema]=byTema[q.tema]||{t:0,o:0,area:q.area};byTema[q.tema].t++;if(r.ok)byTema[q.tema].o++;});
  return {tot,ok,err:tot-ok,pct:tot?Math.round(ok/tot*100):0,by,byTema};
}
function daysTo(d){if(!d)return null;const t=new Date(d+"T00:00:00");const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
function fmtDate(d){if(!d)return"";const [y,m,dd]=d.split("-");return dd+"/"+m+"/"+y;}
function rankPos(){const s=stats();const base=1240;const p=Math.max(1,Math.round(base*(1-(s.pct/100)*0.92)-s.tot*3));return s.tot?p:null;}

/* ================= CHARTS ================= */
function barChart(items,opt){ // items [{label,value,max?,color}]
  opt=opt||{};const W=640,H=opt.h||220,pl=34,pb=38,pt=14,pr=10;const n=items.length||1;
  const max=opt.max||Math.max(1,...items.map(i=>i.value));const bw=Math.min(46,(W-pl-pr)/n*0.6);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||"Gráfico de barras")+'">';
  for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*(1-k/4);const v=Math.round(max*k/4);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#E3EEEC"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+(opt.unit||"")+'</text>';}
  items.forEach((it,i)=>{const cx=pl+(W-pl-pr)*(i+0.5)/n;const h=(H-pt-pb)*(it.value/max);const y=H-pb-h;
    s+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="5" fill="'+(it.color||"#0FA3A3")+'"><title>'+esc(it.label)+': '+it.value+(opt.unit||"")+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(y-5)+'" text-anchor="middle" style="fill:#06343F;font-weight:600">'+it.value+(opt.unit||"")+'</text>';
    s+='<text x="'+cx+'" y="'+(H-pb+16)+'" text-anchor="middle">'+esc(it.short||it.label)+'</text>';});
  return s+'</svg>';
}
function lineChart(pts,opt){ // pts [{label,value}]
  opt=opt||{};const W=640,H=opt.h||220,pl=34,pb=34,pt=16,pr=16;const max=opt.max||100;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||"Gráfico de linha")+'">';
  for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*(1-k/4);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#E3EEEC"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*k/4)+(opt.unit||"")+'</text>';}
  if(opt.goal!=null){const y=pt+(H-pt-pb)*(1-opt.goal/max);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#C08A1E" stroke-dasharray="5 4"/><text x="'+(pl+6)+'" y="'+(y-6)+'" text-anchor="start" style="fill:#8A5A00;font-weight:600">'+esc(opt.goalLabel||"meta")+'</text>';}
  const n=pts.length;if(!n)return s+'</svg>';
  const xy=pts.map((p,i)=>[pl+(W-pl-pr)*(n===1?0.5:i/(n-1)),pt+(H-pt-pb)*(1-p.value/max)]);
  s+='<path d="M'+xy.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+'" fill="none" stroke="#0FA3A3" stroke-width="3" stroke-linejoin="round"/>';
  xy.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#fff" stroke="#06343F" stroke-width="2.5"><title>'+esc(pts[i].label)+': '+pts[i].value+(opt.unit||"")+'</title></circle><text x="'+p[0]+'" y="'+(H-pb+16)+'" text-anchor="middle">'+esc(pts[i].label)+'</text>';});
  return s+'</svg>';
}
function donut(pct,color,size){size=size||120;const r=size/2-10,c=2*Math.PI*r;return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+pct+'%"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#E5EFEE" stroke-width="12"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(color||"#0FA3A3")+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*pct/100)+' '+c+'" transform="rotate(-90 '+size/2+' '+size/2+')"/><text x="50%" y="54%" text-anchor="middle" style="font-family:Sora;font-weight:800;font-size:'+(size/5)+'px;fill:#06343F">'+pct+'%</text></svg>';}

const DOSS_HTML='<h2 id="d-raio">1. Raio-X da banca</h2><p>Cada dossiê começa com a distribuição das questões por grande área e os temas que mais se repetem. Com isso você vê para onde a banca puxa e onde vale gastar mais tempo.</p><div class="chart card" id="d-chart"></div><p class="sub" style="font-size:13px">Dados ilustrativos no Dossiê Modelo. Nos dossiês reais, a contagem vem das provas oficiais de 2022 a 2026.</p>'+

'<h3>Pré-eclâmpsia</h3><p>É a PA de 140 x 90 mmHg ou mais após 20 semanas, com proteinúria (300 mg/24 h ou mais, ou relação proteína/creatinina de 0,3 ou mais) ou sinal de lesão de órgão-alvo. Os sinais de gravidade incluem PA de 160 x 110 ou mais, plaquetas abaixo de 100 mil, sintomas neurológicos, dor epigástrica e alteração de função hepática ou renal.</p><div class="box"><b>Conduta:</b> sulfato de magnésio para prevenir convulsão, anti-hipertensivo de ação rápida (hidralazina ou nifedipina) na crise e programação do parto conforme a gravidade e a idade gestacional.</div>'+
'<h3>Apendicite aguda</h3><p>A dor começa periumbilical e migra para a fossa ilíaca direita, com anorexia, náuseas e febre baixa. O diagnóstico é clínico. Sinais clássicos: Blumberg, Rovsing, psoas e obturador. Na dúvida, o adulto faz tomografia; a criança e a gestante fazem ultrassom.</p>'+

function filteredQ(){return Q.filter(q=>(!qf.area||q.area===qf.area)&&(!qf.tema||q.tema===qf.tema)&&(!qf.status||(qf.status==="nao"&&!S.ans[q.id])||(qf.status==="erradas"&&S.ans[q.id]&&!S.ans[q.id].ok)||(qf.status==="certas"&&S.ans[q.id]&&S.ans[q.id].ok)||(qf.status==="salvas"&&S.saved.includes(q.id))));}
function qCard(q,mode){ // mode: 'bank' | 'sim'
  const ans=mode==="bank"?S.ans[q.id]:null;const show=mode==="bank"&&qview.show;
  const sel=mode==="sim"?run.ans[q.id]:qview.sel;
  let alts=q.a.map((t,i)=>{let cl="alt";if(show){if(i===q.c)cl+=" right";else if(i===sel)cl+=" wrong";}else if(sel===i)cl+=" sel";if(!show&&qview.cut[q.id+"_"+i])cl+=" cut";
    return '<button class="'+cl+'" data-act="'+(mode==="sim"?"sim-pick":"pick")+'" data-i="'+i+'"><span class="lt">'+L[i]+'</span><span>'+esc(t)+'</span></button>';}).join("");
  let foot='';
  if(mode==="bank"){
    foot='<div class="row" style="margin-top:8px;justify-content:space-between"><div class="row" style="gap:8px">'+(!show?'<button class="btn" data-act="answer" '+(sel==null?"disabled":"")+'>Responder</button>':'')+
      '<button class="btn ghost" data-act="save-q" data-id="'+q.id+'">'+(S.saved.includes(q.id)?"★ Salva":"☆ Salvar")+'</button></div><div class="row" style="gap:8px"><button class="btn ghost" data-act="q-prev">Anterior</button><button class="btn dark" data-act="q-next">Próxima</button></div></div>';
    if(show){foot+='<div class="coment"><div class="row" style="align-items:center;gap:10px">'+(sel===q.c?'<span class="tag ok">Você acertou</span>':'<span class="tag bad">Resposta correta: '+L[q.c]+'</span>')+'<b>Comentário</b></div><p style="margin:10px 0 0">'+esc(q.com)+'</p>'+
      '<div class="resumo"><table><thead><tr>'+q.tab[0].map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+q.tab.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'+
      (qview.tutor?'<div class="tutor"><b style="display:flex;gap:8px;align-items:center">'+ic("bot").replace('aria-hidden="true"','aria-hidden="true" width="18" height="18"')+'Tutor MedRise</b><p style="margin:8px 0 0">'+esc(q.tut)+'</p></div>':'<button class="btn ghost" style="margin-top:12px" data-act="tutor">'+ic("bot").replace('<svg','<svg width="18" height="18"')+'Não entendi, me explica de outro jeito</button>')+'</div>';}
  }
  return '<div class="card"><div class="row" style="gap:8px;align-items:center"><span class="tag" style="background:'+AREA_COLOR[q.area]+'1A;color:'+AREA_COLOR[q.area]+'">'+esc(q.area)+'</span><span class="tag gray">'+esc(q.tema)+'</span><span class="tag gray">'+q.dif+'</span><span class="tag warn">Questão de exemplo</span></div>'+
   '<p class="q-enun">'+esc(q.e)+'</p>'+alts+(mode==="bank"&&!show?'<p class="sub" style="font-size:12px;margin:4px 0 0">Dica: clique com o botão direito numa alternativa pra riscá-la.</p>':'')+foot+'</div>';
}

function buildPlan(){
  const u=S.user;const s=stats();const d=daysTo(u.data);const weeks=Math.max(1,Math.min(12,d!=null&&d>0?Math.ceil(d/7):8));
  const weight={};AREAS.forEach(a=>{const b=s.by[a];const acc=b.t?b.o/b.t:0.5;weight[a]=1+(1-acc);});
  const tw=AREAS.reduce((x,a)=>x+weight[a],0);
  const temasPorArea={};Q.forEach(q=>{(temasPorArea[q.area]=temasPorArea[q.area]||[]);if(!temasPorArea[q.area].includes(q.tema))temasPorArea[q.area].push(q.tema);});
  const plan=[];for(let w=0;w<weeks;w++){const items=AREAS.map(a=>{const h=Math.max(1,Math.round(u.horas*weight[a]/tw));const ts=temasPorArea[a];return {area:a,h,tema:ts[w%ts.length]};});
    plan.push({w:w+1,items,rev:w%2===1,sim:w%2===1});}
  return {weeks,plan,weight,tw};
}

/* ================= RENDER ================= */
let tick=null;
function render(){
  const root=$("#root");hideBar();
  const [r,p]=route();
  if(r==="home"||(!S.user&&r!=="cadastro")){root.innerHTML=vLanding();return;}
  if(!S.user){root.innerHTML=vOnboard();return;}
  let html;
  switch(r){
    case "especialidade":html=vEspecialidade();break;
    case "dossies":html=vDossies();break;
    case "dossie":html=vDossie(p);break;
    case "questoes":html=vQuestoes();break;
    case "simulados":html=vSimulados();break;
    case "sim":html=vSim();break;
    case "res":html=vRes(p);break;
    case "calendario":html=vCalendario();break;
    case "cronograma":html=vCronograma();break;
    case "desempenho":html=vDesempenho();break;
    case "erros":html=vErros();break;
    case "salvos":html=vSalvos();break;
    case "flashcards":html=vFlash();break;
    case "ranking":html=vRanking();break;
    case "avisos":html=vAvisos();break;
    case "perfil":html=vPerfil();break;
    default:html=vInicio();
  }
  root.innerHTML=shell(html);
  if(r==="dossie")afterDossie();
  clearInterval(tick);if(r==="sim"&&run){tick=setInterval(()=>{const el=$("#timer");if(!el){clearInterval(tick);return;}const left=Math.max(0,run.end-Date.now());el.textContent=String(Math.floor(left/60000)).padStart(2,"0")+":"+String(Math.floor(left/1000)%60).padStart(2,"0");if(left<=0){clearInterval(tick);finishSim();}},1000);}
}
window.addEventListener("hashchange",()=>{qview={sel:null,show:false,tutor:false,cut:qview.cut};render();window.scrollTo(0,0);});

/* ================= ACTIONS ================= */
function finishSim(){
  if(!run)return;const by={};AREAS.forEach(a=>by[a]={t:0,o:0});let ok=0;
  run.qs.forEach(id=>{const q=qById(id);const a=run.ans[id];const r=a===q.c;by[q.area].t++;if(r){ok++;by[q.area].o++;}if(a!=null)S.ans[id]={ok:r,ch:a,ts:Date.now()};else S.ans[id]={ok:false,ch:null,ts:Date.now()};});
  const d=new Date();S.sims.push({sid:run.sid,nome:run.nome,dt:d.toLocaleDateString("pt-BR"),ok,total:run.qs.length,by,qs:run.qs,ans:run.ans,secs:Math.round((Date.now()-run.start)/1000)});
  save();const idx=S.sims.length-1;run=null;location.hash="#res/"+idx;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,v=t.dataset.v;
  if(a==="demo-pick"){const id=DEMO_Q[demo.i];if(demo.show[id])return;demo.sel[id]=+t.dataset.i;$("#demo-box").innerHTML=demoBox();return;}
  if(a==="demo-answer"){demo.show[DEMO_Q[demo.i]]=true;$("#demo-box").innerHTML=demoBox();return;}
  if(a==="demo-go"){demo.i=+t.dataset.i;$("#demo-box").innerHTML=demoBox();return;}
  if(a==="menu"){$("#side").classList.toggle("open");return;}
  // onboarding
  if(a==="ob-fase"){ob.fase=v;}
  if(a==="ob-tipo"){ob.tipo=v;ob.esp="";}
  if(a==="ob-esp"){ob.esp=v;}
  if(a==="ob-banca"){ob.bancas=ob.bancas.includes(v)?ob.bancas.filter(x=>x!==v):ob.bancas.concat(v);}
  if(a==="ob-back"){ob.step--;}
  if(a==="ob-next"){if(ob.step<3){ob.step++;}else{S.user={nome:ob.nome.trim(),tipo:ob.tipo,esp:ob.esp,bancas:ob.bancas,data:ob.data,horas:+ob.horas||20,fase:ob.fase};save();location.hash="#inicio";}}
  if(a.startsWith("ob-")){render();return;}
  // questions
  if(a==="pick"){if(qview.show)return;qview.sel=+t.dataset.i;render();return;}
  if(a==="answer"){const q=filteredQ()[qf.idx];S.ans[q.id]={ok:qview.sel===q.c,ch:qview.sel,ts:Date.now()};save();qview.show=true;render();return;}
  if(a==="tutor"){qview.tutor=true;render();return;}
  if(a==="q-next"||a==="q-prev"){const n=filteredQ().length;qf.idx=(qf.idx+(a==="q-next"?1:-1)+n)%n;qview={sel:null,show:false,tutor:false,cut:qview.cut};render();window.scrollTo(0,0);return;}
  if(a==="save-q"){const id=t.dataset.id;S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):S.saved.concat(id);save();toast(S.saved.includes(id)?"Questão salva":"Removida dos salvos");render();return;}
  // simulados
  if(a==="sim-start"){const s=SIMULADOS.find(x=>x.id===t.dataset.id);run={sid:s.id,nome:s.nome,qs:s.qs.slice(),i:0,ans:{},start:Date.now(),end:Date.now()+s.min*60000};location.hash="#sim";return;}
  if(a==="sim-pick"){run.ans[run.qs[run.i]]=+t.dataset.i;render();return;}
  if(a==="sim-next"){run.i=Math.min(run.qs.length-1,run.i+1);render();return;}
  if(a==="sim-prev"){run.i=Math.max(0,run.i-1);render();return;}
  if(a==="sim-go"){run.i=+t.dataset.i;render();return;}
  if(a==="sim-finish"){const miss=run.qs.length-Object.keys(run.ans).length;if(miss>0&&!t.dataset.sure){t.dataset.sure="1";t.textContent="Faltam "+miss+". Entregar mesmo assim?";return;}finishSim();return;}
  // others
  if(a==="lembrete"){toast("Lembrete de "+v+" ativado");return;}
  if(a==="goto"){const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:"smooth"});return;}
  if(a==="hl-clear"){delete S.hl[t.dataset.id];S.notes=S.notes.filter(n=>n.id!==t.dataset.id);save();render();toast("Grifos apagados");return;}
  if(a==="redo-errs"){qf={area:"",tema:"",status:"erradas",idx:0};location.hash="#questoes";return;}
  if(a==="flip"){flash.flip=!flash.flip;render();return;}
  if(a==="card"){const q=dueCards()[flash.i];S.cards[q.id]={due:Date.now()+(+v)*864e5};save();flash.flip=false;render();return;}
  if(a==="p-banca"){const u=S.user;u.bancas=u.bancas.includes(v)?u.bancas.filter(x=>x!==v):u.bancas.concat(v);save();render();return;}
  if(a==="p-save"){const u=S.user;u.nome=$("#p-nome").value.trim()||u.nome;const tp=$("#p-tipo").value;if(tp!==u.tipo){u.tipo=tp;u.esp=(tp==="R1"?ESPEC_R1[0]:ESPEC_RMAIS[0][0]);}else u.esp=$("#p-esp").value;u.data=$("#p-data").value;u.horas=+$("#p-horas").value||u.horas;save();toast("Perfil salvo");render();return;}
  if(a==="reset"){if(!t.dataset.sure){t.dataset.sure="1";t.textContent="Clique de novo pra confirmar";return;}S=blank();save();ob={step:0,nome:"",tipo:"R1",esp:"",bancas:[],data:"",horas:20,fase:"Internato"};location.hash="#home";render();return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.f){qf[t.dataset.f]=t.value;if(t.dataset.f==="area")qf.tema="";qf.idx=0;qview={sel:null,show:false,tutor:false,cut:qview.cut};render();return;}
  if(t.dataset.act==="plan-done"){S.plan.done[t.dataset.k]=t.checked;save();return;}
  if(t.id==="p-tipo"){S.user.tipo=t.value;S.user.esp=(t.value==="R1"?ESPEC_R1[0]:ESPEC_RMAIS[0][0]);save();render();}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="ob-nome"){ob.nome=t.value;const b=document.querySelector('[data-act="ob-next"]');if(b)b.disabled=!t.value.trim();}
  if(t.id==="ob-data")ob.data=t.value;if(t.id==="ob-horas")ob.horas=t.value;});
document.addEventListener("contextmenu",e=>{const t=e.target.closest('[data-act="pick"]');if(!t||qview.show)return;e.preventDefault();const q=filteredQ()[qf.idx];const k=q.id+"_"+t.dataset.i;qview.cut[k]=!qview.cut[k];render();});
document.addEventListener("keydown",e=>{const t=e.target.closest('[data-act="flip"]');if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click();}});

/* ================= HIGHLIGHT ================= */
let selRange=null;
function hideBar(){const b=$("#hlbar");if(b)b.style.display="none";}
document.addEventListener("mouseup",e=>{
  if(e.target.closest("#hlbar"))return;
  const art=document.getElementById("doss");if(!art){hideBar();return;}
  const sel=window.getSelection();if(!sel||sel.isCollapsed||!art.contains(sel.anchorNode)||!art.contains(sel.focusNode)){hideBar();return;}
  selRange=sel.getRangeAt(0).cloneRange();const r=selRange.getBoundingClientRect();const b=$("#hlbar");
  b.style.display="flex";b.style.left=Math.max(8,r.left+r.width/2-90)+"px";b.style.top=Math.max(8,r.top-50)+"px";
});
$("#hlbar").addEventListener("mousedown",e=>e.preventDefault());
$("#hlbar").addEventListener("click",e=>{
  const btn=e.target.closest("[data-hl]");if(!btn||!selRange)return;const art=document.getElementById("doss");if(!art)return;
  let c=btn.dataset.hl,nota="";if(c==="note"){c="h1";}
  const txt=selRange.toString().trim();if(!txt){hideBar();return;}
  const mark=document.createElement("mark");mark.className=c;
  try{mark.appendChild(selRange.extractContents());selRange.insertNode(mark);}catch(err){toast("Não consegui grifar esse trecho");return;}
  window.getSelection().removeAllRanges();hideBar();
  const id=art.dataset.id;S.hl[id]=art.innerHTML.replace(/<div class="chart card" id="d-chart">[\s\S]*?<\/div><p class="sub" style="font-size:13px">/, '<div class="chart card" id="d-chart"></div><p class="sub" style="font-size:13px">');
  const n={id,doss:(DOSSIES.find(d=>d.id===id)||{}).nome,txt,c,nota};
  if(btn.dataset.hl==="note"){openNote(n);}else{S.notes.push(n);save();toast("Trecho grifado");}
  afterDossie();
});
function openNote(n){
  const box=document.createElement("div");box.className="card";box.style.cssText="position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:50;width:min(420px,92vw);box-shadow:0 10px 40px rgba(6,52,63,.3)";
  box.innerHTML='<h3>Nota sobre o trecho</h3><p class="sub" style="margin:6px 0">"'+esc(n.txt.slice(0,120))+'"</p><textarea id="note-t" style="width:100%" placeholder="Escreva sua anotação"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost sm" id="note-c">Cancelar</button><button class="btn sm" id="note-s">Salvar nota</button></div>';
  document.body.appendChild(box);box.querySelector("#note-t").focus();
  box.querySelector("#note-c").onclick=()=>{S.notes.push(n);save();box.remove();};
  box.querySelector("#note-s").onclick=()=>{n.nota=box.querySelector("#note-t").value.trim();S.notes.push(n);save();box.remove();toast("Nota salva");};
}

render();
})();
</script>
</body>
</html>
