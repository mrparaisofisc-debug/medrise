function barChart(items,opt){ // items [{label,value,max?,color}]
  opt=opt||{};const W=640,H=opt.h||220,pl=34,pb=38,pt=14,pr=10;const n=items.length||1;
  const max=opt.max||Math.max(1,...items.map(i=>i.value));const bw=Math.min(46,(W-pl-pr)/n*0.6);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||"Gráfico de barras")+'">';
  for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*(1-k/4);const v=Math.round(max*k/4);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#E3EEEC"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+(opt.unit||"")+'</text>';}
  items.forEach((it,i)=>{const cx=pl+(W-pl-pr)*(i+0.5)/n;const h=(H-pt-pb)*(it.value/max);const y=H-pb-h;
    s+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="5" fill="'+(it.color||"#0FA3A3")+'"><title>'+esc(it.label)+': '+it.value+(opt.unit||"")+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(y-5)+'" text-anchor="middle" style="fill:#06343F;font-weight:600">'+it.value+(opt.unit||"")+'</text>';
    s+='<text x="'+cx+'" y="'+(H-pb+16)+'" text-anchor="middle">'+esc(it.short||it.label)+'</text>';});
  return s+'</svg>';
}
function lineChart(pts,opt){ // pts [{label,value}]
  opt=opt||{};const W=640,H=opt.h||220,pl=34,pb=34,pt=16,pr=16;const max=opt.max||100;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||"Gráfico de linha")+'">';
  for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*(1-k/4);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#E3EEEC"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*k/4)+(opt.unit||"")+'</text>';}
  if(opt.goal!=null){const y=pt+(H-pt-pb)*(1-opt.goal/max);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#C08A1E" stroke-dasharray="5 4"/><text x="'+(pl+6)+'" y="'+(y-6)+'" text-anchor="start" style="fill:#8A5A00;font-weight:600">'+esc(opt.goalLabel||"meta")+'</text>';}
  const n=pts.length;if(!n)return s+'</svg>';
  const xy=pts.map((p,i)=>[pl+(W-pl-pr)*(n===1?0.5:i/(n-1)),pt+(H-pt-pb)*(1-p.value/max)]);
  s+='<path d="M'+xy.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+'" fill="none" stroke="#0FA3A3" stroke-width="3" stroke-linejoin="round"/>';
  xy.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#fff" stroke="#06343F" stroke-width="2.5"><title>'+esc(pts[i].label)+': '+pts[i].value+(opt.unit||"")+'</title></circle><text x="'+p[0]+'" y="'+(H-pb+16)+'" text-anchor="middle">'+esc(pts[i].label)+'</text>';});
  return s+'</svg>';
}
function donut(pct,color,size){size=size||120;const r=size/2-10,c=2*Math.PI*r;return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+pct+'%"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#E5EFEE" stroke-width="12"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(color||"#0FA3A3")+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*pct/100)+' '+c+'" transform="rotate(-90 '+size/2+' '+size/2+')"/><text x="50%" y="54%" text-anchor="middle" style="font-family:Sora;font-weight:800;font-size:'+(size/5)+'px;fill:#06343F">'+pct+'%</text></svg>';}

function dossHTML(d){
  const qs=Q.filter(q=>q.banca===d.banca);const n=qs.length;
  const byA={};AREAS.forEach(a=>byA[a]=qs.filter(q=>q.area===a));
  let h='<h2 id="d-raio">1. Raio-X da banca</h2><p>Análise de <b>'+n+' questões válidas</b> da prova '+esc(d.banca)+' '+d.anos+' (anuladas e excluídas ficaram de fora). A prova cobra as cinco grandes áreas, com peso maior em <b>'+AREAS.slice().sort((x,y)=>byA[y].length-byA[x].length)[0]+'</b>.</p><div class="chart card" id="d-chart"></div>';
  h+='<h2 id="d-top">2. Temas cobrados</h2>';
  AREAS.forEach(a=>{const t={};byA[a].forEach(q=>t[q.tema]=(t[q.tema]||0)+1);h+='<h3>'+a+' ('+byA[a].length+')</h3><p>'+Object.entries(t).sort((x,y)=>y[1]-x[1]).map(([k,v])=>esc(k)+(v>1?' <b>('+v+')</b>':'')).join(' · ')+'</p>';});
  h+='<h2 id="d-resumo">3. Resumo de alto rendimento</h2><p>O essencial de cada tema que caiu, direto ao ponto.</p>';
  AREAS.forEach(a=>{if(!byA[a].length)return;h+='<h3 style="margin-top:22px;color:'+AREA_COLOR[a]+'">'+a+'</h3>';
    byA[a].forEach(q=>{h+='<p><b>'+esc(q.tema)+'.</b> '+esc(q.com)+'</p><div class="resumo"><table><thead><tr>'+q.tab[0].map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>'+q.tab.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';});});
  const rel=qs.filter((q,i)=>i%9===0).slice(0,8);
  h+='<h2 id="d-relampago">4. Questões relâmpago</h2>'+rel.map(q=>'<div class="box"><b>'+esc(q.tema)+':</b> '+esc(q.tut)+'</div>').join("");
  h+='<h2 id="d-nao">5. O que a banca não costuma cobrar</h2><p>Essa seção fica mais precisa a cada ano de prova analisado. Por enquanto, com '+d.anos+' analisado, o padrão é de questões clínicas práticas, com casos de atenção primária e urgência, e pouca cobrança de detalhes de fisiopatologia ou doses exatas.</p>';
  h+='<h2 id="d-vespera">6. Checklist da véspera</h2><ul>'+qs.filter((q,i)=>i%6===2).slice(0,14).map(q=>'<li><b>'+esc(q.tema)+':</b> '+esc(q.tut)+'</li>').join("")+'</ul>';
  return h;
}

function buildPlan(){
  const u=S.user;const s=stats();const d=daysTo(u.data);const weeks=Math.max(1,Math.min(12,d!=null&&d>0?Math.ceil(d/7):8));
  const weight={};AREAS.forEach(a=>{const b=s.by[a];const acc=b.t?b.o/b.t:0.5;weight[a]=1+(1-acc);});
  const tw=AREAS.reduce((x,a)=>x+weight[a],0);
  const temasPorArea={};Q.forEach(q=>{(temasPorArea[q.area]=temasPorArea[q.area]||[]);if(!temasPorArea[q.area].includes(q.tema))temasPorArea[q.area].push(q.tema);});
  const plan=[];for(let w=0;w<weeks;w++){const items=AREAS.map(a=>{const h=Math.max(1,Math.round(u.horas*weight[a]/tw));const ts=temasPorArea[a];return {area:a,h,tema:ts[w%ts.length]};});
    plan.push({w:w+1,items,rev:w%2===1,sim:w%2===1});}
  return {weeks,plan,weight,tw};
}

  '<section class="lp-band" id="como"><div class="lp-in">'+sTitle("Como funciona","Um caminho simples pra estudar com estratégia","",true)+'<div class="grid g4" style="margin-top:34px">'+[["user","Diga sua residência","R1 ou R+, especialidade, provas e horas por semana."],["plan","Receba seu plano","Dossiês das suas bancas e cronograma semanal prontos."],["quiz","Treine","Questões, simulados e Tutor sempre que travar."],["trophy","Evolua até a prova","Gráficos, ranking e revisão do que você erra."]].map((x,k)=>'<div class="card step"><div class="row" style="justify-content:space-between;align-items:center"><span class="n">0'+(k+1)+'</span><span class="ic-c">'+ic(x[0])+'</span></div><h3>'+x[1]+'</h3><p class="sub" style="margin:0">'+x[2]+'</p></div>').join("")+'</div></div></section>'+
  /* PLANOS */
  '<section class="lp-band soft" id="planos"><div class="lp-in">'+sTitle("Escolha seu plano","Comece hoje e estude do jeito certo","Mesma plataforma completa, duas formas de acesso.",true)+'<div class="grid g2" style="margin:40px auto 0;max-width:860px;align-items:stretch">'+
   plans.map(p=>'<div class="card price '+(p[6]?"best":"")+'">'+(p[6]?'<span class="flag">Mais vantajoso</span>':'')+'<div><h3>'+p[0]+'</h3><span class="sub">'+p[1]+'</span></div><div><span class="val">'+p[2]+'</span> <span class="sub">'+p[3]+'</span></div><span class="sub">'+p[4]+'</span>'+(p[7]?'<span class="tag ok" style="align-self:flex-start">'+p[7]+'</span>':'')+'<ul>'+p[5].map(x=>'<li>'+x+'</li>').join("")+'</ul><a class="btn '+(p[6]?"":"dark")+'" href="#cadastro" style="margin-top:auto">Comprar agora</a></div>').join("")+'</div></div></section>'+
  /* GARANTIA */
  '<section class="lp-band"><div class="lp-in"><div class="guar"><span class="ic-c xl">'+ic("shield")+'</span><div><h2 style="font-size:24px">Garantia de 7 dias</h2><p class="lead" style="margin-top:6px">Entre, teste tudo, faça simulados e leia os dossiês. Se em 7 dias você achar que não é pra você, devolvemos 100% do seu dinheiro.</p></div></div></div></section>'+
  /* FAQ */
  '<section class="lp-band soft" id="faq"><div class="lp-in" style="max-width:820px">'+sTitle("Dúvidas","Perguntas frequentes","",true)+'<div class="faq" style="margin-top:20px">'+faq.map(f=>'<details><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>').join("")+'</div></div></section>'+
  /* CTA */
  '<section class="lp-band lp-cta"><div class="lp-in"><h2>Sua vaga não espera. Comece a estudar o que cai.</h2><p class="lead" style="color:#E3FBF6;margin:12px auto 0">Dossiê, questões, simulados, Tutor e cronograma. Tudo num lugar só.</p><div style="margin-top:26px">'+buy("background:#fff;color:var(--ink)")+'</div></div></section>'+
  '<footer class="lp-foot"><div class="lp-in row" style="justify-content:space-between;align-items:center">'+LOGO_FULL(38,true)+'<span>© MedRise</span></div></footer></div>';
}
/* ================= RENDER ================= */
let tick=null;
function render(){
  const root=$("#root");hideBar();
  const [r,p]=route();
  if(r==="home"||(!S.user&&r!=="cadastro")){root.innerHTML=vLanding();return;}
  if(!S.user){root.innerHTML=vOnboard();return;}
  let html;
  switch(r){
    case "especialidade":html=vEspecialidade();break;
    case "dossies":html=vDossies();break;
    case "dossie":html=vDossie(p);break;
    case "questoes":html=vQuestoes();break;
    case "simulados":html=vSimulados();break;
    case "sim":html=vSim();break;
    case "res":html=vRes(p);break;
    case "calendario":html=vCalendario();break;
    case "cronograma":html=vCronograma();break;
    case "desempenho":html=vDesempenho();break;
    case "erros":html=vErros();break;
    case "salvos":html=vSalvos();break;
    case "flashcards":html=vFlash();break;
    case "ranking":html=vRanking();break;
    case "avisos":html=vAvisos();break;
    case "perfil":html=vPerfil();break;
    default:html=vInicio();
  }
  root.innerHTML=shell(html);
  if(r==="dossie")afterDossie();
  clearInterval(tick);if(r==="sim"&&run){tick=setInterval(()=>{const el=$("#timer");if(!el){clearInterval(tick);return;}const left=Math.max(0,run.end-Date.now());el.textContent=String(Math.floor(left/60000)).padStart(2,"0")+":"+String(Math.floor(left/1000)%60).padStart(2,"0");if(left<=0){clearInterval(tick);finishSim();}},1000);}
}
window.addEventListener("hashchange",()=>{qview={sel:null,show:false,tutor:false,cut:qview.cut};render();window.scrollTo(0,0);});

/* ================= ACTIONS ================= */
function finishSim(){
  if(!run)return;const by={};AREAS.forEach(a=>by[a]={t:0,o:0});let ok=0;
  run.qs.forEach(id=>{const q=qById(id);const a=run.ans[id];const r=a===q.c;by[q.area].t++;if(r){ok++;by[q.area].o++;}if(a!=null)S.ans[id]={ok:r,ch:a,ts:Date.now()};else S.ans[id]={ok:false,ch:null,ts:Date.now()};});
  const d=new Date();S.sims.push({sid:run.sid,nome:run.nome,dt:d.toLocaleDateString("pt-BR"),ok,total:run.qs.length,by,qs:run.qs,ans:run.ans,secs:Math.round((Date.now()-run.start)/1000)});
  save();const idx=S.sims.length-1;run=null;location.hash="#res/"+idx;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,v=t.dataset.v;
  if(a==="demo-pick"){const id=DEMO_Q[demo.i];if(demo.show[id])return;demo.sel[id]=+t.dataset.i;$("#demo-box").innerHTML=demoBox();return;}
  if(a==="demo-answer"){demo.show[DEMO_Q[demo.i]]=true;$("#demo-box").innerHTML=demoBox();return;}
  if(a==="demo-go"){demo.i=+t.dataset.i;$("#demo-box").innerHTML=demoBox();return;}
  if(a==="menu"){$("#side").classList.toggle("open");return;}
  // onboarding
  if(a==="ob-fase"){ob.fase=v;}
  if(a==="ob-tipo"){ob.tipo=v;ob.esp="";}
  if(a==="ob-esp"){ob.esp=v;}
  if(a==="ob-banca"){ob.bancas=ob.bancas.includes(v)?ob.bancas.filter(x=>x!==v):ob.bancas.concat(v);}
  if(a==="ob-back"){ob.step--;}
  if(a==="ob-next"){if(ob.step<3){ob.step++;}else{S.user={nome:ob.nome.trim(),tipo:ob.tipo,esp:ob.esp,bancas:ob.bancas,data:ob.data,horas:+ob.horas||20,fase:ob.fase};save();location.hash="#inicio";}}
  if(a.startsWith("ob-")){render();return;}
  // questions
  if(a==="pick"){if(qview.show)return;qview.sel=+t.dataset.i;render();return;}
  if(a==="answer"){const q=filteredQ()[qf.idx];S.ans[q.id]={ok:qview.sel===q.c,ch:qview.sel,ts:Date.now()};save();qview.show=true;render();return;}
  if(a==="tutor"){qview.tutor=true;render();return;}
  if(a==="q-next"||a==="q-prev"){const n=filteredQ().length;qf.idx=(qf.idx+(a==="q-next"?1:-1)+n)%n;qview={sel:null,show:false,tutor:false,cut:qview.cut};render();window.scrollTo(0,0);return;}
  if(a==="save-q"){const id=t.dataset.id;S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):S.saved.concat(id);save();toast(S.saved.includes(id)?"Questão salva":"Removida dos salvos");render();return;}
  // simulados
  if(a==="sim-start"){const s=SIMULADOS.find(x=>x.id===t.dataset.id);run={sid:s.id,nome:s.nome,qs:s.qs.slice(),i:0,ans:{},start:Date.now(),end:Date.now()+s.min*60000};location.hash="#sim";return;}
  if(a==="sim-pick"){run.ans[run.qs[run.i]]=+t.dataset.i;render();return;}
  if(a==="sim-next"){run.i=Math.min(run.qs.length-1,run.i+1);render();return;}
  if(a==="sim-prev"){run.i=Math.max(0,run.i-1);render();return;}
  if(a==="sim-go"){run.i=+t.dataset.i;render();return;}
  if(a==="sim-finish"){const miss=run.qs.length-Object.keys(run.ans).length;if(miss>0&&!t.dataset.sure){t.dataset.sure="1";t.textContent="Faltam "+miss+". Entregar mesmo assim?";return;}finishSim();return;}
  // others
  if(a==="lembrete"){toast("Lembrete de "+v+" ativado");return;}
  if(a==="goto"){const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:"smooth"});return;}
  if(a==="hl-clear"){delete S.hl[t.dataset.id];S.notes=S.notes.filter(n=>n.id!==t.dataset.id);save();render();toast("Grifos apagados");return;}
  if(a==="redo-errs"){qf={area:"",tema:"",status:"erradas",idx:0};location.hash="#questoes";return;}
  if(a==="flip"){flash.flip=!flash.flip;render();return;}
  if(a==="card"){const q=dueCards()[flash.i];S.cards[q.id]={due:Date.now()+(+v)*864e5};save();flash.flip=false;render();return;}
  if(a==="p-banca"){const u=S.user;u.bancas=u.bancas.includes(v)?u.bancas.filter(x=>x!==v):u.bancas.concat(v);save();render();return;}
  if(a==="p-save"){const u=S.user;u.nome=$("#p-nome").value.trim()||u.nome;const tp=$("#p-tipo").value;if(tp!==u.tipo){u.tipo=tp;u.esp=(tp==="R1"?ESPEC_R1[0]:ESPEC_RMAIS[0][0]);}else u.esp=$("#p-esp").value;u.data=$("#p-data").value;u.horas=+$("#p-horas").value||u.horas;save();toast("Perfil salvo");render();return;}
  if(a==="reset"){if(!t.dataset.sure){t.dataset.sure="1";t.textContent="Clique de novo pra confirmar";return;}S=blank();save();ob={step:0,nome:"",tipo:"R1",esp:"",bancas:[],data:"",horas:20,fase:"Internato"};location.hash="#home";render();return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.f){qf[t.dataset.f]=t.value;if(t.dataset.f==="area")qf.tema="";qf.idx=0;qview={sel:null,show:false,tutor:false,cut:qview.cut};render();return;}
  if(t.dataset.act==="plan-done"){S.plan.done[t.dataset.k]=t.checked;save();return;}
  if(t.id==="p-tipo"){S.user.tipo=t.value;S.user.esp=(t.value==="R1"?ESPEC_R1[0]:ESPEC_RMAIS[0][0]);save();render();}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="ob-nome"){ob.nome=t.value;const b=document.querySelector('[data-act="ob-next"]');if(b)b.disabled=!t.value.trim();}
  if(t.id==="ob-data")ob.data=t.value;if(t.id==="ob-horas")ob.horas=t.value;});
document.addEventListener("contextmenu",e=>{const t=e.target.closest('[data-act="pick"]');if(!t||qview.show)return;e.preventDefault();const q=filteredQ()[qf.idx];const k=q.id+"_"+t.dataset.i;qview.cut[k]=!qview.cut[k];render();});
document.addEventListener("keydown",e=>{const t=e.target.closest('[data-act="flip"]');if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click();}});

/* ================= HIGHLIGHT ================= */
let selRange=null;
function hideBar(){const b=$("#hlbar");if(b)b.style.display="none";}
document.addEventListener("mouseup",e=>{
  if(e.target.closest("#hlbar"))return;
  const art=document.getElementById("doss");if(!art){hideBar();return;}
  const sel=window.getSelection();if(!sel||sel.isCollapsed||!art.contains(sel.anchorNode)||!art.contains(sel.focusNode)){hideBar();return;}
  selRange=sel.getRangeAt(0).cloneRange();const r=selRange.getBoundingClientRect();const b=$("#hlbar");
  b.style.display="flex";b.style.left=Math.max(8,r.left+r.width/2-90)+"px";b.style.top=Math.max(8,r.top-50)+"px";
});
$("#hlbar").addEventListener("mousedown",e=>e.preventDefault());
$("#hlbar").addEventListener("click",e=>{
  const btn=e.target.closest("[data-hl]");if(!btn||!selRange)return;const art=document.getElementById("doss");if(!art)return;
  let c=btn.dataset.hl,nota="";if(c==="note"){c="h1";}
  const txt=selRange.toString().trim();if(!txt){hideBar();return;}
  const mark=document.createElement("mark");mark.className=c;
  try{mark.appendChild(selRange.extractContents());selRange.insertNode(mark);}catch(err){toast("Não consegui grifar esse trecho");return;}
  window.getSelection().removeAllRanges();hideBar();
  const id=art.dataset.id;S.hl[id]=art.innerHTML.replace(/<div class="chart card" id="d-chart">[\s\S]*?<\/svg><\/div>/, '<div class="chart card" id="d-chart"></div>');
  const n={id,doss:(DOSSIES.find(d=>d.id===id)||{}).nome,txt,c,nota};
  if(btn.dataset.hl==="note"){openNote(n);}else{S.notes.push(n);save();toast("Trecho grifado");}
  afterDossie();
});
function openNote(n){
  const box=document.createElement("div");box.className="card";box.style.cssText="position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:50;width:min(420px,92vw);box-shadow:0 10px 40px rgba(6,52,63,.3)";
  box.innerHTML='<h3>Nota sobre o trecho</h3><p class="sub" style="margin:6px 0">"'+esc(n.txt.slice(0,120))+'"</p><textarea id="note-t" style="width:100%" placeholder="Escreva sua anotação"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost sm" id="note-c">Cancelar</button><button class="btn sm" id="note-s">Salvar nota</button></div>';
  document.body.appendChild(box);box.querySelector("#note-t").focus();
  box.querySelector("#note-c").onclick=()=>{S.notes.push(n);save();box.remove();};
  box.querySelector("#note-s").onclick=()=>{n.nota=box.querySelector("#note-t").value.trim();S.notes.push(n);save();box.remove();toast("Nota salva");};
}

render();
})();
</script>
