ina E1.", "choque neurogênico; manter suporte ventilatório, acesso venoso para fase rápida de fluido cristaloide isotônico, hidratação venosa de manutenção e administrar corticoide endovenoso.", "choque obstrutivo; manter suporte ventilatório, acesso venoso para fase rápida de fluido cristaloide isotônico e corrigir rapidamente a causa subjacente com descompressão torácica com agulha.", "choque distributivo; manter suporte ventilatório, acesso venoso para fase rápida de fluido cristaloide isotônico, hidratação venosa de manutenção, administrar antibióticos e fármacos vasoativos."], "c": 3, "com": "RN de 14 dias, sem pré-natal, parto domiciliar, com onfalite (hiperemia e edema do coto), má perfusão, taquicardia e desconforto: choque séptico, que é distributivo. A conduta é suporte ventilatório, expansão com cristaloide, manutenção e antibiótico precoce.", "tab": [["Choque", "Pista"], ["Distributivo (séptico)", "Foco infeccioso, como onfalite"], ["Cardiogênico", "Cardiopatia, hepatomegalia, piora com volume"], ["Obstrutivo", "Pneumotórax, tamponamento"]], "tut": "Coto umbilical vermelho e inchado é porta de entrada de infecção: pense em choque séptico e dê antibiótico cedo."}, {"id": "en25-44", "banca": "ENAMED/ENARE", "ano": 2025, "num": 44, "area": "Ginecologia e Obstetrícia", "tema": "Terceiro período do parto", "e": "Parturiente de 29 anos, sem comorbidades, esteve em trabalho de parto por 8 horas e evoluiu para parto vaginal. Após 10 minutos do desprendimento do feto, ainda não se observou a expulsão da placenta. A paciente está estável e sem sinais de hemorragia. Diante do quadro apresentado, a conduta a ser adotada é", "a": ["aguardar a expulsão espontânea da placenta, sem intervenções adicionais, e observar sinais de separação.", "realizar tração controlada do cordão umbilical, enquanto se estabiliza o útero com a mão suprapúbica.", "iniciar curagem placentária, devido ao tempo transcorrido sem desprendimento placentário.", "administrar uterotônico adicional e realizar massagem uterina para auxiliar a dequitação."], "c": 1, "com": "Com 10 minutos sem dequitação, sem sangramento, a conduta é o manejo ativo: tração controlada do cordão com contratração suprapúbica (manobra de Brandt-Andrews), após ocitocina. A placenta só é considerada retida após 30 minutos.", "tab": [["Manejo ativo do 3º período", "Componente"], ["1", "Ocitocina 10 UI IM após o nascimento"], ["2", "Tração controlada do cordão"], ["3", "Massagem uterina após dequitação"]], "tut": "Até 30 minutos, a placenta ainda não está retida: puxe o cordão com cuidado, segurando o útero por cima."}, {"id": "en25-45", "banca": "ENAMED/ENARE", "ano": 2025, "num": 45, "area": "Medicina Preventiva", "tema": "Tuberculose na população privada de liberdade", "e": "Paciente de 27 anos, em regime fechado em penitenciária, queixa-se de tosse há 2 semanas. Considerando a situação na qual se encontra esse paciente, o médico de família e comunidade deve", "a": ["encaminhar para internação clínica, objetivando rapidez no diagnóstico e garantia da segurança.", "solicitar radiografia de tórax, pesquisa laboratorial de Mycobacterium tuberculosis e garantir o tratamento em caso de positividade.", "solicitar internação social, a fim de garantir tratamento supervisionado, observado diretamente por 6 meses, caso seja confirmada a tuberculose.", "aguardar evolução, com uso de sintomáticos; caso a tosse persista por mais de 3 semanas, proceder à investigação diagnóstica de tuberculose."], "c": 1, "com": "Na população privada de liberdade, a tuberculose é muito mais frequente, por isso tosse por 2 semanas ou mais já justifica investigação. Pede-se radiografia de tórax e pesquisa do bacilo (TRM-TB ou baciloscopia), garantindo o tratamento se positivo.", "tab": [["População", "Tosse que justifica investigar TB"], ["Geral", "≥ 3 semanas"], ["Privados de liberdade, PVHIV, situação de rua", "Qualquer duração ou ≥ 2 semanas"], ["Exames", "TRM-TB/baciloscopia + radiografia"]], "tut": "Em presídio, o tempo de tosse que liga o alerta é menor: duas semanas já bastam para investigar tuberculose."}, {"id": "en25-46", "banca": "ENAMED/ENARE", "ano": 2025, "num": 46, "area": "Clínica Médica", "tema": "Espondiloartrites", "e": "Homem de 32 anos apresenta quadro de dor lombar crônica de início insidioso, com duração aproximada de 6 meses, que piora pela manhã e melhora com o movimento. Refere rigidez matinal, principalmente nas regiões lombar e sacroilíaca, com duração de mais de 30 minutos, com dor nas articulações sacroilíacas e sensação de fadiga durante as últimas semanas. Não há histórico de trauma. A história familiar é positiva para doenças reumatológicas, mas o paciente desconhece diagnósticos específicos. O painel de autoanticorpos apresenta: Positivo Anticorpo antinuclear (ANA) Título 1:80 Padrão homogêneo/difuso Anticorpo anti-DNA dupla hélice Negativo Antígeno leucocitário Positivo humano B27 (HLA-B27) Fator reumatoide Negativo Anticorpo anti-CCP Negativo Anticorpo anti-Ro Negativo Anticorpo anti-La Negativo Com base no caso clínico e nos exames laboratoriais apresentados, qual é o diagnóstico mais provável?", "a": ["Artrite reativa.", "Artrite psoriática.", "Espondilite anquilosante.", "Lúpus eritematoso sistêmico."], "c": 2, "com": "Homem jovem com lombalgia inflamatória (piora pela manhã e melhora com movimento), sacroileíte e HLA-B27 positivo: espondilite anquilosante. FR e anti-CCP negativos afastam artrite reumatoide. O FAN em título baixo é inespecífico.", "tab": [["Lombalgia", "Inflamatória x mecânica"], ["Início", "< 40 anos, insidioso x qualquer idade"], ["Movimento", "Melhora x piora"], ["Repouso", "Piora x melhora"]], "tut": "Dor nas costas de jovem que melhora mexendo e piora parado é inflamatória. Com HLA-B27, pense em espondilite anquilosante."}, {"id": "en25-47", "banca": "ENAMED/ENARE", "ano": 2025, "num": 47, "area": "Pediatria", "tema": "Imunizações na adolescência", "e": "Adolescente de 12 anos, sexo feminino, é levada à Unidade Básica de Saúde (UBS) para verificar se suas vacinas estão atualizadas. Até os 8 anos, todas as vacinas preconizadas pelo Ministério da Saúde para o biênio 2024-2025 foram feitas, sendo que tomou 1 dose da vacina contra febre amarela aos 9 meses. Nesse momento, deve receber as vacinas", "a": ["HPV, reforço da hepatite Be dT.", "reforço da hepatite B, dT e SCR.", "HPv, meningocócica ACWY e febre amarela.", "SCR, meningocócica ACWY e febre amarela."], "c": 2, "com": "Aos 12 anos, ela deve receber HPV e meningocócica ACWY. Como tomou apenas uma dose de febre amarela aos 9 meses, sem o reforço dos 4 anos, também precisa da dose de febre amarela.", "tab": [["Vacina", "Calendário"], ["HPV", "9 a 14 anos (dose única no calendário atual)"], ["Meningocócica ACWY", "11 a 14 anos"], ["Febre amarela", "9 meses + reforço aos 4 anos"]], "tut": "Adolescente de 12 anos: HPV e meningo ACWY. E sempre confira a febre amarela: quem ficou sem o reforço dos 4 anos precisa completar."}, {"id": "en25-48", "banca": "ENAMED/ENARE", "ano": 2025, "num": 48, "area": "Clínica Médica", "tema": "Derrame pleural", "e": "Paciente masculino, 36 anos, é tabagista e trabalha como ascensorista. Procura atendimento no ambulatório queixando-se de tosse seca, persistente por mais de 3 semanas, acompanhada de febre vespertina, dificuldade respiratória durante esforços e dor infraescapular à esquerda. Exame físico: bom estado geral, orientado, emagrecido, descorado, hidratado, afebril. Ausculta cardíaca sem alterações; ausculta pulmonar com murmúrios vesiculares diminuídos e percussão maciça em base do tórax à esquerda. Com base no diagnóstico provável, quais são, respectivamente, o exame complementar e a conduta adequada ao caso?", "a": ["Ressonância magnética; programação cirúrgica.", "Tomografia de tórax; lobectomia segmentar.", "Tomografia de tórax; drenagem de tórax.", "Ultrassonografia; toracocentese."], "c": 3, "com": "Macicez e murmúrio diminuído na base esquerda, com tosse, febre vespertina e emagrecimento: derrame pleural, possivelmente tuberculoso. O ultrassom confirma e guia a toracocentese diagnóstica (ADA, bioquímica, citologia).", "tab": [["Passo", "Derrame pleural"], ["Imagem", "Radiografia/ultrassom"], ["Diagnóstico", "Toracocentese diagnóstica"], ["Exsudato linfocítico com ADA alta", "Tuberculose pleural"]], "tut": "Pulmão abafado na percussão e sem som de ar é líquido. O primeiro passo é puncionar e analisar o líquido."}, {"id": "en25-49", "banca": "ENAMED/ENARE", "ano": 2025, "num": 49, "area": "Ginecologia e Obstetrícia", "tema": "Contracepção em condições clínicas", "e": "Nulípara de 30 anos, com diagnóstico de lúpus eritematoso sistêmico e história recente de trombose venosa, apresenta ciclos menstruais prolongados de 8 a 10 dias, com intenso sangramento e cólicas fortes, busca orientação sobre métodos contraceptivos. Considerando os critérios de elegibilidade para uso de anticoncepção e o quadro clínico, qual é a melhor opção de contracepção?", "a": ["DIU de cobre.", "DIU de levonorgestrel.", "Anticoncepcional injetável mensal.", "Pílula anticoncepcional combinada contínua."], "c": 1, "com": "Com LES e trombose recente, métodos com estrogênio são proibidos (categoria 4). Como ela tem sangramento intenso e cólica, o DIU de levonorgestrel é a melhor opção: não aumenta o risco trombótico de forma relevante e reduz o fluxo.", "tab": [["Método", "LES com trombose / sangramento intenso"], ["Combinados com estrogênio", "Contraindicados / -"], ["DIU de cobre", "Permitido, mas piora o sangramento"], ["DIU de levonorgestrel", "Permitido e reduz o sangramento"]], "tut": "Trombose afasta estrogênio. Entre o que sobra, quem sangra muito se beneficia do DIU hormonal, que diminui a menstruação."}, {"id": "en25-50", "banca": "ENAMED/ENARE", "ano": 2025, "num": 50, "area": "Clínica Médica", "tema": "Diabetes tipo 2: insulinização", "e": "Homem de 55 anos, com diagnóstico de diabetes mellitus, foi em consulta de rotina em Unidade Básica de Saúde (UBS) levando exames laboratoriais solicitados pelo médico na consulta anterior. Faz uso de metformina 850 me, 3 vezes ao dia, e glicazida 30 mg, 1 vez ao dia, há mais de 6 meses. Os exames laboratoriais atuais apresentam hemoglobina glicada de 9,5% e creatinina sérica de 0,8 mg/dL. Qual das condutas é a mais adequada para o seguimento desse caso?", "a": ["Suspender os medicamentos orais, iniciar insulina NPH 10 Ul subcutânea pela manhã e 20 UI à noite. Monitorar a glicemia pré-prandial, e, quando estiver controlada, medir a glicemia pós-prandial para avaliação da introdução da insulina regular.", "Aumentar a glicazida para 60 mg ao dia, aumentar a metformina para 1 g, 3 vezes ao dia, repetir exames em 1 mês. Iniciar insulina se estiverem alterados; pactuar com o paciente a possibilidade de insulinização no retorno.", "Manter a dose de metformina e glicazida, iniciar insulina NPH 10 UI subcutânea à noite, associada à monitorização glicêmica de jejum. Ajustar 2 a 3 Ula cada 2 a 3 dias, até atingir a meta da glicemia de jejum.", "Trocar a glicazida por glibenclamida 20 mg por dia, aumentar a metformina para 1 g, 3 vezes ao dia, solicitar novos exames em 1 mês."], "c": 2, "com": "HbA1c de 9,5% apesar de metformina e sulfonilureia: indicação de insulina. O esquema inicial é manter os orais e associar insulina NPH ao deitar (cerca de 10 UI ou 0,1-0,2 UI/kg), ajustando pela glicemia de jejum.", "tab": [["Situação", "Conduta"], ["Fora da meta com 2 orais", "Associar insulina basal"], ["Dose inicial", "NPH 10 UI ao deitar"], ["Ajuste", "2 a 3 UI a cada 2 a 3 dias pela glicemia de jejum"]], "tut": "Os comprimidos não deram conta? Mantém os comprimidos e coloca NPH à noite, ajustando pela glicemia do café da manhã."}, {"id": "en25-51", "banca": "ENAMED/ENARE", "ano": 2025, "num": 51, "area": "Clínica Médica", "tema": "Colangite esclerosante primária", "e": "Homem de 38 anos retorna a ambulatório de clínica médica de um hospital de atenção secundária, onde faz acompanhamento clínico de retocolite ulcerativa. Analisando os exames complementares solicitados na última consulta, o médico atendente observa elevações significativas da fosfatase alcalina e gama-GT, com discreta elevação dos níveis séricos de aminotransferases, sem hiperbilirrubinemia. Questionado, o paciente refere apenas leve desconforto no hipocôndrio direito. Ao exame físico, não há icterícia, febre ou presença de sinal de Murphy. Considerando a doença de base do caso, o exame complementar indicado e seu resultado provável são, respectivamente,", "a": ["tomografia computadorizada de abdome; lesão tumoral presente ao nível do hilo hepático.", "colangiopancreatografia retrógrada endoscópica; presença de litiase impactada no colédoco terminal.", "colangiorressonância; múltiplas estenoses intercaladas na árvore biliar, com áreas normais ou dilatadas de permeio.", "ultrassonografia abdominal total; espessamento da parede da vesícula biliar com nodulação no interior, sem sombra acústica."], "c": 2, "com": "Retocolite ulcerativa com elevação de fosfatase alcalina e GGT (padrão colestático): colangite esclerosante primária. A colangiorressonância mostra estenoses múltiplas intercaladas com dilatações, o aspecto 'em contas de rosário'.", "tab": [["Doença", "Associação / exame"], ["Colangite esclerosante primária", "Retocolite / colangiorressonância"], ["Colangite biliar primária", "Mulher, antimitocôndria positivo"], ["Risco associado", "Colangiocarcinoma"]], "tut": "Retocolite com fosfatase alcalina alta = colangite esclerosante. Na colangiorressonância, a via biliar parece um colar de contas."}, {"id": "en25-52", "banca": "ENAMED/ENARE", "ano": 2025, "num": 52, "area": "Pediatria", "tema": "Reflexos primitivos", "e": "Mãe de menina de 11 meses em consulta de puericultura, relata que não há queixas específicas no momento e refere que a criança está começando a trocar passos de maneira independente. Apresenta marcos do desenvolvimento anteriores a 11 meses dentro da normalidade e bom ganho pondero-estatural. Gestação e parto sem intercorrências. O reflexo primitivo usualmente presente nessa faixa etária é o", "a": ["reflexo plantar.", "reflexo de Moro.", "reflexo de procura.", "reflexo tônico cervical."], "c": 0, "com": "Aos 11 meses, Moro, procura e tônico-cervical já desapareceram. O reflexo cutâneo-plantar em extensão (Babinski) é esperado até cerca de 1 ano a 1 ano e meio.", "tab": [["Reflexo", "Desaparece por volta de"], ["Procura e sucção", "3 a 4 meses"], ["Moro", "4 a 6 meses"], ["Tônico-cervical assimétrico", "3 a 4 meses"], ["Cutâneo-plantar em extensão", "12 a 18 meses"]], "tut": "De todos os reflexos primitivos, o plantar em extensão é o último a sumir, perto de quando a criança anda."}, {"id": "en25-53", "banca": "ENAMED/ENARE", "ano": 2025, "num": 53, "area": "Cirurgia", "tema": "Hematoma epidural", "e": "Paciente do sexo masculino, 23 anos, foi vítima de acidente automobilístico no qual o veículo em que estava colidiu com caminhão. Usava cinto de segurança e foi retirado consciente do carro pela equipe de resgate. Apresentava amnésia anterógrada. Após atendimento pré-hospitalar, o paciente foi levado ao pronto-socorro, sem déficits motores ou sensitivos. No hospital, o médico pede uma tomografia computadorizada de crânio para avaliação. Alguns minutos depois, a equipe de enfermagem solicita avaliação de emergência para o paciente, com necessidade de intubação orotraqueal por rebaixamento do nível de consciência e anisocoria com pupila esquerda dilatada. Tomografia computadorizada de crânio sem contraste Ao considerar a situação clínica do paciente e a imagem tomográfica apresentada, o médico diagnosticou", "a": ["hematoma subdural agudo, sendo necessário realizar hidantalização do paciente e aguardar melhora clínica.", "contusão cerebral, sendo necessário realizar cirurgia de emergência para controle de hipertensão intracraniana.", "hematoma epidural, sendo necessário realizar cirurgia de emergência para controle da hipertensão intracraniana.", "hematoma intraparenquimatoso, sendo necessário realizar hidantalização do paciente e aguardar melhora clínica."], "c": 2, "com": "Trauma com intervalo lúcido e, depois, rebaixamento súbito com anisocoria: hematoma epidural (na prova, a TC mostrava imagem biconvexa). É emergência neurocirúrgica, com drenagem imediata.", "tab": [["Hematoma", "Imagem / evolução"], ["Epidural", "Biconvexo (lente) / intervalo lúcido"], ["Subdural agudo", "Crescente / mais grave, idoso, etilista"], ["Conduta com efeito de massa", "Cirurgia de emergência"]], "tut": "Acordou bem e piorou de repente com uma pupila dilatada? Pense em hematoma epidural, que tem forma de lente na TC e vai pra cirurgia."}, {"id": "en25-54", "banca": "ENAMED/ENARE", "ano": 2025, "num": 54, "area": "Ginecologia e Obstetrícia", "tema": "Contracepção e enxaqueca", "e": "Uma adolescente de 15 anos comparece em consulta ginecológica com a finalidade de iniciar contracepção. Na história patológica pregressa, refere episódios de enxaqueca com aura. Nos antecedentes familiares, relata que a avó materna teve diagnóstico de câncer de mama, sua mãe é hipertensa e sua irmã tem diabetes. O uso do contraceptivo combinado está contraindicado para essa paciente devido ao risco de", "a": ["câncer de mama.", "diabetes mellitus.", "acidente vascular cerebral.", "hipertensão arterial sistêmica."], "c": 2, "com": "Enxaqueca com aura é categoria 4 para métodos combinados (contraindicação absoluta), pelo aumento do risco de acidente vascular cerebral isquêmico.", "tab": [["Condição", "Combinado hormonal"], ["Enxaqueca com aura", "Contraindicado (risco de AVC)"], ["Enxaqueca sem aura < 35 anos", "Pode usar com cautela"], ["Alternativas", "Progestágeno isolado, DIU"]], "tut": "Aura + estrogênio = risco de AVC. Para quem tem enxaqueca com aura, nada de pílula combinada."}, {"id": "en25-55", "banca": "ENAMED/ENARE", "ano": 2025, "num": 55, "area": "Medicina Preventiva", "tema": "Vacinação do idoso", "e": "Ao visitar um idoso acamado de 80 anos, restrito ao lar e dependente em relação às atividades de vida diária, a médica de família e comunidade verificou que ele não havia recebido as vacinas indicadas pelo Ministério da Saúde para os idosos. Ao questionar a filha de 55 anos, principal cuidadora, sobre a vacinação do idoso, ela respondeu que o pai é muito frágil e não iria aguentar os efeitos colaterais, e como ele é restrito ao lar, a família preferiu não vacinar. Assinale a alternativa que inclui, respectivamente, vacinas disponibilizadas no calendário de imunização nacional para o idoso e uma forma de abordar a situação encontrada.", "a": ["Pneumocócica 23-valente, 1 dose, com reforço em 5 anos; dupla adulto (dT — contra difteria e tétano), a cada 10 anos; contra influenza e covid-19, anualmente; contra hepatite B, 3 doses. Agendar uma nova visita domiciliar com mais membros da família para dialogar sobre a situação.", "Contra influenza e covid-19, anualmente; dupla adulto (dT — contra difteria e tétano), a cada 10 anos; contra hepatite B, 3 doses; contra herpes-zoster, 2 doses. Fazer denúncia ao Conselho Municipal do Idoso sobre não vacinação do idoso.", "Pneumocócica 10-valente, 1 dose, com reforço em 5 anos; dupla adulto (dT — contra difteria e tétano), a cada 10 anos; contra influenza e covid-19, anualmente; contra hepatite B, 3 doses. Solicitar que a filha assine um termo de responsabilidade em relação à não vacinação do pai.", "Pneumocócica 10-valente, 1 dose, com reforço em 5 anos; contra influenza e covid-19, anualmente; contra herpes- zoster, 2 doses; dupla adulto (dT — contra difteria e tétano), a cada 10 anos."], "c": 0, "com": "O calendário do idoso acamado inclui pneumocócica 23-valente (com reforço em 5 anos), dT a cada 10 anos, influenza e covid-19 anuais e hepatite B. A recusa da família deve ser abordada com diálogo, esclarecendo riscos e benefícios.", "tab": [["Vacina", "Idoso"], ["Pneumocócica 23-valente", "Acamados/institucionalizados; reforço em 5 anos"], ["dT", "A cada 10 anos"], ["Influenza e covid-19", "Anual"]], "tut": "Idoso frágil é justamente quem mais precisa de vacina. A pneumocócica do idoso é a 23-valente; a 10-valente é da criança."}, {"id": "en25-56", "banca": "ENAMED/ENARE", "ano": 2025, "num": 56, "area": "Medicina Preventiva", "tema": "Controle vetorial", "e": "O vírus Chikungunya é transmitido pelo mosquito Aedes sp e foi responsável por grandes epidemias associadas a desfechos clínicos agudos, crônicos e graves. As ações voltadas para o controle do Aedes sp incluem medidas como o manejo integrado de vetores, que envolve atividades a serem executadas pela equipe de vigilância do território em um processo cíclico, tais como", "a": ["levantamento do índice larvário, notificação de vetores infectados e avaliação dos indicadores entomológicos e epidemiológicos.", "treinamento da equipe de controle de vetores, uso intensivo de inseticidas, mutirões de limpeza e tratamento de pontos estratégicos.", "vigilância virológica, notificação semanal dos casos suspeitos de Chikungunya em áreas sem transmissão e definição do local provável de infecção.", "análise situacional com base em informações epidemiológicas e entomológicas, desenho das operações de planificação, implementação, monitoramento e avaliação."], "c": 3, "com": "O manejo integrado de vetores é um processo cíclico de análise da situação (dados epidemiológicos e entomológicos), planejamento das operações, implementação, monitoramento e avaliação.", "tab": [["Etapa", "Manejo integrado de vetores"], ["1", "Análise situacional"], ["2", "Planejamento"], ["3", "Implementação"], ["4", "Monitoramento e avaliação"]], "tut": "Manejo integrado é um ciclo de gestão: analisa, planeja, faz, monitora e avalia. Não é só passar inseticida."}, {"id": "en25-57", "banca": "ENAMED/ENARE", "ano": 2025, "num": 57, "area": "Pediatria", "tema": "TDAH: metilfenidato", "e": "Criança de 9 anos chega à Unidade Básica de Saúde (UBS) com o diagnóstico de transtorno de déficit de atenção e hiperatividade há 2 anos. Faz uso de metilfenidato há pelo menos 1 ano. O pai informa que, desde o início do uso, apresentou grande melhora na escola e solicita que o uso seja estendido por mais tempo. Quais estratégias de monitoramento referentes ao uso dessa medicação devem ser utilizadas?", "a": ["Realizar seguimento em conjunto com neuropediatra para acompanhar aumento de peso e possível dislipidemia associada ao uso crônico do medicamento.", "Acompanhar com testes psicodinâmicos parâmetros de atenção e desempenho escolar, a fim de avaliar a efetividade da estimulação farmacológica.", "Coletar hemograma e hormônios tireoidianos anuais e eventualmente prescrever antipsicóticos para combate dos efeitos colaterais.", "Agendar consultas periódicas para verificação da estatura, peso e pressão arterial, com nova avaliação para retirada após 1 ano."], "c": 3, "com": "No uso de metilfenidato, deve-se monitorar periodicamente peso, estatura e pressão arterial (o remédio reduz apetite e pode afetar o crescimento e a PA). Também se reavalia a necessidade de manter o tratamento, com tentativa de pausa programada.", "tab": [["Efeito do metilfenidato", "Monitorar"], ["Redução do apetite", "Peso"], ["Possível impacto no crescimento", "Estatura"], ["Efeito simpatomimético", "PA e frequência cardíaca"]], "tut": "Estimulante tira a fome e acelera o coração: acompanhe peso, altura e pressão."}, {"id": "en25-58", "banca": "ENAMED/ENARE", "ano": 2025, "num": 58, "area": "Clínica Médica", "tema": "Tireoidite subaguda", "e": "Mulher de 45 anos é internada em hospital de média complexidade com queixas de febre (em torno de 38 ºC), mialgia, mal-estar e dor na região cervical anterior, irradiada para a mandíbula e orelhas. Há 2 semanas, iniciou quadro sugestivo de infecção viral respiratória alta, com evolução clínica lenta desde então, passando a sentir palpitações e tremores nos últimos 3 dias. Procurou atendimento na unidade de saúde. Ao exame físico, a paciente se encontra febril, com taquicardia desproporcional à temperatura corporal e tremores finos nas extremidades. À palpação da tireoide: glândula dolorosa, firme e levemente aumentada de tamanho, assimétrica, não nodular. As dosagens da velocidade de hemossedimentação e proteína C reativa se mostraram elevadas. Considerando a principal hipótese diagnóstica para o caso, quais exames complementares a sustentariam e qual o tratamento indicado, respectivamente?", "a": ["Redução da captação tireoidiana de iodo radioativo; betabloqueador e anti-inflamatório.", "Detecção de presença de nódulo quente à cintilografia de tireoide; tireoidectomia subtotal.", "Verificação de aumento nas dosagens séricas de TSH, T4 livre e TRAb; ablação com iodo radioativo.", "Verificação de aumento das concentrações sanguíneas de TSH, T3 e T4 livre; oseltamivir + metimazol + atenolol."], "c": 0, "com": "Dor cervical anterior irradiada após infecção viral, tireoide dolorosa, febre, tireotoxicose e VHS/PCR elevados: tireoidite subaguda granulomatosa (De Quervain). A captação de iodo está reduzida, e o tratamento é betabloqueador com anti-inflamatório.", "tab": [["Tireotoxicose", "Captação de iodo"], ["Graves", "Aumentada e difusa"], ["Tireoidite subaguda", "Muito reduzida"], ["Nódulo tóxico", "Nódulo quente"]], "tut": "Tireoide que dói depois de uma virose é De Quervain. Como a glândula está inflamada e 'vazando' hormônio, ela não capta iodo."}, {"id": "en25-59", "banca": "ENAMED/ENARE", "ano": 2025, "num": 59, "area": "Pediatria", "tema": "Síndromes neurocutâneas", "e": "Lactente de 9 meses é atendido em Unidade Básica de Saúde (UBS) em virtude do surgimento de crises epilépticas há 3 meses. Os eventos se caracterizam por espasmos em flexão dos membros superiores sobre o tronco, semelhantes a sustos, e ocorrem nos horários de maior sonolência da criança. História gestacional e de parto sem anormalidades. Ao exame físico, lactente interage com o observador, porém não consegue ficar sentado. Ausculta cardíaca e respiratória sem anormalidades. Apresenta várias manchas hipomelanóticas nos membros inferiores e no tronco. Ressonância magnética de crânio revelou duas áreas compatíveis com astrocitomas de células gigantes subependimárias. A principal hipótese diagnóstica é", "a": ["neurofibromatose.", "esclerose tuberosa.", "síndrome de Sturge-Weber.", "doença de von Hippel-Lindau."], "c": 1, "com": "Espasmos infantis, manchas hipomelanóticas e astrocitoma subependimário de células gigantes: esclerose tuberosa.", "tab": [["Síndrome", "Marca"], ["Esclerose tuberosa", "Manchas hipocrômicas, espasmos, SEGA"], ["Neurofibromatose 1", "Manchas café com leite, neurofibromas"], ["Sturge-Weber", "Mancha vinho do Porto na face"]], "tut": "Mancha branca na pele + espasmos no bebê = esclerose tuberosa."}, {"id": "en25-60", "banca": "ENAMED/ENARE", "ano": 2025, "num": 60, "area": "Cirurgia", "tema": "Diverticulite aguda", "e": "Paciente masculino, 59 anos, atendido em hospital terciário com queixa de dor de moderada intensidade em fossa ilíaca esquerda (FIE), com início há 5 dias. Apresentou temperatura de 38 ºC nas últimas 48 horas, associada à prostração. Não possuía comorbidades. Relatou episódio semelhante de menor intensidade há cerca de 1 ano, com resolução espontânea e um episódio de hematoquezia há 6 meses. No momento se encontra em regular estado geral, discretamente desidratado, com frequência cardíaca de 95 bpm; pressão arterial de 140 x 90 mmHg; índice de massa corporal de 30,5 mg/kg”. Abdome flácido, doloroso à palpação profunda em FIE e hipogástrio, com plastrão palpável em hipogástrio. Hemograma: leucócitos de 17.000/mm (valor de referência: 5.000 a 10.000/ mm), 7% de bastões (valor de referência: O a 5%). Considerando o quadro, qual é o exame complementar de maior acurácia para estabelecer o diagnóstico?", "a": ["Radiografia abdominal em 3 posições.", "Colonoscopia com biópsia.", "Tomografia de abdome com contraste.", "Ultrassonografia de abdome."], "c": 2, "com": "Dor em fossa ilíaca esquerda, febre, leucocitose e plastrão em homem de 59 anos: diverticulite aguda complicada. A tomografia de abdome com contraste é o exame de maior acurácia. A colonoscopia é contraindicada na fase aguda.", "tab": [["Diverticulite", "Pontos-chave"], ["Exame de escolha", "TC com contraste"], ["Fase aguda", "Evitar colonoscopia"], ["Após 6 a 8 semanas", "Colonoscopia para afastar câncer"]], "tut": "Apendicite do lado esquerdo no mais velho = diverticulite. Confirma na TC; colonoscopia só depois que esfriar."}, {"id": "en25-61", "banca": "ENAMED/ENARE", "ano": 2025, "num": 61, "area": "Ginecologia e Obstetrícia", "tema": "Vulvovaginites", "e": "Mulher de 35 anos, diabética, com laqueadura tubária bilateral, procurou atendimento médico com queixa de prurido genital e disúria terminal, com 7 dias de evolução. Recentemente, fez uso de antibiótico para tratamento de abscesso dental. Ao exame especular, notava-se edema vulvar, hiperemia, fissura, corrimento esbranquiçado e teste das aminas negativo. Com base no agente etiológico mais provável, o tratamento é", "a": ["miconazol, 1 aplicador, via vaginal, por 7 noites.", "cefalexina, 2 g/dia, via oral, por 7 dias.", "azitromicina 1 g/dia, via oral, por 10 dias.", "metronidazol, 1 aplicador, via vaginal, por 10 noites."], "c": 0, "com": "Diabética, após antibiótico, com prurido, edema, fissuras e corrimento branco grumoso, teste das aminas negativo: candidíase. O tratamento é antifúngico, como miconazol creme vaginal por 7 noites.", "tab": [["Vulvovaginite", "Achados / tratamento"], ["Candidíase", "Prurido, branco grumoso, pH < 4,5 / azólico"], ["Vaginose bacteriana", "Odor, aminas positivas / metronidazol"], ["Tricomoníase", "Amarelo-esverdeado, bolhoso / metronidazol"]], "tut": "Coceira forte com corrimento tipo leite coalhado, depois de antibiótico ou em diabética: candidíase."}, {"id": "en25-62", "banca": "ENAMED/ENARE", "ano": 2025, "num": 62, "area": "Medicina Preventiva", "tema": "Declaração de óbito", "e": "Médica de família e comunidade foi solicitada para preencher a declaração de óbito de um paciente que acompanhava regularmente em sua área adstrita. O paciente era hipertenso há 30 anos, com histórico pessoal de acidente vascular encefálico (AVE) há 5 anos. Há 10 dias o paciente apresentou quadro gripal e há 1 dia teve agravamento dos sintomas respiratórios, com dispneia e cianose. A declaração de óbito deverá ser preenchida", "a": ["pelo Instituto Médico Legal e constar: Parte |: a) Insuficiência respiratória aguda grave (horas); b) Síndrome gripal (10 dias); c) Hipertensão arterial sistêmica (30 anos). Parte Il: Acidente vascular encefálico (5 anos).", "pela médica e constar: Parte |: a) Insuficiência respiratória aguda grave (horas); b) Pneumonia (1 dia); Síndrome gripal (10 dias). Parte Il: a) Acidente vascular encefálico (5 anos); b) Hipertensão arterial sistêmica (30 anos).", "pelo Serviço Móvel de Atendimento de Urgência (SAMU) e constar: Parte |: a) Síndrome gripal (10 dias); b) Pneumonia (1 dia); c) Insuficiência respiratória aguda grave (horas). Parte Il: a) Acidente vascular encefálico (5 anos); b) Hipertensão arterial sistêmica (30 anos).", "pelo serviço de verificação de óbitos e constar: Parte |: a) Insuficiência respiratória aguda grave (horas); b) Acidente vascular encefálico (5 anos); c) Hipertensão arterial sistêmica (30 anos)."], "c": 1, "com": "Morte natural de paciente acompanhado pela médica: ela mesma deve preencher a DO. Na Parte I, a causa básica fica na última linha preenchida (síndrome gripal), seguida das consequências (pneumonia, insuficiência respiratória). As comorbidades contribuintes (AVE, HAS) vão na Parte II.", "tab": [["Situação", "Quem preenche a DO"], ["Morte natural com médico assistente", "O médico assistente"], ["Morte natural sem assistência", "SVO (ou médico local)"], ["Morte violenta ou suspeita", "IML"]], "tut": "Na DO, escreva de cima para baixo como uma cadeia: a doença que começou tudo fica embaixo. Morte natural de paciente seu é você quem assina."}, {"id": "en25-63", "banca": "ENAMED/ENARE", "ano": 2025, "num": 63, "area": "Medicina Preventiva", "tema": "Desenhos de estudo", "e": "Uma equipe de saúde da família percebeu um aumento do número de casos complicados de diabetes mellitus. De um total de 3.500 pacientes cadastrados, 280 são acompanhados por diabetes mellitus tipo 2, sendo 4 casos de amputações, 28 casos de retinopatia diabética e 80 casos de algum grau de doença renal crônica. Foi identificado que essa população apresentava dieta inadequada, baixo nível de atividade física e pouco conhecimento sobre estilos de vida que poderiam prevenir complicações das doenças. A equipe de saúde decidiu elaborar um projeto de intervenção com ênfase em avaliação e orientação nutricional e práticas de atividade física de rotina. Qual é o desenho de pesquisa para avaliação do impacto desse projeto de intervenção coletiva?", "a": ["Estudo de caso-controle aninhado.", "Ensaio clínico não randomizado.", "Estudo de coorte retrospectivo.", "Ensaio clínico randomizado."], "c": 1, "com": "A equipe aplica a intervenção em toda a sua população, sem sorteio dos participantes. Avaliar o impacto dessa intervenção caracteriza um ensaio clínico (ou comunitário) não randomizado.", "tab": [["Desenho", "Característica"], ["Ensaio randomizado", "Pesquisador sorteia quem recebe"], ["Ensaio não randomizado", "Pesquisador intervém, sem sorteio"], ["Coorte", "Pesquisador só observa"]], "tut": "Se o pesquisador aplicou a intervenção, é ensaio. Se sorteou quem recebe, é randomizado; se não sorteou, é não randomizado."}, {"id": "en25-64", "banca": "ENAMED/ENARE", "ano": 2025, "num": 64, "area": "Clínica Médica", "tema": "Risco de suicídio", "e": "Homem de 23 anos, estudante universitário, é levado à Unidade de Pronto Atendimento (UPA) por um amigo da moradia estudantil, que o encontrou chorando, trancado no banheiro com diversas cartelas de medicamentos próximas de si. O paciente nega ter ingerido qualquer fármaco ou outras substâncias, mas admite estar pensando em dar fim à própria vida. Refere tristeza profunda há cerca de 2 meses, com piora recente após o término de um relacionamento. Diz estar “sem propósito na vida” e que “ninguém sentiria falta” se ele morresse. Conta que viu na internet que tomar muitos comprimidos de paracetamol seria a melhor forma de morrer. Relata insônia inicial e terminal, perda de apetite, queda de rendimento acadêmico e isolamento social. Nega uso atual de drogas ilícitas, mas admite consumo de álcool eventualmente. Abandonou psicoterapia após 2 sessões. Todos os familiares vivem em outro estado. Ao exame, apresenta-se vígil, orientado, com discurso discretamente lentificado, sem alucinações ou delírios evidentes. O contato visual é pobre, o afeto está intensamente rebaixado e não modulante. Exames laboratoriais gerais solicitados à chegada na UPA não mostram alterações. Qual é a conduta adequada ao caso clínico apresentado?", "a": ["Encaminhar o paciente para acompanhamento médico em Unidade Básica de Saúde (UBS).", "Encaminhar o paciente para psicoterapia com equipe multiprofissional na atenção primária à saúde.", "Encaminhar o paciente para avaliação ambulatorial com psiquiatra em centro de atenção psicossocial do tipo |.", "Encaminhar o paciente para internação em enfermaria de saúde mental em hospital geral ou em serviço congênere."], "c": 3, "com": "Jovem com depressão grave, ideação com plano definido (paracetamol), acesso ao meio, isolamento, uso de álcool e sem rede de apoio próxima: risco alto de suicídio. A conduta é a internação em enfermaria de saúde mental de hospital geral ou serviço equivalente.", "tab": [["Risco", "Conduta"], ["Baixo (ideação sem plano)", "Acompanhamento na APS"], ["Moderado", "CAPS, acompanhamento próximo"], ["Alto (plano, meio, sem suporte)", "Internação"]], "tut": "Plano + meio à mão + sem ninguém por perto = risco alto. Não dá pra mandar pra casa."}, {"id": "en25-65", "banca": "ENAMED/ENARE", "ano": 2025, "num": 65, "area": "Clínica Médica", "tema": "Trombofilias", "e": "Mulher de 35 anos procura Unidade Básica de Saúde (UBS) informando ter tido diagnóstico de trombose venosa profunda há cerca de 2 anos. Fez tratamento adequado com anticoagulante oral por tempo limitado, tendo recebido alta com cura do quadro há cerca de 1 ano. Na ocasião, ela não havia realizado qualquer exame específico adicional. Entretanto, nos últimos 6 meses, seu pai e sua irmã também tiveram o diagnóstico de trombose. O médico assistente solicita exames complementares para rastreio de hipercoagulabilidade primária. Considerando a história apresentada, qual alteração laboratorial é compatível com a suspeita de doença hereditária?", "a": ["Presença de Fator V de Leiden.", "Níveis aumentados de proteína S.", "Níveis aumentados de antitrombina III.", "Níveis reduzidos de Fator de Von Willebrand."], "c": 0, "com": "TVP em mulher jovem com pai e irmã também com trombose sugere trombofilia hereditária. Entre as opções, só o fator V de Leiden é compatível. Nas outras trombofilias há redução (não aumento) de proteína S e antitrombina.", "tab": [["Trombofilia hereditária", "Alteração"], ["Fator V de Leiden", "Presença da mutação (mais comum)"], ["Mutação da protrombina", "G20210A"], ["Deficiências", "Proteína C, proteína S, antitrombina diminuídas"]], "tut": "Trombofilia é falta de anticoagulante natural ou excesso de pró-coagulante. Proteína S ou antitrombina 'aumentadas' nunca são a resposta."}, {"id": "en25-66", "banca": "ENAMED/ENARE", "ano": 2025, "num": 66, "area": "Pediatria", "tema": "Cetoacidose na criança", "e": "Menina de 11 anos foi trazida à Unidade de Pronto Atendimento (UPA) com quadro de queda do estado geral, náuseas e dor abdominal, desidratação e hálito cetônico. Exames realizados: glicemia de 410 mg/dL; gasometria venosa de pH 7,15 e bicarbonato de 13 mEqg/L; exame de urina indica cetonúria. Além da fluidoterapia, o próximo passo é", "a": ["reposição de potássio.", "correção imediata da glicemia.", "reposição de bicarbonato de sódio.", "administração imediata de manitol."], "c": 0, "com": "Na cetoacidose, a insulina leva potássio para dentro das células e pode causar hipocalemia grave. Após a fluidoterapia inicial, o próximo passo é repor potássio (conforme o nível sérico e a diurese) antes ou junto com a insulina. Bicarbonato e manitol não são rotina.", "tab": [["CAD pediátrica", "Ponto-chave"], ["1º", "Fluidos (expansão cuidadosa)"], ["2º", "Potássio na solução"], ["Depois", "Insulina 0,05-0,1 UI/kg/h, sem bolus"]], "tut": "Na criança com CAD, primeiro água, depois potássio, depois insulina. Corrigir a glicemia rápido demais aumenta o risco de edema cerebral."}, {"id": "en25-67", "banca": "ENAMED/ENARE", "ano": 2025, "num": 67, "area": "Cirurgia", "tema": "Hemorragia externa no trauma", "e": "Paciente do sexo masculino, 26 anos, está sendo atendido em via pública, vítima de disparo de arma de fogo em braço direito. O trauma ocorreu cerca de 15 minutos antes da chegada da equipe de atendimento pré-hospitalar. Ao exame, o paciente se encontra pálido, pele fria, sudoreico, frequência cardíaca de 120 bpm, pressão arterial de 90 x 50 mmHg e escala de coma de Glasgow de 15. A equipe de socorristas não possui hemoderivados disponíveis. Exame físico de cabeça, pescoço, tórax e abdome sem alterações, incluindo a região posterior do paciente. Presença de ferida perfuro-contusa em região medial do terço distal do braço direito, apresentando hemorragia pulsátil em grande volume. Considerando o atendimento pré-hospitalar do paciente, deve-se realizar", "a": ["dissecção da região traumatizada e hemostasia do vaso que apresenta sangramento com pinças hemostáticas; iniciar reposição volêmica com albumina e soro fisiológico.", "dissecção da região traumatizada e hemostasia do vaso que apresenta sangramento com pinças hemostáticas; iniciar reposição volêmica com soro fisiológico e glicofisiológico.", "compressão local da ferida e, caso essa manobra não cesse a hemorragia, aplicação de torniquete proximal à ferida e fora da região de articulação; iniciar reposição volêmica com soro fisiológico.", "compressão local da ferida e, caso essa manobra não cesse a hemorragia, aplicação de torniquete proximal à ferida e fora da região de articulação; iniciar reposição volêmica com albumina e soro fisiológico."], "c": 2, "com": "No atendimento pré-hospitalar, a hemorragia externa grave é controlada com compressão direta. Se não funcionar, aplica-se um torniquete proximal à ferida, fora de articulação. A reposição volêmica é criteriosa, com cristaloide aquecido e hipotensão permissiva até o controle definitivo.", "tab": [["Passo", "Hemorragia de membro"], ["1", "Compressão direta"], ["2", "Torniquete proximal, fora de articulação"], ["Reposição", "Cristaloide aquecido, em volume limitado"]], "tut": "Sangramento que jorra no braço: aperta, e se não parar, garrote acima da ferida. Pinçar vaso na rua não é conduta."}, {"id": "en25-68", "banca": "ENAMED/ENARE", "ano": 2025, "num": 68, "area": "Ginecologia e Obstetrícia", "tema": "Rastreio do câncer de colo", "e": "Uma mulher de 30 anos recebeu a citologia oncótica com laudo de “atipias celulares escamosas de significado indeterminado, onde não se pode afastar alto grau (ASC-H)”. Ela nega antecedente de tabagismo e não se lembra de ter tido infecção sexualmente transmissível. Nesse caso, a conduta adequada deve ser a realização de", "a": ["conização.", "colposcopia.", "cirurgia de alta frequência.", "nova citologia oncótica em 6 meses."], "c": 1, "com": "ASC-H (atipias que não excluem lesão de alto grau) em mulher de 30 anos indica colposcopia imediata, independentemente da idade.", "tab": [["Citologia", "Conduta"], ["ASC-US (≥ 25 anos)", "Repetir em 6 meses"], ["LSIL (≥ 25 anos)", "Repetir em 6 meses"], ["ASC-H / HSIL", "Colposcopia"]], "tut": "O 'H' de ASC-H é de alto grau: possibilidade de lesão grave vai direto pra colposcopia."}, {"id": "en25-69", "banca": "ENAMED/ENARE", "ano": 2025, "num": 69, "area": "Clínica Médica", "tema": "Dependência química", "e": "Homem de 45 anos procura Unidade Básica de Saúde (UBS) do seu bairro, por não conseguir controlar a frequência e a quantidade do uso de bebida alcoólica. Por conta disso, está faltando ao trabalho e não consegue se lembrar do que acontece quando bebe. O médico da UBS investigará os pontos mais importantes que podem indicar o padrão de dependência a substâncias psicoativas de acordo com o Manual Diagnóstico Estatístico de Saúde Mental (DSM-5). O médico deve investigar sobre", "a": ["a intolerância cruzada entre outras substâncias e a de uso abusivo.", "a aceitação e a adesão à proposta de abstinência apresentada pela equipe.", "otempo que é gasto para obter a substância ou recuperar- se de seus efeitos.", "o tipo e a classe de substância que o paciente usa, diferenciando se é lícita ou ilícita."], "c": 2, "com": "Entre os critérios do DSM-5 para transtorno por uso de substância está o tempo gasto para obter a substância, usá-la ou se recuperar dos seus efeitos. Também entram perda de controle, fissura, prejuízo social, tolerância e abstinência.", "tab": [["Grupo de critérios DSM-5", "Exemplo"], ["Controle prejudicado", "Usa mais do que pretendia, muito tempo gasto"], ["Prejuízo social", "Falta ao trabalho"], ["Farmacológicos", "Tolerância e abstinência"]], "tut": "O DSM-5 olha o quanto a substância domina a vida: o tempo gasto atrás dela é um dos critérios."}, {"id": "en25-70", "banca": "ENAMED/ENARE", "ano": 2025, "num": 70, "area": "Medicina Preventiva", "tema": "Surto de escabiose em instituição", "e": "Agentes penitenciários de uma unidade prisional informaram à equipe de saúde sobre o aumento de queixas de prurido intenso e lesões cutâneas entre as pessoas privadas de liberdade. Cada cela, prevista para 35 pessoas, está com lotação de 75. As ações prioritárias no manejo adequado dessa situação são", "a": ["solicitar o isolamento imediato dos casos sintomáticos, iniciar tratamento individual conforme avaliação clínica, recomendar higienização de colchões e ampliar o fornecimento de sabão e escovas pessoais.", "implementar bloqueio coletivo com tratamento simultâneo, notificar o surto ao serviço de vigilância em saúde, reorganizar fluxos com a administração prisional e planejar medidas educativas e estruturais.", "preferir o tratamento tópico dos casos diagnosticados, com prescrição médica individualizada, e restringir o fornecimento de medicação aos casos confirmados, evitando exposição a medicamentos em massa.", "reunir-se com a direção para discutir a viabilidade de transferência dos casos graves, focando a atuação em medidas educativas com folhetos informativos sobre problemas de pele mais frequentes."], "c": 1, "com": "Prurido em várias pessoas numa cela superlotada sugere surto de escabiose. A conduta é tratamento coletivo simultâneo de todos os contatos (bloqueio), notificação do surto à vigilância e reorganização junto à administração.", "tab": [["Surto de escabiose", "Ação"], ["Tratamento", "Todos ao mesmo tempo, mesmo assintomáticos"], ["Vigilância", "Notificar o surto"], ["Ambiente", "Roupas e colchões; reduzir superlotação"]], "tut": "Escabiose em grupo fechado se trata em bloco: todo mundo no mesmo dia, senão volta."}, {"id": "en25-71", "banca": "ENAMED/ENARE", "ano": 2025, "num": 71, "area": "Clínica Médica", "tema": "Psicopatologia", "e": "Homem de 28 anos, solteiro e residindo com os pais, comparece ao Centro de Atenção Psicossocial (CAPs), com visível constrangimento ao longo da consulta. Apesar de sua resistência inicial, relata que tem pensamentos recorrentes e indesejados, os quais invadem sua cabeça, tendo como temática a sua mãe sendo vítima de grande violência. Enfatiza sua angústia com esses pensamentos, que já duram mais de 6 meses, provocando significativo prejuízo em sua vida pessoal e profissional. Afirma ter o entendimento de que não há fundamento nessas ideias e que não faz sentido sofrer com isso. A denominação para a descrição clínica apresentada é", "a": ["delírio.", "obsessão.", "hipertimia.", "compulsão."], "c": 1, "com": "Pensamentos recorrentes, intrusivos e indesejados, que o próprio paciente reconhece como absurdos e que causam angústia, são obsessões. A compulsão é o comportamento repetitivo feito para aliviar a obsessão.", "tab": [["Termo", "Definição"], ["Obsessão", "Pensamento intrusivo, egodistônico"], ["Compulsão", "Ato repetitivo para aliviar a angústia"], ["Delírio", "Crença falsa e inabalável, sem crítica"]], "tut": "Se o paciente sabe que a ideia não faz sentido e sofre com ela, é obsessão. No delírio, ele acredita de verdade."}, {"id": "en25-72", "banca": "ENAMED/ENARE", "ano": 2025, "num": 72, "area": "Clínica Médica", "tema": "Supercrescimento bacteriano", "e": "Homem de 35 anos, índice de massa corporal de 15 kg/m?, é internado devido à diarreia líquida, com produtos patológicos, acompanhada de flatulência e desconforto abdominal há 4 semanas. Apresentou emagrecimento de cerca de 10 kg em 1 mês. Foram solicitados exames com endoscopia digestiva alta e baixa, sem alterações macroscópicas. Estudos histopatológicos de estômago, intestino delgado e cólon normais. Teste respiratório com lactulose positivo. O plano terapêutico adequado para esse paciente será", "a": ["neomicina e rifaximina.", "loperamida e escopolamina.", "dieta sem glúten e sem lactose.", "probióticos e inibidores da bomba de prótons."], "c": 0, "com": "Diarreia crônica com flatulência, emagrecimento, exames endoscópicos e histológicos normais e teste respiratório com lactulose positivo: supercrescimento bacteriano do intestino delgado (SIBO). O tratamento é antibiótico, como rifaximina, que pode ser associada à neomicina.", "tab": [["SIBO", "Pontos-chave"], ["Diagnóstico", "Teste respiratório (lactulose/glicose)"], ["Tratamento", "Rifaximina (± neomicina)"], ["Fatores de risco", "Dismotilidade, IBP, cirurgia prévia"]], "tut": "Teste do hidrogênio positivo = bactéria demais no intestino delgado. Trata com antibiótico que fica no intestino (rifaximina)."}, {"id": "en25-73", "banca": "ENAMED/ENARE", "ano": 2025, "num": 73, "area": "Pediatria", "tema": "Convulsão febril", "e": "Criança de 2 anos encaminhada ao matriciamento de pediatria, com história de ter apresentado há 7 dias uma crise tônico- clônica generalizada em vigência de temperatura axilar de 39,3 ºC, duração de 2 minutos, sem recorrência em 24 horas. Naquela ocasião foi realizado exame físico e neurológico, compatível com infecção viral de vias aéreas superiores, sem outras alterações. A conduta adequada nesse caso é", "a": ["solicitar eletroencefalograma.", "indicar profilaxia com barbitúricos.", "tranquilizar e orientar puericultura de rotina.", "solicitar exames laboratoriais e de imagem."], "c": 2, "com": "Criança de 2 anos com crise tônico-clônica generalizada única, de 2 minutos, com febre, sem recorrência em 24 horas e exame normal: convulsão febril simples. Não precisa de EEG, exames nem profilaxia. A conduta é tranquilizar a família e orientar.", "tab": [["Convulsão febril", "Simples x complexa"], ["Tipo", "Generalizada x focal"], ["Duração", "< 15 min x > 15 min"], ["Recorrência em 24 h", "Não x sim"]], "tut": "Convulsão com febre, generalizada, curta e única, numa criança de 6 meses a 5 anos: é simples. Acalme os pais e não peça exame."}, {"id": "en25-74", "banca": "ENAMED/ENARE", "ano": 2025, "num": 74, "area": "Cirurgia", "tema": "Complicações da tireoidectomia", "e": "Paciente de 47 anos, sexo feminino, atendida no ambulatório de cirurgia geral. A paciente havia sido submetida à cirurgia de tireoidectomia total há 60 dias, devido à um carcinoma folicular de tireoide, o qual estava restrito à glândula. No pós-operatório imediato, a paciente apresentou rouquidão, que não melhorou durante o acompanhamento ambulatorial nesses 60 dias. Com base no quadro clínico apresentado, qual foi o nervo lesionado durante a cirurgia?", "a": ["Laríngeo recorrente.", "Glossofaríngeo.", "Hipoglosso.", "Vago."], "c": 0, "com": "Rouquidão persistente após tireoidectomia indica lesão do nervo laríngeo recorrente, que inerva quase toda a musculatura intrínseca da laringe. Lesão bilateral pode causar insuficiência respiratória.", "tab": [["Nervo", "Lesão causa"], ["Laríngeo recorrente unilateral", "Rouquidão"], ["Laríngeo recorrente bilateral", "Estridor, insuficiência respiratória"], ["Laríngeo superior (ramo externo)", "Perda de agudos (voz de cantor)"]], "tut": "Saiu da tireoidectomia rouco e não melhorou? O nervo laríngeo recorrente foi lesado."}, {"id": "en25-75", "banca": "ENAMED/ENARE", "ano": 2025, "num": 75, "area": "Ginecologia e Obstetrícia", "tema": "Contracepção na obesidade e bariátrica", "e": "Paciente de 29 anos, nuligesta, ciclos menstruais com intervalos de 20 a 65 dias, duração de 4 a 10 dias, intensidade moderada. Apresenta índice de massa corporal de 41,5 kg/m? e se submeterá à cirurgia bariátrica em alguns meses. Necessita de orientação para contracepção. Com base nessas informações, assinale a alternativa correta.", "a": ["Para contracepção efetiva e proteção endometrial, está indicado o endoceptivo antes da operação", "Devido ao risco de apresentar tromboembolismo, está contraindicado o uso de métodos hormonais.", "Apresenta quadro de anovulação crônica, portanto deve ser orientada a usar preservativo masculino.", "Está contraindicada gravidez na fase de perda de peso, logo ela pode usar o adesivo anticoncepcional."], "c": 0, "com": "Obesidade grave com ciclos irregulares (anovulação, com risco de hiperplasia endometrial) e cirurgia bariátrica programada: o DIU de levonorgestrel dá contracepção eficaz, protege o endométrio e não depende de absorção intestinal.", "tab": [["Situação", "Melhor escolha"], ["Bariátrica (má absorção)", "Evitar via oral; preferir DIU/implante"], ["Anovulação crônica", "Proteção endometrial com progestágeno"], ["Obesidade grave", "Evitar estrogênio quando há outros riscos"]], "tut": "Antes da bariátrica, nada de pílula (vai ser mal absorvida). O DIU hormonal resolve contracepção e protege o endométrio."}, {"id": "en25-77", "banca": "ENAMED/ENARE", "ano": 2025, "num": 77, "area": "Medicina Preventiva", "tema": "Competência cultural", "e": "Uma equipe de saúde da família realiza atendimento itinerante a comunidades ribeirinhas e aldeias indígenas na Região Amazônica. Em visita, uma médica recém-chegada observa que uma mulher ribeirinha evita contato visual durante a consulta e responde às perguntas apenas com monossílabos. Em outra situação, um indígena da etnia Tikuna não aceita ser atendido sozinho e insiste na presença de um pajé da comunidade. A abordagem adequada que a equipe deve adotar é", "a": ["investir na padronização de rotinas clínicas e na capacitação da equipe para comunicação técnica propositiva e objetiva.", "promover espaços formativos para a equipe assistencial, reconhecendo saberes e práticas das populações atendidas.", "reforçar a autonomia profissional da médica, mantendo as condutas clínicas baseadas em evidências científicas.", "estabelecer rotinas padronizadas uniformes de atendimento para ribeirinhos e indígenas."], "c": 1, "com": "No cuidado a povos indígenas e ribeirinhos, a equipe deve respeitar e incorporar os saberes e práticas tradicionais (como a presença do pajé). Isso exige espaços de formação para a equipe, reconhecendo a diversidade cultural.", "tab": [["Princípio", "Aplicação"], ["Atenção diferenciada", "Respeito à cultura local"], ["Diálogo intercultural", "Incluir lideranças tradicionais"], ["Padronização rígida", "Inadequada nesses contextos"]], "tut": "Com povos tradicionais, quem se adapta é a equipe: reconhecer e respeitar os saberes locais faz parte do cuidado."}, {"id": "en25-79", "banca": "ENAMED/ENARE", "ano": 2025, "num": 79, "area": "Clínica Médica", "tema": "Sepse", "e": "Mulher de 62 anos, com histórico de infecções do trato urinário de repetição, dá entrada em Unidade de Pronto Atendimento (UPA) com quadro de febre alta e calafrios. A paciente é portadora de diabetes mellitus tipo 2, em tratamento regular com metformina e glicazida. À admissão apresenta-se com pressão arterial de 110 x 70 mmHg, frequência cardíaca de 106 bpm, frequência respiratória de 25 irpm e temperatura axilar de 38 “C. Os exames laboratoriais indicam hemoglobina de 12,3 g/dL e hematócrito de 36%; leucócitos de 14.000/mmê (valor de referência: 6.000 a 10.000/mm?), com 84% de neutrófilos e 12% de bastonetes; plaquetas de 210.000/mm'. A conduta para o caso deve ser recomendar", "a": ["tratamento com antitérmico, hidratação oral vigorosa e observação na unidade hospitalar.", "tratamento com esquema antibiótico de amplo espectro, ainda na 12 hora da chegada da paciente.", "tratamento com cobertura contra Candida sp, por se tratar de infecção urinária de repetição em paciente diabética.", "tratamento com antibiótico de amplo espectro, mantido durante todo o curso de tratamento, mesmo após os resultados das culturas."], "c": 1, "com": "Febre, taquicardia, taquipneia e leucocitose com desvio em diabética com ITU de repetição: provável sepse de foco urinário. O antibiótico de amplo espectro deve ser iniciado na primeira hora, após coleta de culturas, e depois descalonado conforme o resultado.", "tab": [["Pacote da 1ª hora (sepse)", "Ação"], ["Lactato", "Dosar"], ["Culturas", "Coletar antes do antibiótico"], ["Antibiótico", "Amplo espectro na 1ª hora"], ["Hipotensão/lactato alto", "Cristaloide 30 mL/kg"]], "tut": "Suspeitou de sepse, o relógio corre: antibiótico na primeira hora e, depois, ajuste pela cultura."}, {"id": "en25-80", "banca": "ENAMED/ENARE", "ano": 2025, "num": 80, "area": "Pediatria", "tema": "Hérnia diafragmática congênita", "e": "Recém-nascido a termo apresenta, no 1º minuto de vida, quadro de apneia e bradicardia, desvio do ictus à direita, abdome escavado e presença de ruídos hidroaéreos à ausculta do hemitórax esquerdo. No decorrer do atendimento desse recém-nascido, em sala de parto, os procedimentos adequados a serem realizados são", "a": ["intubação traqueal e massagem cardíaca externa.", "cateterismo umbilical e drenagem de hemitórax esquerdo.", "ventilação com óxido nítrico e administração de surfactante.", "ventilação com balão autoinflável com pressão expiratória final positiva."], "c": 0, "com": "RN com desconforto ao nascer, abdome escavado, ictus desviado e ruídos hidroaéreos no tórax: hérnia diafragmática congênita. Não se deve ventilar com balão e máscara, porque o ar distende as alças no tórax. Intuba-se logo e, se houver bradicardia persistente, faz-se massagem cardíaca.", "tab": [["Hérnia diafragmática", "Ponto-chave"], ["Achados", "Abdome escavado, RHA no tórax"], ["Proibido", "Ventilação com balão e máscara"], ["Conduta", "Intubação imediata + sonda gástrica"]], "tut": "Barriga murcha e barulho de intestino no peito = hérnia diafragmática. Nada de máscara: intuba direto."}, {"id": "en25-81", "banca": "ENAMED/ENARE", "ano": 2025, "num": 81, "area": "Cirurgia", "tema": "Doenças anorretais", "e": "Adulto jovem, sexo masculino, atendido em Unidade Básica de Saúde (UBS), relata dor e ardor no ânus acompanhados de sangramento vivo em pequena quantidade ao evacuar com esforço e fezes endurecidas. Nega tumoração perianal. Portador de constipação crônica e diagnóstico recente de doença Crohn. Exame geral sem alterações. Qual é o diagnóstico mais provável?", "a": ["Abcesso perianal.", "Fístula perianal.", "Cisto pilonidal.", "Fissura anal."], "c": 3, "com": "Dor anal intensa ao evacuar, com sangramento vivo em pequena quantidade e fezes endurecidas: fissura anal. A doença de Crohn também se associa a fissuras, muitas vezes atípicas.", "tab": [["Doença", "Achado"], ["Fissura anal", "Dor intensa ao evacuar + sangue vivo"], ["Hemorroida interna", "Sangramento indolor"], ["Abscesso", "Dor contínua, abaulamento, febre"]], "tut": "Dói muito pra evacuar e sai um pouco de sangue vivo: fissura. Hemorroida interna sangra sem doer."}, {"id": "en25-82", "banca": "ENAMED/ENARE", "ano": 2025, "num": 82, "area": "Ginecologia e Obstetrícia", "tema": "Prevenção da prematuridade", "e": "Paciente G3P1A1, idade gestacional de 24 semanas, comparece à consulta. Refere que na primeira gestação teve um abortamento com 16 semanas e na segunda, teve trabalho de parto vaginal muito rápido, na idade gestacional de 28 semanas. Na ultrassonografia transvaginal, realizada com 23 semanas desta gestação, detectou-se colo uterino com 1,5 cm de comprimento. Qual é a conduta adequada à situação?", "a": ["Solicitar a pesquisa de estreptococo do Grupo B na 282 semana.", "Internar a paciente para receber atosiban intravenoso até 34 semanas.", "Prescrever nifedipina 20 mg via oral diariamente à noite até 39 semanas.", "Prescrever progesterona micronizada via vaginal 200 mg ao dia até 36 semanas."], "c": 3, "com": "Gestante com antecedente de parto prematuro e colo curto (1,5 cm) com 24 semanas: a progesterona micronizada vaginal (200 mg/dia) até 36 semanas reduz o risco de novo parto prematuro.", "tab": [["Situação", "Conduta"], ["Colo ≤ 2,5 cm no 2º trimestre", "Progesterona vaginal"], ["Prematuro prévio + colo curto", "Progesterona (± cerclagem)"], ["Até quando", "36 semanas"]], "tut": "Colo curto no ultrassom = progesterona vaginal até 36 semanas pra segurar a gravidez."}, {"id": "en25-83", "banca": "ENAMED/ENARE", "ano": 2025, "num": 83, "area": "Ginecologia e Obstetrícia", "tema": "Rastreio do câncer de colo", "e": "Mulher de 32 anos, sexualmente ativa, comparece à consulta com o médico de família e comunidade para realização do seu primeiro exame preventivo. O médico realiza a coleta de citologia oncótica. Após 3 semanas, a paciente retorna com o resultado “presença de lesão intraepitelial de baixo grau”. Considerando esse resultado, qual é a conduta adequada do médico?", "a": ["Solicitar ultrassonografia transvaginal.", "Repetir o exame citopatológico em 6 meses.", "Encaminhar para a realização de colposcopia.", "Repetir o exame citopatológico imediatamente."], "c": 1, "com": "Lesão intraepitelial de baixo grau (LSIL) em mulher de 25 anos ou mais: a conduta é repetir a citologia em 6 meses. Se persistir, encaminha-se para colposcopia.", "tab": [["Resultado", "Conduta (≥ 25 anos)"], ["ASC-US", "Repetir em 6 meses"], ["LSIL", "Repetir em 6 meses"], ["HSIL / ASC-H", "Colposcopia"]], "tut": "Baixo grau costuma regredir sozinho: repete em 6 meses. Alto grau vai direto pra colposcopia."}, {"id": "en25-84", "banca": "ENAMED/ENARE", "ano": 2025, "num": 84, "area": "Medicina Preventiva", "tema": "Violência contra a pessoa idosa", "e": "A agente comunitária de saúde de uma Unidade Básica de Saúde (UBS) relata, durante a reunião de equipe, a sua preocupação com os idosos de uma instituição de longa permanência para idosos (ILPI) no território da UBS. Em sua última visita, a agente observou que na instituição havia 38 idosos vivendo em isolamento excessivo, a maioria sem vínculos familiares ativos e sofrendo constantes agressões dos funcionários. Comenta ainda que havia sinais de contenção física em idosos com demência avançada e presença de lesões de pressão. Qual a conduta mais adequada da equipe de saúde?", "a": ["Formalizar denúncia ao Conselho Municipal do Idoso, considerando que situações como contenção e úlcera por pressão podem acontecer em ambientes de institucionalização prolongada e não requerem intervenção clínica imediata.", "Oferecer apoio clínico para os casos de maior vulnerabilidade, como os com lesão por pressão e agitação psicomotora, sugerindo adequações na rotina assistencial, respeitando a autonomia da ILPI.", "Articular ação intersetorial com órgãos de controle social, registrar notificação compulsória de violência institucional e elaborar plano de ação conjunta com a equipe da ILPI.", "Agendar reuniões quinzenais com a equipe da ILPI para educação permanente sobre cuidados paliativos, sem envolver outras instâncias legais ou sociais."], "c": 2, "com": "Agressões, contenção inadequada e lesões por pressão em uma ILPI configuram violência institucional. A equipe deve notificar compulsoriamente, articular com órgãos de controle (MP, conselho do idoso, vigilância sanitária) e montar um plano de ação conjunto.", "tab": [["Violência contra idoso", "Conduta"], ["Suspeita", "Notificação compulsória"], ["Instituição", "Acionar MP, conselho, vigilância sanitária"], ["Cuidado", "Plano intersetorial"]], "tut": "Violência contra idoso não se resolve só com capacitação: notifique e acione os órgãos de proteção."}, {"id": "en25-85", "banca": "ENAMED/ENARE", "ano": 2025, "num": 85, "area": "Clínica Médica", "tema": "Intoxicações", "e": "Mulher de 42 anos é levada pelo irmão à Unidade de Pronto Atendimento (UPA) com fala alterada, lentificação, tontura e sonolência. Ela admite ter ingerido 30 comprimidos de clonazepam 2 mg há 20 minutos. Paciente evolui com hipotensão, rebaixamento do nível de consciência, sendo caracterizado coma e indicada a ventilação mecânica. Qual medicação é indicada nessa situação?", "a": ["N-acetilcisteína.", "Flumazenil.", "Naloxona.", "Atropina."], "c": 1, "com": "Intoxicação por benzodiazepínico (clonazepam) com coma: o antagonista específico é o flumazenil. Na prática, é usado com cautela por risco de convulsões, principalmente em usuários crônicos.", "tab": [["Intoxicação", "Antídoto"], ["Benzodiazepínicos", "Flumazenil"], ["Opioides", "Naloxona"], ["Paracetamol", "N-acetilcisteína"], ["Organofosforados", "Atropina"]], "tut": "Benzodiazepínico = flumazenil; opioide = naloxona. Clássica dupla de antídotos."}, {"id": "en25-86", "banca": "ENAMED/ENARE", "ano": 2025, "num": 86, "area": "Clínica Médica", "tema": "Arterite de células gigantes", "e": "Mulher de 55 anos, sem história de doenças crônicas, procura atendimento por queixa de cefaleia persistente em ambos os lados do crânio, associada a alterações de visão (amaurose fugaz e diplopia), cansaço e artralgias. Relata dor em todo o couro cabeludo. Notou perda de peso (2 kg em 2 meses). Nega fotofobia ou fonofobia, febre ou náuseas, e afirma que não acorda de madrugada por conta da cefaleia. Nega qualquer problema de ordem emocional. Ao exame, a paciente encontra- se afebril, com pupilas isocóricas e sem rigidez de nuca. Qual é o tipo de cefaleia dessa paciente, e qual exame seria útil na sua investigação preliminar, respectivamente?", "a": ["Cefaleia primária (cefaleia tensional); nenhum exame é necessário.", "Cefaleia secundária (hemorragia subaracnoideia); análise de líquor.", "Cefaleia primária (migrânea); tomografia computadorizada de encéfalo.", "Cefaleia secundária (arterite temporal); velocidade de hemossedimentação."], "c": 3, "com": "Mulher acima de 50 anos com cefaleia nova, dor no couro cabeludo, sintomas visuais (amaurose fugaz, diplopia), artralgias e perda de peso: arterite temporal (cefaleia secundária). VHS e PCR elevados apoiam o diagnóstico, e o corticoide deve ser iniciado logo para evitar cegueira.", "tab": [["Arterite temporal", "Pontos-chave"], ["Perfil", "> 50 anos"], ["Clínica", "Cefaleia nova, claudicação de mandíbula, sintomas visuais"], ["Exames", "VHS/PCR elevados; biópsia de artéria temporal"]], "tut": "Cefaleia nova depois dos 50 com alteração visual: peça VHS e não espere, porque o risco é ficar cego."}, {"id": "en25-87", "banca": "ENAMED/ENARE", "ano": 2025, "num": 87, "area": "Pediatria", "tema": "Obesidade e acantose nigricans", "e": "Adolescente de 13 anos, sexo masculino, procura atendimento na Unidade Básica de Saúde (UBS) devido a manchas escurecidas nas dobras do pescoço, axilas e virilhas. Ao exame físico, índice de massa corporal está no Z escore entre +2 e +3 para a idade e sexo, relação da circunferência abdominal/estatura aumentada, com manchas hipercrômicas no pescoço, axilas e raiz da coxa, sem outros achados significativos. Além de prescrever mudança de hábitos alimentares e aumento da atividade física, deve-se", "a": ["solicitar biópsia das lesões e hemoglobina glicada.", "solicitar perfil lipídico e ultrassonografia de abdome.", "indicar corticoide tópico nas lesões e evitar exposição solar.", "indicar antifúngico nas lesões e solicitar teste de tolerância oral à glicose."], "c": 1, "com": "Adolescente com obesidade e acantose nigricans (marcador de resistência insulínica): além de mudar hábitos, deve-se investigar comorbidades metabólicas, como dislipidemia (perfil lipídico) e esteatose hepática (ultrassom de abdome).", "tab": [["Acantose nigricans", "Significado"], ["Manchas escuras em dobras", "Resistência à insulina"], ["Investigar", "Glicemia/HbA1c, perfil lipídico, esteatose"], ["Tratamento", "Perda de peso"]], "tut": "Mancha escura no pescoço do adolescente obeso não é sujeira nem fungo: é resistência à insulina. Investigue o metabolismo."}, {"id": "en25-89", "banca": "ENAMED/ENARE", "ano": 2025, "num": 89, "area": "Ginecologia e Obstetrícia", "tema": "Descolamento prematuro de placenta", "e": "Gestante de 28 anos, idade gestacional desconhecida, situação de vulnerabilidade social, chega, trazida pelo Serviço Móvel de Atendimento de Urgência (SAMU), com sangramento vaginal intenso, hipertonia uterina, pressão arterial de 130 x 90 mmHg, altura uterina de 32 cm, batimentos cardíacos fetais de 90 bpm. Togue vaginal: colo grosso, posterior impérvio. A acompanhante refere que a paciente fez uso de cocaína antes do ocorrido. O diagnóstico, a conduta adequada e a complicação possível são, respectivamente,", "a": ["descolamento de placenta; cesárea; útero de Couvalaire.", "rotura de vasa prévia; amniotomia; anemia fetal.", "trabalho de parto; inibição; prematuridade.", "pré-eclâmpsia; cesárea; rotura uterina."], "c": 0, "com": "Sangramento intenso, hipertonia uterina, sofrimento fetal (bradicardia) e uso de cocaína: descolamento prematuro de placenta. Com feto vivo e colo desfavorável, faz-se cesárea de emergência. Uma complicação possível é o útero de Couvelaire (apoplexia uteroplacentária).", "tab": [["DPP", "Pontos-chave"], ["Fatores de risco", "HAS, cocaína, trauma, tabagismo"], ["Clínica", "Dor, hipertonia, sangramento escuro"], ["Complicações", "Útero de Couvelaire, CIVD"]], "tut": "Útero duro como pedra, sangramento e bebê sofrendo, ainda mais com cocaína: descolamento de placenta e cesárea."}, {"id": "en25-90", "banca": "ENAMED/ENARE", "ano": 2025, "num": 90, "area": "Medicina Preventiva", "tema": "Profilaxia da raiva", "e": "Homem de 23 anos, previamente hígido, procura atendimento na Unidade Básica de Saúde (UBS) relatando que há cerca de 2 horas foi mordido por um gato de rua ao tentar retirá-lo de cima de uma árvore. A mordida resultou em feridas cortocontusas nos dedos da mão esquerda. Paciente nega episódios anteriores de agressões desse tipo. O animal, que não pertence a ninguém da vizinhança, fugiu após ser resgatado. Na cidade, no ano anterior, houve a confirmação de raiva em felinos. A conduta adequada no atendimento imediato ao paciente é", "a": ["higienizar adequadamente e suturar as lacerações; aplicar o soro antirrábico; prescrever 1 dose de penicilina benzatina 1,2 milhão de UI.", "lavar os ferimentos com antissépticos; aguardar a busca ativa do animal pela zoonose para início da profilaxia; aplicar reforço da vacina dT (difteria e tétano).", "lavar os ferimentos com água corrente abundante e sabão; administrar a vacina antirrábica em 4 doses, nos dias 0, 3, 7 e 14; aplicar imunoglobulina humana antirrábica.", "higienizar com solução antisséptica; administrar a 12 dose da vacina antirrábica; na presença de qualquer reação adversa, contraindicar as doses subsequentes; aplicar o soro antirrábico."], "c": 2, "com": "Mordedura de gato não observável, em mão (local grave), numa região com raiva felina: acidente grave. A conduta é lavar com água e sabão e fazer vacina antirrábica (4 doses: dias 0, 3, 7 e 14) mais soro ou imunoglobulina antirrábica.", "tab": [["Acidente", "Conduta"], ["Animal observável", "Observar 10 dias"], ["Leve, animal não observável", "Vacina (4 doses)"], ["Grave, animal não observável", "Vacina + soro/imunoglobulina"]], "tut": "Gato fugiu e a mordida foi na mão: é grave. Vacina + soro, depois de lavar bem com água e sabão."}, {"id": "en25-91", "banca": "ENAMED/ENARE", "ano": 2025, "num": 91, "area": "Clínica Médica", "tema": "Síndrome coronariana sem supra", "e": "Homem de 56 anos, em acompanhamento médico por angina instável de início recente, diabetes mellitus tipo 2, hipertensão arterial sistêmica e dislipidemia, é internado em unidade coronariana de hospital de atenção terciária com quadro de dor torácica emaperto, deforte intensidade, irradiada parao membro superior esquerdo e mandíbula, iniciada há cerca de 2 horas. O paciente relata ter sofrido 3 episódios de dor com características similares, mas de menor duração, nas últimas 24 horas. Ele vem em uso crônico de losartana, hidroclorotiazida, ácido acetilsalicílico, dapagliflozina, metformina e atorvastatina. Ao exame físico, ausculta-se 42 bulha, níveis pressóricos dentro da normalidade, sem congestão pulmonar. Um eletrocardiograma mostra novo infradesnivelamento segmento ST de 1 mm, com inversão de onda T, em parede anterior. O paciente evolui com elevação da troponina-l, fazendo curva enzimática. O escore de risco Grace é de 152 pontos, enquanto o TIMI risk score é de 5 pontos. A conduta indicada nesse caso é realizar", "a": ["angiotomografia coronária em até 48 horas.", "cateterismo cardíaco nas primeiras 24 horas.", "cateterismo cardíaco em até 3 dias do evento.", "ecocardiograma de estresse em até 7 dias do evento."], "c": 1, "com": "IAM sem supra (troponina elevada, infra de ST) com GRACE de 152 (acima de 140) é de alto risco. A estratégia invasiva precoce está indicada, com cateterismo nas primeiras 24 horas.", "tab": [["Risco", "Tempo do cateterismo"], ["Muito alto (instabilidade, angina refratária)", "< 2 horas"], ["Alto (troponina +, GRACE > 140)", "< 24 horas"], ["Baixo", "Estratificação não invasiva"]], "tut": "Troponina subiu e GRACE passou de 140: cateterismo nas primeiras 24 horas."}, {"id": "en25-92", "banca": "ENAMED/ENARE", "ano": 2025, "num": 92, "area": "Pediatria", "tema": "Asma grave na criança", "e": "Menina de 1 ano e 10 meses é levada ao serviço de urgência com quadro de tosse e dispneia há 4 dias. A mãe refere que aumentou a frequência de salbutamol, que usa rotineiramente, porém não observou melhora, com piora da dispneia há 6 horas. Relata frequentes exacerbações da asma nos últimos 3 meses, apesar da utilização de prednisolona. História familiar: paie mãe asmáticos. Ao exame físico, lactente no colo da mãe, afebril, sonolenta, taquidispneica, choro entrecortado, saturação 94% em ar ambiente, retração de musculatura acessória. Além da internação da criança, a conduta adequada é prescrever", "a": ["metilprednisolona endovenoso.", "ventilação não invasiva (VNI) com sedação.", "salbutamol endovenoso em infusão contínua.", "sulfato de magnésio em infusão intravenosa contínua."], "c": 0, "com": "Crise grave de asma (sonolência, retrações, fala entrecortada) sem resposta ao salbutamol: além de internar e manter o broncodilatador, deve-se dar corticoide sistêmico, como metilprednisolona endovenosa.", "tab": [["Crise grave de asma", "Tratamento"], ["Broncodilatador", "Salbutamol inalatório frequente"], ["Corticoide sistêmico", "Precoce (oral ou EV)"], ["Refratária", "Sulfato de magnésio, considerar UTI"]], "tut": "Crise de asma que não melhora com bombinha: corticoide sistêmico já, ainda mais em criança sonolenta."}, {"id": "en25-93", "banca": "ENAMED/ENARE", "ano": 2025, "num": 93, "area": "Cirurgia", "tema": "Queimadura química ocular", "e": "Paciente de 45 anos atendida na Unidade Básica de Saúde (UBS) com dor ocular. Referiu que estava realizando limpeza doméstica com alvejante e deixou atingir o olho, acidentalmente. Ao exame físico, foi observada presença de hiperemia intensa com opacidade da córnea e queimadura química da pálpebra superior do olho direito. Qual é o correto manejo da paciente?", "a": ["Prescrição de analgésico tópico e colírio lubrificante.", "Lavagem dos olhos com solução de água boricada e curativo oclusivo.", "Lavagem ocular com solução fisiológica e avaliação imediata do especialista.", "Prescrição de colírio de corticoide tópico e avaliação precoce do especialista."], "c": 2, "com": "Queimadura química ocular é emergência: o primeiro passo é irrigação abundante com soro fisiológico (ou água) por vários minutos e, depois, avaliação imediata do oftalmologista. Não se faz curativo oclusivo nem corticoide antes da avaliação especializada.", "tab": [["Queimadura química no olho", "Conduta"], ["Imediato", "Irrigação abundante"], ["Depois", "Oftalmologista imediato"], ["Evitar", "Neutralizar com outra substância, ocluir"]], "tut": "Produto químico no olho: lava, lava e lava, e chama o oftalmologista na hora."}, {"id": "en25-94", "banca": "ENAMED/ENARE", "ano": 2025, "num": 94, "area": "Ginecologia e Obstetrícia", "tema": "Sangramento pós-menopausa", "e": "Mulher de 72 anos, previamente hígida, com menopausa aos 53 anos, obesa, solteira e nulípara, nunca fez reposição hormonal. Chega à Unidade de Pronto Atendimento (UPA) com sangramento vaginal há dois dias, hemodinamicamente estável. Nega sangramentos anteriores. Realizou exame especular, com os seguintes achados: mucosa vaginal sem alterações, colo uterino contendo lesão polipoide que se exteriorizava pelo orifício externo, ectocérvice sem alterações, anexos livres. À ultrassonografia transvaginal, útero contendo 3 nódulos, medindo respectivamente 2,5 cm, 3,5 cm e 1,5 cm em seus maiores diâmetros, sendo o 1º e o 2º intramurais e o 3º submucoso. Endométrio medindo 8 mm de espessura. Colo uterino mostrando lesão polipoide no canal endocervical, medindo 1,5 cm em sua maior dimensão. Qual é a principal hipótese diagnóstica?", "a": ["Hiperplasia endometrial.", "Câncer de colo de útero.", "Leiomioma submucoso.", "Endométrio atrófico."], "c": 0, "com": "Mulher na pós-menopausa, obesa, nulípara, com sangramento e endométrio de 8 mm (acima de 4 mm) tem fatores de risco para hiperplasia e câncer de endométrio. O pólipo endocervical e os miomas não explicam sozinhos o quadro. A investigação é histológica (histeroscopia com biópsia).", "tab": [["Endométrio na pós-menopausa com sangramento", "Conduta"], ["≤ 4 mm", "Provável atrofia"], ["> 4 mm", "Investigar (histeroscopia/biópsia)"], ["Fatores de risco", "Obesidade, nuliparidade, menopausa tardia"]], "tut": "Sangrou depois da menopausa com endométrio grosso? Pense em hiperplasia ou câncer de endométrio e biopse."}, {"id": "en25-95", "banca": "ENAMED/ENARE", "ano": 2025, "num": 95, "area": "Pediatria", "tema": "Anemia ferropriva", "e": "Menina de 11 anos é levada pela mãe à consulta médica em Unidade Básica de Saúde (UBS), com história de cansaço, palidez cutânea e baixo rendimento escolar nos últimos 3 meses. Ao exame físico, mucosas hipocrômicas (3+/4+); palidez cutânea. Pulso radial: 104 bpm, rítmico e cheio. Aparelho cardiovascular: sopro sistólico 2/6. Restante do exame físico sem alterações. Mãe apresenta hemograma da menina realizado há 2 semanas. Hemoglobina 84 g/dL 11,5 a 15,5 g/dL Hematócrito 25,3% 36 a 48% VCM 62 fL 80 a 98 fL HCM 24 pg 2/a 34 pg CHCM 28 g/dL 31236 g/dL RDW 22% 11,5 a 14,5% Leucócitos totais 8.430/mm? 4.000 a 10.000/mm? Neutrófilos 54% 40 a 80% Eosinófilos 10% 025% Basófilos 1% 0a 2% Monócitos 4% 2 a 10% Linfócitos 31% 25 a 50% Plaquetas 480.000/mm? | 140.000 a 450.000/mmê Diante do caso apresentado, assinale a alternativa mais adequada.", "a": ["Deve-se dosar o ferro sérico, por ser exame sensível e específico, atentando-se para o ritmo circadiano do ferro, cujos valores são mais elevados pela manhã.", "Considerando-se o resultado dos exames, pode-se iniciar tratamento com 4 mg/kg/dia de ferro elementar, e espera- se aumento de reticulócitos em 4 a 7 dias.", "Com base no HCM, a anemia pode ser classificada em normocítica, e o esfregaço de sangue periférico pode evidenciar anisocitose, eliptocitose e poiquilocitose.", "A eosinofilia e a trombocitose observadas function qById(id){return Q.find(q=>q.id===id);}
function stats(filterArea){
  let tot=0,ok=0;const by={};AREAS.forEach(a=>by[a]={t:0,o:0});const byTema={};
  Object.entries(S.ans).forEach(([id,r])=>{const q=qById(id);if(!q)return;if(filterArea&&q.area!==filterArea)return;
    tot++;if(r.ok)ok++;by[q.area].t++;if(r.ok)by[q.area].o++;
    byTema[q.tema]=byTema[q.tema]||{t:0,o:0,area:q.area};byTema[q.tema].t++;if(r.ok)byTema[q.tema].o++;});
  return {tot,ok,err:tot-ok,pct:tot?Math.round(ok/tot*100):0,by,byTema};
}
function daysTo(d){if(!d)return null;const t=new Date(d+"T00:00:00");const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
