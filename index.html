 de 1,6, indica choque grave. Além de corrigir a atonia, deve-se acionar o protocolo de transfusão maciça.", "tab": [["Índice de choque (FC/PAS)", "Significado"], ["< 0,9", "Normal"], ["≥ 1,0", "Sangramento significativo"], ["≥ 1,4", "Transfusão maciça provável"]], "tut": "Na hemorragia pós-parto, divida FC pela PA sistólica: acima de 1,4, pede sangue em massa."}, {"id": "usp26-106", "banca": "USP-SP", "ano": 2026, "num": 106, "area": "Ginecologia e Obstetrícia", "tema": "Cistite não complicada", "e": "Mulher, 26 anos de idade, procura atendimento na Unidade Básica de Saúde (UBS) por disúria e urgência miccional há 3 dias. Nega febre, nega corrimento vaginal, usa DIU de cobre há 2 anos. Não faz uso de medicação de uso contínuo e teve sintomas semelhantes há cerca de 1 ano e meio. Exame físico sem alterações. Assinale a alternativa que apresenta a conduta recomendada para o caso.", "a": ["Ciprofloxacino, após coleta de urina 1 e urocultura.", "Ceftriaxona, sem necessidade de coleta de exame.", "Sulfametoxazol/trimetoprima, após coleta de urina 1 e urocultura.", "Nitrofurantoína, sem necessidade de coleta de exame."], "c": 3, "com": "Cistite em mulher jovem, não gestante, sem febre ou sinais de pielonefrite: tratamento empírico sem necessidade de exames, com nitrofurantoína (ou fosfomicina).", "tab": [["Cistite não complicada", "Conduta"], ["Diagnóstico", "Clínico"], ["Primeira linha", "Nitrofurantoína ou fosfomicina"], ["Evitar", "Quinolonas de rotina"]], "tut": "Cistite simples na mulher jovem: trate pela clínica, com nitrofurantoína."}, {"id": "usp26-107", "banca": "USP-SP", "ano": 2026, "num": 107, "area": "Ginecologia e Obstetrícia", "tema": "Atraso puberal", "e": "Adolescente, sexo feminino, 15 anos de idade, sem desenvolvimento mamário ou menarca. Altura está no z-score -2. Avaliação hormonal revela LH de 0,2 mUI/mL, FSH de 1,1 mUI/mL e estradiol indetectável. Qual a hipótese mais provável?", "a": ["Hiperprolactinemia.", "Disgenesia gonadal.", "Hiperplasia adrenal congênita.", "Síndrome de insensibilidade androgênica. Note e adote: Valor de referência para pré-puberes: LH: < 0,3 mUI/mL FSH: < 4,0 mUI/mL"], "c": 0, "com": "Adolescente sem puberdade com LH e FSH baixos e estradiol indetectável: hipogonadismo hipogonadotrófico. Entre as opções, a hiperprolactinemia é a causa compatível. Disgenesia gonadal teria FSH alto.", "tab": [["Atraso puberal", "Gonadotrofinas"], ["Hipogonadotrófico", "LH/FSH baixos (central, prolactina)"], ["Hipergonadotrófico", "LH/FSH altos (Turner, disgenesia)"], ["Atraso constitucional", "Baixos, mas puberdade virá"]], "tut": "Gonadotrofina baixa = problema no comando central. Alta = problema no ovário."}, {"id": "usp26-108", "banca": "USP-SP", "ano": 2026, "num": 108, "area": "Pediatria", "tema": "Puberdade precoce", "e": "Menina, 6 anos de idade, apresenta telarca bilateral progressiva e aceleração da velocidade de crescimento. O exame físico mostra desenvolvimento mamário estágio M2 e a estatura no z-score +3 para a idade. Exame neurológico é normal. Assinale a alternativa que apresenta a conduta adequada.", "a": ["Análise do cariótipo.", "Dosagem de hormônio do crescimento.", "Ressonância magnética de SNC.", "Ultrassom pélvico."], "c": 2, "com": "Telarca progressiva com aceleração do crescimento em menina de 6 anos sugere puberdade precoce central. Em meninas com início antes dos 6 anos, ou com sinais de alarme, a RM de SNC é indicada para afastar lesão.", "tab": [["Puberdade precoce", "Definição"], ["Meninas", "Antes dos 8 anos"], ["Meninos", "Antes dos 9 anos"], ["Central", "LH elevado; investigar SNC"]], "tut": "Peito crescendo e estirão em menina pequena: pense em puberdade precoce central e olhe o cérebro."}, {"id": "usp26-109", "banca": "USP-SP", "ano": 2026, "num": 109, "area": "Ginecologia e Obstetrícia", "tema": "Violência sexual", "e": "Adolescente, 17 anos de idade, chega ao hospital acompanhada da mãe, relatando violência sexual ocorrida há aproximadamente 80 horas. O teste rápido para HIV foi negativo. Qual das condutas é mais apropriada em relação à Profilaxia Pós-exposição (PEP) ao HIV?", "a": ["Iniciar PEP com esquema de 28 dias.", "Não iniciar PEP, pois o prazo máximo é 72 horas.", "Não há indicação, pois o teste rápido para HIV é negativo.", "Aguardar a avaliação da soroconversão em sete dias."], "c": 1, "com": "A PEP para HIV deve ser iniciada em até 72 horas da exposição. Após 80 horas, não está mais indicada, mas o restante do atendimento (outras profilaxias, contracepção de emergência até 120 h, seguimento) continua.", "tab": [["Profilaxia", "Prazo"], ["PEP HIV", "Até 72 h"], ["Contracepção de emergência", "Até 120 h"], ["Profilaxia de outras ISTs", "Pode ser feita"]], "tut": "PEP para HIV tem janela de 72 horas. Passou disso, não adianta começar."}, {"id": "usp26-110", "banca": "USP-SP", "ano": 2026, "num": 110, "area": "Ginecologia e Obstetrícia", "tema": "Cervicite", "e": "Mulher, 24 anos de idade, com queixa de corrimento vaginal amarelado e aumento da secreção nas últimas 48 horas, sem prurido vaginal. Refere dor leve no hipogástrio, sem febre. Ao exame especular, observa-se conteúdo mucopurulento na endocérvice e discreto sangramento. Ao toque, o colo é friável. O teste rápido de Amplificação de Ácido Nucleico (NAAT) é positivo para Neisseria gonorrhoeae e Chlamydia trachomatis. Assinale a alternativa que apresenta o tratamento mais adequado e eficaz atualmente.", "a": ["Doxiciclina 100 mg VO por 7 dias em monoterapia.", "Ceftriaxona 500 mg IM em dose única e doxiciclina 100 mg VO por 7 dias.", "Ceftriaxona 500 mg IM em dose única e azitromicina 1 g VO em dose única.", "Azitromicina 1 g VO em duas doses com 7 dias de intervalo."], "c": 2, "com": "Cervicite por gonococo e clamídia: o PCDT brasileiro recomenda ceftriaxona 500 mg IM dose única associada a azitromicina 1 g VO dose única.", "tab": [["Cervicite", "Tratamento (PCDT IST)"], ["Gonococo", "Ceftriaxona 500 mg IM"], ["Clamídia", "Azitromicina 1 g VO (ou doxiciclina 7 dias)"], ["Parceiros", "Tratar também"]], "tut": "Gonococo e clamídia juntos: ceftriaxona na injeção e azitromicina por boca."}, {"id": "usp26-111", "banca": "USP-SP", "ano": 2026, "num": 111, "area": "Ginecologia e Obstetrícia", "tema": "Insuficiência istmocervical", "e": "Mulher, 26 anos de idade, secundigesta com um parto vaginal anterior com recém-nascido de 1.800 g, retorna em consulta pré-natal com 20 semanas de gravidez. Está bem, sem queixas. Traz ultrassonografia morfológica realizada hoje, com feto único, sem malformações diagnosticadas, placenta fúndica. Avaliação do colo via transvaginal apresentada nas imagens a seguir: Assinale a alternativa que apresenta a conduta a ser adotada.", "a": ["Medida do colo seriada.", "Repouso absoluto.", "Inserção de pessário.", "Cerclagem de emergência."], "c": 3, "com": "Antecedente de parto prematuro (RN de 1.800 g) e colo curto e dilatado com afunilamento à pressão no segundo trimestre: indicação de cerclagem.", "tab": [["Colo curto", "Conduta"], ["< 25 mm + parto prematuro prévio", "Cerclagem"], ["< 20 mm sem antecedente", "Progesterona vaginal"], ["Pessário", "Opção em casos selecionados"]], "tut": "Prematuro anterior e colo que encurta: cerclagem.", "img": ["img/q/usp26-111.jpg"]}, {"id": "usp26-112", "banca": "USP-SP", "ano": 2026, "num": 112, "area": "Ginecologia e Obstetrícia", "tema": "Trabalho de parto prematuro", "e": "Primigesta, 22 anos de idade, 34 semanas e 3 dias de gravidez, comparece ao pronto atendimento com queixa de dor em baixo ventre há 2 dias, que se intensificou na última hora. Nega perdas vaginais. Nega sintomas urinários. Tem registro em cartão de pré-natal de sorologias de 3º trimestre negativas, não coletou pesquisa de Estreptococo B. Ao exame, apresenta bom estado geral, corada, PA de 122×84 mmHg, FC de 92 bpm, abdome gravídico, altura uterina de 28 cm, cefálico, dorso à esquerda, dinâmica uterina 2 contrações moderadas em 10 minutos, BCF presente de 156 bpm. Ao toque vaginal, colo médio, medianizado, 3 cm de dilatação, bolsa íntegra. A conduta imediata recomendada no pronto atendimento é:", "a": ["Escopolamina endovenosa e reavaliação em duas horas.", "Betametasona intramuscular e inibição do trabalho de parto.", "Ampicilina endovenosa e condução do trabalho de parto.", "Sulfato de magnésio endovenoso e cesárea imediata."], "c": 2, "com": "Gestante com 34 semanas e 3 dias em trabalho de parto: a partir de 34 semanas não se inibe o parto nem se faz corticoide. Com status de estreptococo B desconhecido, faz-se profilaxia com ampicilina e conduz-se o parto.", "tab": [["Idade gestacional", "Conduta"], ["< 34 semanas", "Corticoide, tocólise, magnésio se < 32"], ["≥ 34 semanas", "Conduzir o parto"], ["EGB desconhecido no prematuro", "Profilaxia com ampicilina/penicilina"]], "tut": "Passou de 34 semanas, deixa nascer. Sem cultura de estreptococo B, faz a profilaxia."}, {"id": "usp26-113", "banca": "USP-SP", "ano": 2026, "num": 113, "area": "Ginecologia e Obstetrícia", "tema": "Climatério e humor", "e": "Mulher, 52 anos de idade, em consulta de rotina refere ciclos menstruais com intervalos de 45 dias há 5 meses. Também notou perda progressiva de interesse sexual e prejuízo no relacionamento conjugal. Nesses meses, relata dificuldade com a memória. Tem estado cansada e já não está mais indo aos almoços com as amigas. Está se alimentando bem, até com mais apetite do que o costume e ganhou peso no último mês. Nega antecedente de trombose venosa ou doença cardiovascular. Exame pélvico mostra mucosa vaginal sem atrofia significativa; restante do exame físico é normal. Ela se considera uma mulher forte, nega tristeza e expressa vontade de tomar um medicamento que pudesse melhorar o sono e reduzir o apetite. Considerando o quadro descrito, assinale a alternativa que apresenta o tratamento medicamentoso mais indicado.", "a": ["Testosterona.", "Estrogênio + progesterona.", "Topiramato.", "Sertralina."], "c": 3, "com": "Na transição menopausal com queixas de libido, memór ": "Ginecologia e Obstetrícia", "tema": "Miomas e sangramento", "e": "Mulher, 42 anos de idade, apresenta menstruações com fluxo intenso e duração de 10 dias há mais de 6 meses. Ao exame ginecológico, apresenta útero aumentado, móvel, de superfície regular. Ultrassonografia revela miomas subserosos e intramurais, o maior com 5 cm. Foi indicada a inserção de DIU de progesterona. Qual é o objetivo deste tratamento?", "a": ["Reduzir o fluxo sanguíneo ao útero.", "Bloquear o ciclo ovulatório.", "Promover a involução dos leiomiomas.", "Promover atrofia endometrial."], "c": 3, "com": "O DIU de levonorgestrel age causando atrofia (decidualização) do endométrio, o que reduz o sangramento. Ele não reduz significativamente o tamanho dos miomas.", "tab": [["Tratamento", "Mecanismo"], ["DIU-LNG", "Atrofia endometrial"], ["Análogo de GnRH", "Reduz o mioma (hipoestrogenismo)"], ["Ácido tranexâmico", "Antifibrinolítico"]], "tut": "O DIU hormonal age no endométrio, não no mioma: ele afina a camada que sangra."}, {"id": "usp26-120", "banca": "USP-SP", "ano": 2026, "num": 120, "area": "Ginecologia e Obstetrícia", "tema": "Profilaxia antibiótica no parto", "e": "Tercigesta secundípara, com estenose mitral reumática, comparece na maternidade com gestação de 37 semanas e 6 dias em trabalho de parto espontâneo. Refere perda de líquido amniótico típica há 8 horas. Pesquisa de Estreptococo grupo B não realizada. Considerando parto vaginal não complicado, qual é a profilaxia antibiótica indicada?", "a": ["Ampicilina.", "Cefazolina.", "Ampicilina e clindamicina.", "Não há indicação."], "c": 3, "com": "Questão anulada pela banca. A estenose mitral não exige profilaxia de endocardite no parto vaginal não complicado. Com 37 semanas e 6 dias, bolsa rota há 8 horas e sem febre, também não há fator de risco para estreptococo do grupo B, então a resposta mais defensável é que não há indicação.", "tab": [["Profilaxia para EGB sem cultura", "Indicar se"], ["Prematuridade", "< 37 semanas"], ["Bolsa ro function stats(filterArea){
  let tot=0,ok=0;const by={};AREAS.forEach(a=>by[a]={t:0,o:0});const byTema={};
  Object.entries(S.ans).forEach(([id,r])=>{const q=qById(id);if(!q)return;if(filterArea&&q.area!==filterArea)return;
    tot++;if(r.ok)ok++;by[q.area].t++;if(r.ok)by[q.area].o++;
    byTema[q.tema]=byTema[q.tema]||{t:0,o:0,area:q.area};byTema[q.tema].t++;if(r.ok)byTema[q.tema].o++;});
  return {tot,ok,err:tot-ok,pct:tot?Math.round(ok/tot*100):0,by,byTema};
}

function barChart(items,opt){ // items [{label,value,max?,color}]
  opt=opt||{};const W=640,H=opt.h||220,pl=48,pb=40,pt=18,pr=10;const n=items.length||1;
  const max=opt.max||Math.max(1,...items.map(i=>i.value));const bw=Math.min(46,(W-pl-pr)/n*0.6);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||"Gráfico de barras")+'">';
  for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*(1-k/4);const v=Math.round(max*k/4);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#E3EEEC"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+(opt.unit||"")+'</text>';}
  items.forEach((it,i)=>{const cx=pl+(W-pl-pr)*(i+0.5)/n;const h=(H-pt-pb)*(it.value/max);const y=H-pb-h;
    s+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="5" fill="'+(it.color||"#0FA3A3")+'"><title>'+esc(it.label)+': '+it.value+(opt.unit||"")+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(y-5)+'" text-anchor="middle" style="fill:#06343F;font-weight:600">'+it.value+(opt.unit||"")+'</text>';
    s+='<text x="'+cx+'" y="'+(H-pb+16)+'" text-anchor="middle">'+esc(it.short||it.label)+'</text>';});
  return s+'</svg>';
}
function lineChart(pts,opt){ // pts [{label,value}]
  opt=opt||{};const W=640,H=opt.h||220,pl=48,pb=36,pt=18,pr=16;const max=opt.max||100;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label||"Gráfico de linha")+'">';
  for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*(1-k/4);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#E3EEEC"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*k/4)+(opt.unit||"")+'</text>';}
  if(opt.goal!=null){const y=pt+(H-pt-pb)*(1-opt.goal/max);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#C08A1E" stroke-dasharray="5 4"/><text x="'+(pl+6)+'" y="'+(y-6)+'" text-anchor="start" style="fill:#8A5A00;font-weight:600">'+esc(opt.goalLabel||"meta")+'</text>';}
  const n=pts.length;if(!n)return s+'</svg>';
  const xy=pts.map((p,i)=>[pl+(W-pl-pr)*(n===1?0.5:i/(n-1)),pt+(H-pt-pb)*(1-p.value/max)]);
  s+='<path d="M'+xy.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+'" fill="none" stroke="#0FA3A3" stroke-width="3" stroke-linejoin="round"/>';
  xy.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#fff" stroke="#06343F" stroke-width="2.5"><title>'+esc(pts[i].label)+': '+pts[i].value+(opt.unit||"")+'</title></circle><text x="'+p[0]+'" y="'+(H-pb+16)+'" text-anchor="middle">'+esc(pts[i].label)+'</text>';});
  return s+'</svg>';
}
function donut(pct,color,size){size=size||120;const r=size/2-10,c=2*Math.PI*r;return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+pct+'%"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#E5EFEE" stroke-width="12"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(color||"#0FA3A3")+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*pct/100)+' '+c+'" transform="rotate(-90 '+size/2+' '+size/2+')"/><text x="50%" y="54%" text-anchor="middle" style="font-family:Sora;font-weight:800;font-size:'+(size/5)+'px;fill:#06343F">'+pct+'%</text></svg>';}

function dossHTML(d){
  const qs=Q.filter(q=>q.banca===d.banca);const n=qs.length;

  h+='<h2 id="d-resumo">3. Resumo de alto rendimento</h2><p>O essencial de cada tema que caiu, direto ao ponto.</p>';
  AREAS.forEach(a=>{if(!byA[a].length)return;h+='<h3 style="margin-top:22px;color:'+AREA_COLOR[a]+'">'+a+'</h3>';
    byA[a].forEach(q=>{h+='<p><b>'+esc(q.tema)+'.</b> '+esc(q.com)+'</p><div class="resumo"><table><thead><tr>'+q.tab[0].map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>'+q.tab.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';});});
  const rel=qs.filter((q,i)=>i%9===0).slice(0,8);

  h+='<h2 id="d-nao">5. O que a banca não costuma cobrar</h2><p>Essa seção fica mais precisa a cada ano de prova analisado. Por enquanto, com '+d.anos+' analisado, o padrão é de questões clínicas práticas, com casos de atenção primária e urgência, e pouca cobrança de detalhes de fisiopatologia ou doses exatas.</p>';
  h+='<h2 id="d-vespera">6. Checklist da véspera</h2><ul>'+qs.filter((q,i)=>i%6===2).slice(0,14).map(q=>'<li><b>'+esc(q.tema)+':</b> '+esc(q.tut)+'</li>').join("")+'</ul>';
  return h;

function buildPlan(){
  const u=S.user;const s=stats();const d=daysTo(u.data);const weeks=Math.max(1,Math.min(12,d!=null&&d>0?Math.ceil(d/7):8));
  const weight={};AREAS.forEach(a=>{const b=s.by[a];const acc=b.t?b.o/b.t:0.5;weight[a]=1+(1-acc);});
  const tw=AREAS.reduce((x,a)=>x+weight[a],0);
  const temasPorArea={};Q.forEach(q=>{(temasPorArea[q.area]=temasPorArea[q.area]||[]);if(!temasPorArea[q.area].includes(q.tema))temasPorArea[q.area].push(q.tema);});
  const plan=[];for(let w=0;w<weeks;w++){const items=AREAS.map(a=>{const h=Math.max(1,Math.round(u.horas*weight[a]/tw));const ts=temasPorArea[a];return {area:a,h,tema:ts[w%ts.length]};});
    plan.push({w:w+1,items,rev:w%2===1,sim:w%2===1});}
  return {weeks,plan,weight,tw};
}
function vCronograma(){
  const u=S.user;const P=buildPlan();
  return '<div class="head"><div><h1>Meu Cronograma</h1><p class="sub">Montado automaticamente com base na data da prova, nas suas '+u.horas+'h por semana e no seu desempenho. Áreas em que você erra mais ganham mais horas.</p></div><a class="btn ghost" href="#perfil">Ajustar horas e data</a></div>'+

  P.plan.map(p=>'<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;align-items:center"><h2>Semana '+p.w+'</h2>'+(p.sim?'<span class="tag">Inclui simulado</span>':'')+'</div><div class="tbl-wrap"><table class="t" style="margin-top:8px"><tbody>'+
   p.items.map((it,k)=>{const key=p.w+"_"+k;const done=S.plan.done[key];return '<tr><td style="width:44px"><input type="checkbox" aria-label="Marcar como feito" data-act="plan-done" data-k="'+key+'" '+(done?"checked":"")+' style="width:20px;height:20px"></td><td><b style="color:'+AREA_COLOR[it.area]+'">'+esc(it.area)+'</b><br><span class="sub">'+esc(it.tema)+'</span></td><td>'+it.h+'h</td><td>'+Math.round(it.h*6)+' questões</td></tr>';}).join("")+

}

  /* MÉTODO */
  '<section class="lp-band"><div class="lp-in two"><div>'+sTitle("O problema","Estudar muito não é o mesmo que estudar certo","")+'<ul class="bad-list">'+["Resolvem questões sem acompanhar a evolução","Fazem provas sem analisar os próprios erros","Estudam tudo igual, sem saber o que a banca cobra","Perdem tempo procurando material em vários lugares","Ficam com dúvida e ninguém explica","Chegam na prova sem treinar em condições reais"].map(t=>'<li><span class="nope">'+ic("no")+'</span>'+t+'</li>').join("")+'</ul></div>'+
   '<div class="sol"><span class="ic-c lg">'+ic("zap")+'</span><h3 style="font-size:20px;margin-top:14px;color:#fff">A MedRise junta treino, análise e estratégia num lugar só.</h3><p style="color:#CBE9E4">Você sabe o que a sua banca cobra, treina do jeito que ela cobra e acompanha cada ponto que falta até o dia da prova.</p>'+buy("background:var(--mint);color:var(--ink);margin-top:8px")+'</div></div></section>'+
  /* PROVAS */
  '<section class="lp-band soft"><div class="lp-in two">'+'<div>'+sTitle("Treine com provas de verdade","Questões organizadas pra mostrar onde você está forte e onde falta","Cada questão vem com comentário, tabela-resumo e o Tutor. Você vê a lacuna e já sabe o que revisar.")+'<div class="chips" style="margin-top:20px">'+["Residência R1","R+ (pré-requisito)","ENAMED","REVALIDA","Simulados MedRise"].map(t=>'<span class="chip on" style="cursor:default">'+t+'</span>').join("")+'</div></div>'+
   '<div class="grid g2">'+[["quiz","Resolva","Questões por banca, área e tema"],["chart","Compare","Sua nota contra a dos outros alunos"],["x","Revise","Caderno de erros e Tutor"],["zap","Evolua","Cronograma ajusta o foco"]].map(x=>'<div class="card feat"><div class="ic">'+ic(x[0])+'</div><h3>'+x[1]+'</h3><p class="sub" style="margin:0">'+x[2]+'</p></div>').join("")+'</div></div></section>'+
  /* COMO FUNCIONA */
  '<section class="lp-band" id="como"><div class="lp-in">'+sTitle("Como funciona","Um caminho simples pra estudar com estratégia","",true)+'<div class="grid g4" style="margin-top:34px">'+[["user","Diga sua residência","R1 ou R+, especialidade, provas e horas por semana."],["plan","Receba seu plano","Dossiês das suas bancas e cronograma semanal prontos."],["quiz","Treine","Questões, simulados e Tutor sempre que travar."],["trophy","Evolua até a prova","Gráficos, ranking e revisão do que você erra."]].map((x,k)=>'<div class="card step"><div class="row" style="justify-content:space-between;align-items:center"><span class="n">0'+(k+1)+'</span><span class="ic-c">'+ic(x[0])+'</span></div><h3>'+x[1]+'</h3><p class="sub" style="margin:0">'+x[2]+'</p></div>').join("")+'</div></div></section>'+
  /* PLANOS */
  '<section class="lp-band soft" id="planos"><div class="lp-in">'+sTitle("Escolha seu plano","Comece hoje e estude do jeito certo","Mesma plataforma completa, duas formas de acesso.",true)+'<div class="grid g2" style="margin:40px auto 0;max-width:860px;align-items:stretch">'+
   plans.map(p=>'<div class="card price '+(p[6]?"best":"")+'">'+(p[6]?'<span class="flag">Mais vantajoso</span>':'')+'<div><h3>'+p[0]+'</h3><span class="sub">'+p[1]+'</span></div><div><span class="val">'+p[2]+'</span> <span class="sub">'+p[3]+'</span></div><span class="sub">'+p[4]+'</span>'+(p[7]?'<span class="tag ok" style="align-self:flex-start">'+p[7]+'</span>':'')+'<ul>'+p[5].map(x=>'<li>'+x+'</li>').join("")+'</ul><a class="btn '+(p[6]?"":"dark")+'" href="#cadastro" style="margin-top:auto">Comprar agora</a></div>').join("")+'</div></div></section>'+
  /* GARANTIA */
  '<section class="lp-band"><div class="lp-in"><div class="guar"><span class="ic-c xl">'+ic("shield")+'</span><div><h2 style="font-size:24px">Garantia de 7 dias</h2><p class="lead" style="margin-top:6px">Entre, teste tudo, faça simulados e leia os dossiês. Se em 7 dias você achar que não é pra você, devolvemos 100% do seu dinheiro.</p></div></div></div></section>'+
  /* FAQ */
  '<section class="lp-band soft" id="faq"><div class="lp-in" style="max-width:820px">'+sTitle("Dúvidas","Perguntas frequentes","",true)+'<div class="faq" style="margin-top:20px">'+faq.map(f=>'<details><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>').join("")+'</div></div></section>'+
  /* CTA */
  '<section class="lp-band lp-cta"><div class="lp-in"><h2>Sua vaga não espera. Comece a estudar o que cai.</h2><p class="lead" style="color:#E3FBF6;margin:12px auto 0">Dossiê, questões, simulados, Tutor e cronograma. Tudo num lugar só.</p><div style="margin-top:26px">'+buy("background:#fff;color:var(--ink)")+'</div></div></section>'+
  '<footer class="lp-foot"><div class="lp-in row" style="justify-content:space-between;align-items:center">'+LOGO_FULL(38,true)+'<span>© MedRise</span></div></footer></div>';
}
/* ================= RENDER ================= */
let tick=null;
function render(){
  const root=$("#root");hideBar();
  const [r,p]=route();
  if(r==="home"||(!S.user&&r!=="cadastro")){root.innerHTML=vLanding();return;}
  if(!S.user){root.innerHTML=vOnboard();return;}
  let html;
  switch(r){
    case "especialidade":html=vEspecialidade();break;
    case "dossies":html=vDossies();break;
    case "dossie":html=vDossie(p);break;
    case "questoes":html=vQuestoes();break;
    case "simulados":html=vSimulados();break;
    case "sim":html=vSim();break;
    case "res":html=vRes(p);break;
    case "calendario":html=vCalendario();break;
    case "cronograma":html=vCronograma();break;
    case "desempenho":html=vDesempenho();break;
    case "erros":html=vErros();break;
    case "salvos":html=vSalvos();break;
    case "flashcards":html=vFlash();break;
    case "ranking":html=vRanking();break;
    case "avisos":html=vAvisos();break;
    case "perfil":html=vPerfil();break;
    default:html=vInicio();
  }
  root.innerHTML=shell(html);
  if(r==="dossie")afterDossie();
  clearInterval(tick);if(r==="sim"&&run){tick=setInterval(()=>{const el=$("#timer");if(!el){clearInterval(tick);return;}const left=Math.max(0,run.end-Date.now());el.textContent=String(Math.floor(left/60000)).padStart(2,"0")+":"+String(Math.floor(left/1000)%60).padStart(2,"0");if(left<=0){clearInterval(tick);finishSim();}},1000);}
}
window.addEventListener("hashchange",()=>{qview={sel:null,show:false,tutor:false,cut:qview.cut};render();window.scrollTo(0,0);});

/* ================= ACTIONS ================= */
function finishSim(){
  if(!run)return;const by={};AREAS.forEach(a=>by[a]={t:0,o:0});let ok=0;
  run.qs.forEach(id=>{const q=qById(id);const a=run.ans[id];const r=a===q.c;by[q.area].t++;if(r){ok++;by[q.area].o++;}if(a!=null)S.ans[id]={ok:r,ch:a,ts:Date.now()};else S.ans[id]={ok:false,ch:null,ts:Date.now()};});
  const d=new Date();S.sims.push({sid:run.sid,nome:run.nome,dt:d.toLocaleDateString("pt-BR"),ok,total:run.qs.length,by,qs:run.qs,ans:run.ans,secs:Math.round((Date.now()-run.start)/1000)});
  save();const idx=S.sims.length-1;run=null;location.hash="#res/"+idx;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,v=t.dataset.v;
  if(a==="zoom"){e.preventDefault();e.stopPropagation();const z=document.createElement("div");z.id="zoom";z.innerHTML='<img src="'+t.dataset.src+'" alt="">';z.onclick=()=>z.remove();document.body.appendChild(z);return;}
  if(a==="demo-pick"){const id=DEMO_Q[demo.i];if(demo.show[id])return;demo.sel[id]=+t.dataset.i;$("#demo-box").innerHTML=demoBox();return;}
  if(a==="demo-answer"){demo.show[DEMO_Q[demo.i]]=true;$("#demo-box").innerHTML=demoBox();return;}
  if(a==="demo-go"){demo.i=+t.dataset.i;$("#demo-box").innerHTML=demoBox();return;}
  if(a==="lp-menu"){const m=$("#lp-menu");if(m)m.classList.toggle("open");return;}
  if(a==="menu"){$("#side").classList.toggle("open");return;}
  // onboarding
  if(a==="ob-fase"){ob.fase=v;}
  if(a==="ob-tipo"){ob.tipo=v;ob.esp="";}
  if(a==="ob-esp"){ob.esp=v;}
  if(a==="ob-banca"){ob.bancas=ob.bancas.includes(v)?ob.bancas.filter(x=>x!==v):ob.bancas.concat(v);}
  if(a==="ob-back"){ob.step--;}
  if(a==="ob-next"){if(ob.step<3){ob.step++;}else{S.user={nome:ob.nome.trim(),tipo:ob.tipo,esp:ob.esp,bancas:ob.bancas,data:ob.data,horas:+ob.horas||20,fase:ob.fase};save();location.hash="#inicio";}}
  if(a.startsWith("ob-")){render();return;}
  // questions
  if(a==="pick"){if(qview.show)return;qview.sel=+t.dataset.i;render();return;}
  if(a==="answer"){const q=filteredQ()[qf.idx];S.ans[q.id]={ok:qview.sel===q.c,ch:qview.sel,ts:Date.now()};save();qview.show=true;render();return;}
  if(a==="tutor"){qview.tutor=true;render();return;}
  if(a==="q-next"||a==="q-prev"){const n=filteredQ().length;qf.idx=(qf.idx+(a==="q-next"?1:-1)+n)%n;qview={sel:null,show:false,tutor:false,cut:qview.cut};render();window.scrollTo(0,0);return;}
  if(a==="save-q"){const id=t.dataset.id;S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):S.saved.concat(id);save();toast(S.saved.includes(id)?"Questão salva":"Removida dos salvos");render();return;}
  // simulados
  if(a==="sim-start"){const s=SIMULADOS.find(x=>x.id===t.dataset.id);run={sid:s.id,nome:s.nome,qs:s.qs.slice(),i:0,ans:{},start:Date.now(),end:Date.now()+s.min*60000};location.hash="#sim";return;}
  if(a==="sim-pick"){run.ans[run.qs[run.i]]=+t.dataset.i;render();return;}
  if(a==="sim-next"){run.i=Math.min(run.qs.length-1,run.i+1);render();return;}
  if(a==="sim-prev"){run.i=Math.max(0,run.i-1);render();return;}
  if(a==="sim-go"){run.i=+t.dataset.i;render();return;}
  if(a==="sim-finish"){const miss=run.qs.length-Object.keys(run.ans).length;if(miss>0&&!t.dataset.sure){t.dataset.sure="1";t.textContent="Faltam "+miss+". Entregar mesmo assim?";return;}finishSim();return;}
  // others
  if(a==="lembrete"){toast("Lembrete de "+v+" ativado");return;}
  if(a==="goto"){const lm=$("#lp-menu");if(lm)lm.classList.remove("open");const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:"smooth"});return;}
  if(a==="hl-clear"){delete S.hl[t.dataset.id];S.notes=S.notes.filter(n=>n.id!==t.dataset.id);save();render();toast("Grifos apagados");return;}
  if(a==="redo-errs"){qf={area:"",tema:"",status:"erradas",idx:0};location.hash="#questoes";return;}
  if(a==="flip"){flash.flip=!flash.flip;render();return;}
  if(a==="card"){const q=dueCards()[flash.i];S.cards[q.id]={due:Date.now()+(+v)*864e5};save();flash.flip=false;render();return;}
  if(a==="p-banca"){const u=S.user;u.bancas=u.bancas.includes(v)?u.bancas.filter(x=>x!==v):u.bancas.concat(v);save();render();return;}
  if(a==="p-save"){const u=S.user;u.nome=$("#p-nome").value.trim()||u.nome;const tp=$("#p-tipo").value;if(tp!==u.tipo){u.tipo=tp;u.esp=(tp==="R1"?ESPEC_R1[0]:ESPEC_RMAIS[0][0]);}else u.esp=$("#p-esp").value;u.data=$("#p-data").value;u.horas=+$("#p-horas").value||u.horas;save();toast("Perfil salvo");render();return;}
  if(a==="reset"){if(!t.dataset.sure){t.dataset.sure="1";t.textContent="Clique de novo pra confirmar";return;}S=blank();save();ob={step:0,nome:"",tipo:"R1",esp:"",bancas:[],data:"",horas:20,fase:"Internato"};location.hash="#home";render();return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.f){qf[t.dataset.f]=t.value;if(t.dataset.f==="area")qf.tema="";qf.idx=0;qview={sel:null,show:false,tutor:false,cut:qview.cut};render();return;}
  if(t.dataset.act==="plan-done"){S.plan.done[t.dataset.k]=t.checked;save();return;}
  if(t.id==="p-tipo"){S.user.tipo=t.value;S.user.esp=(t.value==="R1"?ESPEC_R1[0]:ESPEC_RMAIS[0][0]);save();render();}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="ob-nome"){ob.nome=t.value;const b=document.querySelector('[data-act="ob-next"]');if(b)b.disabled=!t.value.trim();}
  if(t.id==="ob-data")ob.data=t.value;if(t.id==="ob-horas")ob.horas=t.value;});
document.addEventListener("contextmenu",e=>{const t=e.target.closest('[data-act="pick"]');if(!t||qview.show)return;e.preventDefault();const q=filteredQ()[qf.idx];const k=q.id+"_"+t.dataset.i;qview.cut[k]=!qview.cut[k];render();});
document.addEventListener("keydown",e=>{const t=e.target.closest('[data-act="flip"]');if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click();}});

/* ================= HIGHLIGHT ================= */
let selRange=null;
function hideBar(){const b=$("#hlbar");if(b)b.style.display="none";}
document.addEventListener("mouseup",e=>{
  if(e.target.closest("#hlbar"))return;
  const art=document.getElementById("doss");if(!art){hideBar();return;}
  const sel=window.getSelection();if(!sel||sel.isCollapsed||!art.contains(sel.anchorNode)||!art.contains(sel.focusNode)){hideBar();return;}
  selRange=sel.getRangeAt(0).cloneRange();const r=selRange.getBoundingClientRect();const b=$("#hlbar");
  b.style.display="flex";b.style.left=Math.max(8,r.left+r.width/2-90)+"px";b.style.top=Math.max(8,r.top-50)+"px";
});
$("#hlbar").addEventListener("mousedown",e=>e.preventDefault());
$("#hlbar").addEventListener("click",e=>{
  const btn=e.target.closest("[data-hl]");if(!btn||!selRange)return;const art=document.getElementById("doss");if(!art)return;
  let c=btn.dataset.hl,nota="";if(c==="note"){c="h1";}
  const txt=selRange.toString().trim();if(!txt){hideBar();return;}
  const mark=document.createElement("mark");mark.className=c;
  try{mark.appendChild(selRange.extractContents());selRange.insertNode(mark);}catch(err){toast("Não consegui grifar esse trecho");return;}
  window.getSelection().removeAllRanges();hideBar();
  const id=art.dataset.id;S.hl[id]=art.innerHTML.replace(/<div class="chart card" id="d-chart">[\s\S]*?<\/svg><\/div>/, '<div class="chart card" id="d-chart"></div>');
  const n={id,doss:(DOSSIES.find(d=>d.id===id)||{}).nome,txt,c,nota};
  if(btn.dataset.hl==="note"){openNote(n);}else{S.notes.push(n);save();toast("Trecho grifado");}
  afterDossie();
});
function openNote(n){
  const box=document.createElement("div");box.className="card";box.style.cssText="position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:50;width:min(420px,92vw);box-shadow:0 10px 40px rgba(6,52,63,.3)";
  box.innerHTML='<h3>Nota sobre o trecho</h3><p class="sub" style="margin:6px 0">"'+esc(n.txt.slice(0,120))+'"</p><textarea id="note-t" style="width:100%" placeholder="Escreva sua anotação"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost sm" id="note-c">Cancelar</button><button class="btn sm" id="note-s">Salvar nota</button></div>';
  document.body.appendChild(box);box.querySelector("#note-t").focus();
  box.querySelector("#note-c").onclick=()=>{S.notes.push(n);save();box.remove();};
  box.querySelector("#note-s").onclick=()=>{n.nota=box.querySelector("#note-t").value.trim();S.notes.push(n);save();box.remove();toast("Nota salva");};
}

render();
})();
</script>
